name: Weekly RSS refresh

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Refresh pending episodes
    runs-on: ubuntu-latest
    steps:
      # Mint the App token FIRST, before checkout, and check out with it. If
      # checkout runs with the default GITHUB_TOKEN, its persisted git
      # credentials are what create-pull-request pushes with — and a push
      # attributed to GITHUB_TOKEN cannot trigger ci.yml (recursion guard),
      # even when the PR itself is opened by the App. Checking out with the
      # App token makes the branch push App-attributed, so CI runs.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.REFRESH_APP_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run rih-pipeline refresh
        env:
          RIH_RSS_URL: ${{ secrets.RIH_RSS_URL }}
        run: uv run rih-pipeline refresh

      - name: Detect new pending stubs
        id: detect
        run: |
          set -euo pipefail
          # Untracked .yaml files under data/pending/ are the new stubs.
          mapfile -t new_files < <(git ls-files --others --exclude-standard -- 'data/pending/*.yaml')
          count=${#new_files[@]}
          echo "count=$count" >>"$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No new pending episodes; exiting."
            exit 0
          fi
          {
            echo "body<<EOF"
            echo "Automated weekly RSS refresh found $count new episode(s):"
            echo
            for f in "${new_files[@]}"; do
              echo "- \`$f\`"
            done
            echo
            echo "Each YAML is a stub awaiting human tagging. Fill in countries,"
            echo "year_start, year_end, date_precision, kind, topics, and"
            echo "historical_figures, then move the file from \`data/pending/\`"
            echo "to \`data/episodes/\`."
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Open refresh PR
        if: steps.detect.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          # Use the App token AND commit as the App's bot user. peter-evans
          # defaults the committer to github-actions[bot]; a commit carrying
          # that identity is treated as GITHUB_TOKEN-origin and its PR does
          # not trigger ci.yml (recursion guard), even when pushed with the
          # App token. Committing as the App bot removes that marker so CI
          # runs. The <id> is the App bot user id (gh api /users/<slug>[bot]).
          token: ${{ steps.app-token.outputs.token }}
          committer: rih-episode-append[bot] <307244164+rih-episode-append[bot]@users.noreply.github.com>
          author: rih-episode-append[bot] <307244164+rih-episode-append[bot]@users.noreply.github.com>
          branch: automation/weekly-refresh
          delete-branch: true
          add-paths: data/pending
          commit-message: "chore(refresh): ${{ steps.detect.outputs.count }} new pending episode(s)"
          title: "Weekly RSS refresh: ${{ steps.detect.outputs.count }} new episodes"
          body: ${{ steps.detect.outputs.body }}
