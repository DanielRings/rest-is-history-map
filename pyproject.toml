[project]
name = "rih-pipeline"
version = "0.1.0"
description = "Producer pipeline for the Rest Is History map+timeline browser."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "feedparser>=6.0.11",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.2",
]

[project.scripts]
rih-pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "types-pyyaml>=6.0.12",
  "types-jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF", "D"]
ignore = [
  "D203",  # incompatible with D211
  "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"pipeline/tests/**" = ["D"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
addopts = "-ra"
