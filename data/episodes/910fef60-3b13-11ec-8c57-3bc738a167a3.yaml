title: Food Glorious Food
description: 'Tom Holland and Dominic Sandbrook tuck into the history of British food
  with author Pen Vogler. They debate the origins of curry and debate our obsession
  with beef. Plus, they discuss a curious historical obsession with cooking pigs and
  chickens, stitched together.



