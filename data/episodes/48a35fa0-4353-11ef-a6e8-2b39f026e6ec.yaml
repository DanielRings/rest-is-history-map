title: 'RIHC: Presidential Assassinations, Political Violence, and Revolutionary Legacies'
description: "How many American Presidents have been killed by assassins, and which\
  \ ones? Do failed assassination attempts historically work in the favour of a candidate\
  \ running for election, or does it make little difference? Which assassination attempts\
  \ from American history, and the political environments in which they took place,\
  \ most closely resemble that of Trump's on the 13th of July? Is the potential interface\
  \ between rhetoric and political violence in America right now, the worst it has\
  \ been since the time of Lincoln in the 1850's? Have any British Prime Ministers\
  \ ever been assassinated? What is it about the differing political climates of Britain\
  \ and America that have resulted in so many more assassination attempts in the U.S.?\
  \ And, what impact has the French Revolution had, if any, upon French politics today?\n\
  Join Tom and Dominic for this week's bonus episode as, in the wake of the recent\
  \ assassination attempt on Donald Trump, they discuss some of history's most significant\
  \ political assassinations and instances of political violence, along with the long-term\
  \ impacts of famous revolutions. \n_______\n\n*The Rest Is History LIVE in the U.S.A.*\n\
  If you live in the States, we've got some great news: Tom and Dominic will be performing\
  \ throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,\
  \ Washington D.C., Boston and New York. \n\n*The Rest Is History LIVE at the Royal\
  \ Albert Hall*\nTom and Dominic, accompanied by a live orchestra, take a deep dive\
  \ into the lives and times of two of history’s greatest composers: Wolfgang Amadeus\
  \ Mozart and Ludwig van Beethoven.\n\nTickets on sale now at TheRestIsHistory.com\n\
  _______\n\nTwitter:\n@TheRestHistory\n@holland_tom\n@dcsandbrook\n\nProducer: Theo\
  \ Young-Smith\nAssistant Producer: Tabby Syrett\nExecutive Producers: Jack Davenport\
  \ + Tony Pastor"
