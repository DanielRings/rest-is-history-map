title: 'The Fall of the Aztecs: The Adventure Begins (Part 1)'
description: 'The meeting of the controversial Spanish conquistador Hernán Cortés
  and the formidable Emperor Montezuma in 1519 was one of the great hinge moments
  of world history, and the beginning of the end for the mightiest of the New World
  empires: the realm of the Aztecs. 


  The build-up to this extraordinary encounter is at once a thrilling adventure story
  and a tragic tale of violence, brutality and loss. It’s a story of temples and sacrifices,
  exploration and imperialism, with cataclysmic consequences for human history.


  Join Tom and Dominic in the first episode of this sensational saga, as they follow
  the young Cortés across the Atlantic to the Caribbean islands of Hispaniola and
  Cuba, where the search for gold comes at a terrible price …


  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


