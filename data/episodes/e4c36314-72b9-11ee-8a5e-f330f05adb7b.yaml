title: 'RIHC: History’s Top Sidekicks, Christian Frontier Battles, & the Quran'
description: 'Who is history’s most influential sidekick? Which battle was more important
  to safeguarding Christianity in Europe: Tours in 732, or Vienna in 1683? Who is
  the UK’s most boring Prime Minister? Which historical event from within their own
  lifetimes would Tom and Dominic have most wanted to witness in person? And what
  is the debate regarding the origins of the Quran?


  Join Tom and Dominic in this week’s bonus episode as they answer some of history’s
  most important questions. 


