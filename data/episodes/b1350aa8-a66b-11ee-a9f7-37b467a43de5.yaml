title: 'The Nazis in Power: The Night of the Long Knives (Ep 1)'
description: '“Hitler had entered Röhm’s bedroom alone with a whip in his hand. Behind
  him had stood two detectives holding pistols, with the safety catch removed, at
  the ready…”

  The 30th of June 1934 saw a seismic moment unfold in the early years of the Third
  Reich. With the Führer and his party firmly in power, a bloody faction fight takes
  place within the Party. The Nazis have gained control of both the streets and the
  democratic institutions of Germany, with Hitler made Chancellor in 1933. But the
  SA, the largest Nazi military faction, led by the unmistakable Ernst Röhm, have
  shown signs of challenging Hitler, and rumours have reached the Führer that he is
  facing a coup… After a bloody night of murderous terror led by Hitler and his personal
  guard, the SS, they are left as the strongest military wing in the Party, with the
  SA facing extinction.


  Join Tom and Dominic in the first episode of our series on the Nazis in Power, as
  they delve into how Hitler solidified his and his party’s control of Germany, the
  different right wing groups at play, the signs of uprising against Hitler’s rule,
  and the eventual quelling of all opposition.



