title: 'Ancient Carthage: Rise of a Superpower (Part 2)'
description: '“An aristocratic republic, secret and well-ordered, where individuals
  are subject to the harsh laws of the austere and disciplined rich…”

  The mysterious, wealthy and glamorous city of Carthage flourished between the ninth
  and second centuries BC, becoming one of the greatest naval and mercantile powers
  in the world. By the sixth century BC the Carthaginians were a force to be reckoned
  with, holding off assaults from various Greek rivals, and starting to colonise larger
  parts of the Mediterranean. Where once there had been a barren wasteland, now stood
  glittering villas and temples, bustling marketplaces, and vast walls stretching
  down to the sea. Yet Carthage also had a reputation for violence and cruelty. Bloody
  human offerings were made to the gods, with hundreds of Carthaginian children cast
  into the flames, whilst crucifixion was often inflicted on generals who fell short
  of Carthage’s exacting standards…

  Join Tom and Dominic as they explore the extraordinary rise of Carthage, a city
  of blazing innovation and sinister mystique. By the third century BC it seemed that
  no power could ever rival it. But little did the Carthaginians know that another
  city, a minnow from an Italian backwater, was on the rise. A city that may even
  one day challenge her supremacy: Rome.




