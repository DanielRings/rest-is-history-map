title: The Blood-Drinking Bride of Christ
description: 'A woman of immense influence on medieval Christendom, Catherine of Siena
  was one of the first female Doctors of the Church, who married Christ in her own
  bedroom. Living through a time of great anxiety due to the onset of the Black Death,
  she healed the sick, convinced the Pope to return from exile in France, appeased
  riotous crowds, and even brought her own mother back from the dead. Join Tom and
  Dominic as they discuss Catherine of Siena, her life, her impact on the Middle Ages,
  and her relationship with Christ. 


