title: 'RIHC: The Secret Life of James I, Mary Queen of Scots, and the Execution of
  a King'
description: 'How did James IV become King of Scotland after the execution of his
  long absent mother, Mary Queen of Scots, and how did he think of her? Was he received
  favourably in England following Elizabeth I’ death? Did James really slobber? And,
  why was he so different from his beheaded son, Charles I?


  In this week’s bonus episode, Tom is joined by historian Clare Jackson, to discuss
  the fascinating secret life of James I.


