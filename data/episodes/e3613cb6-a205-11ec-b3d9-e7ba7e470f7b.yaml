title: The Last Emperor of Mexico
description: 'What links the Mexican Republic, Palmerston, the Hapsburgs, Napoleon
  III and butterfly catching? Please tweet us if you can think of anything other than
  the following answer, which is the incredible story of the Last Emperor of Mexico.


  Tom and Dominic are joined by Edward Shawcross as they travel back to recount and
  discuss this amazing moment in Mexican history.


