title: 'The French Revolution: Liberty, Equality, Fraternity (Part 6)'
description: 'Alongside violence, the French Revolution is a story of principles and
  values. It is the ultimate intersection of brutality and Enlightenment idealism,
  as epitomised by the Fall of the Bastille. So too the creation and implementation
  of the Declaration of the Rights of Man - a totemic manifesto for the French state,
  which seemingly embodied a shockingly overt rupture from the past. Not only one
  of the decisive moments of the French Revolution, the declaration would prove transformative
  for all world history, and galvanised France as the cradle of of modern nationalism. So,
  just as the walls of the Bastille were abolished, the words of the document tore
  down something just as old and once impenetrable: the taint of absolutism, handing
  sovereignty from the king to the nation. By the 4th of August 1789 this amorphous
  beast was gripped by a great hysterical, almost paranoid passion, and it was amidst
  this turmoil that the French Assemblée Constituante voted unanimously to abolish
  feudalism, in one fell swoop eliminating everything that had come before. What would
  this consciously manufactured new beginning hold in store for Revolutionary France,
  or was it merely a bombastic continuation of the past? 

  Join Tom and Dominic as they discuss the groundbreaking ideas behind the French
  Revolution, along with the deep history of the ideals its enshrined. So too the
  stories behind some of its most famous iconography, and the long-term repercussions
  of this transformative upheaval for the modern world. 

