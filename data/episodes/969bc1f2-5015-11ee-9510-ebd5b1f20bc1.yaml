title: 'The Real Harry Potter: Magic, Empire and Beastly Bullies (Ep 1)'
description: 'Eclectic traditions, obscure codes and cryptic ancient languages: the
  world of Harry Potter has captivated the imagination of children from all backgrounds
  for decades. A fantasy series inspired by a long lineage of stories, from Tolkien
  to Narnia, all committed to the importance of the building of moral character. Join
  Tom and Dominic in the first part of our series on Harry Potter, as they trace the
  roots of J.K. Rowling’s novels, and demystify the world of eminent headmasters,
  weird sports, prefects and houses.


  *The Rest Is History Live Tour 2023*:


  Tom and Dominic are back on tour this autumn! See them live in London, New Zealand,
  and Australia!


