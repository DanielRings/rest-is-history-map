title: 'Evita: Birth of a Legend (Part 1)'
description: '"Don''t cry for me Argentina, the truth is I never left you."


  Few political figures have been both hailed as a saint and immortalised through
  an Andrew Lloyd Webber musical. The mythology of Evita Perón continues to permeate
  through Argentinian society, but what''s the real history of her life?


  Eva and her siblings were born out of wedlock and subsequently shunned by the community
  in her rural village. Losing her father in a car crash at a young age, she grew
  up with a terrible sense of hurt and a desire for a better life. Cinema was a welcome
  distraction and soon had a significant influence on Eva. Despite not being the most
  talented actor, her emotive and monotone voice suited the hugely popular soap operas
  on the radio in Argentina. But she sought total stardom, and she was willing to
  move to the capital to find it…


  Join Dominic and Tom as they discuss Eva''s escape from a childhood of resentment
  to the bright lights of Buenos Aires with her sights set on making it as an actor.


