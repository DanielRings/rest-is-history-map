title: 'Coronations: Chaos, Ceremony and Empire (Ep 3)'
description: 'What was the most calamitous coronation of all time? Which ceremony
  does Tom think is the most boring subject he''s ever discussed on the podcast? How
  will Charles III''s big day compare to that of his ancestors?

  In their third and final episode on coronations, Tom and Dominic answer all these
  questions as they explore the most recent coronations in British history.



