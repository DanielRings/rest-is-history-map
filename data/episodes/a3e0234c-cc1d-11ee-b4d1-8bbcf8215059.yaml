title: 'Carthage vs. Rome: Total War (Part 4)'
description: 'In the third century BC, a clash which had been brewing for centuries
  finally erupted: Rome, the ruthless imperialist upstart dominating Italy, against
  Carthage, the ancient but sinister apex predator of the Mediterranean. The conflict
  sparked in Messina in 263 BC, and went on for over two decades, as the fortunes
  of both powers rose and fell. Rome’s superior, land-based army proved the perfect
  match to the Carthaginians’ maritime might, though both forces rapidly adapted to
  the expertise of their foe. By 250 BC, Carthage was embattled and flailing, and
  in need of a hero, to restore the fate of Carthage, and ensure her survival…

  Join Tom and Dominic as they discuss the outbreak of the First Punic War, in which
  history’s greatest rivalry, Rome vs Carthage, finally came to blows. As the established
  power of Carthage was challenged by the rise of a new contender in Rome, but could
  either live in a world where the other survived?




