title: Scandal in the White House
description: "Who was Grover Cleveland, and why is he one of the most controversial\
  \ American Presidents of all time? Why was the run up to his first term, in 1884\
  \ at the height of the Gilded Age, so pivotal to American politics? How did he rocket\
  \ to the heights of political power? What dark secrets began swirling about his\
  \ disreputable past, and character? Did he really seduce a young widow by the name\
  \ of Maria Crofts Halpin, impregnate her, and then lock her in a mental asylum?\
  \ What became of their alleged child? And, how did this shocking scandal unfold? \n\
  \n\n\nJoin Dominic and Tom as they investigate one of the most lurid stories in\
  \ all American political history - a tale of lust, lies, deviance and kidnapping,\
  \ but also immense political significance. What is the truth behind this mystery?\n\
  \n\n\n\n\nJoin The Rest Is History Club: Unlock the full experience of the show\
