title: 'Columbus: A New World? (Ep 2)'
description: 'Having convinced the Catholic Monarchs to fund his journey across the
  Atlantic, Columbus sets sail with three ships, a crew with dubious loyalties, and
  a mission to find China or Japan by heading west. 

  A voyage spanning the Canary Islands, Cuba and Hispaniola, he will encounter and
  enslave indigenous peoples, mislead and fall out with his crew, then eventually
  be arrested in Portugal on his return to Europe. If freed by the Portuguese, how
  will he be received by the Catholic Monarchs?


