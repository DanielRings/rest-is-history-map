title: 'Greek Myths: Jason & The Quest for the Golden Fleece (Part 4)'
description: "What terrifying trials did Jason and the Argonauts have to overcome\
  \ to win the famous Golden Fleece from a fire-breathing dragon, in one of the greatest\
  \ greek myths of all time? When and where does this thrilling story come from? How\
  \ does it tie together the tales of Odysseus, Orpheus, Achilles and Circe? Is there\
  \ any historical evidence for the story of Jason and the Argonauts? What are the\
  \ origins of Medea, the beautiful but vindictive sorceress who Jason marries? Did\
  \ the Greeks still worship the Olympian gods in the more skeptical Hellenistic age?\
  \ How did the coming of Alexander the Great transform the Greeks’ understanding\
  \ of the divine? And, were the Olympian gods really once mortal kings and queens\
  \ of an earlier age, or were they planets….?\n\nJoin Tom and Dominic as they conclude\
  \ their epic journey into the glorious heart of Greek mythology, as they explore\
  \ their evolution in an increasingly skeptical Hellenistic world, and answer the\
  \ question; why did the Greek myths endure and captivate audiences throughout history,\
  \ in a way that no other culture’s mythology did?\n\n\n\n\n\nJoin The Rest Is History\
  \ Club: Unlock the full experience of the show – with exclusive bonus episodes,\
  \ ad-free listening, early access to every series and live show tickets, a members-only\
  \ newsletter, discounted books from the show, and access to our private Discord\
  \ chatroom. Sign up directly at therestishistory.com\n\n\n\nFor more Goalhanger\
