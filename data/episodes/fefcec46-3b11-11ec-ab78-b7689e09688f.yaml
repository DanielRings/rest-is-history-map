title: The Prime Ministers’ World Cup
description: 'Who is the greatest British Prime Minister of them all? The bookmakers
  have Winston Churchill favourite to lift the crown, but William Gladstone and Maggie
  Thatcher won’t give up the fight without a struggle. And who’s this coming up quietly
  on the left-hand rail? Why, it’s Clement Attlee, who looks a real threat to the
  horses on his right. Dominic Sandbrook and Tom Holland debate the runners and riders
  in our inaugural Rest is History World Cup.



