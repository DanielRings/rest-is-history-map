title: Athens and the Birth of Democracy
description: 'What did "demos" really mean to the Athenians? Why were women such a
  crucial part of Athenian democracy? And who was the Tom Wamsgams of Athens? Join
  Tom and Dominic as they explore whether Athenian democracy really was the precursor
  to modern day democracy, or whether it was something entirely different.


