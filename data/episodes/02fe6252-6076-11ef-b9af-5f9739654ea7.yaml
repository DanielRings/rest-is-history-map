title: 'Hundred Years’ War: England Triumphant (Part 4)'
description: 'St Crispin’s day, 1415: Henry V stands victorious, after a tremendous
  defeat of the French forces at the Battle of Agincourt. He is just about to make
  a historic speech which will be retold by Shakespeare nearly two centuries later.
  There are mounds of bodies, too many dead for the chroniclers to count. Those who
  escaped the bloodshed have been taken prisoner back to England, including the young
  Duke of Orleans, on the day before his twenty-first birthday. And a month later,
  across the Channel, the Count of Armagnac comes to power in Paris, and rules so
  brutally that the residents of the French capital start to hope for an English invasion.
  Henry V is taking no time to rest, and begins planning his next offensive…


  Join Tom and Dominic in the fourth instalment of our series on the Hundred Year’s
  War, as Henry V considers his next move after his triumph at Agincourt.


  _______

  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in New York, San Francisco, L.A., Chicago,
  Philadelphia, Washington D.C., and Boston.


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.

