title: 'Elizabeth I vs The Catholics: England’s Greatest Hero (Part 3)'
description: 'Why is Sir Francis Drake enshrined as one of England’s greatest heroes?
  Where did he come from, and how did he rise to prominence and earn the adoration
  of Elizabeth I, from obscure poverty? And, why is he also such a controversial figure…?




  Join Tom and Dominic as they sail into the remarkable life and adventures of Sir
  Francis Drake. From his controversial piracy, and his explorations around the world,
  to his burgeoning feud with the Spanish, ultimately culminating in his clash with
  Armada in 1588…&nbsp;






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


