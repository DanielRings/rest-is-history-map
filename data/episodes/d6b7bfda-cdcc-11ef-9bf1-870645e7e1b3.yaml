title: 'Wojtek: The Bear Who Beat the Nazis'
description: 'The story of Wojtek - the bear who took on the Nazis - amidst the death
  and devastation of the Second World War, and more specifically Poland''s heroic
  resistance, is a flicker of redemption amidst an otherwise deeply depressing period
  of history. His is a life that exemplifies not only Poland’s struggle in microcosm,
  but also the global nature of the war overall. Discovered by a young boy as a tiny
  cub, his mother dead, he was sold to Polish officers travelling to Palestine in
  the hills outside Tehran. The soldiers nursed and fed the young bear with milk from
  a vodka bottle, treating him like one of their own. Later, he was even purported
  to keep them warm at night, drink beer, delight in wrestling and showers, and both
  march and salute. When the Polish forces were finally deployed to Europe, ‘Wojtek’
  as he had been named, went with them; a mascot and morale booster to the men. There
  he was given military rank, and actively participated in the Italian campaign, carrying
  ammunition and artillery crates. But with death and destruction on all sides, what
  would be his fate?

  Join Tom and Dominic as they discuss Wojtek, one of history’s most extraordinary
  animals, and his life in the army - an emblem of hope and resilience in the face
  of the horrors of the Second World War.

