title: 'RIHC: The 1960s (Livestream)'
description: 'In Tom and Dominic''s inaugural livestream for the Rest is History Club,
  we dive into one of the most seminal decades in modern history: the 1960s. Should
  the period be remembered as a byword for cultural revolution or as the birthplace
  of individualism? Catch up or listen again to a jam-packed show that veers between
  the uprisings of Eastern Europe to Tom singing Bob Dylan. 


  Producer: Dom Johnson


  Exec Producers: Tony Pastor & Jack Davenport


