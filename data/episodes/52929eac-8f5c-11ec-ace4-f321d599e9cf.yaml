title: American Crusades
description: 'On today''s episode Tom and Dominic are joined by Andrew Preston, a
  Cambridge University professor whose new book focuses on religion in American war
  and diplomacy.


  What is the role of religion in the American outlook? How has it shaped foreign
  policy? What is the relationship between pacifistic religious ideals and a crusading
  mentality?


  Join us tomorrow for another episode, which focuses on more recent American history
  and its relationship with religion.


  Producer: Dom Johnson

