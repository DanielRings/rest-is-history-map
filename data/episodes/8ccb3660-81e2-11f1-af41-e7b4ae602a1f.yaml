title: 'A Murderous Affair: The Habsburgs'' Great Scandal (Part 1)'
description: 'What was Vienna like in the 1880s? Why was Crown Prince Rudolf of Austria
  seen as the outcast of the prestigious Habsburg dynasty? And, how would meeting
  17 year-old Baroness Mary Vetsera on his 30th birthday change both of their lives,
  and the trajectory of Europe, forever?




  Join Dominic and Tom as they unravel the mysterious tale that is the Mayerling Incident.




  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠Tickets available for Friday 4th September⁠⁠, the Saturday show is SOLD OUT.




