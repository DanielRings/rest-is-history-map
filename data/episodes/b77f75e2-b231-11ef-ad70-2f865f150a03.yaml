title: 'Warlords of the West: Barbarian Heirs of Rome (Part 1)'
description: 'The Rise of the Franks - a mighty host of warlords; forefathers of the
  western world and forgers of medieval civilisation, under the totemic leadership
  of history’s most glorious King: Charlemagne. It is a tale rich in fantasy and myth,
  transporting us into a distant age and the dark debris of a crumbling Roman empire;
  landscapes scarred by ruins, clashing queens, poisonings, sorcery, bloody battles,
  ice castles, and axe-wielding warriors, more reminiscent of King Arthur, Game of
  Thrones and the Lord of the Rings than real life. Once insignificant, terrifying
  barbarians from the peripheries of Gaul, with flaming red hair and formidable moustaches,
  they would emerge from the ashes of the Roman Empire in the 4th century AD, and
  become the heirs of the Caesars. But how? The answer lies in warring barbarian strongmen,
  the collision of old gods and the new, a mighty Christian martyr, a mysterious ancient
  bloodline born of perhaps Jesus Christ himself, the emperors of old, and a sea monster;
  and a battle to determine dominion of the West… 

  Join Tom and Dominic as they launch into one of the greatest stories in all of European
  history: the rise the Franks. Europe’s mightiest warriors, warlords and kings, whose
  legacy would reshape the world forever. 

