title: 'The Nazis in Power: The Night of Broken Glass (Ep 7)'
description: 'By November 1938 the scene in Germany was at its darkest yet, as the
  full scale of Hitler’s intentions for the Jewish population of the German Reich
  was becoming evermore apparent. As the threat of another world war increased, so
  the Nazi anti-semitism machine went up a gear. Synagogues were destroyed, Jewish
  businessmen, bureaucrats, lawyers and doctors disbarred, plans were made for a mass
  expulsion of Jews from Europe. But the worst was yet to come, as the assassination
  of a German official in Paris in late 1938 instigated the most savage wave of Jewish
  persecution in Germany so far…


  Join Dominic and Tom as they discuss the build up to Krystallnacht - the Night of
  Broken Glass - and the diabolical destruction, brutality and violence that ensued.
  By the end of 1938, Hitler’s two dearest ambitions, an apocalyptic victory over
  the Jewish people and the conquest of Europe itself, seemed terrifyingly within
  reach.



