title: Why A United Ireland Isn't Part of the UK
description: "What are the fundamental cultural differences between Ireland and the\
  \ UK? What role does religion and landownership play in the countries’ relationship?\
  \ And, why did the United Kingdom of Great Britain and Ireland fail?\n\n\n\nIn this\
  \ very special bonus episode, we share an exclusive talk from The Rest Is History\
  \ Festival at Hampton Court Palace. Here, Dominic is joined on stage by Friend of\
  \ the Show and historian Paul Rouse, to discuss the tumultuous history of Ireland\
  \ and Britain.\n\n\n\n\n\n*The Rest Is History LIVE: The Ultimate Victorian Adventure*\n\
  \nThe maddest expedition in history and it’s NEVER been heard before on the show:\
  \ join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers\
  \ story of Queen Victoria ordering one of history’s most daring assignments ever.\
  \ ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.\
