title: 'RIHC: Museums of the Western World (Livestream)'
description: 'Which six museums from throughout the West have Tom and Dominic found
  the most interesting or unusual, and why? From space age classical statues in Rome,
  to the mysterious Grauballe Man in Denmark, and much, much more...


  Join Dominic and Tom for this month''s livestream, as they discuss six of the world''s
  most intriguing museums, and some of the extraordinary historical treasures contained
  within them.




  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London!

  Buy your tickets here: therestishistory.com



