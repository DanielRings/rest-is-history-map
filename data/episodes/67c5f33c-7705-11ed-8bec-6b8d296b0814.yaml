title: 'Cameroon: The Slave General of Peter the Great'
description: 'In today’s World Cup special on Cameroon, Tom and Dominic tell the fascinating
  story of “probably the most famous Cameroonian to become a Russian General”. Learn
  about the extraordinary life of Major-General Abram Petrovich Gannibal, the great-grandfather
  of Russia’s most famous poet, Alexander Pushkin.


