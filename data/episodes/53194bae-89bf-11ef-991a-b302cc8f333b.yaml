title: 'The French Revolution: Massacre at the Palace (Part 4)'
description: 'The war between revolutionary France and the allied powers of Prussia
  and Austria has reached fever pitch, and in early August 1792, the latter party
  threaten a terrible vengeance on Paris should harm be done to the French royal family.
  But far from calming tensions, this threat puts the King, Marie Antoinette and their
  children in terrible danger. They’ve been kept in the Tuileries Palace since their
  failed escape, and on the 10th of August, a frenzied crowd, led by National Guards
  and “fédérés” from Marseille, storm the palace, massacring the Swiss guards defending
  the Royal family, as they tear through the halls, in search of Louis XVI and Marie
  Antoinette…


  Join Tom and Dominic in the fourth instalment of season two of the Fetch Revolution,
  as they dive into the chaos and carnage of the storming of the Tuileries.


