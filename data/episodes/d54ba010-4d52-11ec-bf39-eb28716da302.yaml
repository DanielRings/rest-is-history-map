title: The UK’s Best Churches
description: 'There are estimated to be around 16 thousand churches in England alone. But
  which are the finest in the UK? Tom Holland and Dominic Sandbrook are joined by
  the director of Friends of Friendless Churches, Rachel Morley, to decide a top ten. They
  also discuss some of the listeners’ favourites. Just remember: cathedrals not allowed!

  8'
