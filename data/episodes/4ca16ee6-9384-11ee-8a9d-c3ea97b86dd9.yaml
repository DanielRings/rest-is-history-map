title: 'The Savage Storm: World War II and The Battle for Italy'
description: 'The Battle for Italy in 1943 proved to be one of the bloodiest and most
  brutal episodes of the Second World War. Following hot on the heels of their recent
  victory in Sicily, the Allies crossed the Straits of Messina and entered Italy in
  September, to fight their way up the Italian peninsula, what Churchill termed “the
  soft underbelly of Europe”. Intended to draw Axis troops away from the Eastern Front,
  and with Churchill’s enthusiastic backing, the campaign was expected to be an easy
  one, with Allied troops in Rome by Christmas. But this wasn''t to be the case. What
  unfolded was an attritional meat-grinder, in which every mile the Allies covered
  was a hard-fought struggle against fierce German resistance.

   

  Join Tom, Dominic and renowned historian of war James Holland to discuss this dark
  and dramatic campaign, fought amidst the precarious ruins of a vanished Roman empire,
  as they describe in unflinching detail its horrors, hardships, and tragedies. Buy
  your copy of James'' new book here: https://coles-books.co.uk/the-savage-storm-by-james-holland-hardback


