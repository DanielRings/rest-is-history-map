title: The Trial of Charles I Part 2
description: 'Tune in to hear the second part of The Rest Is History''s take on the
  execution of Charles I and its aftermath.


  Charles I was executed 373 years ago to the day on 30th January. But was his killing
  a sinful act of treason or merely one of retributive justice?


  Tom and Dominic welcome back Professor Ted Vallance from the University of Roehampton
  to explore one of the most extraordinary events in British history.


  Producer: Dom Johnson

  Exec Producer: Tony Pastor


