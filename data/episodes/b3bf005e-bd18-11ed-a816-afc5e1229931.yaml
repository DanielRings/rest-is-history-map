title: 'RIHC: Women''s History, gladiators, and a literary smackdown'
description: 'How close was Germany to civil war in 1918? Could it have followed Russia''s
  lead? Did Tolstoy appreciate Shakespeare, and would he beat him in a write-off?
  What are the challenges of producing episodes on social histories? Which French
  novel is one of Dominic''s all-time favourites? Would Tom, if he could travel in
  time, disappear to the Colosseum to watch gladiators fight? In this week''s bonus
  episode, our hosts attempt to answer these difficult questions, and many more...


