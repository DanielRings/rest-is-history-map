title: 'Hitler''s War on Poland: Countdown to Armageddon (Part 1)'
description: 'Following the Munich agreement of September 1938, Nazi troops marched
  into Czechoslovakia and ruthlessly claimed it as a German protectorate. Still, even
  following his annexation of Czechoslovakia, Hitler’s determination to make Germany
  the greatest power in Europe was far from sated. Thus, hungry for war and keenly
  conscious of Germany’s fast imploding economic situation, his mind had turned by
  the beginning of 1939 to his next unfortunate target: Poland. And it was not only
  defeat that he envisaged this time, but Polish liquidation. But, with both the Poles
  and British becoming increasingly wary of Germany''s growing assertiveness and militarism,
  in March 1939 they and France forged a military alliance. Enraged by this, Hitler
  finalised his plans for the conquest of Poland. In an unexpected turn of events,
  he also went in search of an unlikely ally of his own to counter the new alliance
  from which he was smarting: Russia’s Joseph Stalin, the Nazis’ ideological antagonist…

  Join Tom and Dominic for the appalling story of the build up to Hitler’s genocidal
  war on Poland. Was it possible that even at this inflamed juncture, war could still
  have been prevented?

