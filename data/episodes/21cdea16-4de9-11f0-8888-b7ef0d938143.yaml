title: 'The Irish War of Independence: Rise of the IRA (Part 1)'
description: 'What are the origins of the Irish War of Independence? What impact did
  the First World War have on Irish efforts for Home Rule? What was the mood in Ireland
  following the bloody Easter Rising of 1916? And, who was Éamon de Valera, the man
  who dominated the story of not only Irish politics in the 20th century, but also
  the entire story of Irish independence?


  As they launch back into the epic and tumultuous Irish War of Independence, Dominic
  and Tom are joined once again by historian Paul Rouse, to discuss one of the most
  important conflicts in the history of Britain. 


