title: 'The Troubles: Murder in Belfast (Part 1)'
description: 'How did the Troubles break out in Northern Ireland in the 1960s, and
  how far back does the dispute really go? Why did the conflict intensify as it did?
  And, what did it really mean to be a Catholic in Northern Ireland?&nbsp;




  Join Dominic and Tom as they discuss one of the darkest and most contentious periods
  of British history: The Troubles.&nbsp;






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


