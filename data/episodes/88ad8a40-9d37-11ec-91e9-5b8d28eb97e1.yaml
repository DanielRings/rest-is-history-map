title: Putin's Russia (Episode 4)
description: '[Episode 4 of 4]


  ''In the noughties, Russian democracy becomes a form of show business''


  In the final instalment of our Russia mini-series, Tom and Dominic reach the climax
  of Putin’s rise to power, charting how a former KGB agent managed to climb from
  relative obscurity to become the uncrowned Tsar of Russia.


  The episode also touches on his relationship with oligarchs such as Roman Abramovich,
  the hall of mirrors he''s created, and a look at how his character has changed over
  the course of his presidency.


