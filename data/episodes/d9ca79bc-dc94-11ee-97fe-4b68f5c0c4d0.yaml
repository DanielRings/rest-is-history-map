title: 'Titanic: Nightmare at Midnight (Part 5)'
description: '“A story of horror unparalleled in the annals of the Sea.”

  On the 14th of April 1912, Titanic, a floating palace sailing through the North
  Atlantic, found itself hurtling towards a formidable iceberg. Contrary to the panicked
  reactions of her crew who, fatefully, pulled the hulking vessel to starboard, the
  ship''s passengers slept, laughed and played on, unaware of the danger ahead. Then
  came a terrible grinding sound, as the side of the ship grated against the iceberg,
  followed by a long, dead silence. At 12.15am a distress call went out, and the order
  went out to begin filling the lifeboats, women and children first. But, with far
  fewer lifeboats than passengers, who would be allowed to board them, and who would
  be left behind? What leverage did gender, class, and age provide when so many lives
  hung in the balance? By 1.55am, the lifeboats were scarce, and the panic of those
  still aboard the ship spiralled out of control, as the Titanic entered her death
  throes… 


  Join Tom and Dominic as they discuss Titanic’s collision with the iceberg, the reactions
  of her doomed passengers and crew, and the stories of courage, incompetence, and
  tragedy.


  *The Rest Is History LIVE in 2024*

