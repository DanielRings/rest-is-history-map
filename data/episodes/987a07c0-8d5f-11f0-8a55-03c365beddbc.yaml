title: 'RIHC: The Glorious Revolution, Whigs vs. Tories, and the Birth of Party Politics'
description: 'How did the late 17th and early 18th centuries cement the political
  traditions that have defined Britain ever since? Why was the political history of
  this period so tumultuous? Who were the Whigs and the Tories, and what did they
  stand for? How and why were these political positions descended from the Cavaliers
  and Roundheads of the English Civil War? What did The Glorious Revolution, in which
  the Catholic Stuart James II was defeated and replaced as king by the Dutch William
  of Orange, have to do with the escalation of party political tensions? When did
  religion cease to be the great dividing line in politics? Why was this turbulent
  period, nevertheless so much less violent than former epochs? Who was on the throne,
  overseeing the political melee? Do the Whigs and Tory’s provide the origins of the
  Brexit divide? And, which side of the divide would politicians such as the current
  UK Prime Minister, Keir Starmer, fall onto - Whig or Tory...?




  In this week’s bonus episode, Dominic is joined by historian and old friend of The
  Rest is History, George Owers - AKA Capel Lofft - to discuss the birth of the Whigs
  and the Tories, the two political parties that laid the foundation for British politics
  today.


