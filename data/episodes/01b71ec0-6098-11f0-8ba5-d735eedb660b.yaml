title: 'RIHC: Corrupt US Presidents, Wartime Prime Ministers, and the Birth of Byzantium'
description: 'Who was, or is, America’s most corrupt president? Where is the boundary
  between Eastern and Western Europe, and where should it be? When did the Eastern
  Roman Empire become Byzantium? Do ideas such as Marxism really serve as the drivers
  of history? Who was the more impressive wartime Prime Minister, Pitt the Younger,
  or Churchill? Did the Roman Empire decline and Fall? And, if Tom and Dominic could
  make an Assassins Creed game set in any period, which would they choose…?




  Join Tom and Dominic as they answer these fascinating historical questions.  




