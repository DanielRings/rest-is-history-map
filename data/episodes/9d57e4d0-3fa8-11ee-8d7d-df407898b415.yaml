title: The Lost Library of Alexandria
description: 'One of the greatest institutions of the ancient world, the Library of
  Alexandria was the embodiment of ultimate learning, and a “repository of everything”.
  Built within the same complex as the tomb of Alexander the Great, it stood as a
  beacon of knowledge, boasting an unparalleled collection of scrolls and manuscripts
  from across the world. Join Tom and Dominic as they explore the story of the Library,
  its role in the ancient world, and who eventually destroyed it…



