title: 'Mary, Queen of Scots: The Royal Rivals (Part 2)'
description: 'What was life like in the glittering French court, for the young and
  newly married Mary Queen of Scots? What momentous destiny was her formidable mother,
  Mary of Guise, planning for her? How did Mary become, in 1559, not only the queen
  of Scotland, but also of France, and - according to her Catholic French supporters
  - the queen of England? What would Mary do when unexpectedly widowed in a distant
  court of vipers? And, what did her cousin, the famous Protestant English Queen,
  Elizabeth I, make of this young, charming, Scottish pretender to her throne...?


  Join Tom and Dominic as they discuss Mary Queen of Scots; her rise to the throne
  of France, and her burgeoning rivalry with Elizabeth I. 




