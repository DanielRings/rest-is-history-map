title: The Most Disastrous Party in History
description: 'We''ve all been to some terrible ones, but what is the most disastrous
  party in human history?


  Not at all inspired by recent political events, Tom and Dominic have whittled our
  listener suggestions down to the ten parties that they think are the most calamitous
  - tune in to hear which party comes out on top!


