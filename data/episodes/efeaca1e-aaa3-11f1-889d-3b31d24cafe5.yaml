title: 'Cicero: Defender of the Republic'
description: 'Who was the statesman Cicero, and how did he rise from provincial obscurity
  to become one of Rome’s greatest orators, crushing conspiracy along the way? How
  did he defend the Roman Republic against Julius Caesar and his allies? And, why
  did his long and tumultuous life end with a bloody execution…?




  In this week’s bonus episode, Tom is joined by historian Catherine Edwards to discuss
  the rise, triumphs, and downfall of Cicero - one of the most famous Romans of all
  time - in the dying days of the Roman Republic.&nbsp;




  Catherine’s new book, The life of Cicero and the end of the Roman Republic is out
  now in hardback, audio and ebook.




