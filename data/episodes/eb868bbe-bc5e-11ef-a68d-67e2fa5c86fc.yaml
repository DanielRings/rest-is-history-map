title: 'RIHC: Paul McCartney, Churchill’s Roaring Lion, and Stalinist Propaganda'
description: 'What did war photography capture about the truth of the Vietnam War?
  How did Stalin erase his enemies from the public record? What was the story behind
  ‘The Roaring Lion’, the most iconic portrait of Winston Churchill ever taken, and
  one of the most famous photographs of all time? What does Richard Avedon''s melancholic
  photograph of Marilyn Monroe reveal about the actresses inner turmoil? And, how
  does filming and photographing Tom and Dominic on Savile Row, in collaboration with
  Anderson & Sheppard tailors and the Royal Albert Hall, compare with his time photographing
  Sir Paul McCartney, and other stars?

  In this week’s bonus episode, Dominic is joined by one of Britain’s best known photographers,
  Chris Floyd, to discuss history’s greatest photographs and their subjects.


  Follow this link to watch Chris'' film of Tom and Dominic on The Rest is History''s
  YouTube channel: https://www.youtube.com/watch?v=vUwp_ZYen8k&amp;t=5s

