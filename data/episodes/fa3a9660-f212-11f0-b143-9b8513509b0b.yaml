title: 'Revolution in Iran: Rise of the Ayatollah (Part 2)'
description: 'What set off the final uprisings of the Iranian Revolution, against
  the last Shah of Iran, Mohammed Reza Pahlavi? Would President Jimmy Carter and America
  back the Shah’s forbidding opponent, the firebrand, Ayatollah Khomeini? And, why
  would the Revolution prove to be one of the most pivotal events in recent history?




  Join Dominic and Tom, as they discuss the final fall of Iran’s last Shah, America’s
  response, and the rising power of the revolutionary Ayatollah Khomeini, and his
  radical new vision for the governance of Iran…




