title: The First Abolitionist
description: 'It''s 1718, an English Quaker lands in Barbados. He is soon horrified
  to discover the treatment of people working the plantations there. Treatment the
  Marquis de Sade saw as the only cruelty that could rival that of the ancients. Listen
  to discover how Benjamin Lay became the first abolitionist, performing many stunts
  to shock and convince his fellow Quakers and humans that slavery was abhorrent and
  wrong.


  This episode contains graphic details of the torture of enslaved people, including
  mentions of suicide. This content is not intended for younger audiences, and listener
  discretion is advised.


