title: 'The 1973 Chilean Coup: General Pinochet Seizes Power (Ep 2)'
description: 'The U.S. have given up on ousting the socialist President Allende through
  democratic means, and shift to a more militaristic approach, in the form of General
  Pinochet. Once known as the ‘dull dog’, a man who had a reputation for procuring
  Jeeps for his fellow troops, the son of a customs official, he would overthrow Allende
  and become a bloodthirsty tyrant, killing thousands and torturing far, far more.
  In our second episode on the 1973 Chilean coup, Tom and Dominic look at how the
  coup itself unfolded, Salvador Allende’s ensuing fate, and what life was like in
  Chile under the ruthless Pinochet.


