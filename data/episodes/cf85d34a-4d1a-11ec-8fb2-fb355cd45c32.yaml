title: The Berlin Wall
description: '60 years ago this month, the German Democratic Republic (East Germany)
  began building a barrier that divided the city of Berlin. It stood until 1989 and
  came to symbolise the front line of the Cold War.


  Iain MacGregor, author of "Checkpoint Charlie: The Cold War, the Berlin Wall and
  the Most Dangerous Place on Earth", joins Tom and Dominic to discuss the history
  of the Wall, the ideological divide it represented and why it eventually fell.


