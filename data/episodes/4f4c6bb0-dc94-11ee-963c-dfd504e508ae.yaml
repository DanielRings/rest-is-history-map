title: 'Titanic: Countdown to Disaster (Part 3)'
description: 'The drama and tragedy of the Titanic’s sinking has spawned all manner
  of myths about those who left Southampton on the 10th of April 1912, and for four
  days luxuriated in the ship’s modern facilities, extravagant interiors, and plush
  cabins. Among them were many magnates and tycoons, such as J.J. Astor, the richest
  man onboard, and the American businessman Ben Guggenheim. Conspicuously absent,
  however, was J. P. Morgan, who cancelled his booking at the last minute, and five
  days later would find his greatest business competitors eliminated… Just as intriguing
  though, and often overlooked, were the Titanic’s second class passengers: middle-aged
  men with their teenage mistresses, a father who had his kidnapped his children,
  excited migrant families, and Joseph Laroche, a brilliant engineer and the only
  black man on board, for whom the Titanic provided the chance to start a new life-
  the same was true for many others.

  Join Tom and Dominic as they explore the dazzling, eccentric and endlessly fascinating
  First and Second Class passengers of the Titanic, whose extraordinary lives shine
  all the brighter for the terrible danger and tragedy waiting for them on the icy
  horizon…


  *The Rest Is History LIVE in 2024*

