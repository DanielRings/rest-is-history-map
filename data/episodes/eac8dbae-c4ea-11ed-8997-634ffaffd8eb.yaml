title: 'Atlantis: The Legend (Ep 1)'
description: 'Majestic palaces, untold riches, and indeterminable power... the story
  of Atlantis is a tale as old as time. But is there really any truth behind the ancient
  tome, or was Plato simply trying his hand at political satire? Join Tom and Dominic
  as they discuss the origins of the legend of Atlantis.


