title: 'The Irish War of Independence: Bloody Sunday (Part 3)'
description: 'What occurred on Bloody Sunday on 21 November 1920 - a turning point
  in the Irish War of Independence and one of the bloodiest and most brutal moments
  in Irish history? How many British Army Officers were assassinated on the instructions
  of firebrand political leader, Michael Collins, that morning? Then, how many civilians
  did the British army gun down during a Gaelic football match at Croke Park that
  afternoon, and why given it was largely unprovoked? And, what events did that fateful
  day set in motion along the road to Irish Independence, by turning Irish public
  opinion against the British government?


  In today’s episode, Dominic and Tom are joined once more by historian Paul Rouse,
  to discuss one of the most tragic events of the entire Irish War of Independence;
  Bloody Sunday. 


