title: 'RIHC: Secret Nazi Tunnels, Europe''s Deep History, and Mysterious Frontiers'
description: 'How did the Nazis brutally reshape the boundaries of Poland, and thereby
  dislocate vast swathes of her population? What is the deep history of Europe''s frontiers?
  Why are liminal border zones such uncanny, almost other-worldly places? What were
  the mysterious Nazis tunnels built into the eerie mountains of Silesia? Was the
  Holy Roman Empire a single entity or many distinct states? What can borderlines
  tell us about the lesser known aspects of European history? Have borders become
  more a less restrictive and regimented? How did the First and Second World Wars
  redraw the whole of Europe? And, what was the legendary amber Room of St Petersburg,
  one of history''s great lost treasures...?

  In this week''s bonus episode, Dominic is joined by political historian Lewis Baston,
  to discuss his brilliant new book ''Borderlines'', and the remarkable, secret history
  of Europe''s borders, from east to west.

