title: 'Romans in Space: Star Wars, Dune and Beyond...'
description: 'Extolling his love for democracy, the Senator took on autocratic powers,
  during a time of emergency, to save the Republic. The Republic was then abolished,
  and in its place rose an Empire… This is not the story of Julius Caesar or Augustus,
  but of ‘Star Wars’, the blockbuster movie series telling the story of a struggle
  between good and evil, a battle for the revival of the old Republic. 

  But is the world of ‘Star Wars’ really inspired by Roman history? How does ‘Dune’
  reflect the birth and growth of Islam? Why does ‘The Hunger Games’ use Roman iconography
  and names? Does Isaac Asimov’s ‘Foundation’ reflect the fall of the Roman Empire?

  Join Tom and Dominic in today’s episode, as they look at how the Roman myth has
  seeped into popular culture, inspiring quests, stories and entire worlds, from ‘Star
  Wars’ to ‘Dune’, ‘Star Trek’, ‘The Hunger Games’, and many more sci-fi bestsellers.


  *The Rest Is History LIVE in 2024*

