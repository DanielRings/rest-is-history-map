title: 'Sixties Fashion: Swinging London (Ep 2)'
description: 'In a swirling world dominated by miniskirts, feather boas, posh photographers,
  youth culture, Jimi Hendrix and the Beatles, London has been transformed, and avant-garde
  “boutiques” have taken over areas left empty in the wake of the demise of local
  manufacturing. Join Tom and Dominic in the second part of our series on Sixties
  Fashion, as they explore the birth of the miniskirt, Sergeant Pepper’s, hippies,
  the legacy of the 60s, and much more - all you need is love!


