title: 'Peter the Great: The Rise of Russia (Part 1)'
description: "Why was the early life of Peter the Great - Tsar and autocrat of all\
  \ the Russias, who endures to this day as an iconic symbol of Russian might - drenched\
  \ in blood and violence? What amalgamation of court politics and family feuding\
  \ saw him catapulted to the role of Tsar against all the odds? What did he do during\
  \ the course of his colourful life and tumultuous reign to earn the moniker ‘the\
  \ Great’? And, why is he considered by many, the father of Russia? \n\n\n\nJoin\
  \ Dominic and Tom as they launch into the early life of one of history’s most bombastic\
  \ rulers - Peter the Great; the conditions in 17th century Russia, the violent palace\
  \ coup that nearly destroyed him as a boy, and his road to the Great Northern War\
  \ that would later make his name, and change the fate of Europe. \n\n\n\n\n\nThe\
  \ Rest Is History Club: Become a member for exclusive bonus content, early access\
  \ to full series and live show tickets, ad-free listening, our exclusive newsletter,\
  \ discount book prices on titles mentioned on the pod, and our members’ chatroom\
  \ on Discord. Just head to therestishistory.com to sign up, or start a free trial\
  \ today on Apple Podcasts: apple.co/therestishistory.\n\n\n\nFor more Goalhanger\
  \ Podcasts, head to www.goalhanger.com\n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\
