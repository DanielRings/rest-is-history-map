title: The Fall of the Roman Republic
description: 'In this second episode on perhaps the most notorious assasination in
  world history, Tom and Dominic look at the bloody and chaotic aftermath of the death
  of Julius Caesar. They discuss the fate of the senators turned assassins, their
  failure to restore the institutions of the republic, and the ensuing civil war that
  brought about the first emperor of Rome.


