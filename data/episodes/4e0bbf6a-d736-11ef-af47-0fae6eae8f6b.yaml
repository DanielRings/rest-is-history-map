title: 'Emperors of Rome: Sex Secrets of the Caesars (Part 1)'
description: 'The Roman historian Suetonius’ The Lives of the Caesars, written during
  the early imperial period of the Roman Empire, is a seminal biography covering the
  biographies of the early emperors of Rome, during two spectacular centuries of Roman
  history. Delving deep into the personal lives of the caesars and sparing no detail,
  no matter how prurient, pungent, explicit or salacious, it vividly captures Rome
  at the peak of her power, and those colourful individuals at the heart of everything.
  It is an unsettling yet fascinating portrait of the alien and the intimate, that
  sees some of history’s most famous characters revealed as almost modern men, plotting
  a delicate line between private and public, respectability and suspicion. From the
  showmanship of Augustus, the first Caesar, and his convoluted family melodramas,
  to Tiberius, a monster in the historical record famed for his sexual misdeeds, to
  Caligula, who delighted in voyeuristic moral degeneracy, and the looming shadow
  of Nero; all will be revealed…

  Join Tom and Dominic as they launch into Suetonius and the lives of Rome’s most
  infamous emperors, illuminating a world of sex and violence that both venerates,
  deifies and condemns absolute power. When the curtain is lifted, what deprivation
  lurks behind the majesty of Rome? And who was the real Suetonius, the man laying
  it all bare?


  Pre-order Tom Holland''s new translation of ''The Lives of the Caesars'' here.

