title: A Very British Scandal
description: 'Jeremy Thorpe was the most flamboyant politician of his day. Leader
  of the Liberal Party for nine years he was tried at the Old Bailey for conspiracy
  to murder his former lover Norman Scott. Although acquitted, the case destroyed
  Thorpe’s career. Dominic Sandbrook and Tom Holland discuss this extraordinary story,
  which includes the murder of Scott’s dog Rinka.


