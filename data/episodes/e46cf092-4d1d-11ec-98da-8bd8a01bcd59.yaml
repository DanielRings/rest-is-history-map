title: Silicon Valley Part 2
description: 'The rise of social media is the central subject of our second instalment
  with tech pioneer Marc Andreessen. Tom Holland and Dominic Sandbrook ask whether
  social media is the principal force behind an increase in populist politics. The
  ‘Americanisation’ of culture plus Marc’s theory on why software is the closest thing
  to real life magic also feature.


