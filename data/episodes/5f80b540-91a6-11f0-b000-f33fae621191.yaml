title: CHATHAM HIGH STREET
description: 'Why is Chatham High-street both futuristic and riddled with the past?
  Why was it a magnet for historical figures such as King John, Charles II, Nelson
  and Charles Dickens, and the location for some of the most totemic moments in British
  history? Is it really a melting pot of every epoch - from the Roman invasion of
  Britain, to the Napoleonic Wars, and to the Second World War - and therefore the
  most historically significant high-street in the world? 


