title: 'Dawn of the Samurai: Japan''s Greatest Warrior  (Part 3)'
description: 'Who was Yoshitsune, one of the greatest generals in all Japanese history?
  What part did he play in the ferocious Samurai civil war between the Minamoto clan
  and the Taira? And, who would win the most decisive victory in all of Samurai history?




  Join Tom and Dominic as they delve deeper into the origin, rise, and triumph of
  the mighty Samurai, in 12th century Japan.




