title: 'King Arthur: The Once & Future King (Part 1)'
description: 'What is the truth behind the tales of King Arthur, Britain’s greatest
  myth? When did these stories begin, and with whom? And, is Arthur’s apocalyptic
  last battle based on an English historical reality from the 15th century?




  Join Tom and Dominic as they launch into one of the greatest historical mysteries
  of all time, and discover the truth behind the legends of King Arthur.&nbsp;&nbsp;&nbsp;


