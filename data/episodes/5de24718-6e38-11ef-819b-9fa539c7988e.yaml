title: 'The War on Beards: From Peter the Great to John Lennon (Part 2)'
description: '“I like an Englishman to look like an Englishman, and beards are foreign
  and breed vermin. Also depend upon it, they will lead to filthy habits.”


  Europe has had a love-hate relationship with facial hair since the Late Middle Ages.
  In the eleventh century, beards were celebrated as an expression of fertility caused
  by men’s “hot breath”. Yet by the turn of the twentieth century, a clean shaven
  man represented the youth and vigour celebrated in corporate culture. But how did
  the Reformation impact opinions on beards? Why did Peter the Great instate a tax
  on beards in Russia? How did the Crimean War lead to the popularity of the Victorian
  beard? And why did The Beatles end up bearded?


  Join Dominic and Tom as they discuss the evolution of the modern beard. With a cast
  of hairy and hairless characters including the bearded witches of Macbeth, cricketer
  Winston Churchill, Jeremy Corbyn, George Best, W. G. Grace, Charles Darwin, and
  Lord Kitchener…


