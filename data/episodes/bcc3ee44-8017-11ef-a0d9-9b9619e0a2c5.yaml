title: 'RIHC: Assassinations, American Exceptionalism, and Clinton''s Lost Election'
description: 'What was the worst foreign policy mistake the US ever made? Who will
  win the upcoming presidential election? Should the northern states have just abandoned
  the South in the American Civil War? Do assassinations have long-term political
  repercussions? Will America be the most powerful nation in the world in 100 years? 


  In this week’s bonus episode, Dominic is joined by friend and Professor of American
  History, Andrew Preston, to discuss Reagan’s optimism versus Trump’s rage, America''s
  most underrated president, and why there’s no such thing as too much maple syrup…

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

