title: 'RIHC: Is Marathon the Most Important Battle in Ancient History?'
description: 'Has the improbability of a Greek victory at the Battle of Marathon been
  exaggerated? Is the Battle of Marathon the most important battle of the ancient
  world in terms of transforming the future of the west, or is this overplayed? And,
  do you think the Greeks who fought at Marathon would appreciate the modern marathon?




  Join Tom and Dominic for this week’s bonus Q&amp;A as they answer these questions
  and more.


