title: 'The Road to 1066: Revenge of the Vikings (Part 2)'
description: 'Following the bloody St Brice''s Day Massacre, of the 13th of November
  1002, which saw King Æthelred brutally exterminating the Danes from England, the
  Vikings were hungry for revenge. None more so than the terrifying Scandinavian King,
  Sweyn Forkbeard. Having capitalised on his famous father, Harold Bluetooth''s unification
  of Norway and Denmark, through his aggressive christianisation of the formerly pagan
  peoples there, Sweyn had built up a formidable force. It was this power that Æthelred
  had unwisely taunted, underestimating the might of the Danes. He would pay the price
  only a few short months later when Sweyn''s terrible fleet landed at Wilton Abbey
  in Wessex - one of the greatest symbols of the House of Alfred the Great - to bleed
  England dry, and destroy her King. Time and time again, from this date onwards,
  Sweyn''s Danish raids would devastate England, even going so far as to lock the Archbishop
  of Canterbury in a cage…by 1013 Æthelred''s reign was essentially over, his family
  having fled to Normandy, and England under Danish rule. But then, the death of Sweyn
  Forkbeard would change everything, setting in motion another titanic war of succession,
  this time pitting the Scandinavian Cnut against Æthelred''s son Edmund Ironside.
  Who would triumph in this climactic clash of would-be kings?

  Join Tom and Dominic as they discuss the revenge of the vikings and the rise of
  Cnut, as 1066 and the Battle of Hastings loom into view...


