title: 'The Battle of Cable Street: Fascism Defeated (Ep 3)'
description: '“You will never catch Sir Oswald admitting to anti-semitism - all he
  does is embody it!”

  Following the violent scenes at Kensington Olympia, the British fascist movement
  is in decline. Britain is swirling with unemployment, having just come out of a
  decade of general strikes, and as the country suffers, changes and becomes more
  urbanised, the fascists seek a scapegoat to pin Britain’s downfall on. On the 6th
  of October 1936, Mosley gathers with 3000 of his blackshirts to march through London’s
  East End, an area with a large Jewish population; they are met by 100,000 anti-fascist
  demonstrators blocking the streets… Join Tom and Dominic in the third episode of
  our series on British fascism, as they look at the Battle of Cable Street, fascism
  in the pre-war years, Oswald’s role in the anti-war movement, his eventual arrest
  and detainment, and much more.


