title: The Handmaid's Tale, by Margaret Atwood
description: 'Which moments from history inspired the terrifying dystopian patriarchy
  of ‘The Handmaid’s Tale’? How does this unsettling thriller of a novel unfold? Who
  are characters such as ‘the Commander’, his wife Serena Joy, and their ‘Handmaid’,
  Offred, based upon? Is it a prediction of the future, or a reflection of America’s
  past? Who is the book’s author, Margaret Atwood, and did she draw upon her own life
  when writing it? To what extent was she inspired by modern American politics? Why
  does this riveting thriller still matter so much today? And, what was the basis
  for the titular, red robed ‘Handmaids’ of the novel…?


  Join Dominic and Tabby as they explore Margaret Atwood’s chilling dystopian fable,
  ‘The Handmaid’s Tale’, delving into the history behind the book, and unravelling
  the terrifying world of Gilead, in which women are nothing but slaves to their bodies,
  the state, and the men who govern it. 


