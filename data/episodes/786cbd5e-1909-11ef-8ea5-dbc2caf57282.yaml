title: 'Fall of the Sioux: The Ghost Dance (Part 2)'
description: 'Following the tragic death of Crazy Horse and the ruthless cessation
  of the Sioux way of life, the last of the great Native American leaders were gradually
  picked off or repressed by the U.S. Government. Few though had so pitiful a fate
  as the once mighty Lakota War Chieftain, Sitting Bull. Having fled to Canada in
  search of peace from the relentless harrowing of his people, Sitting Bull finally
  returned and arrived at the Standing Rock Reservation in 1883. He was unprepared,
  however, for the changes wrought upon his people. With the explosion of railroads
  and the decimation of the already flailing buffalo populations, the Great Plains
  had been transformed into a desolate, barbed wasteland. While, the Native Americans
  within the reservations were increasingly coerced into Christianity by missionaries,
  or controlled by Federal agents. Then, news reached Sitting Bull and his people
  of a messianic figure from beyond the Rocky Mountains, who would come to liberate
  them from their plight. With him he brought the answer to their troubles: the Ghost
  Dance. Would it see the drums of war sound once more? 

  Join Dominic and Tom as they discuss the life of Sitting Bull in the years following
  his victory at the Little Bighorn: the destruction of the Plains, his time with
  the infamous Buffalo Bill, and the birth of the mystical, incendiary Ghost Dance. 





