title: The Birth of the Railways
description: 'Today Tom and Dominic are joined by historian Dan Jackson to talk about
  one of the greatest inventions known to man - the railways.


  Where were they first created? When did they arrive in England? And how did they
  relate to the standardisation of GMT in Britain?


  From Eric Hobsbawm to cucumber straighteners, this pod has it all! 


