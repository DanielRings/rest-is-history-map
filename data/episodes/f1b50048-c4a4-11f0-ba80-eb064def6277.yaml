title: 'RIHC: Henry VIII, Katherine of Aragon, and The Secrets of the Tudor Heart
  Pendant'
description: "How is the recently discovered 'Tudor Heart Pendant', connected to Henry\
  \ VIII and the first of his many wives, Katherine of Aragon? What secrets does it\
  \ reveal about the true nature of their relationship? And, in what miraculous way\
  \ was this beautiful, significant necklace, found...?\n\n\n\nIn this week's bonus\
  \ episode Tom is joined by Rachel King, curator of Renaissance Europe at the British\
  \ Museum, to discuss the story behind the recently discovered Tudor Heart Pendant,\
  \ and the truths it reveals about Henry VIII.   \n\n\n\nFor more information and\
  \ donations, visit: https://www.britishmuseum.org/tudor-heart-appeal \n\n\n\n_______\n\
