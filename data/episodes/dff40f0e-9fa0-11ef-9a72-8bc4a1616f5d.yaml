title: 'RIHC: The Revolutionary Rock and Roll of 1968'
description: 'What does the music of 1968 America tell us about the roiling political
  climate of that tumultuous year of American politics? Why has music so often been
  associated with protest and the left, against right wing policies? Was music always
  a vehicle of protest in 1968 or just as much about having a good time? How did the
  music of this period differ from that of the rest of the world? Why did it take
  for Punk to take off in the late 1970’s for the UK to have a comparably momentous
  moment of music history? Why did right-wing politicians like George Wallace see
  rock and roll as threatening? Was this the year that music became politicised? And,
  just why is it that the music of that year so political? 


  In this week’s bonus episode, with Dominic away, Tom is joined by historian Dorian
  Lynskey to discuss the history of music, politics and protest.


