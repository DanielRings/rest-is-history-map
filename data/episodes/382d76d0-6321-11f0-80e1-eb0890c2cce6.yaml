title: 'Mary, Queen of Scots: Murder Most Foul (Part 4)'
description: "Why did Mary Queen of Scots’ second marriage to the volatile Lord Darnley\
  \ threaten to send Scotland into civil war? In what way did she essentially declare\
  \ war upon her powerful cousin, Elizabeth I? Who was the hotheaded James Hepburn,\
  \ the Earl of Bothwell, and why would he come to play such a devastating role in\
  \ Mary’s life? Could Mary survive unburnt if the religious tensions smouldering\
  \ at the heart of Scotland, erupted into a bonfire of destruction? Why did she personally\
  \ lead a Scottish army into battle, pistols in hand? And, who in her inner circle\
  \ was brutally murdered before her very eyes?\n\n\n\nJoin Tom and Dominic as they\
  \ discuss the climax of Mary Queen of Scots’ dysfunctional marriage, her efforts\
  \ to seize power in both Scotland and England, and the birth of her heir, whose\
  \ very existence threatened the reign of England’s Virgin Queen?\n\n\n\n\n\n\n\n\
