title: 'RIHC: The French Revolution EXTRA'
description: 'What would have happened had the French royal family managed to escape
  France? Could Louis XVI ever have found a compromise with the revolutionaries? Would
  the revolutionaries ever have coexisted with the Catholic Church? How important
  was the American Revolution to its French counterpart? Were Burke''s writings particularly
  influential outside of Britain? Join Tom and Dominic as they explore these questions,
  and many more, in our French Revolution bonus special.


  _______


  *The Rest Is History LIVE in the U.S.A.*


  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 




  *The Rest Is History LIVE at the Royal Albert Hall*


  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.




  Tickets on sale now at TheRestIsHistory.com


