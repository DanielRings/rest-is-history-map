title: '1066: Slaughter at Stamford Bridge (Part 2)'
description: 'In the tumultuous climax of 1066, why was Harold’s very own brother
  Tostig the first of the mighty foes he had to face? How did Harald Hardrada then
  launch his invasion of England, and how much resistance did he initially receive?
  And, what unfolded at the bloody battle of Stamford Bridge, in which Harold Godwinson
  and Harald Hardrada, two terrible kings, faced off at long last?


  Join Tom and Dominic as they discuss the Battle of Stamford Bridge, the last great
  clash between vikings and Anglo Saxons, for the English throne…


