title: 'Titanic: The Tragedy Begins (Part 1)'
description: '"There is no danger that Titanic will sink. The boat is unsinkable and
  nothing but inconvenience will be suffered by the passengers."

  The sinking of the Titanic, on a freezing Sunday night in April 1912, claimed more
  than 1500 lives. But how this state-of-the-art ocean liner came to be is also a
  story full of drama, encapsulating the turn of the century’s spirit of competition
  and drive for modernity. The booming financial world of the 1900s, rising immigration,
  the excitement of speed and steam, and an ever-growing transatlantic rivalry between
  Britain and the U.S. all played a part in the liner’s inception. And from this era
  emerged three men who would shape the Titanic’s journey: J.P. Morgan, an American
  titan of business; Thomas Ismay, the English magnate who owned the ship’s parent
  company; and William Pirrie, a leading British shipbuilder. Between these three
  men and two pivotal cities - New York and Belfast - the origins of the disaster
  that defined a generation can be traced… 

  Join Tom and Dominic as they discuss the context behind the building of RMS Titanic.
  From the rivalries of the transatlantic liner industry, to the tensions surrounding
  the Irish Home Rule movement, the story of the “unsinkable” began in a tumultuous
  age.



