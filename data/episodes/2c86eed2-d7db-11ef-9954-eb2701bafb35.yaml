title: 'RIHC: Fallen Empires, The Dark Ages, and Christopher Nolan’s Odyssey'
description: 'Which character from history would Tom and Dominic choose to make a
  hit Netflix series about? What are history’s most consequential empires? Which empire
  collapses most impacted the world? Did the British population actively participate
  in imperial culture prior to Windrush? What is the difference between the medieval
  period and the Dark Ages? Would Hitler still have invaded Poland if Stalin hadn’t
  agreed to make a pact with him in 1939? And, what have been the most remarkable
  global historical developments of the first quarter of the twenty-first century? 

  Join Dominic and Tom for this week’s bonus episode, as they answer some titillating
  historical queries. 

