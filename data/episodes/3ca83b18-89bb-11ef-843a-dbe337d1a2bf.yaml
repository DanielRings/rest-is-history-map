title: 'The French Revolution: The Shadow of the Guillotine (Part 3)'
description: 'During the "Ancien Regime", royal executioners held an unholy status,
  and would strike up fear in the crowds as they walked the streets of Paris. But
  with the Revolution, the role of executioners in society was reformed, and whilst
  they lost some of their privileges, they were ushered into to a new, universalist
  France. And as the Revolution brought forward more and more enemies of the state,
  executioners were faced with more victims than the axe could handle. This, combined
  with an ever growing debate around the humanity and dignity of executions, would
  lead to the invention of a killing machine still used by the French state more than
  150 years later…


  Join Tom and Dominic in the third part of our second season of the French Revolution,
  as they look at gruesome methods of execution under the French monarchy, the changing
  role of executioners, how the Guillotine came to loom so large over the fate of
  so many… 


