title: 'Hitler''s War on Poland: The Fall of Warsaw (Part 3)'
description: 'The Nazi invasion of Poland is one of the most harrowing episodes of
  the Second World War, which saw terrible scenes of abuse take place. Though long
  threatened, Poland was in no way prepared to face Hitler’s war machine when it finally
  attacked. Replete with tanks and planes, his would be a new kind of warfare. So,
  on the 10th of September 1939, Warsaw became the first capital in Europe to face
  relentless bombing raids, with Hitler - delighted by war - a spectator to the whole
  thing. The breaking point came when Stalin, whose troops had been fighting in Japan,
  agreed to send in his Red Army into Poland to reinforce the Germans. Before long,
  and despite their heroic resistance, the Poles had been decimated by German machinery,
  and nine days later the Nazis entered Danzig in triumph. With Warsaw an apocalyptic
  wasteland, Nazi occupied Poland became a hell of random brutality, discrimination,
  and horrific violence, particularly for the Jewish members of the population. 

  Join Dominic and Tom for the tragic conclusion of their journey into the dark depths
  of the fall of Poland, including the invasion of the German war machine, Russian
  participation, and Poland''s inspiring defence.

