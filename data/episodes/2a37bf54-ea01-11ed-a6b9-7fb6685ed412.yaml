title: 'Coronations: Sex, Holy Oil and Civil War (Ep 2)'
description: 'Whether it''s London descending into a riot, a bad hangover with Samuel
  Pepys, or a royal lacking discretion… Charles III will certainly be hoping that
  History does not repeat itself this weekend.

  In the second of our episodes on coronations, Tom and Dominic take a look at some
  of the bad behaviour that occurred at coronations in the past, and whether that
  serves as an omen for the monarch''s reign to come…


