title: 'The Roman Conquest of Britain: To the Ends of the Earth (Part 4)'
description: 'In the aftermath of Boudicca’s uprising, the Romans felt they could
  not withdraw from the British Isles. They sent their most competent fighters and
  leaders to suppress the indigenous Britons in the south. As the Druids of Wales
  were defeated, and the resistant Caledonians were massacred, the process of Romanisation
  in Britain began. London became the urbanised imperial capital, and the Roman love
  of hot springs saw the development of Bath. And, forty years after their arrival,
  they finally reached the Highlands, conquering lands as north as Orkney. 


  Listen as Tom and Dominic discuss how the Romans circumnavigated the British Isles,
  colonised its lands and returned to Rome as heroes.


