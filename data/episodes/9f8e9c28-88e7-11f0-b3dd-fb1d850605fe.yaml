title: The Hobbit, by J.R.R. Tolkien
description: 'How did J.R.R. Tolkien’s experiences during the First World War inspire
  ‘The Hobbit’, and ''The Lord of the Rings''? What was his early life like? How did
  he come to write these literary classics? What historical and mythical episodes
  did he draw from? How does ‘The Hobbit’ reflect the political and social anxieties
  of 1930s Britain? Was the book an immediate success? How does this early iteration
  of Middle-Earth, the One Ring, and beloved characters such as Gollum and Bilbo Baggins,
  differ from their portrayal in the subsequent, ‘The Lord of the Rings’? What are
  the greatest and most overrated moments of the book? How does the narrative unfurl?
  What makes it a literary masterpiece, and so much more than merely a fantastical
  adventure story? Why do children’s books matter so much? Is Gandalf the most iconic
  literary wizard of all time? And, what inspired Tolkien’s legendary hobbits?




  Join Dominic and Tabby as they discuss one of the greatest fantasy novels of all
  time; ‘The Hobbit’, and the man from whose remarkable imagination it, ''The Lord
  of the Rings'', and the world of Middle-earth, sprung: J.R.R. Tolkien.


  _______


