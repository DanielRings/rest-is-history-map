  \ Greek religion? And, how did Odysseus finally make it home to Penelope and her\
  \ suitors?&nbsp;&nbsp;\n\nJoin Tom and Dominic as they reach the dramatic conclusion\
  \ of Homer’s Odyssey, and the story of Odysseus’ dreadful return…\n\n\n\n*The Rest\
  \ Is History LIVE: The Ultimate Victorian Adventure*\n\n\n\nThe maddest expedition\
  \ in history and it’s NEVER been heard before on the show: join Tom Holland & Dominic\
  \ Sandbrook LIVE at the Southbank as they tell the bonkers story of Queen Victoria\
