title: 'Emperors of Rome: Claudius, Paranoia and Poison (Part 4)'
description: 'Following the bloody assassination of the twenty-eight year old Emperor
  Caligula, Rome found herself without a leader. Who then should fill the enormous
  power vacuum left by the death of an emperor? Should Rome return to a Republic?
  Then, one overlooked candidate - a scion of the hallowed family of Augustus long
  lurking in the wings of imperial power - unexpectedly rose to the fore: Claudius,
  Caligula’s uncle. Famed as a drooling idiot all his life, Claudius’ apparent shortcomings
  had kept him safe from the ruthless ambitions of his family and enemies. But his
  life of anonymity would now be brought to an abrupt end, with a shocking coup led
  by the Praetorian Guard. The Praetorians, one of the most potent forces in Rome,
  feared the loss of the emperor’s patronage, and so pulled him out from the curtain
  behind which he had been hiding, carried him to their camp, and declared him emperor.
  The reign that ensued - described in gory, glistening, salacious detail by the Roman
  historian Suetonius - would see Claudius dismantle his mask of imbecility to reveal
  himself clever and studious, but easily duped by his advisors, freemen, and wives
  alike. It would see him claim the conquest of Britain, increase the strength of
  the Roman army, fall foul of the senate, play cuckold in one of the most famous
  sexual scandals of all time, and marry his niece. All the while, the shadows of
  Nero’s rise to supreme power were lengthening…

  Join Tom and Dominic for the mighty conclusion of their journey through the lives
  of Rome’s first Caesars, as described in rich, technicolour by Suetonius, climaxing
  with the epic reign of Rome’s most unexpected emperor: Claudius.


  Pre-order Tom Holland''s new translation of ''The Lives of the Caesars'' here.

