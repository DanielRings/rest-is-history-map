title: 'Greatest Paintings: The French Revolution - Millet''s Angelus | FULL EPISODE'
description: "Why was Jean-François Millet’s The Angelus considered highly controversial\
  \ and politically divisive in pre-industrial 19th-century France? What do we know\
  \ about his personal background, his ambiguous relationship with his subjects, and\
  \ the scene of the famous Barbizon School? And, how did artists like Salvador Dalí\
  \ and Vincent Van Gogh draw inspiration and reinterpret the painting? \n\n\n\nIn\
  \ this new The Rest Is History Club series, Tom is joined by art critic and author\
  \ Laura Cumming to discuss the histories behind famous paintings and put them in\
  \ their historical contexts.\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\
