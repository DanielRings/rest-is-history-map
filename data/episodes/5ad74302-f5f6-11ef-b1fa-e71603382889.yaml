title: 'RIHC: The Last English Pope, Persian Europe, and Tom and Dominic''s Favourite
  Castles'
description: 'What era does Trump’s famous slogan, ‘Make America Great Again’, refer
  to? Has this always been a familiar theme in any democratic country? Could another
  city or state have conquered the Mediterranean as the Romans did, or were they unique?
  If so, why and how? Does the geography of the Mediterranean play a part? Is there
  anything that Dominic or Tom would alter in any of the books that they have written?
  Have their interpretations of any periods of history changed significantly in recent
  years? What is the best castle in the UK? And, following the death of the Emperor
  Augustus, how much impetus was there really to restore the Roman Republic? Did most
  people see it as the collapse of roman liberty, or were most people principally
  concerned with stability? 


  Join Tom and Dominic for this week’s bonus episode, as they answer some titillating
  historical queries. 

