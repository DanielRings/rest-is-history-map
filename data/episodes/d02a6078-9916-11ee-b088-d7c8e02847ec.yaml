title: 'RIHC: Tom Holland - This is Your Life (Livestream)'
description: 'Join Dominic in today''s bonus livestream, as he interviews his co-presenter,
  Tom Holland, about his childhood growing up in southern England, his education and
  how it informed his future career, and the journey that took Tom from writing vampire
  novels to historical epics like Dominion, Rubicon, or Pax, to name but a few.


  *The Rest Is History Live 2024*


  Tom and Dominic will be performing in London, at Hampton Court Palace, in June 2024!


