title: 'Charlemagne: Emperor of the West (Part 3)'
description: '"And from that moment on, he was addressed as emperor and Augustus!"

  The coronation of Charlemagne on Christmas Day 800 AD, is one of the landmark moments
  in all world history. More than three centuries after the fall of the Roman Empire
  in the West, the emperors had returned once more, and a Caesar ruled in Rome. But
  how did this legendary event come to pass? For many years Charlemagne, though a
  formidable figure, had been but one power player in the game of empires, competing
  with the emperor of Constantinople and the new Pope in Rome. Then, in 797 a spectacular
  crisis struck Constantinople. The cruel and politically feckless emperor, Constantine
  VI, was ruthlessly usurped by his mother, Irene, who became the first and only ruling
  empress in the whole sweep of Roman history. In the West though, her rule as a woman
  was not acknowledged. To Charlemagne, then, it seemed the perfect opportunity to
  claim the vacant throne. What unfolded after this would see Rome and Constantinople
  lock horns in a terrible power struggle, involving blindings, mutilation and political
  scheming. With Charlemagne acting as arbiter between them, would he take the ultimate
  step and become, for the first time since 476 AD, the emperor in Rome?

  Join Tom and Dominic for the climax of their epic series on Charlemagne: the Frankish
  king turned emperor, who transformed the western world forever. What would become
  of his mighty empire, faced with Saracen pirates, vikings and division?

