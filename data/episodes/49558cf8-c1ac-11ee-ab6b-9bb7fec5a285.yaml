title: 'Britain in 1974: Thatcher Enters the Ring (Part 4)'
description: 'The horrific Guildford Pub Bombings of Saturday 5th October 1974 sent
  shockwaves through Britain, worsening the sense of crisis sweeping through the nation.
  It cast a dark shadow over the election campaign due to take place five days later.
  The future had rarely seemed grimmer, with a general sense of moral and economic
  panic, weariness and depression. For the fourth time, Labour’s Harold Wilson and
  the Conservative’s Edward Heath faced off, with Wilson able to scrape a three-seat
  majority. But could Wilson really revive the nation? Or would it be up to the new
  figure emerging from the Conservative Party, a certain Margaret Thatcher…

  Join Dominic and Tom for the conclusion to their series on one of the maddest years
  in British history, 1974. With dysfunctional governments, dark conspiracies, economic
  meltdown and ongoing terrorist attacks, can Britain survive the year?



  *The Rest Is History LIVE in 2024*


  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 


