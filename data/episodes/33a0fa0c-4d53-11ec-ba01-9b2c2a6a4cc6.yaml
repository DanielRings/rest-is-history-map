title: Germany from Adenauer to Angela
description: As Angela Merkel bows out of German politics, Dominic Sandbrook and Tom
  Holland explore the surprisingly colourful world of Germany’s Chancellors since
  the Second World War. It’s a story of rebels, exiles, Nazis, chain-smokers, the
  colossal bulk of Helmut Kohl and the East German youth of the future Frau Merkel.
  And to Tom’s relief, there’s lots of Christianity.
