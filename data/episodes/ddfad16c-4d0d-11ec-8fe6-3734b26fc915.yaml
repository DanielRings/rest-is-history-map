title: Game of Thrones
description: 'What, if anything, can we learn about medieval history from Game of
  Thrones? Or is George R R Martin’s hugely popular series of books, and the blockbuster
  TV series based on them, in danger of supplanting true history in the popular imagination?
  Tom Holland and Dominic Sandbrook, both huge fans of the series, discuss books,
  films and history.


