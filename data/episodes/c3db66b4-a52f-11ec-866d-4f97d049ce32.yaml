title: 'RIHC: The ''Dark Ages'' (Livestream)'
description: 'Tom and Dominic dive into the mysterious era that is referred to by
  many (but not Tom Holland!) as The ''Dark Ages'' in their livestream to the RIHC
  on Tuesday 15th March.


  The pair explore the death of Roman civilisation, the rising dominance of the Islamic
  empire, and the obliteration of paganism… while the wangs debate whether it’s a
  good idea to take a shot every time Tom mentions Christianity.


  Watch the YouTube version here: https://youtu.be/B0ExTJL1wh0?t=324


  Producer: Dom Johnson

  Exec Producer: Jack Davenport


