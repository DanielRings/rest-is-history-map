title: 'Columbus: Death in the Caribbean (Ep 3)'
description: 'Columbus returns to the remnants of his first voyage to the "Indies",
  having convinced Isabella and Ferdinand to fund a larger second trip. Desperate
  to make his mission financially fruitful, his search for wealth and capital unleashes
  horror on the land that he has “discovered”. Columbus makes enemies, causes destruction
  and starts to lose his grip on reality, whilst he attempts to cling to his newly-found
  power and status.


