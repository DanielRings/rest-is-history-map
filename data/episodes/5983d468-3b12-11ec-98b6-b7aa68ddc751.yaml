title: The North South Divide
description: 'England has long been divided by an invisible line somewhere north of
  Watford and south of the Mersey.



  But do northerners really have more in common with Scots and Welsh people than their
  fellow Englishmen in London?



  Dan Jackson, author of The Northumbrians and a former advisor to Cheryl Cole, joins
  southerner Tom Holland and midlander Dominic Sandbrook to try and decide if we should
  eat lunch then dinner, or dinner then tea.



