title: 'The French Revolution: Marie Antoinette (Part 1)'
description: 'The French Revolution is one of the great seismic events of global history.
  A devouring conflagration of bloodshed, violence and utopianism, it changed France
  and then latterly the whole of Europe forever. Yet, amidst the panoply of colossal,
  colourful names that defined this cataclysmic event, few have endured as iconically
  as that of Marie Antoinette, the Queen of France, who has in many ways come to embody
  the revolution in the popular imagination. Yet, from the moment of her arrival from
  Austria at the tender age of fifteen, Marie Antoinette was a contentious figure
  in France, with rumours circulating throughout her life of her insatiable sexual
  appetite and frivolity, her sapphic proclivities, and even her vampirism. But who
  was the real Marie Antoinette - voraciously decadent ''it'' girl and snob or a well-meaning
  but naive scapegoat? Under what circumstances did she come to marry the Dauphin,
  the future Louis XVI, and to what extent did she truly spark the French Revolution,
  with her calls to “let them eat cake!”? 

  Join Tom and Dominic for the first instalment of their magnificent sweep through
  the outbreak and first years of the French Revolution, as they discuss the early
  life and character of one of its most celebrated and lambasted figures - an icon
  of style, a beacon of whimsical, bucolic giddiness, a rapacious monster - Marie
  Antoinette. 

