title: 'RIHC: Romans in Britain, the Language of Boudicca, and Celtic Mysteries'
description: "When did Britain cease to be a prehistoric society? What language did\
  \ its peoples speak before the arrival of the Romans? When did coins first start\
  \ being minted in Britain, and what did they have to do with Alexander the Great?\
  \ What does the appearance of writing there following the invasions of Julius Caesar\
  \ in 55 and 54BC, tell us about the influence of the Romans in Britain? What can\
  \ surviving coins tell us about the political leaders that ruled there between Caesar’s\
  \ attempted invasion and the arrival of the emperor Claudius in 43AD? How closely\
  \ connected were the Germanic and Norse worlds with Britain during this period?\
  \ And, was there a great transfer of people in the wake of the Roman withdrawal\
  \ from Britain in the 5th century? \n\n\n\nIn this week’s bonus episode, Tom is\
  \ joined by renowned historian and archaeologist Daphne Nash Briggs, to discuss\
  \ the fascinating history of early Britain, and the secrets revealed by the coins\
  \ of the Iceni, the peoples of the fearsome Boudicca. \n\n_______\n\nTwitter:\n\n\
  @TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\nProducer: Theo Young-Smith\n\n\
  Assistant Producer: Tabby Syrett + Aaliyah Akude \n\nExecutive Producers: Jack Davenport\
  \ + Tony Pastor"
