title: 'The Fall of the Aztecs: The Festival of Blood (Part 5)'
description: '“The blood flowed like water…”


  It is 1520 and word has reached Hernán Cortés in Tenochtitlan that another group
  of Spaniards led by the ferocious Pánfilo de Narváez, have landed on the coast to
  hunt him down. Taking drastic action, he decides to leave the city with his wily
  mistress Malinche to pursue the newcomers, but not before taking the Emperor of
  the Aztecs, Montezuma, as his hostage. 

  But can Cortés really overcome a much larger force commanded by such a formidable
  rival? And can his lieutenant, the dashing, violent and reckless Pedro de Alvarado,
  keep his cool in the heart of the capital? For one of the most hallowed Aztec festivals
  is fast approaching. The tension is mounting, and the Spaniards’ swords are thirsty
  for blood …

  In today’s episode in this unmissable series, Dominic and Tom lead us deeper into
  the heart of darkness, as the story of the Fall of the Aztecs takes a shocking and
  nightmarish turn …


  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


