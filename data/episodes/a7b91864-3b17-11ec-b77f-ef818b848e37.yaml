title: China
description: 'Broadcaster and historian Michael Wood joins Tom Holland and Dominic
  Sandbrook to discuss the world’s oldest civilisation. What were the great moments
  in Chinese history and why do the Opium Wars still feature so prominently in the
  modern Chinese school syllabus? The birth of the Chinese Communist Party and the
  complicated legacy of Chairman Mao all feature.



