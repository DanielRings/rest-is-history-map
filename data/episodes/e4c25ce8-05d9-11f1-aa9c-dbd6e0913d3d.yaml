title: 'Greatest Paintings: The Ghost of Spain – Velázquez’s Las Meninas | FULL EPISODE'
description: "Why does Diego Velázquez’ Las Meninas represent the fading Spanish Golden\
  \ Age? How did he challenge the boundaries between viewer and artwork? And, in what\
  \ ways does his defining style foreshadow Impressionism and serve as an indirect\
  \ image of his own genius?\n\n\n\nIn this new The Rest Is History Club series, Tom\
  \ is joined by art critic and author Laura Cumming to discuss the histories behind\
  \ famous paintings and put them in their historical contexts.\n\n\n\nFUTURE EPISODES....\L\
