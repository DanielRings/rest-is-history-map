title: 'Nelson: The Battle of Copenhagen (Part 3)'
description: "With fears that the powerful Danish fleet would join with the French\
  \ against the British, what great gamble did Horatio Nelson take? After taking the\
  \ drastic decision to attack the Danish fleet in their own harbour, what challenges\
  \ did Nelson and his men face? How did the bloody Battle of Copenhagen in 1801 then\
  \ unfold? And, what would be the consequences of this epic naval clash for Britain,\
  \ Napoleon’s France, and Nelson himself?\n\n\n\nJoin Dominic and Tom as they discuss\
  \ the First Battle of Copenhagen, in the next dramatic phase of Nelson’s triumphant,\
  \ though very dangerous, career…\n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\
