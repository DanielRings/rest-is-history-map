title: 'America in ''68: Nixon''s Great Comeback (Part 6)'
description: '“Nixon now! Nixon now! More than ever we need Nixon now!”

  It''s the 5th of November 1968, and Richard M. Nixon is on tenterhooks, alone in
  his dark hotel room. He watches as the final states are called in the presidential
  election. Will he fall at the same hurdle as he did in 1960? Off the back of losing
  to JFK eight years prior, Nixon is running as the Republican presidential candidate.
  This time not only does he face Democrat Hubert Humphrey, but the independent segregationist
  candidate George Wallace threatens to split Nixon’s votes. A west coast outsider
  who embraces modern media, Nixon aims to capture the hearts of Middle America. But
  will he succeed this time around?


  Join Dominic and Tom for the final instalment of our series on America in 1968,
  as they dive into the political campaign that would go on to become the prototype
  for all future campaigns, as traditionally blue states turn red…


  _______


  *The Rest Is History LIVE in the U.S.A.*


