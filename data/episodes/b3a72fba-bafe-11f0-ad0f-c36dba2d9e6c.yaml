title: 'Elizabeth I: The Shadow of the Tower (Part 3)'
description: 'Why did Elizabeth I’s brother, Henry VIII’s heir, Edward VI, choose
  his cousin Jane Grey to succeed him, rather than either of his wily Tudor sisters?
  Later, how did Elizabeth survive the reign of her once dear Catholic sister, “Bloody
  Mary”, given Mary’s growing resentment? And, while imprisoned in the Tower of London,
  how did Elizabeth avoid the same bloody fate as her beheaded mother, Anne Boleyn…?




  Join Tom and Dominic as they recount the course of Elizabeth I’s dangerous early
  life, as she outfaced her rivals following Edward VI’s death, witnessed the execution
  of the young Jane Grey, and survived the reign of her sister and rival, Mary Tudor…






