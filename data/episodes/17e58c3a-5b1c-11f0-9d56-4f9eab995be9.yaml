title: 'RIHC: Irish Kings, Medieval Magic, and The Norman Invasion of Ireland'
description: "What would Ireland look like today if all traces of the British, English\
  \  and even Norman occupation had been expunged, and it was returned to the condition\
  \  it was before 1169? Did it have one centralised monarchy before the Norman invasion?\
  \  Why were poets at the very apex of the social hierarchy in Ireland at this time?\
  \  What were some of the bizarre divorce laws practiced in medieval Ireland? Why\
  \  did cats hold such a sacred position in Irish law? What language did the early\
  \  Irish speak?  Why did the Irish church develop so differently from elsewhere in\
  \  Britain and Europe? What was it about the early Irish Church that lead other Christians\
  \  to regard it as unusually barbarous? And, would Ireland have had a centralised\
  \  form of kingship if the Norman Conquest had never happened? \n\nIn this week's\
  \  bonus episode, Tom is joined by historian Gillian Kenny, to discuss the extraordinary\
  \  early laws, magical customs, and the christianity of medieval Ireland.\n\n\n\n\
