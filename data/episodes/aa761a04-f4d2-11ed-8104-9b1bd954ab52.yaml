title: 'The Republic of Britain: Life Under Cromwell'
description: 'It''s 1649 and a new republic has been declared, the Commonwealth of
  England. It''s an age of 17th century republicanism, difficult policies in Ireland,
  and a serious PR problem... writer and historian Anna Keay joins Tom and Dominic
  to discuss life under Cromwell.


