title: 'RIHC: The Rise and Fall of Central Europe'
description: 'What became of the Holy Roman Empire, after it was toppled during the
  Napoleonic Wars? Was this the birth of modern Europe? Were the legendary Habsburgs
  a more modernising force than has typically been believed of them? Why was the coronation
  of Leopold II in 1790, so integral to the history of Central Europe? Who actually
  coined the term “Central Europe”? How did modern antisemitism and Jewish diasporas
  redraw Europe? Was anti-semitism inevitable? With the map of Central Europe radically
  redrawn following the First and Second World Wars, how well did displaced peoples
  assimilate into their new homelands? What is the relationship between a language
  and a nation? And, could Pan-Slavism ever have succeeded in the 19th century?




  In this week’s bonus episode, Dominic is joined by historian and journalist Luka
  Ivan Jukic, to discuss the tumultuous history of Central Europe. 


