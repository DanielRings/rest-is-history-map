title: Disease vs. the rise of civilisation (Part 1)
description: 'The way we die has been utterly transformed.


  There have been around 10,000 generations of human beings, but only in the last
  3 or 4 have infectious diseases not been an expected and accepted cause of death.


  What drove the most deadly infectious diseases? Was technological progress and globalisation
  one of the key causes for its spread over the course of history?


  Tom and Dominic are joined by Professor Kyle Harper from the University of Oklahoma
  to discuss the fascinating history of disease and how shifts in the way we die have
  changed our world completely.


