title: 'Hannibal: Rome''s Greatest Enemy (Part 1)'
description: 'Who was Hannibal, the flawed but brilliant Carthaginian general? What
  makes Rome vs Carthage in the third century BC one of the most totemic ancient rivalries
  of all time? How did Hamilcar, father of Hannibal, restore the fortunes of Carthage
  following their devastating defeat to the Romans in 264 BC? And, what personal tragedy
  spurred Hannibal on to seize his destiny by the reins, take command of the Carthaginian
  army, and at last set out to have his vengeance on Rome? 


  Join Tom and Dominic as they launch into the early life and rise of Hannibal; bane
  of Rome and master of Carthage, as the famous feud between those two greatest of
  cities gathers momentum... 






