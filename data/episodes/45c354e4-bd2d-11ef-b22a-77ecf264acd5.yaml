title: 'RIHC: Famous Composers, Mozart’s Requiem, and Musical Riots'
description: 'What does it feel like to conduct a live orchestra? How has music influenced
  politics? Did Igor Stravinsky’s music from the ballet, The Rite of Spring, really
  inspire a riot? Which composer famously practiced on a cardboard piano? What is
  it about Russian operas that make them so powerful? Was Beethoven an especially
  irascible man? Which musical compositions have famously remained unfinished, and
  what became of them? Does classical music need more controversy? And, what are the
  most important pieces of music in history?

  In this week’s bonus episode, Tom and Dominic are joined by renowned conductor and
  history lover Oliver Zeffman - the man who brought about and conducted their Royal
  Albert Show on Mozart and Beethoven in October 2024. Today, they discuss some of
  history’s greatest musical moments and characters. Also, their next live show on
  Wagner and Tchaikovsky at The Royal Albert Hall, on May 4th 2025....

