title: 'RIHC: Medieval Women, Predicting the Future, and the Silk Roads'
description: 'What were the Silk Roads? How did they reshape our understanding of
  the world? Who was Edward III’s wife Isabella - the She Wolf of France - featured
  in Braveheart? How were turtles used to predict the future? Why was there an ice-skating
  saint in medieval Europe? Did medieval monarchs love their children as we do today?
  How differently were men and women perceived in the religious sphere in the medieval
  world? And, why was the famous 11th century mystic Julian of Norwich locked in a
  cell with a cat?

  In this week’s bonus episode, with Dominic in America, Tom is joined by assistant
  producer Tabby to discuss their visit to the British Library’s exhibitions on medieval
  women, and the Silk Roads.

