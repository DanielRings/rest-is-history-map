title: Civil War
description: 'What are the conditions needed for a civil war to start? Could we see
  a modern industrial nation turn upon itself again? Historians Tom Holland and Dominic
  Sandbrook explore examples from ancient history though to Spain in the 1930s and
  Yugoslavia in the 1990s to work out what it takes for neighbour to murder neighbour.



