title: 'King Arthur: The Mysteries of Merlin (Part 3)'
description: 'What are the origins of Merlin, the powerful wizard and King Arthur’s
  advisor? Who was Geoffrey of Monmouth, and what role did he play in evolving the
  tales of Arthur and the Round Table? And, was Merlin based on a real historical
  figure from the Saxon invasion of Britain in the 5th century, and the totemic battle
  of Badon…?




  Join Tom and Dominic as they delve into the true origins of history’s greatest wizard:
  Merlin….


