title: 'The Great Northern War: Slaughter on the Steppes (Part 3)'
description: "Why was the greatest and most climactic battle of the Great Northern\
  \ War, the Battle of Poltova, one of the most important in all European history?\
  \ What drove Charles XII of Sweden to invade Russia in the Summer of 1707, in the\
  \ lead up to that totemic clash? Exactly what happened on the day of the Battle?\
  \ Would both Peter the Great and Charles survive it unscathed, if at all? And, who\
  \ would triumph on that bloodsoaked battlefield? \n\nJoin Dominic and Tom for one\
  \ of the most dramatic events of their journey through the bombastic life and reign\
  \ of Peter the Great so far, as they describe the Battle of Poltova, and the day\
  \ that changed Europe forever.\n\n\n\n\n\nThe Rest Is History Club: Become a member\
