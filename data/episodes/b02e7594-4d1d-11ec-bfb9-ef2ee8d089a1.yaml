title: Silicon Valley Part 1
description: 'Dominic Sandbrook and Tom Holland are joined by tech pioneer Marc Andreessen.
  Has the internet been the most important force in modern history? In part one of
  this two part series they look at how the internet developed out of military technology,
  whether early developers knew they were changing the world, and why business initially
  built a ‘wall of scepticism’ around the possibilities of the World Wide Web.



