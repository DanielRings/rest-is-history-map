title: 'RIHC: Jack the Ripper, the Victims Unveiled'
description: "Were all of Jack the Ripper’s victims prostitutes? Why have their stories\
  \ been left out of so much of the history? And, what were their lives really like?\n\
  \n\n\nIn this week’s bonus episode, Tom and Dominic discuss the lives of the women\
  \ who were so cruelly murdered by Jack the Ripper, turning them into flesh and blood\
  \ people, rather than mere corpses, and shedding light on the experiences of all\
  \ poverty-stricken women in Victorian London.\n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\
  \n@holland_tom\n\n@dcsandbrook\n\nSocial Producer: Harry Balden\n\nAssistant Producer:\
  \ Aaliyah Akude \n\nProducer: Tabby Syrett\n\nSenior Producer: Theo Young-Smith"
