title: 'Eleanor of Aquitaine: Lioness of England'
description: 'Why was Eleanor of Aquitaine''s first marriage to Louis VII of France
  so catastrophic? Which other powerful king did she marry just eight weeks after
  her annulment? And, what became of her after inciting a rebellion against him?


  In this new member’s-only mini series, Tom is joined by historian and author Helen
  Castor, to talk about some of the most impressive queens of medieval Europe. 


