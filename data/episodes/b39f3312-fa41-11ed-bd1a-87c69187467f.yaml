title: 'RIHC: Ireland, Cromwell, and Stanley Baldwin (livestream)'
description: 'Why was Stanley Baldwin reluctant to rearm Britain as quickly as the
  "belligerent warmonger” Churchill would have liked? How did the Troubles in Northern
  Ireland commence in the decade of the Beatles, a time of "peace and love"? Why did
  Poseidon and Athena have to audition to be the patron of Athens? Were Dominic’s
  views on Cromwell well received during our recent Dublin trip? Returning triumphant
  from their first overseas live show, Tom and Dominic discuss these difficult questions,
  and many more, in this week’s bonus episode.


  *The Rest Is History Live Tour 2023*:


  Tom and Dominic are going on an U.S. tour in 2023, performing in Washington D.C.
  and New York! 


