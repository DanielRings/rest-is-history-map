title: 'RIHC: Famous Traitors, The Renaissance, and Post-War Revolutions'
description: 'Who was history’s greatest traitor? Could the Renaissance have happened
  without the fall of Constantinople? Who was history’s worst father? And, during
  the tumultuous years that followed the First World War, why were France, America
  and England the only nations not to erupt into revolution? 




  Join Tom and Dominic for this week’s bonus episode, as they answer these fascinating
  historical questions.


