title: Greatness
description: 'How did certain people come to be called ‘the Great’? Is the notion
  of great men and women outmoded? Can anyone today be reckoned ‘great’? Historians
  Tom Holland and Dominic Sandbrook take a wide ranging stroll through the annals
  of time, from Nero to Nixon, with a bit of Trump thrown in for good measure.



