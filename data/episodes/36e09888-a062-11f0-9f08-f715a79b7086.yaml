title: 'Enoch Powell: Rivers of Blood'
description: 'Who was Enoch Powell, the deeply controversial British conservative
  politician? Why is he the father of Brexit, and possibly even Reform? And, how did
  he come to make his inflammatory ‘Rivers of Blood speech’, in 1968?   




  Join Dominic and Tom as they discuss Enoch Powell - one of the most incendiary and
  contentious figures in all of British political history - and his enduring shadow
  today.




