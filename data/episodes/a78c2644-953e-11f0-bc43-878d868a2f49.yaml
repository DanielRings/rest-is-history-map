title: 'Greek Myths: The Riddle of the Sphinx (Part 2)'
description: "What is the story behind the writing of Oedipus, the notorious king\
  \ of Thebes who murdered his father and unwittingly married his mother? Was it based\
  \ on a real historical event? What are Oedipus’ cursed mythic origins in Thebes?\
  \ Who was Sophocles, the legendary Greek playwright? Why was the play a product\
  \ of 5th century Athens; its rivalries with other greek city states such as Thebes,\
  \ a raging plague, and the tyrant Pericles? What horrifying events unfold in Oedipus?\
  \ It is the greatest tragedy of all time? And, how did it later come to influence\
  \ Sigmund Freud’s unnerving interpretation of the deepest desires of the  subconscious….?\
  \ \n\n\n\nJoin Tom and Dominic as they discuss one of the most famous Greek myths\
  \ of all time: Oedipus; unravelling this disturbing tragedy, delving into its meaning\
  \ today, and exploring the historical context behind it all. \n\n\n\n\n\nJoin The\
  \ Rest Is History Club: Unlock the full experience of the show – with exclusive\
  \ bonus episodes, ad-free listening, early access to every series and live show\
  \ tickets, a members-only newsletter, discounted books from the show, and access\
  \ to our private Discord chatroom. Sign up directly at therestishistory.com\n\n\n\
