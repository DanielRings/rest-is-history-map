title: 'Young Napoleon: The Shadow of the Guillotine (Ep 2)'
description: 'Within the turmoil of the French Revolution, Napoleon Bonaparte stands
  out to his military superiors, first by defeating the English at Toulon, then by
  putting down a royalist mob in Paris when outnumbered four to one, with a “whiff
  of grapeshot”. Having finally shaken off the humiliation of the failed invasion
  of Sardinia which began his career, he is made Commander of the Interior, and rewarded
  with command of the Army of Italy. Has the Corsican rebel finally given up on his
  roots, and embraced French ideals of brotherhood? Join Tom and Dominic in the second
  part of our deep dive on young Napoleon, as they delve into his rise within the
  French military, his disillusionment with Corsican politics, his precocious strategic
  savoir-faire, and the story of how he met the future Empress of the French, Josephine
  de Beauharnais…


  *The Rest Is History Live Tour 2023*:


