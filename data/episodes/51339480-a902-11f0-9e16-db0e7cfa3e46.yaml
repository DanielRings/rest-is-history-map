title: 'RIHC: Shakespeare, Roman Slavery, and the Tudors'
description: "Did every ancient civilisation need slave labour to flourish? Which\
  \ of the famous literary circles from history would Tom and Dominic like to have\
  \ joined? What was Shakespeare like as a man? Did most British people genuinely\
  \ believe that Britain had joined the First World War to protect Belgium? Was Henry\
  \ VII an underrated king? Were the Tudors as a whole an impressive run of English\
  \ monarchs? And, will the attempted assassination of Donald Trump on 13th July 2024,\
  \ go down as an important moment in American history?\n\nIn this week’s bonus episode,\
  \ Tom and Dominic discuss these fascinating historical questions.\n\n_______\n\n\
