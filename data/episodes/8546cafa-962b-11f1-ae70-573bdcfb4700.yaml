title: 'The Troubles: The Brink of Civil War (Part 2)'
description: 'Why did the violence of the Troubles escalate as it did in Ulster? How
  did a series of marches from Belfast to Derry in 1969 result in terrible violence,
  and heighten the conflict? And, which terrible events saw the British army cross
  the border to intervene?




  Join Dominic and Tom as they discuss the next tumultuous stage of The Troubles in
  Northern Ireland.&nbsp;








  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


