title: 'The Fall of the Incas: The Last Emperor (Part 6)'
description: 'With the Incan emperor on the run, and the Spanish divided, what atrocities
  would unfold in the final phase of this brutal conquest? Who would triumph, Francisco
  Pizarro or his brutal former partner Diego de Almagro? And how would the once mighty
  Incas, finally fall…?




  Join Dominic and Tom for the epic conclusion of one of the most epic stories in
  all of world history: a hunt for gold and glory, drenched in blood and tragedy,
  in which the collision of two worlds would reverberate across time…




