title: 'RIHC: Blackshirts, Relics, and the Myth of Viking Sorcery'
description: 'Did Britain ever consider giving the American colonies representation
  in Parliament? If Tom and Dominic were to break away from history, what subject
  would they discuss? Where did the practice of collecting secular relics originate?
  Do Tom and Dominic get worse pre-match nerves before a podcast, a live show or the
  publication of a new book? In this week''s bonus episode, Tom and Dominic discuss
  these important questions, and many more.


