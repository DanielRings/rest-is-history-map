title: Classics
description: The world’s most famous classicist, Professor Mary Beard, joins Tom and
  Dominic to discuss how the legacy of classical Greece and Rome has been interpreted
  and re-interpreted over the past millennium and a half. They range from Dante’s
  Satan snacking on Julius Caesar’s assassins in Hell to recent demands in the United
  States that Classics itself should be cancelled.
