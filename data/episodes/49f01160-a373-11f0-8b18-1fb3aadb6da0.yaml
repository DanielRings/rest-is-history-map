title: The Trojan War, with Mary Beard | FULL EPISODE
description: "Did the Trojan War - the ten year, cosmic clash between the Greeks and\
  \ the Trojans, featuring the Olympian gods, kings and heroes - actually happen?\
  \ Is there any evidence for the existence of the Trojan Horse? And, why is it the\
  \ war the foundational myth of both ancient Greece and ancient Rome?\n\n\n\nTo launch\
  \ a brand new bonus series, Tom is joined by the world famous classicist, Mary Beard,\
  \ to discuss four of classical antiquity’s most iconic subjects. Today: the Trojan\
  \ War….\n\n\n\n**To hear these exclusive new episodes from Mary and Tom every Friday\
  \ for the next four weeks,  join The Rest is History Club at therestishistory.com.**\n\
  \n\n\nFUTURE EPISODES.... \n\nOct 17th: ALEXANDER THE GREAT\n\nOct 24th: JULIUS\
