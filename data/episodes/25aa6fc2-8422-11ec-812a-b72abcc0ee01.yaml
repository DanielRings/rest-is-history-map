title: Disease, the New World and modern pandemics (Part 2)
description: 'How devastating were European arrivals to the Americas in terms of deaths
  and the introduction of new infectious diseases?


  Tom and Dominic are joined by Professor Kyle Harper from the University of Oklahoma
  to discuss the relationship between disease and colonial expansion, the origins
  of the Spanish flu and the spread of modern forms of infectious disease.


  Producer: Dom Johnson

