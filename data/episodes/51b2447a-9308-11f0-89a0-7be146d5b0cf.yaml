title: 'RIHC: King and Conquerer, Bad Vice Presidents, and Christian Colonies'
description: 'What do Tom and Dominic think of the new TV show, King and Conquerer?
  Which Harold would have been the most entertaining company: Harold Godwinson, Harold
  Wilson, or Harald Hardrada? What was Harold Godwinson like as a man? Is there a
  difference between Protestant and catholic colonialism? Which US Vice President
  has been the least effective, and which one has had the most negative impact? Where
  does JD Vance sit in that? How would you define “Englishness”? Does England have
  a national dress? How does the UK financial condition today compare to that of the
  1970s? And, are prime ministers and politicians in Britain, simply worse today than
  they were in former generations…?




  In this week''s bonus episode, Tom and Dominic answer these thrilling historical
  questions.


