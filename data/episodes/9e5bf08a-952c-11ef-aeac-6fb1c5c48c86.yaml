title: 'RIHC: Tudor Scuba Diving, Dinosaur Hunters and Britain''s Greatest Cartoonist'
description: 'Was Napoleon taller than Lord Admiral Nelson? Who was Jacques Francis,
  the young West African free diver who in the sixteenth century was charged with
  salvaging weapons from the Mary Rose, Henry VIII’s beloved flagship? What remarkable
  creature did Mary Anning, the famous eighteenth century palaeontologist, discover
  at the age of eighteen? Is it true that she was struck by lightning as a baby? Who
  was the heroic Elsie Inglis - Scotland’s Florence Nightingale - who tirelessly fought
  to save lives with her nursing throughout the First World War? What did Rosalind
  Franklin’s scientific research unlock about the secrets of human DNA? And, what
  did these four remarkable eighteen year olds have in common? 


  In this week''s bonus episode, Dominic is joined by author and historian Alice Loxton
  to discuss her book "Eighteen", the drawings of England''s greatest cartoonist,
  and some of history''s most fascinating eighteen year olds. 



