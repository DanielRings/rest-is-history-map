title: 'The Road to 1066: Countdown to Conquest (Part 4)'
description: 'In the triumvirate of 1066, William of Normandy, Harald Hardrada, and
  Harold Godwinson, the latter has above all endured as one of the great heroes of
  English history. But how did he become the short-lived King during that tumultuous
  year? The answer lies in his formidable family, the Godwins. Often symbolised as
  the last of the Anglo-Saxons, their stratospheric rise to power was engineered by
  Godwin, an obscure Thaine from Sussex, in a striking case of social mobility. Making
  himself integral to Cnut, he was made Earl of Wessex to help him run his new kingdom.
  But Godwin was also cunning and conniving, constantly shifting sides to ensure the
  maximum advantage to his family. Even Edward the Confessor, who hated the Godwinsons,
  had no choice but to promote Harold and Godwin’s other sons, and marry his daughter,
  Edith. But, with his hatred mounting and the couple childless, the fortunes of the
  Godwins would soon change…in September 1051, with tensions reaching boiling point,
  they went into exile. It would not last, and their return would see them catapulted
  to even greater heights of influence. Meanwhile, just as Edward’s life was dwindling,
  Harold’s star was rising, and across the channel William of Normandy’s prowess was
  also mounting. What would happen when, in a remarkable turn of events, the two men
  finally met? What fateful oaths were taken that day…?


  Join Tom and Dominic as they lead us to the brink of 1066, and discuss the family
  behind it all: the Godwins. How would their hold on England see Harold crowned King
  of England, and turned oath-breaker? 

