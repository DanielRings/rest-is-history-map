title: 'RIHC: King Arthur, Ancient Egypt, and Unexpected Historical Trends'
description: 'Which historical subject do Tom and Dominic think is the most important
  in the whole of world history? How are different events, periods and monuments perceived
  in different parts of the world today? Which topics have the most international
  resonance? Does political leaning or gender have any impact on whether certain subjects
  have more traction than others? Which historical topic do most people across the
  world think is the most significant, and why? And, what influence, if any, do differing
  interpretations of history have upon events in the present day? 

  Join Tom and Dominic for this week''s bonus episode, as they discuss historical
  trends and attitudes to certain historical subjects globally today, according to
  the polls.

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

