title: 'The Roman Conquest of Britain: Julius Caesar’s Invasion (Part 1)'
description: 'Julius Caesar saw the Britons as brutal savages. Yet the Romans romanticised
  their lack of civilisation, deeming them as untainted by Mediterranean luxury. In
  55 BC, having sent scouts along the Kentish coast, Caesar launches an invasion of
  the island as part of his Gallic Wars campaign. After a disastrous first attempt
  marred by storms, the “menacing horde of barbarians” of the English Home Counties
  ask Caesar for help and he returns with a bigger, stronger army to support their
  prince. Will this campaign succeed?


  Join Tom and Dominic as they explore Caesar’s invasion of Britain and how it entered
  the orbit of the great imperial power.


