title: 'The Body in the Woods: A Medieval Murder Mystery'
description: 'Why was a boy grotesquely and mysteriously murdered in a wood in Norwich
  in the 12th century? Who was his killer? Was it a ritual child sacrifice? Why was
  the murder blamed on Norwich''s Jewish community, and in what appalling way? How
  did the incident set in motion a whole wave of Jewish persecution across the world,
  as more and more children disappeared and were found ritually murdered? And, what
  can this chilling story tell us about mediaeval attitudes to Jews?




  Join Tom and Dominic as they retell the terrifying story of Blood Libel, one of
  medieval England’s most terrifying mysteries. 




