title: 'American Civil War: Outbreak (Ep 2)'
description: 'Welcome to the second episode in The Rest Is History''s ''American Civil
  War'' series.


  In today''s pod, Dominic, Tom and historian Adam Smith discuss the opening exchanges
  of the war and the tactics both sides used. They also look at some of the big characters
  including Robert E. Lee and Stonewall Jackson, and ask whether there was ever any
  realistic chance of the European nations joining the conflict.


