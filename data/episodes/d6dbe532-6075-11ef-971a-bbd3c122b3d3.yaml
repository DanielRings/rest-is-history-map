title: 'Hundred Years’ War: Bloodbath at Agincourt (Part 3)'
description: '“We few, we happy few, we band of brothers”.

  The Battle of Agincourt in 1415 endures as perhaps the most totemic battle in the
  whole of English history. Thanks in part to Shakespeare’s masterful Henry V, the
  myths and legends of that bloody day echo across time, forever enshrining the young
  Henry as the greatest warrior king England had ever known. So too the enduring idea
  of the English as plucky underdogs, facing down unfavourable odds with brazen grit.
  And though the exact numbers of men who fought in the two armies is hotly contested,
  the prospect was certainly intimidating for the English host looking down upon the
  vast French force amassed below them the day before the battle. Hungry and weary
  after an unexpectedly long march, and demoralised by the number of French that would
  be taking to the field, the situation certainly seemed dire for the English. One
  man amongst them, however, held true to his belief that the day could still be won:
  Henry V. An undeniably brilliant military commander, he infused his men with a sense
  of patriotic mission, convincing them that theirs was truly a divinely ordained
  task, and therefore in this - and his careful strategic planning the night before
  the battle - he proves a striking case of one individual changing the course of
  history. However, the French too had plans in place for the day ahead: total warfare.
  In other words, to overwhelm the English in a single devastating moment of impact,
  sweeping the lethal Welsh archers aside. So it was that dawn broke on the 25th of
  October to the site of King Henry wearing a helmet surmounted by a glittering crown
  and bearing the emblems of both France and England, astride his little grey horse,
  and riding up and down his lines of weathered silver clad men, preparing them to
  stride into legend…then, as the French cavalry began their charge, the sky went
  black as 75,000 arrows blocked out the sun. What else would that apocalyptic day
  hold in store?


  Join Tom and Dominic as they describe the epochal Battle of Agincourt. From the
  days building up to it, to the moment that the two armies shattered together in
  the rain and mud of France. It is a story of courage and cowardice, kings and peasants,
  blood and bowels, tragedy and triumph. 

