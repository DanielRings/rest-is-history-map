title: Ken Burns on Why America Really Declared Independence
description: 'Was the war really about taxation, or was land the deeper cause of America’s
  break with Britain? Legendary documentary-maker Ken Burns joins Dominic to discuss
  the American Revolution and the myths that still surround it. They explore George
  III, slavery, the role of France, and whether the United States could ever have
  won independence without foreign help. Ken also explains why George Washington,
  despite his flaws, was the one figure without whom America could not have existed.
  A wide-ranging conversation about liberty, hypocrisy, empire, and the revolution
  that Britain forgot but America turned into its founding story.


  PLUS, in this extended interview, enjoy the members Q&amp;A at the end.


