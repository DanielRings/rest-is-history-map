title: 'Titanic: Kings of the World (Part 2)'
description: 'The Titanic was a product of the furious competition of the late Gilded
  Age, and no expenses were spared to make her the most extraordinary and luxurious
  ship ever built. The height of an eleven-story building, fully electric, and with
  first class suites designed for the world’s wealthiest, the Titanic embodied the
  Edwardian obsessions with grandeur and greatness. But the ship was also designed
  to accommodate immigrants, who made up the majority of its passengers, in third
  class, or “steerage”. But is their any truth behind the myths surrounding class-based
  mistreatment of the poorer passengers, in contrast to the over-pampered rich? Was
  safety sacrificed in favour of a hubristic lust for luxury and grandeur? 


  Join Dominic and Tom as they discuss the Titanic’s sumptuous, modern interiors,
  her gargantuan proportions, and the stories of builders who brought her to life.
  They dive into a world of butlers, stewards, maids and crewmen, and look into the
  man whose name would later become synonymous with disaster: the Titanic’s captain,
  Edward Smith. 


  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 

