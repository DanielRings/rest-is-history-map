title: Exams
description: 'Even the memory of them is enough to make most people shudder. As thousands
  of British students wait nervously for their A-level and GCSE results, Tom Holland
  and Dominic Sandbrook are joined by educationalist Daisy Christodoulou to discuss
  the fascinating history of the examination. Your time starts now.


