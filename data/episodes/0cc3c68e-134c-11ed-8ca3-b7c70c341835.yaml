title: Plague and the decline of the Roman Empire
description: 'Tom and Dominic are joined by friend of the show Kyle Harper to discuss
  how pandemics and disease played a far greater role in the decline of the Roman
  Empire than previously understood.


  On the show Kyle, Dominic, and Tom discuss life expectancy, how the Roman Empire
  was ''bad for people''s health'', the Antonine Plague, and more.


  Listen to our previous episodes with Kyle:

  146. Disease vs. the rise of civilisation

  147. Disease, the New World and modern pandemics


