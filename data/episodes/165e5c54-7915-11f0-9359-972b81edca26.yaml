title: Mad Victorian Sport
description: 'How and when was football invented, and what are the origins of football
  clubs? What is the connection between public hangings, highwaymen, and early sporting
  events? Which is the most historically important sporting ground in the world? When
  was the first cricket test match played? What are the origins of rugby? Who was
  Richard Manks - the Lionel Messi of the Victorian period, and what did he achieve?
  And, what is the history of the mighty Ashes, one of the most celebrated sporting
  rivalries of all time? 




  Join Tom and Dominic as they discuss the surprising history of some of the world’s
  greatest sports, sporting events, and stadiums. 






