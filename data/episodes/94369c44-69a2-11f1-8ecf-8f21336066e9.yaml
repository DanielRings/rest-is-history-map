description: "How did Benito Mussolini’s regime in the 1930s use sport to spread his\
  \ ideology and prepare Italy for war? What infrastructure and propaganda strategies\
  \ did he use to make the 1934 World Cup a showcase for fascism? And, did this form\
  \ of propaganda actually work? \n\n\n\nIn this brand new The Rest Is History Club\
  \ mini series, Dominic is joined by Paul Rouse to talk about dictatorships’ connections\
  \ to football World Cups. \n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\
