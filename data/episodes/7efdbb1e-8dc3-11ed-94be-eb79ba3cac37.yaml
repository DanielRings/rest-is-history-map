title: 'Lady Jane Grey: The Nine Days'' Queen (Ep 1)'
description: 'Edward VI is dead - but who will succeed him on the throne? 


  In the first of two episodes, Tom and Dominic discuss the succession question that
  surrounded the reign of Edward VI, the sole male heir of Henry VIII - and how a
  15-year-old Lady Jane Grey ended up Queen of England and Ireland.


  Tune in to hear about svengalis, the deeply embedded memory of Henry VIII, and why
  the people of Guildford are the true victims in this incredible story.


