title: 'The Nazis'' Road to War: Showdown in Munich (Part 2)'
description: 'On 17th September 1938, in Munich, one of the most extraordinary meetings
  in history took place. Neville Chamberlain launched an extraordinary and unprecedented
  diplomatic coup. Boarding a plane, he set off to meet Adolf Hitler in a desperate
  attempt to prevent war over Czechoslovakia, following the Nazis’ territorial incursions
  into Czechoslovakia. Little did he know that Hitler was already planning to launch
  a full blown war on the first of October - just two weeks later. Chamberlain, in
  his own mind the man of the hour, boldly wrestling the fate of Europe back under
  control, left with the goodwill of the British public behind him. Arriving at the
  Berghoff, Hitler’s fabled eerie, the two men talked and debated for three hours.
  Finally, Hitler agreed not to precipitate military action while Chamberlain discussed
  the situation with his Cabinet. Ominously, both men were delighted by the turn of
  events. Upon returning home, Chamberlain declared himself convinced of Hitler’s
  reliability, despite knowing full well of the atrocities he had already committed.
  Finally, in September 1938, another totemic emergency meeting of the main European
  powers took place in Munich, and an agreement - the consequences of which would
  change the world - was reached. Chamberlain would return to Britain a hero, but
  given the war that would follow, should he instead have been cast as a traitor?

  Join Tom and Dominic as they discuss the Munich Agreement: one of the most discussed,
  and infamous diplomatic instances in history, which has forever since shaped the
  way that Western nations have addressed international affairs. Had Neville Chamberlain
  delayed war with Germany, or inevitably doomed Czechoslovakia and Poland to the
  ruthless ravages of Adolf Hitler and his Nazi party?

