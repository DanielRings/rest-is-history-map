title: 'The Golden Age of Japan: Secrets of the Imperial Court (Part 2)'
description: 'In the vibrant but vicious golden age of Imperial Japan, how did women
  use writing as a way to secure their status, and express their deepest desires?
  Who was Sei Shōnagon, the witty courtier whose account of life around the Japanese
  Empress during the iconic Heian period, provides a scintillating insight into this
  colourful world? And, behind the sophisticated melee of the Imperial court, with
  its elegance and decorum, what risks and hazards haunted every aspiring courtier…?


  Join Tom and Dominic for the climax to their tantalising journey into the beating
  heart of Imperial Japan, and the remarkable woman whose moving, keenly perceptive,
  but also slyly venomous, insights into this complicated arena, bring it flamboyantly
  to life. 


