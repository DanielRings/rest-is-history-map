title: 'Germany: The Song Hitler Stole (Part 3)'
description: 'Why is the German national anthem the most controversial of all? Is
  it true that it is Austrian in origin? And, what happened when Germany split after
  the Second World War? Did it perhaps lead to an absolute banger in the form of East
  Germany’s new anthem..?




  Join Tom and Dominic as they discuss the history of Germany and its various different
  anthems.


