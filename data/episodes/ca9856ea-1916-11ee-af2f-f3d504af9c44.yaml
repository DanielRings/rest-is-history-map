title: The Birth of the United States (Part 3)
description: '“O ye that love mankind! Ye that dare oppose, not only the tyranny,
  but the tyrant, stand forth!” The U.S. Congress votes for independence on the 2nd
  of July 1776, and George Washington reads the Declaration of Independence to his
  troops a few days later, after which they pull down the statue of George III in
  New York, melting it down to make bullets. The king is now the target of the revolutionaries’
  grievances, it is no longer the British Parliament. In Episode 3 of our series on
  the American Revolution, Tom, Dominic and Professor Adam Smith explore the importance
  and impact of the Declaration of Independence, the role of King George III, and
  the effect of France’s involvement.


