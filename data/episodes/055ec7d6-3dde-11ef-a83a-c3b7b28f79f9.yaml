title: 'The Road to The Great War: The Lights Go Out (Part 6)'
description: '“The lamps are going out all over Europe, we shall not see them lit
  again in our lifetime”

  In the early days of August 1914, the British press has become increasingly vocal
  about the prospect of war breaking out amongst the great European powers. But the
  Kaiser still believes he can count on his ambassador in London, and his dear cousin,
  George V, to make sure Britain stays out of the war, giving the Germans an easy
  go at the French. And a telegram from the British capital apparently brings the
  best possible news: Britain declares itself neutral, and will make sure that France
  does the same…


  Join Tom and Dominic in the final instalment of our series on the outbreak of the
  First World War, as the storm clouds of war finally reach Western Europe…

