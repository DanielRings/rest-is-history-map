title: 'RIHC: The British Empire, Tudor Lovers, and War Poetry'
description: 'When was poetry first invented? Which famous Tudor royal wrote love
  poems from the Tower of London? And, why did the First World War produce such extraordinary
  poetry?




  In this week’s bonus episode, Dominic is joined by historian Mark Forsyth to discuss
  the colourful history of English poetry.


