title: 'RIHC: Roald Dahl, Scottish politics, and regal Reagan'
description: 'Should Roald Dahl''s works be re-written to fit 21st century perspectives?
  Which American president faced the toughest crisis? What would a Denisovan sound
  like, and would they like vanilla ice-cream? Which British politician reminds Dominic
  of Mary Queen of Scots? This week''s bonus dissects these important topics, and
  many more...


