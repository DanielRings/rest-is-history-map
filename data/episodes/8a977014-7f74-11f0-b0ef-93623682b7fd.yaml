title: 'The First World War: The Battle of the Frontiers (Part 2)'
description: 'What was Britain''s first military move following the outbreak of the
  First World War? Where did the French launch their initial attack on the Germans?
  Whose army was the biggest and best of all the participants in the war? And, what
  unfolded at the pivotal Battle of the Ardennes in August 1914, on the frontiers
  of France, between the Germans and the French, and what would be the consequences
  of the outcome for the war as a whole?


  Join Dominic and Tom as they discuss, in riveting, unsparing detail, the dramatic
  early engagements of the First World War, and the bloody Battle of Ardennes. 






