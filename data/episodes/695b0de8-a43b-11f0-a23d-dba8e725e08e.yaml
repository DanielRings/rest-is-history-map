title: 'Nelson: Glory at Trafalgar (Part 6)'
description: "How did the British fleet prepare for war, on the morning of the Battle\
  \ of Trafalgar? With the flags of both fleets flying and both Nelson and the French\
  \ admiral Villeneuve glittering in their uniforms, how did the two fleets finally\
  \ collide? Amidst the rivers of blood, the blast of canons, the flying splinters,\
  \ and the swirling smoke, how did Nelson’s ships and sailors fare? And, cornered\
  \ by three enemy ships, what would be the fate of Nelson aboard his Victory…?\n\n\
  \n\nJoin Dominic and Tom as they reach the glorious, tragic climax of their epic\
  \ voyage through the life and battles of Horatio Nelson, at the height of the Napoleonic\
  \ Wars. \n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\
