title: 'The French Revolution: The Diamond Necklace Scandal (Part 2)'
description: 'In August 1785 a shocking affair came to light which would prove so
  detrimental to the reputation and standing of the French King Louis XVI, and more
  especially his already unpopular wife, Queen Marie Antoinette, that it would become
  a decisive moment in the rising tide of the French Revolution. It concerned a gaudy
  but incalculably expensive diamond necklace commissioned by Louis XV for his mistress,
  Madame du Barry. Embroiled in the affair was a young prostitute by the name of Nicole
  Le Guay d’Oiva with an uncanny resemblance to the Queen, a naive Cardinal named
  Louis-René de Rohan, desperate to return to Marie Antoinette’s good graces, an aristocratic
  confidence trickster, Jeanne de la Motte, and a Freemason occultist, Alessandro
  Cagliostro. The web of lies and deceptions that they wove - in many ways capitalising
  upon the simmering tensions of court life at Versailles - and the scandal that subsequently
  erupted, would inflame the entire nation.

  Join Tom and Dominic as they divulge, gem by glittering, salacious gem, the twists
  and turns of the famous Affair of the Diamond Necklace. An intrigue of such devilish
  guile and duplicity, with so colourful a cast of characters, that it near bellies
  belief. But also, with repercussions for the French monarchy that would destabilise
  it forever….

  _______

