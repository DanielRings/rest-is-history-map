title: 'Custer''s Last Stand: Death in the Black Hills (Part 5)'
description: 'In the wake of the barbaric Washita River massacre, George A. Custer
  finds himself drifting: addicted to gambling, at odds with his wife, and failing
  in his efforts to take advantage of the American gold rush in New York. He is sent
  away to Kentucky to suppress post-war civil unrest, but again finds himself alienated
  from many of his companions, due to his controversial views on Reconstruction. Restless
  and dissatisfied, the chance for danger and action finally come Custer’s way, thanks
  to the ambitions of the Northern Pacific Railway. With plans to build it right across
  Lakota territory, the venture would intentionally and fatally threaten their way
  of life, by wiping out the bison. With this threat on the horizon, the Lakota war
  leaders, Sitting Bull and Crazy Horse, lead terrific raids against the survey party
  sent to prospect the land, setting back their efforts. So another, bolstered expedition
  follows in 1873, with Custer amongst its ranks, bringing him into contact for the
  first time with the two mighty warriors who would shape his destiny. A fearful,
  bloody game of cat and mouse would ensue, culminating in an epic confrontation…


  Join Dominic and Tom as they discuss the evolution of Custer’s career, his first
  encounter with Sitting Bull and Crazy Horse, the ever-encroaching Northern Pacific
  Railway, and the U.S. Government’s secret plan to defeat the Lakota Sioux, once
  and for all. 





