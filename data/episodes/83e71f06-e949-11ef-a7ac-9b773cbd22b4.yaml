title: 'The French Revolution: The September Massacres (Part 1)'
description: '‘Still more traitors, still more treason…’

  It is 1792 and France has been at war since April; it is not going well. In Paris,
  the Tuileries Palace has been stormed, and the royal family imprisoned. Meanwhile,
  tensions are rising between the main political factions of the Revolution, the Girondins
  and the Montagnard, led by the icy Maximilien Robespierre. The streets of Paris
  teem with armed young men - the Federes and the Sans-Culottes - responsible for
  the brutal slaughtering of the Swiss Guard earlier that year. They have arrested
  and imprisoned thousands of people. It is into this progressively febrile atmosphere
  of paranoia and fear that terrible news arrives: the Prussians, hungry for vengeance,
  have taken the fortress of Verdin. Rumours swirl of treason and betrayal from deep
  within Paris itself, and a new, chilling idea is raised to wash the city of counter
  revolutionaries once and for all: cleanse the prisons. So it is that on the 2nd
  of September, a group of Prisoners being escorted from one prison to another is
  stopped, and methodically hacked to death. The survivors face an impromptu tribunal
  before receiving the same treatment. Over the next few days, all prisoners across
  Paris are likewise judged, and many similarly damned and mutilated. A tide of bloodshed
  is rising, which will soon flood the streets of Paris, taking thousands of lives
  with it. Who will survive the massacre?


  Join Dominic and Tom for the next series of the French Revolution, as they pick
  up this epic story - one of the most resounding and complex historical events of
  all time - with arguably the most horrific episode of the whole revolution: the
  September massacres…



