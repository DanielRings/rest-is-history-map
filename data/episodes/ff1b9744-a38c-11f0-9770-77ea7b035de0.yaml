title: 'RIHC: How Real Were The Greek Myths?'
description: 'Is there a factual basis behind the Greek myths? Why has the Greek city
  of Thebes long been associated with Egypt? Were the plagues sent by God to punish
  Egypt in the Book of Exodus, based upon real historical events? Was Greece actually
  originally colonised by Egyptians and Phoenicians? What evidence is there for this
  theory? Did Herodotus believe that the Greek myths were based on real events, better
  articulated by the Egyptians? Why did the Greeks seek to weave other cultures into
  their mythic past? And, was the Greek God Apollo said to have visited the British
  Stonehenge…?


  Join Tom and Dominic in this week’s bonus episode, as they unravel some of the most
  famous mysteries of the ancient world._______


