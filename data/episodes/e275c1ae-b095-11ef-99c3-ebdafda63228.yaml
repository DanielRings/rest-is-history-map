title: The World's First City
description: 'In as early as 5000 BC the vast and spectacular city of Uruk - replete
  with towering walls, glistening temples and complex irrigation systems - lay sprawled
  across the face of Southern Mesopotamia. Not only is Uruk the oldest city in the
  world, but it is arguably one of the most consequential, having facilitated one
  of the great turning points of human civilisation. Here, in this mysterious metropolis
  lay the origins of urbanisation, making Uruk the predecessor and antecedent of every
  modern city today. It was the cradle of formidable trading networks, sophisticated
  craftsmanship, agricultural prosperity, the earliest examples of writing, and even
  home to the very first person in human history to be named. Yet, by 700 AD this
  once great wonder of the ancient world had been abandoned, leaving nothing behind
  but haunting ruins and two burning questions: firstly, how did this marvel of urbanisation
  come to exist, and secondly, what led to its ruin? Was it colonisation, climate
  change, or conquest…?


  Join Tom and Dominic as they discuss Uruk, the first city in the whole of world
  history and the mother of modern urbanisation, revealing the remarkable tale of
  its discovery, its mysterious origins, and equally enigmatic decline.

