title: 'The French Revolution: The Execution of the King (Part 4)'
description: "The second revolution that engulfed France over the course of 1792 reached\
  \ its climax in December, with an astonishing, world-changing spectacle, which held\
  \ all the eyes of Europe spellbound: Louis Capet, formerly King Louis XVI of France,\
  \ was on trial for his very life. A guilty verdict would undermine millennia of\
  \ thought and tradition, ripping apart the longheld inviolability of the king, still\
  \ held sacred in some quarters of France, and setting a dangerous precedent for\
  \ the other monarchs of Europe. For the revolutionary leaders, then, this was a\
  \ cosmic strike against tyranny, unpicking the very foundations of French society.\
  \ The trial would serve to proclaim the institution of the new regime; a ritualistic\
  \ rebirth born of the death of the king. It would last a month. Then, on the 15th\
  \ of January, a verdict was finally reached: Louis was found guilty, and condemned\
  \ to death by guillotine. With the former king’s day numbered, was there any way\
  \ the judgement could be overturned? And if not, what would the consequences of\
  \ this seismic event be for the future of France, Europe, and the world…?\nJoin\
  \ Tom and Dominic as they discuss the climax of the French Revolution - itself one\
  \ of the most important moments of all history - with the extraordinary trial and\
