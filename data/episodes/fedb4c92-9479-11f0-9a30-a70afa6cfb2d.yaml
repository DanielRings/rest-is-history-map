title: In Cold Blood, by Truman Capote
description: 'How were the Clutter family brutally murdered in their home, in Holcomb,
  Kansas, in 1959? Why was this seemingly perfect and well-loved family killed so
  savagely? Who were their murderers, Perry Smith and Richard Hickock? How did Truman
  Capote, the flamboyant New York socialite famed for ‘Breakfast at Tiffany''s’, come
  to write these real events into a novel over the course of six years, immortalising
  them forever? Was it really the world’s first true crime novel? How does the book
  reflect the conditions of post-war America, and dig into the savagery buried beneath
  the thin veil of  prosperity? Why was Capote’s research so extreme, and how many
  of the moments depicted did he personally experience? Was the book entirely based
  on facts rather than fiction, or did he embroider characters and events? How did
  Capote’s own fascinating life and person contribute to his writing of the book?
  What became of the Clutter’s murderers? And, did Truman Capote really fall in love
  with one of the killers while writing the book…?




  Join Dominic and Tabby as they explore Truman Capote’s groundbreaking ‘In Cold Blood’;
  delving into the shocking murder that shattered a close-knit community in rural
  Kansas, the minds of the two murderers who committed the crime, and also the disquieting
  story behind the book''s creation.


