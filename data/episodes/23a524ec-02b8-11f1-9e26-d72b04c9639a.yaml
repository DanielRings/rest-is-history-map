title: 'The Fall of the Incas: Massacre in the Andes (Part 2)'
description: 'What happened when the Spanish conquistadors lead by Francisco Pizarro
  came face to face with the ruthless emperor of the Incan Empire, Atahualpa? How
  did the Incas treat their strange, pale, alien visitors with their horses? And,
  why did a brutal, bloody fight to the death break out between the two sides after
  the meeting?




  Join Dominic and Tom, as they discuss one of the most totemic meetings of all time
  - the emperor of the Incas Atahualpa and the Spanish buccaneer Francisco Pizarro.
  Would either survive the confrontation that ensued?




