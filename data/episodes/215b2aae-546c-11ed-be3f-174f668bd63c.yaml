title: 'RIHC: Trafalgar, Julia Gillard, and Producer Jack'
description: 'In a Rest Is History first, this podcast features a historic personality
  who has actually been the subject of one of our shows!


  In the latest bonus episode, Tom is joined by former Australian PM Julia Gillard
  - and later by Producer Jack to discuss Trafalgar, recording episodes in Venice,
  and the Edinburgh Festival.


