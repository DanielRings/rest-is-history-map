title: 'RIHC: Was the First World War More Important than the Second?'
description: 'Was the Russian Tsar the most consequential European leader of the First
  World War? Was there a world in which America never entered the conflict? And, who
  is the most exciting explorer of all time?  


  In this week’s bonus episode, Tom and Dominic delve deeper in the First World War,
