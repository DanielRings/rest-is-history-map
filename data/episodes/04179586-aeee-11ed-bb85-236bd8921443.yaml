title: 'Columbus: The Adventure Begins (Ep 1)'
description: 'A controversial figure both now and in his time, Tom and Dominic discuss
  Columbus and his drive for discovery, power and status. They look at Columbus’ early
  life in Genoa, his journey to becoming an accomplished sailor, his obsession with
  crossing the Atlantic to reach what he thought was Asia, and how he convinced the
  Catholic Monarchs of Spain to fund his voyage.


