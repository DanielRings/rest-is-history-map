title: Tom Holland Meets Paul McCartney
description: 'How was Paul McCartney influenced by life in postwar Liverpool? How
  did he and the Beatles first learn to make music? And were they influenced by literature
  as well as other musicians? Join Tom Holland as he asks Paul McCartney these questions
  and more in a very special interview for The Rest Is History which features a WORLD
  EXCLUSIVE reveal of one of the songs from Paul’s new album, Salesman Saint. The
  full album, The Boys Of Dungeon Lane, is out May 29th. 




  Salesman Saint''


  From the album ''The Boys of Dungeon Lane'' 


  Written by Paul McCartney


