title: Stonehenge, Ancient Ritual and the Origins of Paganism
description: 'Like Merlin, who lived his life in reverse, we go backwards in time
  as we continue our two-part series on paganism. Renaissance philosophers; green
  men; a pagan city in the early caliphate; hooded gods on Hadrian’s Wall; Stonehenge;
  cannibals (or were they?) in Cheddar Gorge; and the oldest evidence ever found of
  pagan practice in Britain.


