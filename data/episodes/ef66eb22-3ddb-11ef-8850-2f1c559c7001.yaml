title: 'The Road to The Great War: The Kaiser’s Blank Cheque (Part 2)'
description: 'In the wake of the cataclysmic assassination of Franz Ferdinand on the
  28th of June 1914, in Austria, the long percolating question of what to do about
  Serbia, reached a climax. At last, they had been handed an opportunity to take decisive
  action. On Sunday 5th of July an emissary of the the old and embattled emperor Franz
  Joseph I of Austria, arrived in a deserted Berlin with letters for Kaiser Wilhelm
  II of Germany. Their contents would change the course of world history forever.
  Originally received with uncharacteristic sanguinity and caution, the Kaiser returned
  from a hearty lunch that afternoon with a response to the emperor’s call for war
  against Serbia: Germany would back Austria absolutely, on top of which Wilhelm urged
  his ally to act with haste. What, then, were his motives? Was the Kaiser driven
  by a hunger for world domination, was it his hostility towards the British or was
  he spurred on by his personal sense of loss over the brutal assassination of his
  friend, and his wife? Whatever the case, Germany then issued Austria with the notorious
  Blank Cheque that would definitively set Europe upon the road to war. 

  Join Dominic and Tom as they plot out the events that followed from the assassination
  of Archduke Franz Ferdinand, and the first momentous steps towards a world war that
  even after the Austrian Ultimatum was finally handed to Serbia; none of the major
  players in that ruinous game, had any sense would take place…

