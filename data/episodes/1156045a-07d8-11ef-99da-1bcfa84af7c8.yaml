title: 'Custer vs. Crazy Horse: Rise of Sitting Bull (Part 4)'
description: '“What would you do if your home was attacked? You would stand up like
  a brave man and defend it. That is our story.”

  Following the bloody Fetterman Fight, which saw the Lakota warlord Crazy Horse and
  his warriors ambush and massacre American troops, the American public was left stunned,
  its government and civilian population hungry for revenge. In the wake of this a
  new treaty was signed, further restricting the Lakota Sioux’s freedoms, but nevertheless
  signed by their political leader, Red Cloud. Still, many would not be constrained
  to reservations, and instead sought war. Chief amongst them was Sitting Bull, a
  legendary, mythologised figure of the Great American Plains and the Wild West -
  the embodiment of a vanished age. Born into the Lakota Sioux, and a world of shifting
  allegiances, violent initiation rituals, and intransigent spiritualities, as a young
  man Sitting Bull’s herculean destiny was sung to him by an eagle. The career that
  followed in his war against the U.S. government would exceed even the greatest of
  epics. By 1860 he was paramount leader of the Sioux Nation, when news reached him
  of the imminent arrival of a survey party, lead by none other than George Armstrong
  Custer…


  Join Dominic and Tom as they discuss Sitting Bull’s rise, his extraordinary upbringing,
  and his stand against the increasing encroachment of railroads into his homelands.




