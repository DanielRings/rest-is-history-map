title: 'Helen of Troy: A Family of Blood (Part 2)'
description: 'In 1870 the German archaeologist Heinrich Schliemann - a man of remarkable
  energy, desperately fascinated with Helen of Troy - discovered in Turkey the burnt
  remains of what he claimed to be the legendary city of Troy, and with it, a horde
  of gold and treasure which he attributed to Helen. Following this breakthrough,
  he went in search of another, more obscure prize: Mycenae, one of the most powerful
  city-states in ancient Greece, and the dominion of Agamemnon, husband of Helen’s
  sister, Clytemnestra. A man whose family was dogged by incest, dark curses, vengeance
  and cannibalism, Agamemnon mercilessly sacrificed his daughter on the eve of the
  Trojan Wars. But this would unleash a terrible vengeance from Clytemnestra, and
  set in motion one of the great stories of Greek tragedy…


  Join Tom and Dominic as they unveil the life of Clytemnestra, one of the most potent
  and blood-soaked women in Greek mythology, and tell the story of an amateur archaeologist’s
  hunt for her and Helen.




