title: The Kings of Comedy
description: 'Comedian Al Murray joins Tom Holland and Dominic Sandbrook to discuss
  the history of comedy as well as the funny side of history.

  Has comedy changed through time? When and why are we not allowed to laugh at events?

  Al Murray has made a living out of making people laugh, while also frequently placing
  history at the heart of his humour.


