title: 'JFK: Hunt for a Killer (Part 4)'
description: 'It’s 12:31pm on Friday 22nd November 1963, and in Dallas, Texas, President
  John F. Kennedy lies slumped against his screaming wife, half of his head cradled
  in her hands and his blood spattered across her elegant pink suit and the seats
  of their car. 


  Just moments earlier, three shots had rung out from the direction of the Texas Book
  Depository. Or had they? Who had fired the shots? A single gunman - or more? Just
  who was the oddly detached, vacant-looking man whom left the building minutes later?
  Why did he murder a Dallas policeman shortly after the shooting? Was he really Kennedy’s
  killer, or a red herring, planted by a wider conspiracy? And was he working for
  the Cubans, the Communists - or the CIA?


  Join Tom and Dominic as they plunge into the extraordinary drama of 22 November
  1963, from the national shock after the president’s assassination to the thrilling
  hunt to track down his assassin.


  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


