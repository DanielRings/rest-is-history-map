title: 'RIHC: Murdered Martyrs, Norse Raids, and Mysterious Stone Circles'
description: 'What is the meaning behind Orkney’s mysterious stone circles? How far
  back does the history of the Orkney archipelago truly stretch? What makes its ancient
  neolithic remains so extraordinary? When were the Picts in Orkney and how did they
  relate to the politics of Scottish history? What happened when the Vikings arrived
  in Orkney? When was Orkney Christianised? Who was the legendary patron saint of
  Orkney, King Magnus, and why was he murdered? Why did Denmark mortgage Orkney to
  the Scottish crown during the medieval period? Why was Napoleon Bonaparte so interested
  in Orkney? And, what made Orkney crucial during the Second World War?

  In this week’s bonus episode, Tom is joined by historian Peter Marshall to discuss
  his book (and Tom’s book of the year), Storm’s Edge, and the fascinating history
  and myths of Orkney, through to the early modern period.

