title: 'Ireland: The Easter Rising, 1916 (Ep 4)'
description: "The Easter Rising began in Dublin's General Post Office on Easter Monday,\
  \ 24th April 1916, with Patrick Pearse's dramatic proclamation of the Irish Republic.\
  \ Led by republicans opposed to British rule in Ireland, this was the most significant\
  \ uprising in more than a century - and changed the entire course of Irish and British\
  \ history, with effects that still reverberate today.\nIn today's episode, Tom and\
  \ Dominic return to the GPO in Dublin, as the brilliant Professor Paul Rouse tells\
  \ the bloody story - at once inspiring, terrifying and heartbreaking - of the Easter\
  \ Rising and its extraordinary aftermath. \n\n*The Rest Is History Live Tour 2023*:\n\
  \nTom and Dominic are going on a U.S. tour in 2023, performing in Washington D.C.\
  \ and New York! \n\nBuy your tickets here: restishistorypod.com\n\nTwitter: \n@TheRestHistory\n\
  @holland_tom\n@dcsandbrook"
