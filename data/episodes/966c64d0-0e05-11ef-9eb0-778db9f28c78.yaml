title: 'Custer''s Last Stand: The Battle of the Little Bighorn (Part 7)'
description: '“You and I are going home today, and by a trail that is strange to us
  both…”

  The Battle of The Little Bighorn is one of the totemic moments of American frontier
  history. However, it is also mysterious, with the exact events of that blood-soaked
  day difficult to trace. On the 22nd of June, George Custer marched out with vague
  orders to drive the vast gathering of the Lakota and their allies, under the leadership
  of Crazy Horse and Sitting Bull, towards General Terry’s force, advancing from the
  South. Custer, keen as ever for a charge, was hoping to score a considerable defeat
  over the Native Americans in time for the 4th of July centenary. Then, on the evening
  of the 24th of June, Crow scouts reported that the Lakota’s trail had been found,
  and Custer launched into action. Marching his men through the night, they arrived
  at the encampment the following morning, shocked to discover a camp of thousands.
  At 3pm, the first force attacked, and the Battle of the Little Bighorn, in all its
  horror and gore, had begun…


  Join Dominic and Tom they explore one of America’s most mythologised battles, separating
  fact from fiction, as they build up to George Custer’s last stand.




