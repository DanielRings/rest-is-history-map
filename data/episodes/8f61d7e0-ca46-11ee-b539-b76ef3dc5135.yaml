title: 'RIHC: Pointless Prime Ministers, The Rolling Stones and Medieval Giants'
description: 'What is the worst policy decision a British Prime Minister ever made?
  How much do Prime Ministers really matter? Which of Chaucer''s pilgrims would Tom
  and Dominic be? Is Tom the Wife of Bath and Dominic Chaucer? If Richard II had had
  a son, would he have remained king? When did the 1960''s gain their legendary reputation?
  Did medieval tourists visit Hadrian''s Wall?

  Join Dominic and Tom for this week''s bonus episode, as they discuss some captivating
  historical questions.




