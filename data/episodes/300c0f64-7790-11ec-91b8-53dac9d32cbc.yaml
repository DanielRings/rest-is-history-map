title: The Princes in the Tower Part 2
description: 'Who killed the Princes in the Tower? The inspiration behind Shakespeare''s
  Richard III, their murder remains one of the greatest mysteries in English history.


  In the second of two episodes, all eyes turn to Richard III, prime suspect in the
  disappearance of Edward IV''s sons.


  Tom and Dominic discuss whether Richard likely did kill his nephews, potential other
  suspects, and whether it was a matter of survival for him to do so.


  Plus, the greatest question of our time: was Richard III more Raul Castro, Robert
  Kennedy, or James Callaghan?


  Producer: Dom Johnson

