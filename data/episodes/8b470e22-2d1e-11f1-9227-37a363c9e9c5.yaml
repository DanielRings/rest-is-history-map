title: 'Revolutions: Iran, the Prague Spring, and Ceaușescu’s Fall | History in Photos
  (FULL EPISODE)'
description: "In what ways did Abbas’ identity grant him unique access to the Iranian\
  \ Revolution? How can a single object, like Josef Koudelka’s wristwatch, symbolise\
  \ an entire geopolitical shift like the Prague Spring? And, how does Moises Saman’s\
  \ photographic approach to the Arab Spring differ from traditional revolutionary\
  \ photography?\n\n\n\nIn today’s episode of our new member’s-only mini-series, Dominic\
  \ is joined by photographer Chris Floyd to discuss iconic photographs of political\
  \ revolutions of the 20th and 21st century. \n\n\n\nSign up to our free newsletter\
  \ at therestishistory.com/newsletter! \n\n\n\n The photographers featured in this\
  \ episode are all members of ⁠Magnum Photos⁠.\n\n\n\nGetty Images has one of the\
  \ largest and oldest privately held archives globally with access to over 150 million\
  \ images dating back to the beginning of photography. From historical images created\
  \ in the early\n\n1800s to more contemporary 1990s imagery, the Getty Images archive\
  \ houses a wealth of socially significant, historical photos, videos and prints,\
  \ and includes content from over 40 editorial content\n\npartners including Gamma-Rapho,\
  \ Paris Match, The Bettmann Archive, Sygma and Motorsport Images. Our archive video\
  \ collection contains 3.1 million hours of offline video footage and includes partners\n\
  \nsuch as NBC News Archives, ITN, Sky News and the BBC Motion Gallery.\n\n_______\n\
