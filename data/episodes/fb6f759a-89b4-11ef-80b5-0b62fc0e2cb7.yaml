title: 'The French Revolution: Bloodbath in Paris (Part 1)'
description: 'Welcome to Season 2 of The French Revolution


  Revolutionary fervour threatens to engulf the streets of Paris, as demonstrators
  have gathered on the Champ de Mars to sign a petition demanding the removal of the
  King. Two days prior, the National Assembly had decreed that Louis XVI would remain
  King under a constitutional monarchy, even after his failed escape to Varennes,
  an inexcusable betrayal of the French people. The crowd has begun to swell on the
  Champ de Mars, and two men have already been lynched by the mob. The National Guard,
  with Lafayette at its head, has been sent to disperse the demonstrators, and a bloody,
  violent face-off erupts…


  Join Tom and Dominic in the first part of our second Season of the French Revolution,
  as they break down the events of the Champs de Mars Massacre.


