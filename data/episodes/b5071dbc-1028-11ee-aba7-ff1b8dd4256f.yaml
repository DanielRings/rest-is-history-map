title: 'Oppenheimer: The Father of the Atom Bomb (Ep 1)'
description: '“Now I am become Death, the destroyer of worlds.” This was J. Robert
  Oppenheimer’s reaction to the first atomic bomb test in July 1945, marking the beginning
  of the nuclear age. Oppenheimer, an American theoretical physicist of Jewish-German
  descent, was in charge of the American nuclear project, leading the Los Alamos laboratory
  and tasked with developing “the bomb” in 1943, following his involvement in the
  Manhattan Project. Join Tom and Dominic as they delve into the life of the man behind
  “the weapon to end all wars”.


