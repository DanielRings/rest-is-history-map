title: Drink
description: 'For a festive special, Tom and Dominic are joined by author and alcohol
  historian Henry Jeffreys to discuss some Christmassy tipples, from sherry to port,
  champagne to clairet. Plus, a discussion on why certain drinks revealed your political
  leanings, and how one Shropshire gentleman set his furniture on fire trying to cure
  his hiccups after one too many bottles of wine...


  Read Henry Jeffreys book Empire of Booze now, available here.

   

