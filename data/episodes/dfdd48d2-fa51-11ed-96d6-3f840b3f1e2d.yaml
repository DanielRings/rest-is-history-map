title: 'The Freemasons: History''s Greatest Conspiracy Theory'
description: 'A grubby, secretive cabal of devil worshippers that run the world, or
  a fraternity of like-minded individuals who enjoy eccentric rituals? Freemasonry,
  originating in the Middle Ages, played a significant role in the formation of the
  new American nation under George Washington, held the British empire together, and
  later served as a tool for authoritarianism and revolutionary conspiracy. 

  Tom Holland and Dominic Sandbrook are joined by historian John Dickie on a journey
  to uncover the true history of the Freemasons, a society which has counted among
  its ranks Mozart, Benjamin Franklin, the Duke of Wellington, Shaquille O''Neale,
  and many more…


  *The Rest Is History Live Tour 2023*:

  Tom and Dominic are going on a U.S. tour in 2023, performing in Washington D.C.
  and New York! 


