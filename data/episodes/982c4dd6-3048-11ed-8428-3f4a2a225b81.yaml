title: Queen Elizabeth II - part 2
description: In February 1952, on the death of her father King George VI, the 25-year-old
  Elizabeth became Queen. During her long reign she was served by 15 Prime Ministers
  and met an extraordinary array of people. Dominic Sandbrook and Tom Holland here
  examine her 70 years as Queen of the United Kingdom & 14 other countries, and head
  of the Commonwealth.
