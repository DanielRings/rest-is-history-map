title: 'The Medici: Masters of Florence (Part 1)'
description: 'What are the origins of one of history’s most glittering, and for a
  time, most powerful families in Europe; the Medici? How were they able to seize
  supreme power in the Republic of Florence , one of the most dazzling cities in the
  world, during the 15th century, at the height of the Renaissance? When did Florence’s
  explosive growth begin, and how? Who was Cosimo Medici, the Godfather of the family,
  who through cunning, blood, betrayal and sheer will, pulled his family to the forefront
  of Florentine politics? 


  Join Dominic and Tom for the first episode of their new series on one of history’s
  most glamorous, most colourful, most devious, and frequently most dastardly families
  in history - the Medici - and their rise to the highest echelons of wealth and power
  in Renaissance Europe. 






