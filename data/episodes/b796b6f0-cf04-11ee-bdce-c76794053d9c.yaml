title: 'RIHC: Medieval Monarchs, Historical Epochs and The Crown'
description: 'What qualities did medieval monarchs need to be successful? Did Lord
  Mountbatten plan to lead a coup against Harold Wilson in 1968, as depicted in the
  TV show The Crown? Will historians of the future view the 1960’s as historically
  distinct from the 1970’s, or will they simply merge into larger historical epochs?
  How long does it take people to realise they have lived through moments of life-changing
  cultural transformation? Was the 18th century Britain’s greatest period? And, has
  the last one hundred years of British history seen more change to society, politics
  and culture than the preceding century?

  Join Tom and Dominic for this week''s bonus episode, as they discuss some important
  historical questions. 





  *The Rest Is History LIVE in 2024*


