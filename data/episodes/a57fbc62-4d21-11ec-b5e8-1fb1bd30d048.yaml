title: Decolonising Africa
description: 'Writer and critic Tomiwa Owolade joins Dominic and Tom to discuss the
  story of post-war Africa, from European colonies to independent nation-states. Why
  did the European empires collapse so quickly? Who were the most important African
  thinkers and leaders? And why have countries like the Congo had such a bloody modern
  history?  


