title: 'The Nazis in Power: The Nuremberg Rallies (Ep 2)'
description: '“We did not lose the war because our artillery gave out, but because
  the weapons of our mind didn’t fire”

  In September 1934, the Nazis held their sixth annual party conference in the Bavarian
  city of Nuremberg. The location held a symbolic resonance for the party, being not
  only the embodiment of an uncorrupted medieval Germany, and the centre of the First
  Reich, but also a bedrock of anti-Semitism. It was therefore here that Hitler would
  lay out his terrifying vision for the mighty new empire’s future, promulging the
  superiority and purity of the Aryan bloodline. The rally was a pageant of ritualised
  fanaticism, recalling the majesty of Germany’s mythic past and all the heroism of
  classical antiquity. It was the first of many such extravagant displays, replete
  with parades of marching workers, bonfires, and swastikas, as the Nazi propaganda
  machine, under the leadership of the grotesque Joseph Goebbels, tightened its stranglehold
  over Germany. Through the popularisation of the radio, Nazi youth organisations,
  cinema, and even the Olympic Games, German minds were being steadily remoulded…


  Join Tom and Dominic as they discuss the Nazis'' gradual indoctrination of the German
  people in the build up to the Second World War, and the beginnings of Hitler’s plans
  for not only the Third Reich, but the entire world.



