title: 'The Fall of the Aztecs: The Last Emperor (Part 8)'
description: 'Tenochtitlan, once the glittering jewel at the heart of the mighty Aztec
  Empire, has fallen. Hernán Cortés stands triumphant, the master of this New Spain.
  Or so it seems. For the last Aztec emperor, Cuauhtemoc, is still alive and well.
  And in the jungles of Mexico and Honduras, a dark and bloody story is only just
  beginning …


  In the final episode of this astonishing journey, Dominic and Tom discuss the aftermath
  of the fall of Tenochtitlan, the fates of Cuauhtemoc, Cortés and Malinche, the experiences
  of the local population and the story of Mexico in the decades after the Spanish
  conquest. As this mighty epic draws to a close, they also explore the Black Legend
  of Spanish imperialism, and discuss the long-term repercussions of the conquest
  and its status in the context of world history and politics today.


  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


