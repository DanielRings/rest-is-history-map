title: 'Ireland: Celts, Conquest and Cromwell (Ep 1)'
description: '“In every generation the Irish people have asserted their right to national
  freedom and sovereignty; six times during the past three hundred years they have
  asserted it in arms.” 

  The proclamation of the Irish Republic, delivered by Patrick Pearse in Dublin, marked
  the beginning of the Easter Rising in 1916.

  Looking at the Anglo-Irish relationship leading up to the Easter Rising, Tom and
  Dominic are joined by historian Paul Rouse, to explore the deep history between
  Britain and Ireland, from the Norman conquest to the rebellion of 1798.



