title: 'Warlords of the West: Killer Queens (Part 2)'
description: 'Following the death of the legendary Frankish King Clovis, his son Clothar
  I divided the mighty realm his father had hacked out from the warring warlords of
  Europe between his four sons. But peace was not to reign…the most ambitious of his
  brood - Chilperic - seized Paris, his brother''s domain, following his death. Drawn
  to his swelling power, a seemingly humble yet beautiful slave girl, Fredegund, rose
  up from obscurity to become Chilperic''s mistress. Little did he know what a ruthless
  force of nature he had invited into his bed. Before long, she had persuaded him
  to cast aside his first wife, Audovera. His second, Galswintha, was not so lucky.
  Soon after their marriage she was found strangled to death, and Fredegund - her
  probable murderer - was crowned queen in her place. Meanwhile, Galswintha''s equally
  merciless sister, the intelligent Queen Brunhilda of Austrasia was plotting the
  gruesome downfall of her sister''s killer, hungry for revenge. The terrible and enduring
  feud between these two remarkable women had begun…

  Join Tom and Dominic for this most unbelievable of stories in the second instalment
  of their series on the rise of the Franks, as they unveil the clash of two indomitable
  warrior queens, drenched in blood, violence, vengeance, scheming, and witchcraft.
  The outcome of their civil war would reshape the face of the West.

