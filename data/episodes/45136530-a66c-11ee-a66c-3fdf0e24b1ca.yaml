title: 'The Nazis in Power: Hitler’s Road to War (Ep 3)'
description: '“No one can doubt that this world will one day be the scene of dreadful
  struggles for existence on the part of mankind. In the end, the instinct of self-preservation
  alone will triumph.”

  Hitler has been planning for war since 1928. However, the Treaty of Versailles has
  placed immense limitations on his ability to rearm Germany, and he must first overcome
  internal enemies, whether the SA or the communists. He will then need to build-up
  the Nazi war machine, to allow him to expand the Third Reich and gain his much-desired
  lebensraum, “living space”. But with Germany facing economic decline, will Hitler’s
  push for rearmament provide a solution to the economy’s manifold problems? Or will
  the Führer simply use foreign policy coups as a smokescreen, to hide the dire straits
  facing the German people? Hitler can be certain of one thing - Britain and France
  do not want another war…


  Join Tom and Dominic in the third part of our series on the Nazis in Power, as they
  look at how Hitler, both materially and ideologically, prepared the country for
  war, and, as a brilliant opportunist, preyed on the Allies’ weaknesses in order
  to complete his rearmament of Germany.



