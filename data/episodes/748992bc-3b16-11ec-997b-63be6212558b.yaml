title: The Echo of a Coffee House
description: 'Social media has colonised the world but is it really a new phenomenon?
  Tom Holland and Dominic Sandbrook debate the effects of technical innovations from
  the printing press to Twitter. Do they really make a difference?

  Or was Swift right when he said: “It is the folly of too many, to mistake the echo
  of a London coffee-house for the voice of the kingdom.”



