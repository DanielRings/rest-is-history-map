title: 'JFK: Cuba, Camelot and the Cold War (Part 2)'
description: 'By the late 1950s, John F. Kennedy was a rich and handsome Democratic
  senator with a beautiful wife and young family, heading for the White House despite
  his Catholicism, his affairs and his secret illnesses. In January 1961 he became
  the youngest ever President of the United States, during a period of heightened
  political and social tensions at home and abroad, with the Cold War raging, communism
  on the rise and the Civil Rights Movement dominating the headlines. What role, then,
  did Kennedy’s domestic and foreign policies play in these monumental moments of
  world history? And does the backlash against him offer us the crucial clues to the
  motives behind his assassination, and the identity of his killer? 


  Join Tom and Dominic as they discuss Kennedy’s early political career, the successes
  and failings of his presidency, and world-shaking events such as the Bay of Pigs
  disaster, the Cuban missile crisis, the Space Race and the Vietnam War. All the
  while, Kennedy’s days are numbered as that fateful day in Dallas comes ever closer…



  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


