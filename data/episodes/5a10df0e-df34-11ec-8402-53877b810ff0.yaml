title: Jubilees
description: 'In today''s episode of The Rest Is History Dominic and Tom look at how
  Jubilees have served as a moment for Britain to stop and reflect.


  From the celebrations of George III, Queen Victoria and George V to the modern jamborees
  of Elizabeth II, here''s all you need to know before this year''s Platinum Jubilee.


