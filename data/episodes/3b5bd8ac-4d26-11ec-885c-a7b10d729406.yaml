title: History of India in 10 Buildings
description: 'Curator and art historian Aparna Andhare gives Tom and Dominic her selection
  of the ten buildings that best illustrate India’s past 4,500 years. Ranging from
  Mohenjo-daro to Narendra Modi, all the Subcontinent’s history is here.


