title: 'The Murder of Franz Ferdinand: The Crime (Part 4)'
description: 'Archduke Franz Ferdinand has arrived in Sarajevo for a military inspection,
  alongside his wife, Sophie, on the 28th of June 1914. Unbeknownst to them, six assassins,
  including Gavrilo Princip, line the route of the motorcade, from Sarajevo train
  station to the town hall. Having completed the inspection, the Archduke faces a
  first assassination attempt on the way to the town hall, as a bomb, thrown at his
  car by one of the conspirators, narrowly misses, wounding more than 15 people. Although
  clearly perturbed by the assassination attempt, Franz Ferdinand decides to continue
  with his day as planned, thus sealing his fate…


  Join Tom and Dominic in the final instalment of our series on the murder of the
  Franz Ferdinand, as they delve into the finals hours of his life, and look at the
  series of poor decisions that would lead to Gavrilo Princip completing his mission,
  and going down in infamy…

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


