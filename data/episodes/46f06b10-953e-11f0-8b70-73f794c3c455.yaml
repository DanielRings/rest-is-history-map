title: 'Greek Myths: Zeus, King of the Gods (Part 1)'
description: 'What are the mythic origins of Zeus, King of the Olympians, and the
  other Greek gods? From what period did the earliest of the Greek myths derive? Who
  was Hesiod - alongside Homer, the greatest of the Greek poets, and the father of
  European literature - who first recorded Zeus’ story? When was the golden age of
  Greek myth? Who were the Titans, and why were they consigned to the fiery pit of
  Tartarus? Did different regions of Greece have different interpretations of the
  gods, and do these myths express something particular about ancient Greek culture?
  And, did people really believe in these famous stories of terrible gods, daring
  heroes, and great wars?


  Join Tom and Dominic as they plunge into the glorious, technicolour world of the
  Greek myths, starting with the tumultuous early life of Cronos, his son Zeus, the
  war between the gods and the Titans, and some of the most famous Greek heroes of
  all time - from Perseus to Hercules. 




