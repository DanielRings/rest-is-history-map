title: 'The French Revolution: Showdown in Versailles (Part 4)'
description: 'In the summer of 1788, a monstrous storm swept across France, wiping
  out the crucial wheat harvest. With the nation already in the throes of political
  and financial calamity, this meteorological disaster - followed by an apocalyptic
  drought, and latterly the cruellest winter France had ever known - exacerbated the
  growing sense of catastrophe. With bankruptcy declared that August and unemployment
  record high, all eyes turned to Jacques Necker, the newly appointed finance minister.
  However, the amalgamation of political and financial crisis, the cultural atmosphere
  of virtue and passion, and the rising social unrest had already contrived to destabilise
  the situation permanently. By March there was food rioting, law and order had broken
  down in the countryside, and in April the bloodiest day of the revolution so far
  erupted in Paris. At last, in June, the Estates General met for the first time since
  1614-15, and the mounting pressure to replace the traditional Three Estates with
  a single assembly resolved itself into the formation of the National Assembly; a
  body determined to take the fate of the nation into its own hands. With the elements
  gathering against them, what will Louis XVI and Marie Antoinette do? 

  Join Dominic and Tom as they recount the dramatic series of calamities that unravelled
  the nation and spiralled into the infamous Tennis Court Oath of June 1789, and the
  Revolution itself. From natural disasters and bread riots, and financial ruin, to
  political instability, Dr Guillotin, and disreputable republican firebrands….

  _______


  *The Rest Is History LIVE in the U.S.A.*

