title: 'Christmas: Pagan or Christian?'
description: '“The Church was anxious to draw the attention of its members away from
  the old pagan feast days, and the December date did this very well, for it coincided
  with the birthday of the invincible son of Mithraism…”

  Is Christmas as we know it merely an invention, created by plagiarising from rival
  cults, such as the worship of Mithra, the Iranian sun god, during the days of the
  Roman Empire? Is Christmas in fact based on a pagan festival, that Christians have
  made their own? Or has Christmas always been an authentically Christian celebration,
  born of its tradition and rituals? Join Tom and Dominic as they delve into the roots
  of Christmas, the importance of the Roman festival of Saturnalia, the cult of Sol
  Invictus, and much more.


