title: 'The Nazis in Power: The Conquest of Austria (Ep 4)'
description: 'By 1937, Hitler’s ever-growing ambitions were driving Europe to the
  brink of war. Ever restless, he knew that Germany must conquer the world, or be
  destroyed. His first target was Austria, his homeland, whose annexation to Germany
  would unite German blood under one indomitable Reich. However, in an effort to avoid
  Nazi rule, the Austrian Chancellor, Kurt Schuschnigg, called a referendum on annexation,
  to show the Austrian people’s will against it. Hitler’s reaction was one of rage,
  and on the morning of Friday, the 11th of March, 1938, he sent an ultimatum to Vienna.
  At 5.30am the next day, the German army crossed into Austria. It was met by great
  cheering crowds, and Hitler’s arrival in Vienna was one of true apotheosis… Yet
  the darkness at the heart of Hitler’s European dream was also emerging, as the Nazis
  began to detain and repress Austrian minorities, particularly the Jewish population,
  on an unprecedented scale.


  Join Tom and Dominic as they discuss the annexation of Austria, and the post-war
  myth of Austria’s victimisation at the hands of Hitler and the Nazis. They also
  look at the Nazis’ first acts of violence, discrimination and deportation against
  Vienna’s Jewish population, prefiguring the horrors to follow.



