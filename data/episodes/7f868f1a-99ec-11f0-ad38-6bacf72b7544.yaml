title: Dracula, by Bram Stoker
description: "Was the titular Count Dracula of Bram Stoker’s decadent gothic thriller,\
  \ ‘Dracula’, based on Vlad the Impaler? Was Count Dracula the first literary vampire?\
  \ Which other aspects of Central European history, and Transylvanian ghost tales,\
  \ did Stoker draw upon? Is Castle Dracula a real place? Who was Bram Stoker himself,\
  \ and was he in love with his flamboyant boss, Henry Irving, the greatest actor\
  \ of his age? Was ‘Dracula’ well received following its publication, or condemned\
  \ for being sexually explicit? How has the book influenced the characterisation\
  \ and popularity of vampires in literature, cinema, and popular culture ever since?\
  \ Is the book sexist by the standards of today? How do the many dramatic, hair-raising\
  \ events of the story unfold? Who is Van Helsing, the iconic Dutch doctor, come\
  \ investigative monster-hunter, on Count Dracula’s bloody trail? Is it a Victorian\
  \ gothic romance, a murder mystery, a detective thriller, or a ghoulish bodice ripper?\
  \ And, why has the fame and notoriety of ‘Dracula’ endured …?\n\n\n\nJoin Dominic\
  \ and Tabby as they explore Bram Stoker’s simmering gothic novel, ‘Dracula’ -  literature’s\
  \ most iconic vampire - and delve into the deepest, darkest depths of Central European\
  \ history, and the sexual politics of Victorian London.  \n\n_______\n\nTwitter:\n\
  \n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\nProducers: Tabby Syrett, Theo\
  \ Young-Smith + Nicole Maslen\n\nExecutive Producers: Jack Davenport + Tony Pastor"
