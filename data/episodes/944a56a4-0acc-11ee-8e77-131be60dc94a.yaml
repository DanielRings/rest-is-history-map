title: 'The Trials of Oscar Wilde: Sex and Scandal (Ep 1)'
description: '“The truth is rarely pure and never simple.” As his most popular work,
  The Importance of Being Earnest, hints at, Oscar Wilde’s life was a complicated
  one. Perhaps the most famous gay martyr in history, Wilde is often presented as
  a sacrificial victim destroyed by a bigoted and puritanical establishment. But the
  story of how Wilde came to prominence, and eventually sued his lover’s father for
  libel, is one as surprising as it is complex. Join Tom and Dominic as they explore
  Oscar Wilde’s journey from the heights of brilliant success to the depths of notoriety
  and suffering.


