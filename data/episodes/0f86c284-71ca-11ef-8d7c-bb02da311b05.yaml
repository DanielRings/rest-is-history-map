title: 'Evita: The Mystery of the Missing Body (Part 5)'
description: 'After lying in state in an open casket, Evita’s corpse is taken down
  to a secret laboratory in the basement. And as the Argentinian Victor Frankenstein,
  Dr Ara, busily embalms her body, her ghost continues to haunt the nation. Sightings
  of her face are reported in obscure places all over the country.


  With Evita gone, Colonel Perón embarks upon an affair with a much younger girl and
  has a creepily paternal romantic relationship with her. Meanwhile, as Perón’s sparkle
  starts to fade amongst the public, Evita’s body vanishes…


  Listen as Dominic and Tom explore the final and most bizarre chapter in the extraordinary
  story of Evita Perón. 

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
