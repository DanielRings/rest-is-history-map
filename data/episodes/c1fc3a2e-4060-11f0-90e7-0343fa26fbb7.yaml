title: 'The Medici: Curse of the Mad Monk (Part 3)'
description: 'Did Lorenzo de’Medici’s rule in Florence incur prosperity, or was it
  a corrupt and autocratic regime, rife with torture, that would spell the doom of
  the former Republic? While building an edifice of power, wealth and luxury, how
  was he secretly bankrupting his famous family and city? Was he really the perfect
  Renaissance Prince, and how did he launch the careers of both Michaelangelo and
  Leonardo da Vinci? And, with poverty and riots on the streets of Florence, who was
  Girolamo Savonarola, the Dominican priest bent on destroying Lorenzo and his family,
  while predicting the apocalyptic end of the world…?


  Join Dominic and Tom as they chart the rise and fall of Lorenzo the Magnificent,
  the ruin of Florence, and the hellfire and brimstone priest, destined to set the
  world on fire.  






