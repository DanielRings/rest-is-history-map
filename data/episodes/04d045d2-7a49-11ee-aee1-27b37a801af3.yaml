title: 'The Fall of the Aztecs: Prisoners of Montezuma (Part 4)'
description: 'The year is 1519. Hernán Cortés and his Spanish comrades have arrived
  in Tenochtitlan, the capital city of the Aztecs, and have been welcomed by their
  Emperor Montezuma. But what is Montezuma planning? Are the Spaniards his guests
  - or his prisoners? Has he really acknowledged them as his overlords? Or are they
  destined for a rather darker fate, as the latest inmates in his mysterious zoo?


  In today’s episode, Tom and Dominic follow the Spaniards as they explore the magnificent
  city of Tenochtitlan, from the crowds in the markets to the blood-drenched shrines
  atop the temple pyramids.

   

  The days pass, the smiles fade and the tension rises. And then Cortés hears news
  from the coast that changes everything, and must roll the dice one more time in
  the greatest gamble of all …


  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


