title: 'The First World War: The Invasion of Belgium (Part 1)'
description: 'Following the declaration of war in 1914, how did the outbreak of the
  First World War unfold? What were the earliest military engagements of this terrible,
  totemic event? Who were its key political players and how did they respond? What
  was the attitude to the war in Germany? Were the allies unified from this early
  stage, or were they suspicious and frozen by indecision? And, how did the Germans,
  with the mightiest army in all the world, make its move on "plucky little" Belgium?


  Join Dominic and Tom as they launch into one of the most consequential events of
  all time: the outbreak of the First World War.




