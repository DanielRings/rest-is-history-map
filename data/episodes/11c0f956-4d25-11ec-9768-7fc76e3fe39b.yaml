title: Macbeth
description: 'Something wicked this way comes. Tom Holland and Dominic Sandbrook take
  a deep dive into the real history of Scotland’s most notorious king. Was he really
  the murderous man of Shakespeare’s writing? Plus the boys examine the play for its
  insight into the politics of the time in which it was written. And we discover Dominic’s
  missed vocation.


