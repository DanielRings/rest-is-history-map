title: 'Elizabeth I vs The Catholics: The Shadow War (Part 5)'
description: 'Who was the charismatic Sir Philip Sidney, a beloved but also suspect
  courtier to Elizabeth I? Why, in 1585, was England in such danger from a Spanish
  invasion? And, would Sydney, with his friend Sir Francis Drake, help to save their
  beloved queen?




  Join Tom and Dominic as they plunge into the high point of the Tudor Cold War: with
  Philip II brooding on war in Spain, Holland ablaze, and religious tension gripping
  Europe, what would Elizabeth I do?&nbsp;






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


