title: 'RIHC: The First World War: The Angels of Mons EXTRA'
description: 'During their retreat from the enormous German army in August 1914, was
  the comparatively tiny British Army really saved from annihilation by the miraculous
  appearance of angelic archers? What evidence is there for this story? Did the soldiers
  themselves attest to it? What were these archers said to look like? Was St George
  amongst them? How did the notion of a supernatural intervention such as this impact
  attitudes to the war in Britain, and among the Allies more broadly? What was it
  about the nature of the War by that time - with trench warfare established - that
  may have inspired the emergence of such an extraordinary story? Or, was it a side
  effect of early 20th century superstitions? Why did so many people believe it? Is
  there a rational explanation for the supernatural forces said to have descended
  to protect the British army during the Battle of Mons?  And, were they an inspiration
  for J.R.R Tolkien''s The Lord of the Rings?




  Join Tom and Dominic as they discuss the remarkable, supernatural Angels of Mons,
  and one of the strangest episodes  of the First World War... 


