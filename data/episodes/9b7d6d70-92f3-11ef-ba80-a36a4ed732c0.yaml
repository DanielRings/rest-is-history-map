title: 'America in ''68: George Wallace, The First Donald Trump (Part 4)'
description: '“Segregation now, segregation tomorrow, segregation forever!” 

  George Wallace, Governor of Alabama, was one of the most successful third-party
  presidential candidates in American history. In 1968, he ran a populist campaign
  pitching himself against the Civil Rights movement. He pushed to uphold formal structures
  of white supremacy in the South, forever employing racist dog whistles at his rallies
  and in the media. He may not have won the presidency, but his approach paved the
  way for a new, incendiary brand of politics, which permeates American society to
  this day...


  Join Dominic and Tom to discuss George Wallace’s 1968 campaign. They explore the
  legacy of his political career, how it shaped the modern Republican party, and why
  the Alabama Governor could be considered the precursor to Donald J. Trump.


