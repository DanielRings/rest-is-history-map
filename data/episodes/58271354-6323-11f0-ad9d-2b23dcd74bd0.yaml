title: 'Mary, Queen of Scots: The Mystery of the Exploding Mansion (Part 5)'
description: 'How and why was Mary Queen of Scots’ traitorous husband, Lord Darnley,
  murdered, and by whom…? Was Mary complicit? Why was his death one of the greatest
  mysteries in all British history? And, with Mary’s situation growing increasingly
  precarious, and allies few and far between, to whom would Mary turn next?




  Join Tom and Dominic as they unravel, tantalisingly, the build up to and enactment
  of Lord Darnley’s mysterious murder, in the next stage of the tumultuous life of
  Mary Queen of Scots. Were her hands red and dripping with the blood of her murdered
  husband?






