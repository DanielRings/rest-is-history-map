title: 'RIHC: Vikings, Last of the Mohicans, and Nuclear Ragnarök'
description: 'Did the Vikings ever come into contact with the Native Americans? What
  became of the Mohican tribe from the film, Last of the Mohicans? Are there parallels
  between the leaders of the Lakota Sioux during the American Indian Wars, and the
  leaders who rose up against Imperial Britain in India or Afghanistan? If Henry VIII
  had been granted a divorce by the Pope, would England have become protestant? How
  did the Nazis settle upon the term “Aryan” to describe their grotesquely idealised
  Germanic race? And, If the nuclear bomb had been available before 1945 when in the
  whole of world history might it have been used?

  Join Dominic and Tom for this week’s bonus episode, as they discuss some scintillating
  historical questions. 




