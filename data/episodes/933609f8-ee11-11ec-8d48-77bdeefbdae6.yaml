title: 'ARCHIVE: Watergate (Part 1)'
description: 'Watergate 50th Anniversary re-release:


  Last October we recorded a two part special on the remarkable political story which
  became known as Watergate.


  Today marks 50 years since the break-in at the Democratic headquarters in the Watergate
  building in Washington, D.C. - which marked the start of a scandal that would ultimately
  unseat US president Richard Nixon.


  So we thought we’d re-release our two episodes, largely for the benefit of the many
  new listeners who have been kind enough to subscribe to The Rest is History over
  the past eight or nine months and may have missed the shows first time round.


  That’s not to say our longer-standing listeners should ignore them, they certainly
  reward a second hearing.


  Enjoy the show.


