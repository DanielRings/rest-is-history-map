title: African Amazons
description: 'A story spanning modern-day Ghana, Angola, and Benin, historian Luke
  Pepera joins Tom and Dominic to discuss the tradition of African queens, female
  warriors, and military commanders. Through the lives of Queen Nzinga of Ndongo,
  the Dahomey warriors, and the Ashanti Queen mothers, our hosts look at how these
  figures interacted with their male counterparts, their subjects, and European colonisers.


