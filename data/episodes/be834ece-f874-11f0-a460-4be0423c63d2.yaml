title: 'RIHC: Ancient Iran, Cyrus the Great, and Persian Nationalism'
description: 'How was the dynasty of the last Shah of Iran, the Pahlavis, influenced
  by the mighty Persian kings of old? Which were the greatest of the old Iranian dynasties?
  And, how does the legacy of Iran’s deep history live on in the tumult of the Iranian
  Republic today? 




  In this week’s bonus episode, Tom is joined by historian and old friend of the show,
  Professor Ali Ansari, to discuss Iran’s deep history and its reverberations today.


