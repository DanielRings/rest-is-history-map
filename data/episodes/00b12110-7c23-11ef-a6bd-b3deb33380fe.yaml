title: 'The Roman Conquest of Britain: Boudicca’s Reign of Blood (Part 3)'
description: '“Two cities were sacked, eighty thousand of the Romans and of their
  allies perished, and the island was lost to Rome. Moreover, all this ruin was brought
  upon by a woman...”


  Few figures have statues dedicated to them in the towns they incinerated. But Boudicca
  was no ordinary figure. With a name that means “she who brings victory”, Boudicca
  was Rome’s supervillain. She was a freedom fighter who stood up to the greatest
  imperial power in the world. In 60 AD, Boudicca led her Iceni army to attack Colchester
  and London, cities left bare and vulnerable without fortifications. But the Romans
  would not accept such defeats without taking revenge…


  Join Tom and Dominic as they discuss the life of the first vivid personality in
  British history, a fierce tale of a warrior queen.


