title: 'The Road to The Great War: The Tsar Chooses War (Part 5)'
description: '“We have been forced to draw the sword”.

  Following the expiry of Austria’s Ultimatum on Saturday 25th July 1914, the Kaiser
  and the Tsar - friends and cousins, long desirous of peace between their two nations
  - found themselves in a new and highly precarious situation. Even so, there was
  still a widespread sense across Europe that war could be avoided, with Sir Edward
  Grey determined to mediate between Serbia, Russia, Austria and Germany. His efforts
  would be frustrated when, a month after the assassination, emperor Franz Joseph
  finally signed the declaration of war on Serbia. That same afternoon the power brokers
  of St. Petersburg were urging a reticent Tsar to declare war. Then, in the early
  hours of the following day, there was a mighty explosion outside Belgrade, where
  a contingent of Serbians, embroiled in the assassination of the Archduke, had blown
  up a major railway bridge connecting Belgrade to Austria. Following this, there
  emerged from the darkness three Austro-Hungarian warships, their sights set on revenge….

  Join Dominic and Tom as they describe the most dramatic day in the lead up to the
  First World War so far. With the world hovering on the edge of a gaping precipice,
  the British cabinet subsequently met again to discuss Germany’s next course of action,
  their thoughts inevitably turning to “plucky little Belgium”…

