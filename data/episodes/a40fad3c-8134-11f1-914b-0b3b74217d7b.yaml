title: Tom Holland Meets Tom Holland + The Odyssey Review
description: "How has Homer's work influenced contemporary storytelling? Why does\
  \ the character of Telemachus represent the reality of the Odyssey? And, in what\
  \ ways do Penelope's costumes convey her ever-lasting love for her husband Odysseus?\
  \ \n\n\n\nTom is joined by his namesake, the actor Tom Holland, to discuss Christopher\
  \ Nolan's The Odyssey , their interpretations, and some behind the scenes detail.\
  \ \n\n\n\n*The Rest Is History LIVE: The Ultimate Victorian Adventure*\n\n\n\nThe\
  \ maddest expedition in history and it’s NEVER been heard before on the show: join\
  \ Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers\
  \ story of Queen Victoria ordering one of history’s most daring assignments ever.&nbsp;Tickets\
  \ available for Friday 4th September, the Saturday show is SOLD OUT.\n\n\n\n_______\n\
