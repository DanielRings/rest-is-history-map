title: Our Greatest Prime Minister
description: 'In our last episode we debated the merits of British Prime Ministers
  through the centuries. But who was voted the best of all by the public and why?
  Dominic Sandbrook and Tom Holland discuss the men who made it through to the final
  stages of our Prime Ministers’ World Cup and analyse the public voting patterns
  which led to the final outcome.


