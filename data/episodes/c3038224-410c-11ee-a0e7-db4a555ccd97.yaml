title: 'RIHC: The Industrial Revolution, Anti-Catholicism, and Archaeology'
description: 'Did the French Revolution have a greater impact than the Industrial
  Revolution? Which historical sites would be most enticing for archaeologists to
  dig up? How has anti-catholicism informed both British and American politics? Why
  is History so “in” at the moment? Join Tom and Dominic in this week’s bonus episode,
  as they delve into these difficult topics, and many more.


