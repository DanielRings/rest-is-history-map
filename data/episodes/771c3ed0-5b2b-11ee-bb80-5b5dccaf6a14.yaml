title: The Birth of British Fascism (Ep 1)
description: 'The cultural roots of fascism swirled around Britain at the turn of
  the 20th century, as medieval nostalgia, an obsession with hygiene, anti-semitism,
  and concern for the environment grew in the wake of modern development. In the 1920s,
  Britain faced similarly tough conditions to the European countries where fascism
  did take hold: major economic difficulties, unpopular governments, and intense fears
  of Bolshevism. But did fascism ever really find an audience in Britain? Listen to
  the first episode of our series on British fascism, as Tom and Dominic delve into
  the roots of the ideology in Britain, before the emergence of Oswald Mosley…


