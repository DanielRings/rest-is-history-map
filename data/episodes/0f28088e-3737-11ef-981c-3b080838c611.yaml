title: 'The Murder of Franz Ferdinand: The Killer (Part 1)'
description: 'The assassination of Archduke Franz Ferdinand, heir to one of the world''s
  greatest empires, in June 1914, set in motion a series of events that would culminate
  in the First World War, where more than 15 million people would lose their lives.
  Franz Ferdinand''s assassin, Gavrilo Princip, did not share the same illustrious
  lineage. A Bosnian serb of humble origins who dreamed of a greater Yugoslavia, he
  was prepared to do anything to help advance his cause, and free his country from
  the clutches of the Austro-Hungarian Empire…


  Join Tom and Dominic in the first part of our series on history''s most consequential
  assassination, as they dive into rural Serbia, early 1900s Sarajevo, and the life
  of Gavrilo Princip, a boy who would join the Black Hand, a sinister, mysterious
  underground organisation, and sow the seeds of world war with two shots of his gun.


  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York.


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history''s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

