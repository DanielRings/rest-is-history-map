title: 'RIHC: Mesopotamian Mythology, Cyrus the Great, and The First Museum'
description: 'How much time did the Mesopotamians really spend waging war, and what
  evidence is there for this? Who was King Nabonidus, the last ruler of the Neo-Babylonian
  Empire, under whose kingship Babylon fell? How has cuneiform - an ancient wiring
  system dating back to the Bronze Age - altered the world, and the way that we understand
  the ancient past? Who was Lamashtu, the terrifying demon of Mesopotamia, who famously
  fed on the blood of human babies? What was Ennigaldi-Nanna’s museum - allegedly
  the oldest curation in history, and what was hidden there? And, who was Ennigaldi,
  the fascinating Mesopotamian princess who curated it?


  In this week’s bonus episode, Tom is joined by historian Moudhy Al-Rashid, author
  of the wonderful ‘Between Two Rivers’, to discuss the remarkable ancient history
  of Mesopotamia, and all the extraordinary treasures that remain from it.


