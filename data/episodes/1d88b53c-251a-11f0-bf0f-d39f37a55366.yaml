title: 'Peter the Great: Bloodbath in the Kremlin (Part 2)'
description: "What abominable mischief and hedonism did the seventeen year old Peter\
  \ the Great revel in during his strange and remarkable travels through Europe, before\
  \ truly stepping into the role of Tsar of all the Russias? Did it serve a secret\
  \ political purpose? What was the outcome of the first war he chose to wage against\
  \ the Ottoman Empire? Why did he go on a crucial and possibly dangerous diplomatic\
  \ mission disguised as a member of his own staff? And, when news reached him from\
  \ Russia, of a mutiny that directly challenged his rule, what gruesome revenge did\
  \ he wreak…?\n\n\n\nJoin Dominic and Tom as they discuss in lurid technicolour,\
  \ Peter the Great's early life and rule: his flamboyant \"gap year\" and foreign travels,\
  \ his early military conquests, his drastic reforms to Russia, and the outbreak\
  \ of the Great Northern War, which would see Europe transformed forever. \n\n\n\n\
