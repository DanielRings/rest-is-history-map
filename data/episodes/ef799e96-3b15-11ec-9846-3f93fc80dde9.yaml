title: Spies, with Ben MacIntyre
description: 'History is littered with stories of espionage and its capacity to change
  the course of events. But does spying truly matter and has the human operative finally
  been replaced by the computer?

  Ben MacIntyre, author of books including Agent Zigzag and The Spy and the Traitor,
  joins Tom Holland and Dominic Sandbrook to discuss the history of spying.



