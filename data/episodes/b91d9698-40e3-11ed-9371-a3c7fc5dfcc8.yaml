title: 'Young Churchill: Prisoner and Fugitive (Ep 3)'
description: 'In the final instalment of our series on Young Churchill, learn how
  Churchill escaped a prisoner of war camp in the Boer War, becoming an imperialist
  hero. Discover how Churchill sought shelter in rat infested hideaways, escaped in
  the tight consignment of a train, plus how the simple activity of a hair appointment
  almost blew his cover...


