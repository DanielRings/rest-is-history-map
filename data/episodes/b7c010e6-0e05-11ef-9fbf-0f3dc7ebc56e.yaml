title: 'Custer''s Last Stand: The Final Showdown (Part 8)'
description: 'What happened between the moment that George A. Custer dispatched a
  trumpeter with his famous final plea for back-up, and the gruesome discovery of
  his forces at the Little Bighorn? Certainly, the morning of the 26th of June 1876
  found the overwhelmed Major Reno and what remained of his men, along with Captain
  Benteen, gathered atop a hill, bloody, dehydrated, surrounding by putrefying corpses,
  and mystified as to the whereabouts of Custer. And the nightmarish ordeal of Reno''s
  clash with the Lakota and their allies was not yet over. Gunfire, carbines and the
  whiz of arrows echoed in the distance, while below them fearsome Lakota warriors
  were unnervingly draped in the bloodied jackets and hats of Custer’s 7th Cavalry.
  Finally, at 3pm, the vast encampment of Lakota began moving off, and at dawn the
  next day they glimpsed a dust cloud in the distance: reinforcements at last. What
  they saw upon finally descending the hill, was a scene of such horror, that it would
  resound through the ages…


  Join Dominic and Tom as they describe, moment by moment, the events of George Custer’s
  electrifying last stand at the Battle of the Little Bighorn, and its aftermath.
  What really happened, and what became of Custer, Crazy Horse and Sitting Bull? Above
  all, who was to blame for the events of that shocking day?


