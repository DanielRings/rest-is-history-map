title: 'The Fall of the Incas: Battle for the Sacred City (Part 5)'
description: 'Three years into the conquest of the Incas, how did the Spaniards respond
  to the Incan uprising, lead by their puppet emperor Manco? How did the despicable
  behaviour of Pizarro and his men spark the rebellion? And, how would the terrifying
  assault of Manco and his Incan warriors, on a stranded contingent of Spaniards,
  play out…? 




  Join Dominic and Tom, as they reach the thrilling climax of this tragic, dramatic
  tale of death, conquest and betrayal…  




