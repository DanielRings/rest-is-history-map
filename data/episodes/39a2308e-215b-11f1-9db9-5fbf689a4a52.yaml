title: 'The Ku Klux Klan: Birth of a Nation (Part 3)'
description: 'How did the second incarnation of the clan, born in Georgia in 1915,
  grow into a seemingly indomitable nation-wide fraternal organisation, numbering
  millions? Who were its new targets? And, with the Klan’s momentum seemingly unstoppable
  and an election on the horizon, would their appalling violence be publicly condemned?




  Join Tom and Dominic as they chart the second rise of the violent, tyrannical, Ku
  Klux Klan….




