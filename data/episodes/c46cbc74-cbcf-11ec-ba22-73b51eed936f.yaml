title: Operation Barbarossa
description: 'What military parallels does Putin''s invasion of Ukraine have with
  Hitler''s attempt to invade the Soviet Union?


  On today''s pod Tom and Dominic are joined by historian - and brother of Tom - James
  Holland to discuss Operation Barbarossa and the Nazi invasion of 1941, whether it
  was doomed to fail, and the role it played in the escalation of the Holocaust.


  If you enjoy this episode, be sure to listen to our sister podcast, We Have Ways
  Of Making You Talk, and check out their Second World War festival that''s taking
  place in July by going to wehavewaysfest.co.uk


