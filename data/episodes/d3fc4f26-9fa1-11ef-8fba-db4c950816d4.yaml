title: 'RIHC: Jane Austen, Smugglers, and the Napoleonic Wars'
description: 'What was Jane Austen’s experience of the Napoleonic Wars? How militarised
  was Britain during this time? Were people really press ganged into the British navy?
  How did the wars change the British population? What impact did they have upon the
  rise of both romanticism and industrialisation? How are they reflected in the paintings
  of William Turner? And, was this really the age of smuggling?


  In this week’s bonus episode, with Dominic away, Tom is joined by renowned historian
  Jenny Uglow to discuss what it was like to live through the Napoleonic Wars in Britain.  


