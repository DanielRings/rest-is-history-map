title: Saint Patrick
description: 'Happy St. Patrick''s Day! 


  No, Tom isn''t turning Brixton''s River Effra green, nor is Dominic distributing
  shamrocks throughout the Oxfordshire countryside, but they''re here anyway with
  a very special pod on the mysterious Apostle of Ireland. 


  When was St. Patrick alive? Where was he really born? Why was he kidnapped by pirates?
  And did he really banish the snakes from Ireland?


  All this and more on today''s episode of The Rest Is History.


