title: 'The Assassination of Abraham Lincoln: Manhunt for the Killer (Part 2)'
description: 'How was President Abraham Lincoln murdered on Good Friday 1865, at Ford’s
  Theatre, just five days after Robert E. Lee’s surrender? Who was John Wilkes Booth,
  the racist actor with southern sympathies, who assassinated him? How did he escape
  before the shocked eyes of the packed theatre, and evade his captors to go on the
  run? Would they get him in the end? And, what were the long term repercussions of
  Lincoln’s assassination for the future of race relations in the USA?


  Join Dominic and Tom as they discuss, in remarkable detail, the assassination of
  Abraham Lincoln, the man who did it, and the thrilling manhunt that ensued, the
  impact of Lincoln’s death upon the future of America. 


