title: 'RIHC: In-flight entertainment, Harry Potter, and tales from D.C.'
description: 'Coming to you this week from Washington D.C., Tom and Dominic answer
  more of your questions. What would have happened to the world if Napoleon died in
  1800? What lost ancient literature would the boys love to get their hands on? Plus:
  negotiations begin over Harry Potter and Gregory the 7th... All this and more in
  this week''s The Rest Is History Club''s bonus episode.


  *The Rest Is History Live Tour 2023*:

  Tom and Dominic are back on tour this autumn! See them live in London, New Zealand,
  and Australia!


