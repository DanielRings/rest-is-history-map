title: 'RIHC: Historical Vampires, Watergate, and Ancient Scriptures'
description: 'Which historical act of censorship was the most effective? If he was
  Nixon’s advisor, how would Dominic have handled Watergate? Who are history’s likeliest
  vampires? Which historical figures would Tom and Dominic most enjoy being haunted
  by? Is there a lost ancient text that Tom dreams of discovering? 

  Join Tom and Dominic in this week’s bonus episode as they answer some of history’s
  most intriguing questions. 


