title: 'RIHC: Gold Rushes, The Flying Dutchman, and Obama vs Trump'
description: 'Was the English Reformation a success? What is more important in a political
  leader: first class intellect, or first class temperament? Which mountain produced
  60% of all silver mined in the 16th century? What would have happened if Henry VIII’s
  son Edward hadn’t died so young? Which historical movies would our presenters recommend?
  In this week’s bonus episode, Tom and Dominic delve into these difficult topics,
  and many more…


