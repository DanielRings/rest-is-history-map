title: 'RIHC: Tudor Executions, The Hobbit and Sexuality Through The Ages'
description: 'Was the battle of Trafalgar crucial to the success of the anti-slavery
  movement? What were attitudes to homosexuality like during Lord Byron’s own lifetime?
  Was homosexuality considered a ‘vice’ that was implicitly accepted by the privileged
  classes, but morally unacceptable to the general population of the 18th and early
  19th centuries? How common were male and female homosexual relationships behind
  the scenes? What is History’s most important boat? Would Tom rather find a dinosaur
  egg or score a century at Lords''? And, would Dominic prefer Wolves to win the premiership
  or to be asked to star as Bilbo Baggins in The Hobbit? 

  Join Tom and Dominic for this week’s bonus episode as they answer some fascinating
  historical questions. 



  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London!


