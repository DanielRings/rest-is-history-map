title: 'The Murder of Franz Ferdinand: The Conspiracy (Part 2)'
description: 'Gavrilo Princip, having been sent to school in Sarajevo, has become
  mixed up with the wrong crowd, and is now entangled in a secret Serbian nationalist
  organisation, the Black Hand. Hoping to be more involved in the struggle for a greater
  Yugoslavia, he’s left for Belgrade, and after a few years, sets in motion a plot,
  supported by his underground network. The Austro-Hungarian emperor is on his deathbed,
  and now is the perfect time to eliminate his heir, Franz Ferdinand, and spread chaos
  across the Balkans…


  Join Tom and Dominic in the second part of our series on the murder that sent shockwaves
  through the world, as they look at the simmering tensions in the Balkans and the
  wider Habsburg Empire, the various nefarious groups conspiring for power and revolution,
  and the young man at the heart of it all.


  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


