title: 'RIHC: The Road to the Great War EXTRA'
description: 'Was the outbreak of the First World War inevitable or might it have
  been avoided had Franz Ferdinand never been assassinated? Were any of the global
  powers involved more or less guilty for the outbreak of the war than any other?
  If so, which ones? Which country had the most to lose as a result of the war? Could
  Britain have remained neutral? And if so, should she have? 

  Join Dominic and Tom for this week’s bonus episode, as, off the back of their recent
  series on The Road to War, they delve deeper into the outbreak of the First World
  War, and the way that it has been understood historically, as well as debating some
  intriguing counterfactuals... 

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

