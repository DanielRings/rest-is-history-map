title: 'RIHC: Dickens’ eulogy, Boris in a toga, and Indiana Jones'
description: 'What is the correct way to pronounce Æthelstan? If Nixon''s cover-up
  had worked, would Carter or Reagan ever go on to be president? Which historical
  figure has suffered the most unfair treatment in the court of public opinion? Why
  is Dominic so against recording an episode on the revolutionary Pope Gregory VII?
  And under what circumstances did Tom first meet Boris Johnson, the latter wearing
  a toga? In this week’s bonus episode, Tom and Dominic delve into these challenging
  topics, and many more.


