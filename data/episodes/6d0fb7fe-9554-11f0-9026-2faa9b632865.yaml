title: 'Greek Myths: Sex, Drugs & Tragedy (Part 3)'
description: "Who was Dionysus, the son of Zeus, and Greek god of ecstasy, revelry\
  \ and madness? Why was he so central to the ancient Greeks? What is the story of\
  \ the Bacchae, the play in which a young man is ripped apart by the handmaidens\
  \ of the goddess Artemis? What did it mean to be a Bacchae, one of the followers\
  \ of Dionysus, and what shocking acts did it entail? Why were female cults like\
  \ this believed to be integral to the survival of Athens? How did Dionysus’ cult\
  \ subvert all the conventions of Ancient Greek society? What hedonistic revels occurred\
  \ at his festivals every year? And, what hidden secrets about his historical origins\
  \ have been unlocked by subsequent archaeological discoveries…?\n\n\n\nJoin Tom\
  \ and Dominic as they discuss one of the most exotic and erotic of the Greek gods:\
  \ Dionysus, and the origins of The Bacchae, the tragedy that immortalised his story,\
  \ but also transformed Greek drama, and thereby the world, forever…\n\n\n\n\n\n\
