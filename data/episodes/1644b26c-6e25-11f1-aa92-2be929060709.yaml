title: Brazilian Dictators and the Beautiful Game | History of the World Cup
description: "Why did the Brazilians come to see football as a symbol of their fragmented\
  \ national identity, rather than the British import it was? How did the military\
  \ dictatorship militarise the 1970 World Cup victory? And, in what ways did stars\
  \ like Reinaldo and Sócrates use their platforms to actively defy the authoritarian\
  \ government?\n\nIn this brand new The Rest Is History Club mini series, Dominic\
  \ is joined by Paul Rouse to talk about dictatorships’ connections to FIFA World\
  \ Cups. \n\n_______\n\nEver wanted to know what Nelson would've worn had he and\
  \ his Navy played against Curacao in Kansas City? Well here it is. Buy the kits\
  \ of historical figures as if they were playing in this World Cup. \n\nBuy your\
  \ historical football shirts at https://therestishistory.com\n\n_______\n\nTwitter:\n\
  \n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\nVideo Editors: Jack Meek, Harry\
  \ Swan + Adam Thornton\n\nSocial Producer: Harry Balden\n\nProducers: Tabby Syrett\
  \ & Aaliyah Akude\n\nSenior Producer: Callum Hill\n\nExecutive Producer: Dom Johnson"
