title: The Man Who Escaped Auschwitz (Ep 1)
description: 'Tom and Dominic are joined by Jonathan Freedland to discuss the incredible
  story of Rudolf Vrba and Alfréd Wetzler, who escaped from Auschwitz in April 1944.


  *The Rest Is History Live Tour April 2023*:

  Tom and Dominic are going on tour in April 2023 and performing in London, Edinburgh,
  and Salford! Buy your tickets here:

  https://robomagiclive.com/the-rest-is-history/


  Jonathan''s book, The Escape Artist, was published in June 2022 and is available
  to buy from all good bookshops.


