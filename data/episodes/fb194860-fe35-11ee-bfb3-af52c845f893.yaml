title: The First Emperor of China
description: '"The First Emperor will die and his land will be divided….”

  The First Emperor of China, Qin Shi Huang, left behind him a monumental legacy:
  an Empire which would last millennia, the foundations of the Great Wall of China,
  and an eerie Terracotta Army - 8000 warriors who would protect the Emperor in the
  afterlife. His deeply autocratic reign, and the brutal tactics he used to conquer
  rival states and establish the Chinese Empire, have seen him cast as the archetype
  of the “bad emperor”. And when compared with Qin Shi Huang, Mao boasted that “when
  you berate us for imitating his despotism, we are happy to agree!”. But was Chinese
  unification under one empire inevitable, or did it need a ruthless figure to centralise
  power? And to what terrifying lengths did the first Emperor go to secure immortality…?


  Join Tom and Dominic as they discuss the fantastical First Emperor of China - one
  of the world’s most powerful and formidable rulers. From warring kingdoms and ruthless
  suppressions, to necromancy, mythical beasts, doom-ridden prophecies, and even 20th
  century Chinese Communism. 






