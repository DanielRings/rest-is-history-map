title: 'JFK: The Mystery is Solved (Part 7)'
description: 'On the 27th of September 1964 the Warren Commission, established by
  President Lyndon B. Johnson a year earlier to investigate the assassination of President
  Kennedy, concluded that he had been killed by Lee Harvey Oswald, acting entirely
  alone. But who was Lee Harvey Oswald? And why, if at all, might he have wanted Kennedy
  dead?  


  Born in Louisiana in 1939, Oswald was a bitter loner with communist inclinations
  and an overactive sense of his own destiny. During the course of his life before
  the arrest, Oswald joined the Marines, defected to and from Russia, and caught the
  attention of both the CIA and the KGB… 


  Join Tom and Dominic for the grand finale of their investigation into the assassination
  of JFK, where they give their verdict on this murkiest of mysteries. And, by delving
  into the past, politics and personality of his alleged murderer, conclusively reveal
  whether Lee Harvey Oswald did in fact kill President Kennedy.



  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


