title: '1922: The Birth of the Modern World Part 2'
description: 'In part 2 of this centennial episode, Tom and Dominic cover the triggering
  of the Irish Civil War, the birth of the BBC, and Howard Carter''s ''Tutmania''. 


  Plus, have you ever wondered how many stars Dominic''s 1995 Edinburgh Fringe performance
  of Becket REALLY received from The Scotsman? Featuring appearances from Winston
  Churchill, Michael Collins and Just William, this podcast is not to be missed! 


