title: 'The Taj Mahal: Love and Death'
description: '“The mutual affection and harmony between the two had reached a degree
  never seen between a husband and wife…” The Taj Mahal, built by the Mughal Emperor
  Shah Jahan as a mausoleum for his wife Mumtaz Mahal, tells the story of the imperial
  power and strength of the Mughal Empire, and remains to this day a symbol of perfection,
  refinement and romance. Tom and Dominic are joined by art historian Dr Mehreen Chida-Razvi,
  as they delve into the origins of the Taj Mahal, the empire behind it, and its cultural
  and political significance throughout the centuries.


