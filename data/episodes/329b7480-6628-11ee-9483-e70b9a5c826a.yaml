title: 'Baghdad: The Forging of Islam (Ep 1)'
description: 'A story of great myth and of huge historical significance, the foundation
  of Baghdad is a fundamental episode in the development of Islam. The Umayyad Caliphate,
  the first great Islamic empire, stretched from the Atlantic Ocean to the borders
  of China; no dynasty had ever presided over a greater array of conquests. But amongst
  growing sectarian and internal divisions, discontent on the fringes of the caliphate,
  and the emergence of influential religious scholars, the Umayyads are challenged
  by a new power, which pretends to restore Muhammad’s bloodline to rule over Islam.
  In the first part of our series on the history of Baghdad, Tom and Dominic tell
  the story of the founders of the city, the Abbasids, and delve into the roots of
  the revolution that saw them overthrow the Umayyad Caliphate…


