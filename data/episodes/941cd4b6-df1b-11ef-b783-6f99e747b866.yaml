title: 'RIHC: Nazi Collaborators, the Kaiser, and Assassinating Hitler'
description: 'What became of the Kaiser after Germany lost the Second World War? Who
  was his family, the Hohenzollerns, and why did they vanish from the historical record
  following his fall from power? Was the Kaiser hoping, even in exile, for his own
  restoration? How much popular support would there have been under the Weimar Republic
  for him to retake the throne? Who joined him in exile? Who did he blame for Germany’s
  defeat during The War, and was he embittered by it? Why was his son, the Crown Prince
  Wilhelm, such a disreputable figure? How close did he come to taking the throne
  himself? What was his involvement with the Nazis? Was the Kaiser himself a Nazi
  sympathiser? How did his family collaborate with the Nazis? And, what was Hitler’s
  attitude to the Kaiser and the Hohenzollerns?  

  In this week’s bonus episode, Dominic is joined by historian and author of ''The
  Hohenzollerns and the Nazis'', Stephan Malinowski, to discuss the Kaiser, his forgotten
  life after the First World War and during the Second World War, and his controversial
  family’s collaboration with the Nazis. 

