title: 'The Irish War of Independence: The Violence Begins (Part 2)'
description: 'What was Sinn Féin’s totemic first move after winning a majority seat
  in 1917? Were the IRA’s methods during this early stages of the war as violent as
  they are commonly believed to have been? How sectarian was the IRA? What crucial
  strategy did the Irish adopt in order to overwhelm English efforts to re-establish
  control in Ireland? As a victor of the First World War, was Ireland’s struggle for
  independence unique amongst the revolutions and changing fortunes of other nations
  during the post war years? And, what enabled the famous Michael Collins to attain
  a great leadership role in Irish politics?  


  In today’s episode on some of the seismic moments of the Irish War of Independence
  and the rising tide of bloodshed and violence, Tom and Dominic are joined again
  by historian Paul Rouse. Extraordinary revolutionary leaders, post war politics,
  and the crucial role of women in this seminal struggle, all feature…


