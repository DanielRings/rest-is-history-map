title: 'Mary, Queen of Scots: Downfall (Part 6)'
description: "Following the murder of her husband, Lord Darnley, how did Mary Queen\
  \ of Scots - thought to have conspired for his death - navigate the most precarious\
  \ situation of her young life so far? Would she marry again, and if so whom? Why\
  \ was she forced to flee her enemies dressed as a man, and would she escape the\
  \ threat of imprisonment? Could she look to her fellow cousin, Elizabeth I, for\
  \ aid, or face the  Virgin Queen’s condemnation? And, would she come out from these\
  \ tumultuous events a queen and unscathed, or dethroned, and traumatised for life?\n\
  \n\n\nJoin Tom and Dominic as they reach the dramatic climax of their journey through\
  \ the reign of Mary Queen of Scots, as steps into the hands of Elizabeth I and her\
  \ spymasters. Would this most brave and belligerent, but now beleaguered of women,\
  \ survive the most perilous period of her life?\n\n\n\n\n\nThe Rest Is History Club:\
