title: 'Alfred the Great: Fury of the Vikings (Ep 1)'
description: 'Alfred the Great is under invasion from the Vikings.


  Join Tom and Dominic as they discuss Alfred''s anointment by the Pope in Rome, his
  duality as both a fearsome warrior and a man of poetry, plus his unbelievable escape
  from a Christmas ambush from Viking invaders.


  Dominic''s book, ''Adventures in Time: Fury of the Vikings'', is available to buy
  now in all good bookshops.


