title: 'Britain in 1974: The Crisis Election (Part 2)'
description: 'Three days after one of the most devastating IRA attacks launched upon
  British soil, the Conservative Prime Minister Edward Heath called an election, in
  circumstances that had never been more dire. Running against him was the veteran
  Labour leader, Harold Wilson, now as tired and beleaguered as his rival, and whose
  party was increasingly divided by internal conflict. Jeremy Thorpe, the charming
  but reckless leader of the liberal party had also thrown his hat into the ring.
  As the election drew closer, the parties were neck and neck, and with the sense
  of national hysteria and economic chaos rising, escalated by a baying press and
  the likes of Enoch Powell, the stakes had never been higher. Could the longstanding
  Labour and Conservative duopoly finally be broken? 

  Join Dominic and Tom for the second part of their series on 1974, one of the most
  disastrous years in British history, as they discuss the terrible circumstances
  surrounding the seismic February election, and its momentous outcome. 


    


