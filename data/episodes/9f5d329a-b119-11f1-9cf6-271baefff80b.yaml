title: 'The Terror: The Fall of Robespierre (Part 6)'
description: 'Why did the Terror reach unprecedented levels of bloodshed in 1794?
  Who was running France by this point? And, how was Robespierre finally destroyed,
  and dragged to the guillotine by his former allies…?&nbsp;&nbsp;




  Join Dominic and Tom as they reach the terrifying, climactic conclusion to their
  series on the Terror, as well as the French Revolution, with the gory execution
  of one of its most infamous players: Maximilien Robespierre.&nbsp;


