title: 'Dynasty: The Rise and Fall of the House of Caesar (Extract)'
description: 'To coincide with the re-release of Dynasty in audiobook, now with Tom
  Holland himself narrating, we have the book’s introduction for you to enjoy.

   

  Dynasty, the sequel to Rubicon, is a dazzling portrait of Rome''s first imperial
  dynasty, tracing the full astonishing story of its rule of the world. Ranging from
  the great capital rebuilt in marble by Augustus to the dank and barbarian-haunted
  forests of Germany, it is populated by a spectacular cast: murderers and metrosexuals,
  adulterers and druids, scheming grandmothers and reluctant gladiators.

   

  Dynasty’s re-released audiobook, narrated by our very own Tom Holland, is OUT NOW
  in the UK.

  _____


  Dynasty continues Rubicon''s story, opening where that book ended: with the murder
  of Julius Caesar. This is the period of the first and perhaps greatest Roman Emperors
  and it''s a colorful story of rule and ruination, running from the rise of Augustus
  through to the death of Nero. Holland''s expansive history also has distinct shades
  of I Claudius, with five wonderfully vivid (and in three cases, thoroughly depraved)
  Emperors—Augustus, Tiberius, Caligula, Claudius, and Nero—featured, along with numerous
  fascinating secondary characters. Intrigue, murder, naked ambition and treachery,
  greed, gluttony, lust, incest, pageantry, decadence—the tale of these five Caesars
  continues to cast a mesmerizing spell across the millennia.


  _______


  *The Rest Is History LIVE in the U.S.A.*


  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*


  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

