title: 'Ireland: Union, Famine and Parnell (Ep 2)'
description: 'At the start of the 19th century, the kingdoms of Britain and Ireland
  were officially ''united'' with the Acts of Union. Historian Paul Rouse continues
  our sweep through the Anglo-Irish relationship, including the Great Famine and the
  political battles both for and against Home Rule.

  Tom, Dominic and Paul recorded this episode in the iconic General Post Office on
  O’Connell Street in Dublin.


