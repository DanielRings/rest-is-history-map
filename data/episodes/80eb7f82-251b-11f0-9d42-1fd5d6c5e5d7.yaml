title: 'The Great Northern War: Murder in Moscow (Part 4)'
description: "What were the consequences of Peter the Great’s mighty victory over\
  \ Sweden at the Battle of Poltova in 1707? How great was the impact of his reign\
  \ upon Russia overall, and was he responsible for turning it into one of Europe’s\
  \ greatest powers? What occurred during the later years of his life? And, what is\
  \ the story behind his bloody, terrible and tragic treatment of his son, Alexis…?\n\
  \nJoin Dominic and Tom for the mighty conclusion of their series on one of history’s\
  \ most remarkable characters: Peter the Great. The ramifications of his reign for\
  \ Russia, his ghastly dealings with his own family, and the end of his colourful\
  \ life. \n\n\n\n\n\nThe Rest Is History Club: Become a member for exclusive bonus\
  \ content, early access to full series and live show tickets, ad-free listening,\
  \ our exclusive newsletter, discount book prices on titles mentioned on the pod,\
