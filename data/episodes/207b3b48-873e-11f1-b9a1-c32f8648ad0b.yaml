title: 'Elizabeth I vs The Catholics: A Massacre in Paris (Part 2)'
description: 'What inspired the deadliest bloodbath of the Tudor age: the St Bartholomew’s
  Day Massacre of 1572, in which protestants were slaughtered en masse? How did it
  drive Elizabeth I’s spy master, Francis Walsingham, to repress all treasonous activity
  in her realm? And, what terrible treason was brewing in Rome…?&nbsp;&nbsp;




  Join Tom and Dominic as they discuss the St Bartholomew’s Day Massacre, Sir Francis
  Walsingham, and one of the most devilish religious conspiracies of all time…






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


