title: The Architect of Modern China
description: '“Let us advance courageously, to change the backward condition of our
  country, and turn it into a modern and powerful socialist state!” Deng Xiaoping,
  a man purged by Mao and his followers twice before becoming leader of China, paved
  the way for a modern Chinese state and economy, opening the country up to foreign
  investment and technology, whilst maintaining firm control of the Chinese Communist
  Party. In today’s episode, Tom and Dominic are joined by Friend of the Show Professor
  Rana Mitter, as they look at how China transitioned into the global economic and
  political powerhouse it is today, Deng Xiaoping’s role in transforming the country,
  and, of course, Wham! and their 1985 visit…



