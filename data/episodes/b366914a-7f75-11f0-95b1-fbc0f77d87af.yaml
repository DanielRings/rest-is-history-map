title: 'The First World War: Downfall of the Habsburgs (Part 6)'
description: 'After endeavouring to wreak their revenge on Serbia, what would be the
  greatest hammer blow to the Austro-Hungarian Empire during the First World War?
  With Leviv having fallen apocalyptically to the Russian hordes, what had gone so
  wrong? How might the war have been brought to an end before Christmas of 1914? And,
  with the darkness gathering around the Austrian defences, could the great fortress
  of Przemyśl hold out against the Russian barrage for a second time…?


  Join Dominic and Tom as they discuss the fall of the Austro-Hungarian Empire and
  the Russian advance, on the brutal Eastern front, as the first year of the First
  World War grinds bloodily on…






