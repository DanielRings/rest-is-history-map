title: Viking Sorcery
description: 'Warning! This one isn''t for the faint-hearted… A naked, torch-carrying
  man, who would walk backwards around a funeral pyre, with his fingers covering his
  anus. The armed woman who worked a loom made from human body parts. 6-legged reindeers.
  Slaves buried alive with their owners, tapestries woven of human flesh, and rituals
  with horse penises. Tom and Dominic, in one of the most eagerly-awaited The Rest
  Is History episodes of all time, are joined by archaeologist Neil Price, as they
  delve into the strange and gruesome world of Viking Sorcery.


