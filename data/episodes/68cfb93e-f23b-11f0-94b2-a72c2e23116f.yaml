title: 'Revolution in Iran: The Hostage Crisis (Part 3)'
description: "Why and how was the American Embassy stormed in 1979, at the height\
  \ of the Iranian Revolution? Did America respond when large numbers of American\
  \ civil servants were taken hostage? And, would a science fiction film called Argo\
  \ save the only 6 Americans able to escape…? \n\n\n\nJoin Dominic and Tom, as they\
  \ discuss the defining event of the Iranian Revolution: the invasion of the American\
  \ Embassy on the 4th of November 1979, when American citizens were taken hostage\
  \ in Tehran…\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\
