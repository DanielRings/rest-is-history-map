title: The Triumph of George Washington (Part 4)
description: 'With the French and Spanish siding with George Washington’s revolutionaries,
  the game is up for the British, and it seems time for them to cut their losses.
  Following the surrender of General Cornwallis at Yorktown, the war is effectively
  over, but what are the short and long term consequences of this? In our final episode
  on the American revolution, Tom, Dominic and Professor Adam Smith look at the end
  of the war, the subsequent Treaty of Paris, and the broader question of how the
  revolution shaped the United States and the future of its people.


