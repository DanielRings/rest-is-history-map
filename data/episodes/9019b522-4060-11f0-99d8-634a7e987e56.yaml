title: 'The Medici: Lorenzo the Magnificent (Part 2)'
description: 'Who was Lorenzo the Magnificent, the most glamorous, glittering, and
  blood-soaked of all the Medici, who became his family’s formidable but compulsive
  “Godfather” from the age of only twenty one? What was the Pazzi Conspiracy, in which
  he was almost murdered in a bloody plot to eliminate Medici supremacy in Florence,
  in the middle of a church mass? Was the rise and sway of the Medici in Florence
  during this period the birth of mafia politics in Italy? What influence did Lorenzo
  have upon the Renaissance? And, what would become of the Medici, with conspirators
  circling, the Papacy against them, and their bank coffers draining away? 


  Join Dominic and Tom as they dive into the colourful, salacious and politically
  tumultuous early life of one of Europe’s most charming and charismatic figures:
  Lorenzo the Magnificent. Could he remain Prince of Florence, and save his beloved
  city, against all the odds? 






