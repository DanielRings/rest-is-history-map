title: 'RIHC: Trump’s Election Victory, Spectacular Battlefields, and Star Wars'
description: 'How historically seismic is the recent American election? What will
  be the consequences of Trump’s victory for the future of the U.S.A? Were the 1990’s
  more of a turning point in American politics than the 1960’s? When did political
  journalism lose its impartiality? How will the last ten years of American politics
  be written about by future historians? Are there similarities between George Wallace
  in the U.S and Enoch Powell in the UK? And, what have been Tom and Dominic’s best
  historical insights over the last four years of doing The Rest is History?

  In this week’s bonus episode, Tom and Dominic are reunited at last to discuss their
  U.S. tour, the history of American politics, the recent election result, and top
  British battle sites. 


  _______


