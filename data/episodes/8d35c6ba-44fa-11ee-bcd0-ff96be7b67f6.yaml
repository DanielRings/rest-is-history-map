title: 'Sixties Fashion: The Teenage Revolution (Ep 1)'
description: 'The Sixties is one of the only moments in history when Britain could
  claim to be the epicentre of world fashion, and in this episode Tom and Dominic
  delve into this cultural boom, from the boxy, militaristic styles of the 1940s,
  when fabrics, designs and even the Queen’s wedding dress were limited by post-war
  restrictions, to the greasy haired Edwardian Teddy Boys of the early 1950’s, and
  the warring Mods and Rockers that followed. Then came the 60’s, full of child-like
  designs, colour supplements, rockstar photographers, and their “groovy” models.
  Join Tom and Dominic as they explore why the trends of the Sixties were so androgynous,
  who really invented the mini-skirt, and why Jean Shrimpton was paid £4,000 to go
  to Australia…


