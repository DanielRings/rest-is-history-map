title: 'RIHC: Disney at War'
description: 'Who is the most terrifying villain in any Disney film? How were Disney’s
  jolly fantasy films received by the America of the Great Depression? Which dark
  tales were iconic early Disney movies such as Pinocchio and Snow White based on?
  And, how did Disney respond to the coming of the Second World War…?




  In this week’s bonus episode, Tom and Dominic delve deeper into the life of Walt
  Disney, and the golden age of Disney movies.




