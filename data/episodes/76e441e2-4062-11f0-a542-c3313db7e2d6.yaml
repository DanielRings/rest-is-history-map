title: 'The Medici: The Bonfire of the Vanities (Part 4)'
description: 'Following the death of Lorenzo the Magnificent, who was his Medici successor?
  Could he overcome the political turmoil and religious fervour in Florence, and rebuff
  the stormclouds of war gathering over his city with the approaching French army?
  How did this burgeoning catastrophe catapult the magnetic priest, Savonalrolla,
  to supreme power in Florence? Could he save it from the jaws of death with his fiercely
  puritanical regime? And, how would he become the bane of the Medici and destroy
  all they had ever built, in a roaring bonfire of worldly vanities? 


  Join Dominic and Tom for the climactic apotheosis of their glittering, dramatic,
  salacious and utterly bombastic journey through the rise and fall of the flamboyant
  Medici at the high point of Renaissance Florence, and the charismatic priest who
  would save and then conquer their kingdom. What would be his fate…?






