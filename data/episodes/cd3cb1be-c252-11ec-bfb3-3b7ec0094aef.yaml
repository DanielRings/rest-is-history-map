title: 'French Presidents: 1958-1981'
description: 'It''s the day after the French election runoff between Emmanuel Macron
  and Marine Le Pen, so naturally here''s a Rest Is History French Presidents special.


  Charles de Gaulle, Georges Pompidou, and Valéry Giscard d''Estaing. Join Tom and
  Dominic for the first of two episodes on the topic, as they dive headfirst into
  the first three post-war presidents. 


  Join us for the second part of this special double-bill, where we''ll cover the
  remaining historical residents of the Élysée Palace.


  Producer: Dom Johnson

  Exec Producer: Tony Pastor


