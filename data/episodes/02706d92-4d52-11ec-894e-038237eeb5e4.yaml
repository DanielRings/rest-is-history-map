title: Modern Olympics - Part 1
description: 'In 1896 the Olympic Games were reborn in Athens. Here we look at the
  forgotten tales and little known facts from the start of the modern Olympics through
  to the outbreak of the Second World War.


  Tom tells us about the greatest race of all time, whilst Dominic reveals he is somewhat
  of an Olympics sceptic.


