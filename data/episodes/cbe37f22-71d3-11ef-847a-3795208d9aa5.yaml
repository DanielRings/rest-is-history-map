title: 'Evita: The World’s Most Powerful Woman (Part 3)'
description: '“There is only one man who can lead any worker’s regime.”


  Together, Eva and Colonel Perón built a political movement powered by operatic rhetoric.
  Perónism promised genuine benefits for the working class, denouncing violence and
  emphasising ritual and spectacle. Eva embodied the working-class migrant to Buenos
  Aires that Perón sought to attract, and she increasingly entered the role of his
  partner both at home and in government. 


  Ostentatiously flamboyant in her dress sense, how did Evita become a woman of the
  people who also wore Christian Dior?


  Listen as Tom and Dominic unpack how Eva became Evita, the most powerful woman in
  global politics.

