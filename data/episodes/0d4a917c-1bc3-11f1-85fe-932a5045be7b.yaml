title: 'RIHC: The Odyssey,  Ancient Greek Wars, and Ottoman Invasions'
description: 'How does the island of Corfu feature in Homer''s ''The Odyssey''? In what
  way did Corfu feature during the bloody Peloponnesian War of the 5th century BC?
  And, what was the Kaiser''s involvement in Corfu?




  In this week''s bonus episode, Tom is joined by historian Alex Preston to discuss
  the thrilling history of Corfu.




  To find out more information about Corfu Literary Festival, go to: https://www.corfuliteraryfestival.com/


