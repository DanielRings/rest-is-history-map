title: 'RIHC: The Ottoman Empire, James Bond and the Titanic Submersible'
description: 'Does a mighty power need a formidable rival in order to become great?
  Was 20th century British culture uniquely British? When was the term democracy first
  applied to Western political systems? If the Ottomans had been victorious at Vienna
  and swept thought Europe, was it ever possible that Islam could have become the
  primary religion of Europe? And, which historical topics should all children be
  taught at school?

  Join Tom and Dominic for this week''s bonus episode, as they discuss these intriguing
  historical questions.




