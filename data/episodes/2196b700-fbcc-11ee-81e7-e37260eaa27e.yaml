title: 'RIHC: Harold Wilson''s Affair, Russell Crowe and Historical Rotters'
description: 'What does Dominic make of the recent claims regarding Harold Wilson''s
  secret affair with the civil servant Janet Hewlett-Davies? Has the impact of the
  Moon landings been lost in recent decades? What is the difference between a cad,
  a bounder and a rotter? Which is the worst? And, will Zendaya ever make it onto
  The Rest is History...?

  Join Tom and Dominic for their grand reunion in this week’s bonus episode, as they
  discuss Dominic''s new book, Tom''s Orkney adventure, and answer some intriguing
  historical questions. 




  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London!


