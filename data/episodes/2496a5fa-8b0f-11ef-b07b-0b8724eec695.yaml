title: 'RIHC: The Roman Conquest of Britain EXTRA'
description: 'Why did people become interested in Roman history after the fall of
  the empire? Did the "Break with Rome" change the legacy of the Romans in Britain?
  When did Britain become obsessed with remaking Roman-style art and architecture?
  What were the commonalities between the Romans and the Britons?


  In this week''s bonus episode Tom and Dominic dive deeper, and unpack some of the
  key questions that were left unanswered during the recent Roman Britain series.

  _______

  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York.


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history''s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

