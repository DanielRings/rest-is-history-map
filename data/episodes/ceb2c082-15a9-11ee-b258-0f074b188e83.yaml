title: 'RIHC: Russian Revolutions, William the Conqueror, and Henry V (Livestream)'
description: 'Was the rise of nationalism in the 1800s inevitable? If the Vietnam
  War had never happened, would Lyndon B. Johnson be the poster boy of the Democrats
  rather than JFK? Had Harold Godwinson defeated William the Conqueror and sent him
  back to Normandy, how would this have affected England? Which coup has had the most
  profound impact on a country''s history? If Henry V had survived longer, or Henry
  VI been less useless, could England and France have been kept together? In this
  month''s bonus livestream, Tom and Dominic discuss these questions, and many more.


  *The Rest Is History Live Tour 2023*:


  Tom and Dominic are back on tour this autumn! See them live in London, New Zealand,
  and Australia!


