title: 'Paris 1968: The Return of De Gaulle (Ep2)'
description: 'Charles de Gaulle was a war hero in the First World War, and, having
  refused to accept his government’s armistice with Nazi Germany, became the voice
  of the French Resistance during the Second World War. But how did France’s largest
  uprising since the Paris Commune come to happen during his presidency? Join Tom
  and Dominic in the second part of our tour of Paris, as they look at de Gaulle’s
  role in the events of May 1968, and how he eventually overcame the protests.


