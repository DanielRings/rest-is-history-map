title: 'RIHC: Augustus, Appeasement, and a life of hiccups'
description: 'In this week''s bonus podcast, Tom and Dominic discuss episode reactions,
  members'' questions and your latest discord musings. The boys also talk about how
  Appeasement informed later British foreign policy, the corrupting impact of gold
  in the Roman Republic, and why Kevin Keegan and Tony Blair''s game of headers was
  straight out of the Augustus playbook. 


