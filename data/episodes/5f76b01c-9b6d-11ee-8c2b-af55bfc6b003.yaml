title: The Mystery of the Pregnant Pope
description: 'A Pope of great renown once reigned during chaotic years for the medieval
  Church: she was an extraordinary figure, from a time when women were forbidden from
  even becoming priests - indeed she is History’s only female Pope. But did this “Popess"
  really exist, and if so, who was this mysterious, awesome woman? What does her story
  reveal about the murky politics of the medieval Vatican? The original account described
  an English woman named Joan, who through her brilliance rose to become none other
  than Pope John VIII. Then, in a shocking turn of events, she fell pregnant and gave
  birth to a son during a procession, before meeting a sinister end… 


  Join Tom and Dominic as they discuss this most remarkable of legends and discover
  the truth behind the story of the pregnant Pope - a tale of teenage Popes, female
  persecution, blinding, castration, and Europe’s greatest revolution.



