title: King Arthur and the Ballads of His Greatest Knight
description: 'Where and when does the chilling Arthurian legend of Gawain and the
  Green Knight come from? How does it relate to the mythical foundations of Britain
  in the Trojan War? And, what is the bloody climax of this gripping tale?




  In this week’s bonus episode, Tom is joined by friend of the show, singer and songwriter
  Muco, master of reinterpreting medieval folk songs in middle and old English, to
  delve deeper into the most epic Arthurian romance of all: Sir Gawain and the Green
  Knight.&nbsp;&nbsp;


