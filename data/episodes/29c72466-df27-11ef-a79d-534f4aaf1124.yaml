title: 'RIHC: American Presidents, From FDR To Trump: The Invasion of Iraq, Obama''s
  Failures, and the Biden Blip (Part 2)'
description: 'Was Donald Trump''s rise to power historically unprecedented in America?
  Who has been the worst American president in recent history? Was Reagan''s emotional
  detachment his great strength or weakness? Do all successful world leaders have
  to be actors? Does Bill Clinton''s somewhat sordid personal life while in the Whitehouse
  detract from his successes as president? How will history look back on George W.
  Bush? Will Obama be remembered as little more than the forerunner to Donald Trump?
  And, is Trump a fascist...?

  In this week''s bonus episode, Dominic is joined once more by The Rest Is Politics
  US co-host and Trump''s former Director of Communications, Anthony Scaramucci, to
  discuss some of the best and worst American presidents in recent history, and Mooch''s
  time working with Donald Trump.

