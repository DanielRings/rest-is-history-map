title: 'The Ku Klux Klan: The Rise of Evil (Part 1)'
description: 'How did the three iterations of the Ku Klux Klan come into being in
  1866, 1915, and the late 1940s? What was the impact of the American Civil War and
  the Abolition of slavery in 1863 on the rise of this terrifying institution? And,
  what was the condition of the former slaves in the American South? 




  Join Dominic and Tom as they unfold the history behind the formation of the first
  Ku Klux Klan, its ideology and structure, and the abominable treatment of freedmen
  in the Confederacy South, following the American Civil War.




