title: 'Fall of the Sioux: Death of Crazy Horse (Part 1)'
description: 'Though the Battle of the Little Bighorn seemed for the triumphant Lakota
  and their allies - the largest gathering of Plains Indians ever assembled - a miraculous
  victory, it was for them the beginning of the end. A great council was held near
  the battlefield in which they made the fateful decision to split up. Meanwhile,
  in Washington, Custer’s death and the military defeat of the army was being politicised,
  and the public rallied against the Lakota. Red Cloud, their political leader through
  so many of their struggles, was replaced with a puppet interloper. Then, during
  the winter of 1877, a contingent of ruthless and fiercely effective U.S. officers,
  including General Crook and General Miles, chased and harried the retreating Sioux
  contingents through the snows, leaving them starving, beleaguered and desperate.
  At last, in March 1877 the once formidable war chiefs Crazy Horse and Sitting Bull
  found themselves cornered, and their people left with little choice but to admit
  defeat. What then would be their fate?

  Join Dominic and Tom as they discuss the annihilation of the Plains Indians and
  the dissolution of their extraordinary culture and nomadic way of life, along with
  the tragic death and downfall of one of the most mesmerising and mysterious characters
  of the entire story: Crazy Horse. 





