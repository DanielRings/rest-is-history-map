title: 'RIHC: Gorbachev, Tolkien, and Croatian plagiarism (livestream)'
description: 'Catch up on yesterday (Wednesday 31st August) evening''s livestream
  in audio format here. Tom and Dominic discuss Tolkien and the Lord of the Rings,
  dive into the life and legacy of Mikhail Gorbachev, and address an accusation that
  they''ve been plagiarising a Croatian-language radio station...


  To watch the filmed version on YouTube, simply head to the the following link: https://www.youtube.com/watch?v=6VprOZMDKCw&amp;ab_channel=Goalhanger


