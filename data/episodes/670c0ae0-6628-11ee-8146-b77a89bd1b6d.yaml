title: 'Baghdad: Crossroads of the Universe (Ep 2)'
description: '“No city in the world will ever rival it for prosperity...“ Baghdad,
  originally a Christian village in Iraq, was chosen by the Abbasid Caliph Al-Mansur
  as the site for the new capital of his empire, and it would become a cosmopolis
  to rival Rome or Babylon. Its foundations were built in a perfect circle, with walls
  90 feet tall, and at its heart, the monumental Palace of the Golden Gate. Rejecting
  the Umayyad Caliphate''s desire to conquer Constantinople, Al-Mansur founded his
  own “centre of the universe”. In the second part of our series on Baghdad, Tom and
  Dominic look at how the Abbasids solidified their rule after overthrowing the Umayyads,
  and the beginnings of Baghdad as their new capital.


