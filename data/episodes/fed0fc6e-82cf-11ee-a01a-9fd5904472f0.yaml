title: 'RIHC: History’s Top Lads, Ancient Slavery and Aztec Gold'
description: 'Did all ancient cultures use slaves? Who are history’s top lads? Did
  the Aztecs know the value of their own gold? What would have happened if the English
  had colonised South America instead of the Spanish? Which woman from history should
  have a movie made about her? And why is pentecostalism on the rise? 


  Join Tom and Dominic for their first ever recording from the southern hemisphere
  as they answer some of history’s most intriguing questions.



  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


  *The Rest Is History Live Tour 2023*:

  Tom and Dominic are back on tour! See them live in New Zealand and Australia this
  autumn!


  Buy your tickets here: restishistorypod.com


  Twitter: 

  @TheRestHistory

  @holland_tom

  @dcsandbrook'
