title: 'RIHC: British Inventions, Ronald Reagan, and Roman Conquests'
description: 'What is the best British invention of all time? When did history shift
  from being shaped by emperors to being shaped by population changes and industry?
  How influential was Pope John Paul II in the collapse of communism in Europe? And
  what does the Dreyfus affair tell us about France before the Great War?


  In this week’s bonus episode, Dominic is joined by the Dauphin of The Rest is History
  Theo Young-Smith to discuss anti-French slander, their views on political violence,
  and Dominic’s time in student theatre productions…


  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

