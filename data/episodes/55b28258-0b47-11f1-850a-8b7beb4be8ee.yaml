title: 'Greatest Paintings: Age of Enlightenment - Raeburn''s Skating Minister | FULL
  EPISODE'
description: "How does Henry Raeburn’s Skating Minister represent both the Scottish\
  \ Enlightenment and the Romantic movement? In what ways does the subject Reverend\
  \ Robert Walker’s personal history connect to the famous Dutch Golden Age? And,\
  \ how did a controversy about the most reproduced image in Scotland  traumatise\
  \ the Scottish national identity?\n\n\n\nIn this new The Rest Is History Club series,\
  \ Tom is joined by art critic and author Laura Cumming, to discuss the histories\
  \ behind famous paintings, and put them in their historical contexts.\n\n\n\nNEXT\
  \ WEEK… \nJan 23rd: The Angelus - Jean-François Millet \n\n\n\n_______\n\nTwitter:\n\
