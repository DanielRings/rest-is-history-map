title: 'RIHC: Murder Mysteries, Historical Rebellions and Zombie Rome'
description: 'Which historical revolution would Tom and Dominic have been most likely
  to join? How different would the course of English history have been if Richard
  II had been killed when he met with Wat Tyler as a boy? What is the influence of
  Christianity on Star Wars? Which fictional detective would Dominic and Tom want
  to solve their murders? Who was responsible for the fall of Constantinople? And,
  was the Industrial Revolution more important than the Protestant Reformation?

  Join Tom and Dominic for this week’s bonus episode, as they answer these enthralling
  historical questions. 





  *The Rest Is History LIVE in 2024*


