title: 'Elizabeth I: The Fall of the Axe (Part 1)'
description: 'How did Elizabeth I’s tumultuous early life in the court of her wife
  murdering father, Henry VIII, influence the rest of her life? What was the nature
  of the Tudor world she was born into? Why did Henry VIII so desperately desire a
  son? And, why did Henry and Anne’s marriage following his divorce from Catherine
  of Aragon, change the fate of Britain forever?




  Join Tom and Dominic as they discuss the story behind the birth of Britain’s greatest
  queen - Elizabeth I. From her father Henry VIII’s reign and early marriages, to
  Tudor court politics, and the ruthless execution of her mother, Anne Boleyn….






