title: 'Horror in the Congo: A Conspiracy Unmasked (Part 3)'
description: 'Exposing the dark pit of human suffering, cruelty and corruption that
  had long been secretly festering in King Leopold’s Congo, would reveal one of the
  greatest abuses of human rights in all history, and instigate a human rights campaign
  that would change the world. Having established it as what was essentially his own
  private colonial fiefdom in 1885, Leopold had grown rich off the vast quantities
  of rubber and ivory that his congolese labourers reaped and transported in unimaginably
  brutal conditions. The man to finally discover the horrendous scheme, and Leopold’s
  personal corruption, was Edmund Dene Morel, a young shipping clerk who noticed something
  deeply suspicious about the exports being sent back to the Congo from Belgium. With
  the backing of a wealthy tycoon, and in tandem with extraordinary individuals such
  as the magnetic Roger Casement who had personally experienced the horrors of the
  Congo, Stanley would for the next decade and more of his life embark upon an excoriating
  attack on Leopold and his regime. He interviewed countless first hand witnesses,
  published an outpouring of articles detailing the truth of what was going on, spoke
  convincingly at public gatherings, and set up an influential organisation, all of
  which served to attract much popular support and attention to the campaign. Soon,
  the question of the Congo had become an international political affair. But would
  it be enough to quell the horrific treatment of the Congolese people and discredit
  Leopold once and for all?

  Join Dominic and Tom as they describe the discovery, expose, and excoriation of
  King Leopold’s appalling human rights abuses in the Congo, resulting in one of the
  most important human rights campaigns of all time. Did it succeed? And, with some
  of Europe’s major colonial powers clamouring to condemn Leopold, what were the long
  term implications for European imperialism overall?

