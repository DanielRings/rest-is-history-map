title: The Regency Revolution
description: 'How were the bonnets, corsets, and empire line dresses of the Regency
  period expressive of a revolutionary era?


  In this episode, Tom Holland and Dominic Sandbrook are joined by Hilary Davidson
  to discuss fashion in early 19th century Britain. Diving into the world of Jane
  Austen, they look to understand how the unprecedented changes in style were driven
  by the social, cultural, and political changes of the time.


