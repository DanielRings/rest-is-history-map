title: 'Custer''s Last Stand: The Charge of the 7th Cavalry (Part 6)'
description: 'The U.S. was thrust into frenzied panic following the economic depression
  of 1873, with waves of paramilitary violence sweeping through the South, as violent
  debates surrounding Reconstruction swirled on. Amidst this uncertainty, the government,
  under the leadership of Ulysses S. Grant, drew up a plan to strike into the heart
  of Montana, and settle the issue of the so-called ‘Plains Indians’ once and for
  all. Meanwhile, as the pressures of white settlers and the railroads increased,
  the Lakota and Cheyenne joined forces against the American advances, spearheaded
  by their war chiefs Crazy Horse and Sitting Bull. Over the winter, their numbers
  swelled to become arguably the largest assembly of indigenous people the Plains
  had ever seen. The stage seemed set for a mighty reckoning in the summer of 1876,
  as the federal government geared up for another assault. And much to his delight,
  Custer’s 7th Cavalry is given orders to close in on a Lakota encampment near the
  Little Bighorn River… The Battle of the Rosebud that followed would see a six hour
  struggle of monumental violence. 


  Join Dominic and Tom as they discuss the events and battles that lead up to the
  Battle of the Little Bighorn, Grant’s eccentric generals, and Custer’s impulsive
  escapades in the build-up to the final evening of his life…



