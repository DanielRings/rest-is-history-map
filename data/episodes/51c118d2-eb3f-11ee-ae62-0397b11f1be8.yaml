title: 'RIHC: Henry VIII, Modern Villains, and H.H. Asquith'
description: 'Does H.H. Asquith really belong in Dominic''s top ten British Prime
  Ministers, and if so why? What role did the survivors of the Titanic play in propagating
  the famous myths surrounding the disaster? Are the Tudors overrated? How important
  is it to shield young school children from traumatic historical subjects? What are
  the pros and cons of a written constitution? And, which two people in power today
  will be remembered in the future as a great hero and a great villain?

  In this week’s bonus, with Tom on holiday, Dominic is joined by assistant producer
  Tabby and community manager James, in an Asquith-based showdown for the ages....



  *The Rest Is History LIVE in 2024*

