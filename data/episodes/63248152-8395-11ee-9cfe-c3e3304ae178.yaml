title: 'JFK: Death in Dallas (Part 3)'
description: '“It wouldn''t be very difficult to kill the president of the United
  States, you just have to be in a high building with a high powered rifle, telescopic
  sight and there''s nothing anyone could do about it….”


  On the morning of Friday, 22nd November 1963, John F. Kennedy awoke with just hours
  to live. Ahead was a flight to Love Field, Dallas; then a motorcade into the heart
  of the city’s business district. But as the president and his glamorous wife, Jacqueline,
  settled back in their limousine for the journey towards destiny, they had no idea
  of the horror to come …


  By 12:22pm the motorcade had reached Dealey Plaza in downtown Dallas, passing the
  nondescript Texas Book Depository and slowing for the unexpectedly large and enthusiastic
  crowds gathered to greet the President. At 12:25 bystanders spotted the figure of
  a man on the sixth floor of the Book Depository, staring strangely away from the
  motorcade. Then, at exactly 12.30 pm, the first shot rang out around the square….


  Join Dominic and Tom as they break down the events of the day of the assassination
  of President Kennedy moment by moment, from the night before the murder to its traumatic
  aftermath, poring over the evidence in order to solve this supremely fascinating
  historical mystery. 



  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


