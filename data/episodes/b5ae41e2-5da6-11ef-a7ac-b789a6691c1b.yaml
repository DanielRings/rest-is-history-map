title: 'Henry IV: Warrior Princes and Fat Knights (Part 2)'
description: 'The year is 1403, and the Usurper King, Henry IV, faces a seemingly
  insurmountable challenge to his rule. He has been brought the news that his old
  friend, Harry “Hotspur” Percy, has betrayed him, and plans to lead his army against
  the King. Meanwhile, to the West, the revolt in Wales continues, at its head the
  formidable welsh king Owain Glyndŵr. And even in Scotland, where Henry IV thought
  he’d settled things down by silencing the terrifying Earl of Douglas, there is more
  trouble: a kitchen boy is claiming to be Richard II. And having made it halfway
  up to Scotland with his army to quell the newfound unrest, Henry IV must turn around,
  and march his men towards Wales, to face Hotspur at Schrewsbury...

  Join Tom and Dominic as they dive into the biggest revolt against Henry IV’s rule,
  the making of his son and heir, Prince Hal, and the fate of the real Sir John Falstaff,
  abandoned by his dear friend Hal.


  _______

  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 

  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.

  Tickets on sale now at TheRestIsHistory.com

