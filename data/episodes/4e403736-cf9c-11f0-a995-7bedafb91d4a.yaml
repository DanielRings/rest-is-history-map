title: 'The Beatles: The British Invasion, with Conan O’Brien (Part 2)'
description: '| This episode is available a week early for members of The Rest Is
  History Club |


  What happens when fame, drugs, and genius collide? How did the Beatles survive John
  Lennon’s “more popular than Jesus” interview and the death of Brian Epstein? And,
  why did the band eventually break up?




  Conan O’Brien returns with Tom to dive into the Beatles’ final years: rooftop gigs,
  groundbreaking records, and the inner conflicts that defined - and arguably destroyed
  - the band.




  The Beatles’ nine-part “Anthology” documentary series has been restored and is now
  available to watch on Disney+. Thank you to Apple Corps and Disney for the opportunity
  to use archive from the Anthology in these special Beatles episodes.


