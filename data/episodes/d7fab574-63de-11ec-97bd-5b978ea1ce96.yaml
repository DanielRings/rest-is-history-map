title: '31 Dec: Jean-Bédel Bokassa and the memory of pandemics'
description: It's New Year's Eve - switch off the Hootenanny and tune in to hear Dominic
  recount extraordinary tales of coups, cousins and the rise of an emperor in the
  Central African Republic. Later on in the podcast, Tom questions whether the current
  pandemic will have a more prominent role in the history books than the often disregarded
  Spanish flu.
