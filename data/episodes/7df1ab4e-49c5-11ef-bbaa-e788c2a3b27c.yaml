title: 'The French Revolution: The Royal Family Escapes (Part 8)'
description: 'Twelve months after the dramatic Women’s March on Versailles, the Revolution
  proper was well into its stride, and while Paris overflowed with a sense of unbridled
  political freedom, the King and Queen were little more than prisoners in their echoing
  palace. For the past year Louis XVI had feigned cooperation with the National Assembly,
  all the while torn by his profound Catholicism and frozen by indecision about how
  to overcome his predicament. Then at last, following a traumatic experience over
  the easter of 1791, something changed and the contingency plan formulated several
  months earlier, was put into action. With the help of a disguised Axen Von Fersen,
  the royal couple and their children would flee to Belgium in an enormously ostentatious
  carriage. The date for their escape was set for the 20th of June, but before leaving
  Louis poured his hatred of the revolution into a letter, which if found would surely
  spell his political doom…that night the royal family, replete with accomplices,
  deceptions and disguises, set their audacious plan into action. What ensued was
  a heart-racing cat-and-mouse thriller of near misses, foolhardy naivety and extraordinary
  encounters, with appalling consequences…

  Join Dominic and Tom for the thrilling conclusion to their astounding series on
  the early years of the French Revolution. With the King and Queen of France on the
  run from the nightmare their lives have become, will they make it across the border
  to freedom? Or, will they get caught and devoured by the ravenous hoards of the
  Revolution? 

  _______

  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
