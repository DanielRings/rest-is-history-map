title: The Canterbury Tales (Ep 4)
description: 'Geoffrey Chaucer stands as a founding father of English literature,
  and ‘The Canterbury Tales’ is an enthralling account of his age, holding a mirror
  up to the traditional hierarchies of 14th century England. Chaucer’s own life was
  spent navigating the rapids of a particularly tumultuous period, from fighting in
  the Hundred Years’ War alongside Edward III, to working for the infamous John of
  Gaunt, becoming embroiled in London politics, and surviving the gruesome Black Death.
  Chaucer even lived through the explosive Peasants’ Revolt, during which his own
  life hung in the balance…


  Join Tom and Dominic as they discuss the turbulent life and seminal work of Geoffrey
  Chaucer, a titan of English history and trailblazer of social change.



  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 

