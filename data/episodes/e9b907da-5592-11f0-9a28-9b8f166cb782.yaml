title: 'The Irish War of Independence: Showdown in London (Part 4)'
description: 'What were the terms of the Anglo-Irish Treaty, signed in December 1921,
  following negotiations between the UK and Sinn Féin? How was it received by the
  Irish people? What was the process by which it was agreed between Lloyd George,
  Winston Churchill, Michael Collins, and Arthur Griffith? Why did Éamon de Valera
  object to the treaty, and how did this sow the seeds of civil war? Had the Irish
  beaten the British militarily up to this point? And, what would be the consequences
  of this controversial treaty for the future of Ireland, and Anglo-Irish relations?


  Join Dominic and Tom as they discuss the totemic Anglo-Irish Treaty - one of the
  most controversial moments in Irish political history, which would transform the
  fate of Ireland forever…  






