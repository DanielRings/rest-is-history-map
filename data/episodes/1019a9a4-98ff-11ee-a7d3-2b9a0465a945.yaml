title: Victorian Britain's Maddest Mystery
description: 'In 1854, the twenty-five year old aristocrat Roger Tichborne, heir to
  an impressive fortune, died in a shipwreck ....Or did he? His mother, certain of
  her son’s survival, advertised extensively with a tantalising reward for her son’s
  return. Twenty years later a rough, corpulent butcher from Australia named Arthur
  Orton arrived in Europe, declaring himself to be the long lost heir. The trial that
  ensued captivated the public imagination, becoming the greatest and most dramatic
  case of Victorian England and arguably, all of British history. 


  Join Tom and Dominic as they discuss The Tichborne Case with best-selling author
  Zadie Smith, which forms the centrepiece of her new novel The Fraud. It is a darkly
  comic, story of intrigue and mystery, that crosses continents and encompasses the
  issues of race, empire and class that smouldered at the very heart of 19th century
  British society. 




