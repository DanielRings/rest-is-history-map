title: 'The Road to 1066: Rise of the Normans (Part 3)'
description: 'Born into a world of treachery, violence and death, William of Normandy
  defied all expectations, forging a legacy that lasts to this day. Born out of wedlock
  and dismissed as an upstart, he was originally known as William the Bastard. Inheriting
  the Duchy of Normandy at just eight years old, William was faced with betrayal,
  bloodshed, and anarchy. From the restless Normans, who expanded across Europe as
  mercenaries and horsemen, to the growing threat of Anjou, the early years of his
  reign were blighted by power struggles. Following the brutal murder of his guardians,
  and with Normandy on the brink of collapse, William was forced to survive in a world
  without loyalty, where ambition was the ultimate currency. Meanwhile, across the
  Channel, the English throne was in turmoil, as the sons of Æthelred the Unready
  fought for survival and power…


  Join Tom and Dominic as they trace William’s rise from a vulnerable child to a formidable
  young duke, setting the stage for the ultimate confrontation: his claim to the English
  crown.



