title: 'Henry IV: The Usurper King (Part 1)'
description: '"Uneasy lies the head that wears a crown…”

  Henry IV has been portrayed as both a shadowy, obscure figure, and a strong king
  who was loved by his people. Prior to ascending the throne, Henry, the son of John
  of Gaunt, was admired for his glamour, clemency, courage and strong faith, but these
  sympathies quickly turned to suspicion when he became a ruling regicide. Indeed,
  after a failed rebellion in 1388 against Richard II, Henry led a second coup against
  the king, and successfully usurped the throne in 1399. Once king, keen to gain legitimacy,
  he delivered his claim to the throne in English, and vowed to respect the will of
  the people. But he had inherited a divided country, which was surrounded by enemies
  in France, Scotland and Wales. And, despite being elected to the throne by his peers,
  and, as some sources claimed, prophesied by Merlin and selected by a greyhound,
  Henry quickly lost popularity, and himself faced violent rebellions. When the brewing
  uprising in Northern Wales finally erupted in the autumn of 1400, with the Scots
  following suit not long thereafter, Henry would need all his allies to stand firmly
  by his side…

  Join Tom and Dominic as they explore the life and reign of Henry IV, an epic tale
  of plunder, rivalry and jealousy.


