title: 'RIHC: The Death of Nelson, Ancient Egypt, and The Holy Roman Empire'
description: 'Which historical figure most significantly altered the course of history,
  by virtue of their incompetence? Why did England and Scotland adopt such different
  forms of Protestantism during the Reformation, despite having similar cultures?
