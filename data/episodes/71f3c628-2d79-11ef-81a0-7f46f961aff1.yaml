  has the 18th century always been so neglected as a period of history? Was the Holy
  Roman Empire ever referred to as such during its lifetime? And, which of the Ancient
  Egyptian Kingdoms was the most sustainable - Old, Middle or New?

  Join Dominic and Tom in this week’s bonus episode, as they discuss some interesting
