title: 'RIHC: Revolutions, Tolkien''s Tomb, and Poseidon''s daughter'
description: 'What influence did 1848 have on the birth of the modern Catholic Church?
  Which English king would have made the most of the coronation concert? Considering
  he could interact with Herodotus within the game, would Tom play Assassin''s Creed?
  What is the "Sandbrookian kiss", and have any guests on The Rest is History experienced
  such treatment? In this week''s bonus episode, Tom and Dominic grapple with these
  questions, and many more...


