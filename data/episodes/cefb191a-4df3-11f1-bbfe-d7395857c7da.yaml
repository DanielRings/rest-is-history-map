title: 'The First World War: Death in the Trenches (Part 1)'
description: "During the First World War, what was it like to live in the trenches\
  \ on the Western Front in 1915? How did the Germans attempt to knock the Allies\
  \ out of the war right from the outset? And, what secret weapon did the Germans\
  \ unleash? \n\n\n\nJoin Dominic and Tom as they plunge back into the First World\
