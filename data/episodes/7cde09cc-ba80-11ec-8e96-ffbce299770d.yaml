title: Crucifixion
description: 'Crucifixions were a form of public execution so heinous that the Romans
  themselves were reluctant to document their gory details...


  In this Easter special, Tom and Dominic trace the origins and evolution of crucifixion
  - as well as the historical accuracy of Jesus'' death.


  Warning: this pod is not for the faint of heart.


