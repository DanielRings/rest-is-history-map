title: 'Hannibal: Elephants Cross the Alps (Part 2)'
description: 'Why did Hannibal choose to cross the Alps with his elephants in 218
  BC, when invading Rome? Was it a brilliant stratagem or a military disaster? What
  was the secret to the Roman Republic’s growing military success at this time? And,
  why did Carthage, under Hannibal’s formidable generalship, believe they were more
  than capable of taking on the might of Rome? 


  Join Tom and Dominic as they charge into one of the most legendary military clashes
  of all time: the outbreak of the Second Punic War, which saw Carthage under Hannibal
  Barka, take on the Roman Republic, by leading his army all the way over the snowbound
  Alps, atop elephants….




