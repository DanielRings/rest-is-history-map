title: 'Luther: The Battle Against Satan (Part 3)'
description: 'Three years on from Martin Luther’s publication of the Ninety-Five Theses
  - an assault on the Catholic Church and the selling of indulgences - his radical
  new ideas and brilliant use of the printing press had unleashed chaos in western
  Christendom. Still in Wittenberg, under the Protection of the powerful Frederick
  III, Luther’s increasingly radical beliefs were slowly beginning to undermine the
  entire fabric of the Catholic Church, and the theology that has shaped the Latin
  West for centuries. All the while, support for his outrageous ideas was swelling,
  and Luther’s own celebrity grew hand in hand with the ever-looming threat of excommunication.
  At last, in August 1518, Luther was summoned to have his beliefs examined at the
  Imperial court in Augsburg - would he survive this reckoning?


  Join Tom and Dominic as they discuss the growing radicalism of Luther’s doctrine,
  his seminal Reformation moment, and the great debate in Augsburg which would see
  his fervour put to the test. 




