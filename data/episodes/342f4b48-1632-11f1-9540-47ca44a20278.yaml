title: 'RIHC: Resisting the Nazis, Evading Hitler, and Traitorous Informers'
description: 'How did the group of elite Germans gathered on 10th September 1943,
  plan to bring down the Nazis? What motivated them above anything else? And, who
  betrayed them in the end?In this week’s bonus episode, Dominic is joined by historian
