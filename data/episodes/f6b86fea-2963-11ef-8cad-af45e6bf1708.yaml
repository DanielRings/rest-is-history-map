title: 'St George: Dragon-Slayer'
description: 'The image of Saint George astride his horse, sword and spear in hand,
  slaying a dragon, is one of the most iconic iconographical spectacles of all time.
  But what was the historical truth of this deeply mythologised figure? The conventional
  take on his story is well known: once, long ago, there lived a pagan king who refused
  to honour the one God. As punishment, a terrible dragon was sent to ravage his lands,
  and his daughter sent to supplicate the beast. Until, the saintly George rode up
  to save the girl and the king’s soul…herein lies an important feature of the historical
  George: his piety, with the earliest sources casting him as a Christian martyr from
  Cappadocia, gruesomely tortured and killed in the 3rd century BC. Over time the
  legend has changed and evolved; from the courts of English monarchs such as Edward
  I and Henry VIII, who celebrated his chivalry to buttress their regimes, to his
  many religious and ideological detractors. Throughout it all, though, George stands
  apart from the ranks of Christian saints. But why? 


  Join Tom and Dominic as they trace the historical Saint George and his famous slaying
  of the dragon. From the earliest accounts of him in the Near East, to the cults
  of the medieval era, the reformation, Tudor pageantry, and the introduction of the
  St George’s flag. Fearsome 17th century dragons, mythical beasts, and miraculous
  resurrections all feature…




