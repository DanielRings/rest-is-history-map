title: 'RIHC: The History of Sport, Nazi Football, and World Cups'
description: 'Why does the history of sport matter? What does football teach us about
  world culture? How did Empire impact the development of football during the Victorian
  period? In which ways did football serve to generate a shared national sense of
  Brazil? How did football in South America evolve in reaction to British football?
  What was it about America that produced American Football rather than rugby? Why
  did the Germans know how to play football in the famous Christmas Truce of 1914?
  What was the Nazis’ attitude to football? How did football take hold in Africa?
  Who was football’s first global star? How did FIFA evolve? And, when was the first
  Football World Cup?




  In this week’s bonus episode, Tom is joined by historian Jonathan Wilson, to discuss
  the history of international football.




