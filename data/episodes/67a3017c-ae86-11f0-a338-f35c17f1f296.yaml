title: 'RIHC: WWI Counterfactuals, 1970s Britain, and Pivotal Historical Figures'
description: 'Which historical British figure has had the greatest impact on the world?
  Is Shakespeare the most important writer of all time? What would have happened to
  British politics if Jim Callaghan had won the labour no confidence vote of 1979?
  How much did Thatcher really change history? What would Tom and Dominic put on the
  bank notes? Alongside Chatham High-street, which other places in Britain have a
  hidden history worth exploring? And, what would have happened if Britain had fought
  the Americans in 1914 rather than the Germans…?




  In this week’s bonus episode, Tom and Dominic discuss these fascinating historical
  questions.


  _______


