title: 'RIHC: Lenin’s Russian Return, Mao’s Long March, and Fidel Castro’s Triumph'
description: 'Who was Lenin? What did he do upon hearing that the Tsar had been toppled
  in Russia, while exiled in Zurich? How did he make it home to St Petersburg, with
  the threat of arrest on all sides? Why did the Germans believe he could change the
  outcome of the First World War? During the Chinese Civil War, what was Mao Zedong’s
  Long March? Where did he and the 100,00 troops of the Chinese Red Army go? What
  happened when he and his fellow communists were forced to fight the Chinese Nationalist
  forces pursuing them, on a rickety suspension bridge, at the Battle of Luding Bridge
  in 1935? Was the Long March a resounding defeat, or the Pyrrhic victory Mao claimed
  it to be? Why was Fidel Castro’s return to Cuba from Mexico, in 1956, so dramatic?
  And, how did that journey, which saw him transformed from underdog to leader, launch
  Castro’s restoration, and guild his reputation forever more? 




  In this week’s bonus episode, Dominic is joined by Professor Simon Hall, to discuss
  the journeys that changed the lives of three of the most renowned communist leaders
  of all time, and the impact they had upon the ensuing communist revolutions that
  shook the world between 1917 and 1959: Lenin, Mao, and Castro.




