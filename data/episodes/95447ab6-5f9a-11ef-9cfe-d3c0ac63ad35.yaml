title: 'Hundred Years’ War: The Road to Agincourt (Part 2)'
description: 'On the 11th of August 1415, King Henry V of England - an austere, pious,
  thoughtful and terrifying warlord in only his late-twenties - set sail for France.
  He embarked in the largest ship ever built on English soil at the head of some 15,000
  ships, his nobles, brothers and hordes of Welsh longbow-men in tow. Two days later,
  they made land, and their target: the Port of Harfleur, a nest of state-sponsored
  pirates. Henry’s intention was to use it as a spring-board to a wider campaign in
  France, capitalising on the chaos that raged there, before eventually annexing Normandy.
  The assault on Harfleur that followed was bloody and brutal. The first Norman town
  to be pulverised by artillery, the English canons created a hellish scene of smoke
  and fire. However, the siege went on longer than Henry had hoped, inflicting terrible
  devastation upon the city and his forces. Furthermore, large numbers of his men
  were falling sick and their supplies growing thin. Finally, after four long weeks
  of terrible siege warfare, the city fell. However, a massive French force was now
  assembling to recapture the fallen city, potentially undermining all the money and
  men that Henry had already spent on the campaign. With the clock ticking for the
  English towards the end of 1415, what would Henry’s next move be? First, in a daring
  move of legendary chivalry, he challenged the portly French Dauphin to a duel, to
  no avail. So it was that he decided to march right across France and take Calais;
  a bold public proclamation of his right to the whole of France. Would Henry’s plan
  prove overly ambitious, or would he get the decisive battle he craved…?

  Join Tom and Dominic as they discuss Henry V’s first bloody forays into France,
  enacting his claim to the French crown that he truly believed was his by divine
  ordination, and thereby reigniting the tumultuous Hundred Years’ War….

