title: 'RIHC: The Hundred Years'' War EXTRA with Helen Castor'
description: 'What shaped the relationship between King Henry IV and King Richard
  II? How were the first cousins wrapped up in the Peasants'' Revolt as young boys
  in 1381? Is it difficult for historians to separate their own analysis from Shakespeare’s
  interpretation of the era? How was Henry V inspired by the personalities of these
  two rulers? And did Thomas Holland charm a noblewoman into leaving her husband?


  In this week’s bonus episode, Tom is joined by historian and friend Helen Castor
  to discuss the interconnected tragedies of Richard II and Henry IV, and the inspiration
  behind her new book ‘The Eagle and the Hart’. An exciting chronicle of two royal
  rivals. 


  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York.


  *The Rest Is History LIVE at the Royal Albert Hall*


  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


