title: Londinium (Ep 1)
description: 'Welcome to the first episode in our new mini-series: LONDON WEEK.


  On the public feed, we''ll release an episode daily, from Monday to Friday. However,
  as a friend of the show, you get them ALL at once!


  Ep 1 ''Londinium'' and Ep 4 ''Haunted London'' are live pods we recorded on location
  earlier this year. ''Places'', ''People'', and ''Moments'' are three accompanying
  episodes that Tom and Dominic recorded in order to dive deeper into London''s past.


  Londinium:

  Amid the sounds of building sites and ambulance sirens, Tom and Dominic march across
  the bridges and snake down the alleyways of London. In this special live episode,
  they uncover the Roman roots of the capital city, tracing its journey from desolate
  mudflats to a sprawling beacon of civilisation. 


  Producer: Dom Johnson

  Exec Producers: Jack Davenport + Tony Pastor


