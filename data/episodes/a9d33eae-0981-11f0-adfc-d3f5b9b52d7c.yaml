title: 'RIHC: Rome’s Worst Emperor, The Jacobite Uprising, and Consequential Battles'
description: "Who was Rome’s worst emperor of all time? Are the politicians of today\
  \ less impressive than those of the past? If so, why? Does an understanding of history\
  \ make for a better politician? How did people in the past think of themselves in\
  \ relation to the epoch in which they were living? For instance, did the Victorians\
  \ consider themselves “Victorians” even then? Who was a better Prime Minister, Gladstone\
  \ or Disraeli? Was the Battle of Valmy in 1792, in which French Revolutionaries\
  \ took on the might of the Prussians, one of the most consequential battles of all\
  \ time? And, how did the Jacobite army get as far as Derby in 1745, under the leadership\
  \ of Bonnie Prince Charlie? \n\nJoin Tom and Dominic for this week’s bonus episode,\
  \ as they answer some scintillating historical questions. \n_______\nTwitter:\n\
  @TheRestHistory\n@holland_tom\n@dcsandbrook\nProducer: Theo Young-Smith\nAssistant\
  \ Producer: Tabby Syrett + Aaliyah Akude \nExecutive Producers: Jack Davenport +\
  \ Tony Pastor"
