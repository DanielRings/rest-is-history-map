title: 'The Falklands War: Battle for the Islands (Ep 3)'
description: 'In the third episode of our Falklands War mini-series, the story heats
  up.


  The most controversial episode of the war, the sinking of the Belgrano, takes place,
  the British Task Force lands and battle plays out.


  Tom and Dominic thumb through their copies of the Sun, relive Reagan''s final plea
  to Thatcher, and recount the stories of the men on the ground as Britain closed
  in on victory.


