title: 'Joan of Arc: Saviour of France (Part 2)'
description: 'How did a young, uneducated peasant girl dressed in men’s clothing,
  Joan of Arc, plan to crown the son of the mad and feeble Charles VI, the King of
  all France, and save them from the English? What happened when she met with the
  Dauphin? And, what happened when, in April 1429, Joan of Arc finally road to war,
  dressed in a suit of white armour, and clasping her mighty sword…?




  Join Tom and Dominic as they charge into the very heart of Joan of Arc’s remarkable
  story. Could she really defeat the English in open battle at long last?


