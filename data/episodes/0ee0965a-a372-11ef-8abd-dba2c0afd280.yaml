title: 'Nelson: The Battle of the Nile (Part 5)'
description: 'The 1st of August 1798 saw the British fleet sailing towards Alexandria
  into a land of classical history and mythology, the sun setting like blood over
  the River Nile and French flags flying over the city. The scene could not be more
  perfectly suited to the cataclysmic battle that would soon take place there, in
  which Horatio Nelson would guild his legend forever. Charged with leading a squadron
  of fourteen ships into the Mediterranean to find Napoleon Bonaparte and his vast
  fleet, Nelson had chased him all the way to Alexandria which the French had seized
  along with the rest of Egypt. At last, lookouts spot the masts of Napoleon''s ships
  - a moment of near transcendent excitement for Nelson and the men of his fleet.
  At last, it seemed, the moment had come for their battle of total annihilation in
  all its gore and glory. Wary of this, the French commanders urged Bonaparte to withdraw,
  but in his hubris the French general refused. So it was that the greatest naval
  battle of the 18th century began, to the thunder of cannons, screaming sailors,
  and the chaos of gun smoke, soot, splinters and blood….


  Join Dominic and Tom as they describe one of the most decisive and dramatic moments
  of both naval history and Horatio Nelson''s life: the Battle of the Nile.


