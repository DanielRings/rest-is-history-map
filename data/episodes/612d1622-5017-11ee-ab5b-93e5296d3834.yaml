title: 'The History Behind Hogwarts: Ancient Schools and Revolting Students (Ep 2)'
description: '“To be a boy at one of these schools was to be alternately tyrant and
  slave.”

  More gruesome even than the Battle of Hogwarts, 18th century British Public schools
  were hotbeds for violence and uproar, despite their deeply Christian origins. From
  raucous rebellions featuring students fighting militias and building barricades,
  hostage-taking and pistol-firing, to animal assassinations, abysmal teaching and
  gruesome hazing rituals, their organised brutality was mis-sold as “character-building”.
  Join Tom and Dominic in the second part of our series, as they explore the schools
  which inspired Hogwarts, their pupils, stories and legacies.


