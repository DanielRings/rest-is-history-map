  Canada: Beaver Wars

  Join Tom and Dominic as they discuss the illustrious history of the beaver. This
  story intertwines these small bundles of fur with tribal wars, the monopoly of the
  Hudson''s Bay Company, and Grey Owl - the original beaver conservationist.


