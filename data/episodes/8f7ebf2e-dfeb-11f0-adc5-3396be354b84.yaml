title: 'Joan of Arc: Warrior Maid (Part 1)'
description: 'What are the origins of the legendary Joan of Arc, the famous French
  maid who saved France from the English during the Hundred Years’ War, dressed all
  the while in men’s clothes? Why is hers one of the most remarkable stories of all
  time? And, was she really under divine influence when, as only a teenager, she demanded
  to be taken from her humble French village to Charles of Valois, the would-be King
  of France, in order to save the French from the English - then on the verge of victory?




  Join Tom and Dominic as they launch into the life of one of the most extraordinary
  people in all medieval history: Joan of Arc, and trace her journey from humble peasant
  girl, to advisor to the King of France, to military heroine and saviour of the French,
  to despised heretic condemned to the pyre… 




