title: 'Rome’s Greatest Enemy: Hannibal’s Nemesis (Part 2)'
description: 'What happened at the Battle of Ibera, a totemic though overlooked battle
  of the Punic Wars? With the forces of Carthage closing in on a depleted Rome, would
  a young Roman, Publius Cornelius Scipio resurrect the fortunes of the Republic?
  And, could he destroy Carthage’s most crucial power base in Europe?




  Join Tom and Dominic, as they discuss this next phase of the Carthaginian Wars.




