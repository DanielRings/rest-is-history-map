title: 'Rome’s Greatest Enemy: Bloodbath in Africa (Part 3)'
description: 'Would the Roman general Publius Cornelius Scipio successfully march
  on Africa? What happened when Hannibal and Scipio - the greatest commanders of their
  age - came head to head at the Battle of Zama, in the ultimate showdown? And, what
  would be the fate of these two titans of the ancient world?




  Join Tom and Dominic, as they discuss the Roman Republic’s audacious invasion of
  North Africa under the leadership of the dashing Scipio, and his clash with Hannibal.


