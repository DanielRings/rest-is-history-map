title: 9/11
description: 'On the morning of Tuesday, September 11, 2001, four commercial airliners
  were hijacked above the US by the militant Islamist terrorist group al-Qaeda. What
  followed was the deadliest terrorist attack in history. Twenty years on, Dominic
  Sandbrook and Tom Holland look back at the events and discuss their impact.


