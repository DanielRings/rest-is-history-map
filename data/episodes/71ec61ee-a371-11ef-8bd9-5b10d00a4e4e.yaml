title: 'Nelson: God of War (Part 3)'
description: 'Valentine’s day, 1797: the British Royal Navy are hoping for a decisive
  clash with the Spanish enemy, off the coast of Portugal, at Cape St. Vincent. Nelson
  has already narrowly avoided capture at the hands of the Spanish, after sailing
  through their fleet unnoticed, thanks to the auspicious cover of thick fog. But
  the British are outnumbered, and the Spanish fleet has at its head the largest warship
  in the world, the Santísima Trinidad. The stakes couldn’t be higher: if the Spanish
  aren’t stopped, they could head North towards the western coast of France and join
  forces with the French, the consequences of which would be terrible. Indeed, the
  French would then reign supreme over the Channel, offering them the perfect conditions
  to invade Britain. But after a disastrous start to the battle for the Royal Navy,
  all seems lost for the Royal Navy, until a single British ship breaks formation,
  and takes on the Santísima Trinidad. But who could possibly be behind such an insane
  manoeuvre?


  Join Tom and Dominic in the third part of our series on Lord Nelson, as they dive
  into the chaos and carnage of the Battle of Cape St. Vincent, and look at how Nelson’s
  incredibly daring charge saved Britain… 


