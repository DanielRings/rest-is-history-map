title: 'Oswald Mosley: Fascist Leader (Ep 2)'
description: 'The fascists in Britain have found a leader known across the country:
  the sinister yet complex Oswald Mosley. Following stints as an MP for both the Tories
  and Labour, Mosley, a veteran of the First World War, forms the British Union of
  Fascists in 1932, making a big effort to appeal to women and the working class.
  Although his rhetoric is surprisingly anti-militarist, the violence that occurs
  at his fascist meeting in Kensington Olympia in 1934, the same month as the Night
  of the Long Knives, will have irreversible influence on the development of his new
  party. Join Tom and Dominic in the second episode of our series on British Fascism,
  as they look at Oswald Mosley, his influences, his role within British society,
  and the rise of the British Union of Fascists…


