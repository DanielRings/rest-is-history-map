title: 'USA vs England: The 200-Year Rivalry'
description: 'In today''s World Cup special, Anglo-American relations are at their
  most tense, as the USA and England take to the football/soccer pitch.


  Join Tom and Dominic as they take a retrospective look at this 200-year love-hate
  relationship. From the War of 1812, to Charles Dickens, all the way up to Beatlemania
  and James Bond - buckle up to discover the historical drama underpinning today''s
  battle in Al Bayt Stadium.


