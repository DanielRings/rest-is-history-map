title: 'South Korea: The Riddle of Hwang Jini'
description: 'Join Tom and Dominic on their journey to the 16th century Korean peninsula,
  as they discuss Hwang Jini - a gisaeng, poet, and entertainer - and her everlasting
  impact on Korean culture.

  Dubbed by Tom the ''poetic Emma Hamilton'', the story of Hwang Jini takes us through
  Diamond Mountains, Buddhism, Confucianism, 16th century Korean social class, and
  much more...


