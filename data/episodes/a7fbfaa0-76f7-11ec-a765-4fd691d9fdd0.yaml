title: The Princes in the Tower Part 1
description: 'Who killed the Princes in the Tower? The inspiration behind Shakespeare''s
  Richard III, their murder is one of the greatest mysteries in English history. 


  In the first of two episodes, we start with the princes'' father, Edward IV. Tom
  and Dominic discuss the remarkable parallels between Edward IV and his grandson,
  Henry VIII, and why Edward''s brother, Duke of Clarence, is certainly not a friend
  of the show.


  All this, plus Tom''s case for why he does a better prince impression than Brian
  Blessed.


  Producer: Dom Johnson

  Exec Producer: Tony Pastor


