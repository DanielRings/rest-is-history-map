title: 'Fall of Saigon: Apocalypse Now (Ep 2)'
description: '“It is 105 degrees in Saigon, and rising.” This announcement, made through
  U.S. Armed Forces radio on a spring morning in 1975, is the cue for all Americans
  remaining in Saigon to head to the US embassy, in order to be evacuated. With up
  to a million South Vietnamese also expecting to be flown to safety, the city erupts
  into panic and unrest. The last U.S. troops barricade themselves on the roof of
  the embassy, waiting for the final helicopter to pick them up. Join Tom and Dominic
  as they dissect the final hours of American presence in Saigon, and the legacy of
  the war in Vietnam and abroad.


