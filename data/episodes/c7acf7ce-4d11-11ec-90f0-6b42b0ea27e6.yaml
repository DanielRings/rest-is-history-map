title: Magna Carta
description: 'Does the Magna Carta enshrine the liberties of every free-born Englishman?
  Or is it now irrelevant? Ted Vallance, Professor of History at Roehampton University,
  joins Tom Holland and Dominic Sandbrook to discuss King John and the bill of rights
  he was forced to sign.


