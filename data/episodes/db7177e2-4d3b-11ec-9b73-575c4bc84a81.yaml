title: Dinosaurs
description: 'How did the existence of dinosaurs come to be discovered, & what role
  have they played in the popular imagination over the past 200 years? And what can
  humanity learn from the extinction of dinosaurs - if indeed they ARE extinct? Tom
  Holland and Dominic Sandbrook explore the constantly evolving after-life of dinosaurs.


