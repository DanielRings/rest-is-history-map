title: 'Mary, Queen of Scots: The Battle for Scotland (Part 3)'
description: 'Following the death of her husband, the King of France, was the glamorous
  Mary welcomed back to Scotland, her kingdom since infancy, with open arms or deep
  suspicion? Did she handle the precarious situation in which she found herself well,
  or recklessly? Did the majority of Scottish nobles side with Mary, or plot to usurp
  her in the shadows? When her eye turned on the crown of her wealthier neighbour,
  England, how did its reigning queen, Elizabeth I, react? And, who was the man that
  Mary choose to take as her second husband…?


  Join Tom and Dominic as they discuss Mary Queen of Scots’ polarising return to her
  native land of Scotland, riven by religious factionalism and political disquiet,
  and the terrible dangers of being a Scottish queen in more than name alone.






