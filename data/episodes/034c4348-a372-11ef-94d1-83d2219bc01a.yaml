title: 'Nelson: The Hunt for Napoleon (Part 4)'
description: 'In the wake of the Battle of Cape St. Vincent in 1797, Horatio Nelson,
  though a much acclaimed public hero for his bravery during the battle, is in the
  doldrums. Having led a harebrained attack on Tenerife, Nelson must now contend with
  the loss of his arm. Upon returning to England, famous and lauded, Nelson declared
  his intention to retire to a cottage in the countryside to recover. However, carrying
  on the tide from France came murmurings that that the French were amassing an enormous
  force of soldiers and ships. The supreme commander of this formidable host: a Corsican
  by the name of Napoleon Bonaparte. It seemed that at last, the monumental struggle
  for which Britain had been grimly preparing up for so long - a total struggle of
  apocalyptic proportions - was in the offing. And with it, Nelson, the man of the
  hour, was given command of the squadron charged with finding the vast French fleet
  and hunting down the formidable Napoleon. Nelson’s hour of glory had finally arrived. 


  Join Dominic and Tom as they discuss the aftermath of the Battle of St. Vincent,
  Nelson’s burgeoning legend and emotional turmoil, and his thrilling hunt for Napoleon
  Bonaparte.  


