title: The Empress of the Apocalypse
description: 'In 972AD a princess of the Byzantine Empire was sent by her uncle, the
  Roman emperor in Constantinople, to marry the son of Otto the Great - Emperor of
  the Latin West. A tantalising and formidable figure, Theophanu became a major player
  in one of the most tumultuous and mysterious periods of history. At the end of the
  10th century, the world was still reeling from the cataclysmic implosion of the
  Roman Empire. Into the vacuum it left, three great powers reared their heads: the
  Empire of Islam, the Byzantines, and a Latin West in which barbarian kingdoms tussled
  to build themselves up over the rubble of Rome. It was also a time in which women
  had never wielded greater power, from behind the throne and even, before it. Following
  the death of her father-in-law, therefore, Theophanu - as the anointed wife of an
  emperor - became an Imperatrix Augusta, and in this capacity carved out a mighty
  new role for herself. As Rome’s heir’s battled for supremacy, Theophanu, with her
  competence and sophistication, would fight to see her son named the final, and much
  mythologised Emperor of Rome. Would she succeed?


  Join Tom and Dominic as they discuss Theophanu: empress of the apocalypse. From
  clashing empires, warring queens, and lascivious Popes, to court politics and the
  invention of the fork; all in a time of armageddon. 



