title: 'Dawn of the Samurai: The Shōgun Triumphant (Part 4)'
description: 'Who was the greatest female Samurai warrior of all time? What would
  unfold in the next phase of the terrible civil war between the Minamoto and the
  Taira dynasties? And, how did the Samurai finally become the masters of Japan?  
     




  Join Tom and Dominic as they reach the climactic conclusion of their journey into
  the rise of the Samurai.




