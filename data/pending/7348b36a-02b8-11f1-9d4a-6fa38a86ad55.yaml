title: 'The Fall of the Incas: The King in the North (Part 4)'
description: 'How did the Spanish conquistadors under Francisco Pizarro take advantage
  of the Incan civil war? Were they able to discover the glorious city of Cusco, with
  all of its riches? And, what terrible brutalities did they commit along the way…?




  Join Dominic and Tom, as they discuss the next dramatic phase of the Spaniards conquest
  of the Incas, as the violence escalates and the city of gold prepares to fall… 




