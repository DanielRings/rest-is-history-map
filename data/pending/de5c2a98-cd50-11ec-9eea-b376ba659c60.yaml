title: History's Biggest Questions with Dan Carlin (Part 1)
description: 'Who was the most influential leader of the 20th century? What would
  have happened if the South had won the American Civil War? Would you rather be under
  siege from the Mongols, the Romans, or the Assyrians?


  In a huge moment for transatlantic history podcasting, Tom and Dominic are joined
  by titan of the genre and friend of the show Dan Carlin, the host of one of the
  world''s largest history podcasts, Hardcore History.


  Over the course of two episodes, Dan, Tom, and Dominic tackle ten of the biggest
  questions in history, including counterfactuals and hypothetical matchups.


  Producer: Dom Johnson

  Exec Producer: Tony Pastor & Jack Davenport


