title: 'RIHC: Political Dynasties, Fascism and the Roman Republic'
description: 'Was Julius Caesar a glorified tyrant? Why are we still fascinated by
  dynastic political families like the Kennedy’s? Which Christmas event would Tom
  and Dominic most like to have attended: Charlemagne’s coronation, the completion
  of St Paul''s Cathedral, Washington crossing the Delaware, or the 1914 Christmas
  truce? 


  Join Tom and Dominic in this week''s bonus episode, as they answer these intriguing
  historical questions.



