title: 'The Rolling Stones: Satanic Majesties of Sixties Rebellion (Part 2)'
description: '"We''re not worried about petty morals."


  What happened to the Rolling Stones in 1967 to see them on the brink of imprisonment
  and mass censure, while at the height of their success, with fame, fortune, mansions,
  world tours, and best selling albums to their names? Was Brian Jones, the band''s
  founder, murdered, after being found floating in his swimming pool? Under what pressures
  and against the backdrop of what other controversies, did they produce some of the
  best rock albums of all time? And, what occurred during their infamously deadly
  concert at the Altamont Raceway…?


  Join Dominic and Tom as they discuss the uproarious climax of the Rolling Stones’
  extraordinary career: their entanglements with the law, the evolution of their sound,
  their personal lives; sex, drugs, death, and the birth of rock…



