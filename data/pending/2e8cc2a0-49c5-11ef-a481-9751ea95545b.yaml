title: 'The French Revolution: The Violence Begins (Part 3)'
description: 'With seismic antecedents such as the Glorious Revolution in England
  and the American War of Independence, what was it about the French Revolution that
  saw it become arguably the most important episode in all early modern political
  history? And what unique combination of factors converged to unleash this colossal,
  world-shaking event; the paradigmatic example of a people trying to reshape their
  society? By the start of the 18th century, France was the largest kingdom in continental
  Europe, and a powerhouse of agriculture, trade, and military might. But it was also
  a multilayered and very complex machine, still heavily founded in its ancient hierarchies
  and the dominion of the ancien régime. The King, Louis XVI, though in no way despotic
  and in some ways an enlightened man, did not have the strength to fix the creaking
  system he had inherited. And while the 18th century was an age of enormous dynamism,
  energy and modernity into which a new discourse of the self had been born, it was
  also a time of terrible violence in France, long before the revolution. The nation
  had also been running up stratospheric debts ever since the 1720s, and the poverty
  of the monarchy - the plight of every 18th century monarch - was exacerbated by
  its efforts to fund the American War against the British. Finally, the unravelling
  situation came to a head when, in 1786, Louis XVI was confronted with the news that
  the looming financial abyss had finally engulfed France, triggering a series of
  events that, from 1787, would unleash the doom-spiral of the revolution, and lead
  to his eventual overthrow… 

  Join Dominic and Tom as they discuss the causes behind the French Revolution. From
  the innovative, enlightened culture of 18th century France, set beside its enduringly
  hierarchical and deeply violent society, the amiable but feeble Louis XVI with his
  clueless finance ministers, to the American Revolution, financial cataclysms, and
  angry mobs. 

