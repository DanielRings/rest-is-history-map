title: 'Historical Love Island: THE WINNER'
description: 'Historical Love Island has swept the nation and the podcasting world
  since Monday, when four couples made it to the final: General Custer & Lola Montez,
  Lord Byron & Sporus, Stanley Baldwin & Theodora, and Jimmy Carter & Olympias.


  Fans flocked to Twitter to vote for their favourite historical pair - but which
  couple did Rest Is History listeners crown victorious? Listen to this special episode
  as Tom and Dominic announce the winner.


  Producer: Dom Johnson

  Exec Producer: Jack Davenport


