title: 'Amsterdam: Miracles, Money and Mud (Ep1)'
description: 'A city built on water, Amsterdam has often set the tone of European
  modernity. It first gained prominence as a miraculous centre for pilgrimage, and
  then stood out for its relationship with the Reformation, and for its role in the
  birth of modern capitalism. Join Tom and Dominic on part one of our tour of Amsterdam,
  as they take you on a journey through Dam Square, the birthplace of the Dutch East
  India Company, the Begijnhof, and the Amsterdam Dungeon…


