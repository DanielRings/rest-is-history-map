title: Young Putin, the KGB and the Soviet Union (Episode 1)
description: '[Episode 1 of 4]


  Welcome to our new four part series on the latter years of the Soviet Union, its
  fall, Putin''s early life and his subsequent rise to power.


  Today''s episode focuses on Brezhnev, Putin''s formative years, his early KGB career
  and Gorbachev''s descent into chaos.


  Was Putin a nationalist or a communist? What changed from Brezhnev to Gorbachev?
  What was Putin doing in East Germany during the Soviet twilight years?


  Producer: Dom Johnson

  Exec Producers: Tony Pastor & Jack Davenport


