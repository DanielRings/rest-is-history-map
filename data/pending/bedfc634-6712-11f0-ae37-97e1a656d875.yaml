title: 'RIHC: The Silk Roads, Ancient Asia, and Decentralising Europe'
description: 'Was Peter Frankopan''s book The Silk Roads a big hit in China because
  it re-centred Asia in the context of world affairs? What is the benefit of studying
  civilians instead of emperors? Did Europeans generally have more interest in exploring
  the world, compared to the Chinese? When did the trend of writing "global" history
  first emerge?




  Join Tom and guest Peter Frankopan as they talk about ancient history, discuss his
  book’s international impact, and celebrate its 10th anniversary.


