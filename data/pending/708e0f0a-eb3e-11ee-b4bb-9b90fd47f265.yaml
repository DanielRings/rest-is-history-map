title: 'RIHC: Medieval Martians, Samurai, and Mythical Mysteries'
description: 'How accurate is the TV series ‘Shogun’? Who were the mysterious green
  children of Woolpit - fairies, Flemish exiles with hypochromic anaemia, or extraterrestrials…?
  Can historians ever really suspend their disbelief and enter into the worlds they
  are exploring? Are there any mythological places that might once have been real?
  What made Belfast an industrial powerhouse in the early 20th century, rather than
  the rest of Ireland? Why weren’t pagan texts destroyed by early Christians? And,
  how have British newspapers changed over time?

  Join Tom and Dominic for this week''s bonus episode, as they discuss these thrilling
  historical subjects. 




  *The Rest Is History LIVE in 2024*

