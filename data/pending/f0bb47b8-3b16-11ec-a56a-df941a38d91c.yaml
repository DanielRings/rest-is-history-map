title: We’re All So 17th Century
description: 'Plague, pestilence and statue smashing are back in business. Has 2020
  turned out to be the 17th Century in disguise? And if so, has Boris Johnson become
  the new Oliver Cromwell, determined to crack down on the excesses of Christmas?
  Dominic Sandbrook and Tom Holland suggest things now are not as bad as we thought.



