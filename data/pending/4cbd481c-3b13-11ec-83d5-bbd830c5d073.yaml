title: The Beautiful Game
description: 'It has been described as the most universal cultural mode there has
  ever been, but is football a worthwhile object of study for historians?

  Sports journalist and author Jonathan Wilson joins Dominic Sandbrook and Tom Holland
  to look at the history of the game and how it became Britain’s most successful export.



