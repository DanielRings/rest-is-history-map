title: Germans Behaving Badly
description: 'Why is modern society so self-obsessed?

  The answer may be found in a group of late 18th century German rebels, including
  the writer Goethe and playwright Friedrich Schiller. Andrea Wulf joins Dominic and
  Tom in today''s episode to discuss the rebels'' progressive (and often scandalous)
  lives and her new book, ''Magnificent Rebels: The First Romantics and the Invention
  of the Self''. 


