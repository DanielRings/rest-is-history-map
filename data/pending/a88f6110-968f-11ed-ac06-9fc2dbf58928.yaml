title: 'RIHC: The Nine Days'' Queen, Lennon vs Hitler, and History in schools'
description: 'In today''s bonus episode, Tom and Dominic reflect on their Lady Jane
  Grey episode and their current series on the rise of the Third Reich. They discuss
  whether we should teach school children less about Nazism, the English obsession
  with Tudor women, whether John Lennon was worse than Adolf Hitler, and much more.


