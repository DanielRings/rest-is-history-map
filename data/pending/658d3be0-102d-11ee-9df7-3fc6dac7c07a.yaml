title: 'Oppenheimer: The Witch Hunt (Ep 2)'
description: 'Following the use of the atomic bomb in Japan and the end of the Second
  World War, Oppenheimer pushes for an international approach to nuclear power. This
  attitude towards nuclear secrets, alongside his history of close relationships with
  known communists, results in all his security clearances being revoked in 1954 after
  a public hearing. Join Tom and Dominic as they explore McCarthyism, American anti-communist
  hysteria, and Oppenheimer’s fall from grace.


