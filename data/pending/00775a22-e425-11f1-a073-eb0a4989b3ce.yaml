title: 'The Death of Captain Cook: At World’s End (Part 1)'
description: 'Why is Captain Cook’s reputation so contentious today? What happened
  during his second voyage, when attempting to discover the mythical southern continent,
  Terra Australis? And, would his final voyage drive him mad?




  Join Dominic and Tom as they discuss Captain Cook’s final adventures, his totemic
  discoveries along the way, and his descent into insanity before the end…




