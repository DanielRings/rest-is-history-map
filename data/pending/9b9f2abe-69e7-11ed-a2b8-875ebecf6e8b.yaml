title: 'Croatia: The Man Who Saved The Roman Empire'
description: '"In conditions of chaos, people from outside the Roman social elite
  can rise to the top."


  Join Tom and Dominic for their World Cup episode on Croatia, where they discuss
  the extraordinary life of the Emperor Diocletian. They talk about the Crisis of
  the Third Century, the Roman ''sidebar of shame'', crisis in Gaul, Roman Brexit,
  foundations of the Byzantine Empire, and the best fact Dominic has heard in the
  World Cup series so far...


