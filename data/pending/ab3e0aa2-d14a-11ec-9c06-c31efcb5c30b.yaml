title: Agatha Christie
description: 'Agatha Christie is the best-selling novelist in history.


  Coinciding neatly with the ''Wagatha Christie'' trial taking place between Coleen
  Rooney and Rebekah Vardy in the UK, Tom and Dominic look at Christie as a mirror
  held up to the 20th century, discuss what we can learn about Christianity and the
  concept of ''evil'' from her work, and debate the value of Tom''s Poirot impression.


  Producer: Dom Johnson

  Exec Producers: Jack Davenport & Tony Pastor


