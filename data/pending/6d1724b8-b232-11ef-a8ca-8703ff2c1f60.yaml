title: 'Warlords of the West: A Clash of Ice and Fire (Part 3)'
description: 'By 711, Europe and the Frankish warlords were facing a graver threat
  than ever before. Bands of Northern African, nominally Muslim raiders had begun
  a steady incursion throughout the west, loosely unified under the banner of the
  Umayyads. Having already taken and plundered the Christian territories of the Goths,
  their eyes now fell upon the Frankish kingdom in Gaul, by now the greatest power
  in Europe. It would be a formidable prize if taken. But fortunately for the Franks,
  their leader was the greatest of their warlords since the rise of Clovis I: the
  mighty Charles Martel. Finally, the two great hosts - Charles with his allies from
  Aquitaine and the Umayyads under the leadership of Abd al-Rahman al-Ghafiqi. A world
  shaking, spear shattering, brutally blood-shedding battle would ensue, the outcome
  of which would come to determine the future of Europe. 

  Join Tom and Dominic as they discuss the build up to, climax, and aftermath of the
  Battle of Tours - one of the most important battles in Western history, which would
  prove the making of the Franks, and pave the road to the ascent of Charlemagne. 

