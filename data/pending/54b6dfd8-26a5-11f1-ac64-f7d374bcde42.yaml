title: 'RIHC: The Hitler Interviews'
description: 'Who was George Ward Price, and how did his career as a journalist bring
  him into contact with some of the most powerful or famous characters of the 20th
  century? How did he come to interview Adolf Hitler? And, what did they discuss?In
  this week’s bonus episode, Dominic is joined by author Richard Evans, to discuss
  the fascinating life of George Ward Price - the man who interviewed Adolf Hitler._______Twitter:@TheRestHistory@holland_tom@dcsandbrookVideo
