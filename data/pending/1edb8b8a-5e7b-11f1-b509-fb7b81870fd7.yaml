title: 'South Africa: Mandela and the Death of Apartheid (Part 6)'
description: 'How did the rugby World Cup final of 1995 inspire South Africa’s totemic
  national anthem? Why does the story shed a light on the history of Apartheid in
  South Africa? And, after becoming president, following years of imprisonment, how
  did Mandela use rugby and the national anthem to forge a new South Africa? 




  Join Tom and Dominic as they discuss the inspiring story behind South Africa’s national
  anthem, the collapse of Apartheid, and Nelson Mandela’s presidency.


