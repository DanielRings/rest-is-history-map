title: Spartacus and Gladiators, with Mary Beard | FULL EPISODE
description: "Where did gladiatorial combat originate? Who was Spartacus, the legendary\
  \ gladiator? How did he come to lead the most famous slave revolt in all Roman history?\
  \ How did the rebellion unfold? And, what was Spartacus’ fate..?\n\n\n\nIn the grand\
  \ finale of our thrilling series on four of classical antiquity’s most notorious\
  \ subjects, Tom is joined by the world renowned classicist Mary Beard, to discuss\
  \ gladiators and the famous gladiator turned rebel Spartacus. \n\n\n\n_______\n\n\
