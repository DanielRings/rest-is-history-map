title: 'The World Cup: British Imperialism, South American rivalries, and Mussolini
  (Ep 1)'
description: 'Welcome to The Rest Is History''s definitive guide to the history of
  the FIFA World Cup, which looks past the football and uncovers the personalities,
  geopolitics, and drama behind the tournament.


  In the first of three episodes, Tom and Dominic debate whether the global game is
  a product of British Imperialism, vicious South American rivalries, Bolivians playing
  in berets, the looming shadow of the Second World War, Mussolini, Hitler, and more.


