title: 'The Rise and Fall of Hungarian Football: A Victim of the Revolution (Part
  2)'
description: 'In what way was Hungarian football a product of national culture in
  the first half of the 20th century? Who was Ferenz Puskás and why was he such an
  extraordinary player? And, how does the Hungarian Uprising put a seemingly permanent
  halt on their footballing success?&nbsp;




  In today’s special bonus episode, Dominic is again joined by author and journalist
  Jonathan Wilson, to conclude our mini series on The Rise and Fall of European Football.


