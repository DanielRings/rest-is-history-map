title: Thermopylae & Salamis - Part 2
description: 'Tom Holland and Dominic Sandbrook continue their celebration of the
  2,500th anniversary of the Persian invasion of Greece. Today, they look at two battles
  which have echoed down the millennia: Thermopylae, the very archetype of a heroic
  defeat, and Salamis, the great naval clash which saved Greece from Persian conquest.


