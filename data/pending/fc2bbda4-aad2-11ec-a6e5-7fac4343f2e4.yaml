title: 'Oil: The Making of the Modern World'
description: 'PART 1.


  Tom and Dominic are joined by Helen Thompson, Professor of Political Economy at
  the University of Cambridge, to talk about the incredible influence of oil over
  the last couple of centuries.


  Discussion covers the first oil well ever drilled, how it''s hard to overestimate
  Hitler''s obsession with oil, and the formation of OPEC in the aftermath of the
  Suez Crisis.


  Helen''s new book ''Disorder: Hard Times in the 21st Century'' is out now.


