title: The Murder of Richard II (Ep 3)
description: '“For within the hollow crown that rounds the hollow temple of a king…”

  Richard II, son of the dashing Black Prince and grandson of Edward III, became King
  of England at only ten years old. By the age of fifteen he had overcome one of the
  most terrifying threats to the English Crown up to that point: the Peasants’ Revolt
  of 1381. In the ensuing years, Richard’s rule became increasingly autocratic. This,
  coupled with the threat of foreign invasion and his dangerous proclivity for favourites,
  increasingly alienated Richard’s subjects, with rebel lords eventually taking up
  arms against the king. As the storm-clouds of civil war loomed large, King Richard
  II clung to his hollow crown….


  Join Tom and Dominic as they discuss the events that resulted in Richard’s deposition
  and mysterious death, and what his reign tells us the English monarchy in the 15th
  century.

  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 

