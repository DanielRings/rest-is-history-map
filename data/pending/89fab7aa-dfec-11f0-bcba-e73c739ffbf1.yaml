title: 'Joan of Arc: Heroine in Chains (Part 3)'
description: 'How was Charles VII, with the help of Joan of Arc, able to fight his
  way to Reims to be crowned in the ancient seat of French kings? Why was she able
  to continually defeat the formidable soldiers of England, in battle? And, how was
  Joan’s legendary ascent finally brought shatteringly down, as she fell into the
  hands of her dreaded English enemies…?  




  Join Tom and Dominic as the discuss the apex of Joan of Arc’s many triumphs, her
  continued war with the English, and the terrible moment that would see her captured,
  cast in irons, and put on trial for her life…


