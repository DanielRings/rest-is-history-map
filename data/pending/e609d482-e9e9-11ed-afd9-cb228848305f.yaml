title: 'Coronations: The Deep History (Ep 1)'
description: 'The roots of the coronation ritual are fabulously ancient: certain elements
  of the ceremony are vestiges from the later Roman Empire, others have their origins
  in the Old Testament and ancient Egypt. The liturgy used can be traced back to the
  10th century, and the very idea of kings taking part in rituals comes from Charlemagne. 

  In light of the first British coronation in more than half a century taking place
  this weekend, Tom and Dominic explore the historical and sacral roots of the coronation
  ritual.


