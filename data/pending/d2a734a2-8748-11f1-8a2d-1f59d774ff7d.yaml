title: Why Was Elizabeth I Such An Effective Queen?
description: "How did Elizabeth I’s and Mary Queen of Scots’ upbringing differ in\
  \ relation to their ruling abilities? Could Jane Grey have kept the throne? And,\
  \ what did Henry VIII’s people think of him at the time? \n\n\n\nJoin Tom and Dominic\
  \ as they answer these and many more questions in this week’s bonus Q+A.  \n\n\n\
  \n*The Rest Is History LIVE: The Ultimate Victorian Adventure*\n\nThe maddest expedition\
  \ in history and it’s NEVER been heard before on the show: join Tom Holland & Dominic\
  \ Sandbrook LIVE at the Southbank as they tell the bonkers story of Queen Victoria\
  \ ordering one of history’s most daring assignments ever. ⁠⁠Tickets available for\
  \ Friday 4th September⁠⁠, the Saturday show is SOLD OUT. \n\n\n\n_______\n\nTwitter:\n\
