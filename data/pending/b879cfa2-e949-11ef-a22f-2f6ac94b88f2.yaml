title: 'The French Revolution: The Monarchy Falls (Part 3)'
description: '“From this place and from this day forth commences a new era in the
  world’s history, and you can all say you were present at its birth!”

  By September 1792, the Prussians, under the leadership of the formidable Duke of
  Brunswick, were closing in on revolutionary Paris. There, the streets roiled with
  the clanging of church bells, thousands of volunteers, patriotic songs and slogans,
  and of course; the dead bodies of all those killed during the September Massacres.
  It was against this feverish backdrop that on the 20th, the new National Convention
  - the most democratic of the assemblies yet, with unlimited powers to remake the
  nation - met at the famous Riding School. And though it was riven by internal rivalries
  under the contentious three headed triumvirate of Danton, Marat and Robespierre,
  remake the nation it did. Voting to abolish the monarchy once and for all, the Convention
  declared the institution of a new world and a new beginning for France, with all
  state documents from that day forth bearing the immortal words, ‘Year One’. But,
  with their Prussian enemies baying at the gates, would revolutionary France survive
  to see more than one year? A great military reckoning was approaching, which would
  decide the fate of the new Republic and perhaps, universal liberty. As the armies
  of France and Prussia met for what would prove to be one of the most ideologically
  significant battles of all time, political tensions were mounting in Paris…

  Join Dominic and Tom for this crucial, tremulous episode of the French Revolution.
  With Prussia closing in, bodies littering the streets, and the revolutionary leaders
  hungry for each other''s blood, would the Revolution survive?



