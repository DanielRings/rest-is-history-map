title: 'The Peasants’ Revolt: London’s Burning (Ep 2)'
description: 'On the 13th of June 1381, the rebel army of English peasants, led by
  Wat Tyler, entered London and brought chaos, death and destruction upon some of
  the city’s most important buildings and figures, among them the Archbishop of Canterbury
  and his home at Lambeth Palace. Within the Tower of London, the 14 year-old Richard
  II and his government still cowered, with the rebels demanding that Richard’s treacherous
  advisors be handed over. Desperate, the charismatic young King was convinced by
  his advisors to ride out and meet the rebels. A meeting ensued, upon which the whole
  course of English history depended, as the radicals demanded terms that would mean
  the abolition of serfdom, and the transformation of the English social order forever. 


  Join Tom and Dominic as they describe the gory and unprecedented events of the Peasants''
  Revolt, and discuss the stories of mob violence, murder and vandalism…


  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 

