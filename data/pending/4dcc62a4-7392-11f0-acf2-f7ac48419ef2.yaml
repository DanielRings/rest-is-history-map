title: 'The Assassination of Abraham Lincoln: Death at the Theatre (Part 1)'
description: 'After passing the 13th amendment, in the closing weeks of the brutal
  American Civil War, what did president Abraham Lincoln - recently re-elected - do
  next to inflame his detractors? Crippled with guilt for the death and destruction
  of the war, was he indeed a unionist tyrant? What did Lincoln decide to do with
  the defeated rebel states? And, with time ticking for Lincoln’s life, who was John
  Wilkes Booth, the racist actor bent on Lincoln’s destruction?


  Join Dominic and Tom as they launch into the final days of one of America’s greatest
  presidents; Abraham Lincoln. Who would be his assassin, and where would he meet
  this tragic reckoning?


