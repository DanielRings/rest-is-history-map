title: 'Luther: Showdown with the Emperor (Part 4)'
description: '"I cannot and will not recant anything for to go against conscience
  is neither right nor safe.…Here I stand, I can do no other”

  The Diet of Worms in April 1521 was one of history’s most dramatic confrontations,
  a clash of the old world and the new. It saw the celebrity professor Martin Luther
  summoned to the imperial free city of Worms by the Holy Roman Emperor, Charles V,
  to defend his radical beliefs. And though his life was guaranteed by the Emperor,
  Luther had never been in greater danger. He arrived in the city to huge, ecstatic
  crowds, like Jesus returning to Jerusalem from the desert. But would his rhetorical
  brilliance and passionate defence save him and the future of protestantism, or would
  he doom himself to a fiery fate?


  Join Tom and Dominic as they discuss one of the most groundbreaking moments of western
  history: Martin Luther at the Diet of Worms in 1521, and the extraordinary twist
  of fate which saw the most famous man in Europe inexplicably vanish from the face
  of the earth. Defenestrated dogs, malevolent poltergeists and scatological furores
  abound... 





