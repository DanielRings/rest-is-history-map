title: 'The Terror: The Execution of Marie Antoinette (Part 3)'
description: 'In what conditions was Marie Antoinette - once the most glamorous woman
  in Europe - imprisoned for over a year, before and after the execution of King Louis
  XVI? Why were the French Revolutionaries divided on her own fate? And, how did she
  finally face the guillotine on October 16th, 1793?&nbsp;




  Join Tom and Dominic as they discuss one of the most shocking moments of the French
  Revolution, and the death knell to the monarchy: The execution of the former Queen
  of France, Marie Antoinette.


