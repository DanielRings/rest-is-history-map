title: 'RIHC: Historic Lovers, Liz Truss; and The Seven Years War'
description: 'Which historical character lost the most for lust? Does the Seven Years
  War count as a World War? If Hitler had known of the evil reputation he would come
  to incur, would he have done anything different? How effective was Britain during
  the Second World War in comparison to its performance in the First? What is the
  difference between an empire and a civilisation? Has any book, play, music, or musician
  genuinely had a significant influence upon the public as a whole? What was the biggest
  turning point in the history of medicine? And, following the release of Liz Truss’
  new book; which other former Prime Ministers have published memoirs, and which is
  the best? 

  Join Dominic and Tom for this week’s bonus episode, as they answer some intriguing
  historical questions. 




  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London!


