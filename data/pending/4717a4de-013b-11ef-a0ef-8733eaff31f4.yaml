title: 'RIHC: World War Three (Livestream)'
description: 'Was there a World War before the First World War? Why have apocalyptic
  mythologies always loomed large in human religions? Who was the mystic that predicted
  a Third World War in 1979? Which nation did she say would win, and why? Under what
  circumstances would the world be destroyed? Based on history, is there anything
  happening geopolitically in the world right now that could culminate in the outbreak
  of a Third World War?

  Join Dominic and Tom for this month’s livestream, as they discuss the great World
  Wars of history, apocalyptic prophecies, nuclear warfare, and the future of the
  world...




  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London!


  Buy your tickets here: therestishistory.com


