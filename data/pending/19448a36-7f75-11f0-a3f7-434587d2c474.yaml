title: 'The First World War: The Massacre of the Innocents (Part 4)'
description: 'What happened at the crucial, bloody, Battle of Ypres in October 1914?
  How did the battle come about? Why did the Germans and the British fight each other
  so brutally and for so long to take Ypres? What made the fighting so particularly
  violent? How were the British able to repel the relentless German onslaught time
  after time? What was the famous “Kindermord” - “the Massacre of the Innocents” -
  in the German army, and how true was it? And, what would be the outcome of this
  almighty clash?  


  Join Dominic and Tom as they discuss the terrible Battle of Ypres; its significance
  to the First World War overall, and its consequences for the rise of Hitler in Germany
  later on…. 






