title: China and World War II - Part 2
description: "Tom and Dominic welcome back special guest Rana Mitter to discuss China's\
  \ position during World War Two. \n\nThis episode covers the Rape of Nanjing by\
  \ Japanese forces, the military tactic of flooding the Yellow River, the deal between\
  \ Chinese Nationalist Wang Jin Wei and Japan, and the unlikely pairing of 'Vinegar\
  \ Joe' Stilwell and Chiang Kai-shek.\n\nTwitter:\n@TheRestHistory\n@holland_tom\n\
  @dcsandbrook\n\nEmail: restishistorypod@gmail.com"
