title: 'RIHC: The Princes in the Tower, Fabricated Evidence and History in the News'
description: 'Was the emperor Elagabalus really a woman? What do Tom and Dominic make
  of recent theories on the Princes in the Tower? Must historians be wary of transposing
  the political perspectives of the present onto the past? What goes into the making
  of an eight-part series? And if Tom could ask any historical figure one question,
  who would it be and what would he ask?


  Join Tom and Dominic for this week’s bonus episode as they answer these burning
  historical questions, and lift the curtain on what goes on behind the scenes. 



  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


