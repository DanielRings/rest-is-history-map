title: 'Joan of Arc: For Fear of the Flames (Part 4)'
description: 'What were the harsh conditions of Joan of Arc’s imprisonment, at the
  hands of her English captors? How did Joan’s trial unfold, and with what was she
  charged? And, would Joan confess at the last moment in order to save her own life…?




  Join Tom and Dominic as they discuss the terrible culmination of the life of Joan
  of Arc, as she endured imprisonment, stood on trial for her life, fought bravely
  for herself and the angelic voices that had guided her thus far, all while the flames
  of her doom drew nearer….




