title: 'The Road to The Great War: Countdown to Armageddon (Part 1)'
description: 'By the end of July 1914, the world hovered on the edge of a cataclysmic
  world war; Austria was at war with Serbia, Russia with Germany, and an ultimatum
  had been handed to Belgium. The July crisis had resolved itself in the most calamitous
  way possible. But how did this state of affairs erupt from the assassination of
  Archduke Franz Ferdinand and his wife, Sophie, in Sarajevo a month earlier? Even
  in the wake of their deaths war did not seem inevitable, with diplomats and politicians
  such as the British Foreign Secretary Sir Edward Grey manoeuvring to douse the flames
  kindled by the Serbian assassin Gavrilo Princip. The fires would, however, prove
  unquenchable, thanks to the implosion of of the Balkan powder keg beside a declining,
  desiccated Austro-Hungarian Empire, long fearful of Serbia, the rise of Germany
  under the eccentric Kaiser, as an industrious powerhouse to rival Britain, and the
  complex alliances and treaties that forbade the Great Powers any retreat from the
  coming inferno…

  Join Dominic and Tom as they set out upon Europe’s road to the First World War -
  the War to End All Wars - and explain how that devouring conflagration, which would
  see the end of the world as people knew it before 1914, came to pass.

