title: 'Oil: Conflict, Chaos and Climate Change'
description: 'PART 2.


  Tom and Dominic are back with Helen Thompson for a second episode on the history
  of oil, its impact and how it shapes geopolitics.


  Tune in to hear about the impact of oil production on US Politics, its importance
  to the history and current situation in Ukraine and what we can learn about oil
  from the exploits of J. R. Ewing in the TV show ''Dallas''.


  The pod also looks to the future, examining China''s explosive growth and advantageous position
  with Green Energy, whether Putin''s recent actions have shifted the basis of his
  geopolitical power and if Britain is on track for Net Zero by 2050...


  Producer: Dom Johnson

