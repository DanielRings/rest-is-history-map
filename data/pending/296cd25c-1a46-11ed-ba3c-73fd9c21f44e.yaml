title: 'Holidays: Byron''s Grand Tour (Ep 1)'
description: 'Welcome to the first of four episodes on the history of holidays: Byron''s
  Grand Tour; The Invention of Mass Tourism; Sun, Sea and Sex; and Roman Holidays.


  In the first episode, Tom and Dominic explore the adventures of Byron, Boswell and
  their contemporaries to foreign lands, where they pursued romance, sought to improve
  their health, and ''acquire'' authentic souvenirs.


