title: 'Wagner: LIVE at the Royal Albert Hall'
description: 'Was Richard Wagner a revolutionary artist who reshaped music forever,
  or an egotists mired in scandal, whose dangerous ideas were inseparable from the
  operas he created? How did the legendary worlds encapsulated in his bombastic music
  - featuring gods, heroes, and monsters - become entangled with politics and power? And,
  did Wagner inspire Hitler and the Nazis…?




  Join Tom and Dominic at the Royal Albert Hall, featuring the renowned  Philharmonia
  Orchestra, conducted by Oliver Zeffman, as they play the music of Wagner live, as
  they delve into the life of one of the most controversial but famous figures in
  all of musical history: Richard Wagner.


