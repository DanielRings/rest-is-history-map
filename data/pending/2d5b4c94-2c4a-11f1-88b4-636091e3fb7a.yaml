title: 'Dawn of the Samurai: The Shadow of the Sword (Part 1)'
description: 'When did the Samurai come into being? How did they go from being provincial
  outsiders to masters of Japan, outstripping their aristocratic overlords? And, were
  they really the deadly, honour-driven warriors of myth?




  Join Tom and Dominic as they discuss the rise of history’s most formidable warriors;
  Japan’s lethal Samurai, and the proliferation of their legend. 


