title: The Murder of Julius Caesar
description: '“He was trapped - he couldn’t get up. There was blood everywhere. The
  faces were coming closer, the knives rose and fell. And then, to his relief, he
  saw Brutus.” 

  One of the most iconic deaths in history, Caesar’s assassination is the brutal climax
  to an impressive series of victories: from triumphing during the First Triumvirate,
  to outlasting Pompey and Cato, gaining Imperator status and becoming dictator for
  life. How did it all come to such a gory end?


