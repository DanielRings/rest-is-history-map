title: 'RIHC: The Bloodiest Place in History, Hitler''s Evil Rivals, and Ageing Politicians'
description: 'Which place on Earth has seen the most death over the course of history? Pre-Hitler,
  who was considered the most evil person of all time? Are Churchill’s histories of
  England any good? Which of Shakespeare’s plays has had the greatest cultural impact?
  And what is the historical significance of an ageing political class? Join Tom and
  Dominic in this week’s bonus episode as they attempt to answer these difficult questions,
  and many more...


