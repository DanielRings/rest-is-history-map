title: 'RIHC: Marie Antoinette: The First Fashion Icon'
description: "Was Marie Antoinette the first style icon and celebrity? What was it\
  \ like to be shipped off as a child bride? Why has her legacy endured in a way that\
  \ few historical figures have? \n\nIn this week’s bonus episode, Tom is joined by\
  \ historian and museum curator Sarah Grant, to discuss the V&amp;A’s brand new exhibition;\
  \ curated by Sarah herself, ‘Marie Antoinette Style’, and the notorious fashion\
  \ of one of history’s most glamorous women.\n\n_______Twitter:@TheRestHistory@holland_tom@dcsandbrookProducer:\
  \ Theo Young-SmithAssistant Producer: Tabby Syrett + Aaliyah AkudeExecutive Producers:\
  \ Jack Davenport + Tony Pastor"
