title: 'JFK: A Conspiracy Unmasked (Part 6)'
description: '“We can’t accept very comfortably that two nobodies, two nothings -
  Lee Harvey Oswald and Jack Ruby - were able to change the course of world history.”


  The murder of Lee Harvey Oswald, JFK’s apparent assassin, by the night club owner
  Jack Ruby on 24th November 1963 changed everything. Right from the start, rumours
  had circulated that Oswald had not been acting alone, building on the deep anxieties
  of American society in the 1950s and 1960s. Some blamed Communist states such as
  Cuba or the Soviet Union; others anti-Castro exiles, or the Ku Klux Klan. As the
  years passed, the CIA and FBI came under suspicion. Did Lyndon Johnson know more
  about the conspiracy than he pretended? Just what was Richard Nixon doing on that
  fateful day? And how did Frank Sinatra’s drummer fit in?


  Join Tom and Dominic as they explore the background to the Kennedy conspiracy theories,
  from umbrella men to grassy knolls, discussing the wider context and investigating
  every last clue in their tireless search for the truth.




  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


