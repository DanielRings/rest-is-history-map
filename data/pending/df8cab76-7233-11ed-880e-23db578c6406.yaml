title: 'Senegal: The Door of No Return'
description: 'In today''s episode, Tom and Dominic discuss the Senegalese island of
  Gorée, and its relationship with the transatlantic slave trade. They look at both
  the history and mythology of the "House of Slaves", which still stands today as
  a vestige to human exploitation.


