title: 'The French Revolution: The Women''s March on Versailles (Part 7)'
description: 'By the summer of 1789 the different sections of the Revolution were
  at loggerheads, and the recently created National Assembly riven in two. Both factions,
  the radicals on the left and the more moderate revolutionaries on the right, upheld
  different interpretations of how the new system of governance, so firmly rooted
  in the idea of ‘la nation’, should be organised, particularly as concerned the authority
  of the King and the power of his veto. Tensions mounted, with many opposed to the
  idea of even a constitutional monarchy, and disgusted by the National Assembly’s
  willingness to treat with Louis XVI. None more so than the citizens of Paris, who
  progressively came to embody an amorphous but growing sense of ‘the people’. By
  July, there was a widespread feeling that some sort of violence would inevitably
  break out in the city against the royal family, thanks in part to the rising bread
  prices. The form it took in October of that year would prove more dramatic than
  any could have foreseen. After a lavish banquet in Versailles, an outcry began building
  in the marketplaces of Paris, with a swelling contingent of peasant women decrying
  the hunger of their children, and blaming it upon the Queen and the vampires of
  the court. Then, in a move that would change the fate of France and particularly
  Marie Antoinette forever, the army of women marched on and entered the palace…

  Join Tom and Dominic as they describe one of the most terrifying and savage events
  of the entire French Revolution: the Women’s March on Versailles, which saw the
  queen - barefoot and sobbing - hostage to a head-hacking mob that clamoured for
  her entrails.

