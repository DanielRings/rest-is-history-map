title: 'Ancient Carthage: Lords of the Sea (Part 1)'
description: '“Carthago delenda est.”

  Carthage must be destroyed: this was the rallying cry of Cato the Elder, the senator
  endlessly pushing for war against Rome’s sworn enemy, Carthage. But what are the
  origins of this supposedly decadent and sinister city, and did the Carthaginians
  really sacrifice their children? Starting as a crafty, seafaring people called the
  Phoenicians, a mighty mercantile civilisation emerged, who would eventually come
  to be know as the Carthaginians. But who were the Phoenicians, and why are they
  so mysterious? From the Bible, the Iliad and the Odyssey, to Herodotus’ account
  of the Persian Wars, and the conquests of Alexander the Great, their shadow haunts
  Antiquity…

  Join Tom and Dominic as they investigate the Phoenicians, the first masters of the
  Mediterranean. Pioneers of seafaring, craftsmanship and writing, these were the
  people who gave birth to Rome’s most feared enemy, Carthage. Myths, legends, child-sacrifice,
  and the rise and fall of civilisations abound.





