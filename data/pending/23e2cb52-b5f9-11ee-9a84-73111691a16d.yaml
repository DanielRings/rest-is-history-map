title: The Man in the Iron Mask
description: 'In the late 17th century, during the glorious reign of Louis XIV, the
  Sun King, France was at its apogee, with royal absolutism at its zenith. But, beneath
  the gold and glamour of Louis’ reign, there lay a terrifying darkness: a prison
  system into which people could be disappeared without a trace. And at the very heart
  of this darkness there lurked an excruciating secret…a prisoner, his terrible crime
  unknown, moved from prison to prison, forbidden to speak, and whose face was encased
  at all times in a mask of steel. Who was he, if he even existed at all? An English
  spy? Louis’ long-lost father, driven into obscurity? Or, even more threateningly,
  his twin brother? 



  Join Tom and Dominic as they explore one of the greatest mysteries of all time:
  the Man in the Iron Mask. Following in the footsteps of Voltaire and Alexandre Dumas,
  they definitively solve the case and reveal, once and for all, the identity of this
  enigmatic figure…



  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 

