title: 'RIHC: The Brothers Holland, Masters of the Air and Ghostly Centurions'
description: 'What would have happened if Jesus had survived? Why were swastikas painted
  on some American planes during the Second World War? What were the weaknesses of
  the American B17 flying fortresses? How historically accurate is the new WWII drama,
  Masters of the Air? Is it even better than its forerunner; Band of Brothers? What
  is living history? And, what were the origins of The Rest is History and its progenitor;
  We Have Ways of Making You Talk? 

  In this week’s bonus, with Dominic on holiday, Tom is joined by his brother, historian
  of war James Holland, to discuss some fascinating historical questions, history
  festivals, and much, much more.




  *The Rest Is History LIVE in 2024*


  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London!


