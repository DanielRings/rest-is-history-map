title: 'Baghdad: The Arabian Nights (Ep 4)'
description: 'The setting for so many of the Arabian Nights, like the stories of Sinbad
  the Sailor, Ali Baba and the Forty Thieves, or Aladdin, Baghdad during the Islamic
  Golden Age had a shimmering image, a dimension of mystery and wonder… Join Tom and
  Dominic in the final part of our series on the history of Baghdad, as they explore
  the tales of One Thousand and One Nights, and the city of Caliphs, Hadiths, thieves,
  and of course, pigeon racing! 


  *The Rest Is History Live Tour 2023*:


  Tom and Dominic are back on tour this autumn! See them live in London, New Zealand,
  and Australia!


