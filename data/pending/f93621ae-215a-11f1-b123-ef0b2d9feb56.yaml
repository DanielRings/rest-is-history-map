title: 'The Ku Klux Klan: Terror in the South (Part 2)'
description: 'How and why did the terrible violence of the Ku Klux Klan escalate?
  What was the political context in America for their rising popularity? And, how
  was this first iteration of the Klan finally brought down?




  Join Dominic and Tom as they discuss American politics after the Civil War, the
  growing popularity of the Ku Klux Klan in the American south and their increasingly
  barbaric treatment of freedmen, as well as their final destruction…    




