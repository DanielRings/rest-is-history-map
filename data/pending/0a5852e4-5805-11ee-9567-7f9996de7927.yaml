title: 'The 1973 Chilean Coup: Allende, Nixon and the CIA (Ep 1)'
description: 'In the midst of the Cold War, the 1973 coup against the socialist Chilean
  president Salvador Allende, led by General Pinochet with the support of Richard
  Nixon, remains a seismic episode in Latin American history. A story imbued in American
  Imperialism, Allende sees off waves of attempts by the U.S. to oust and undermine
  him, until they exhaust all legal and parliamentary means, and seek new ways to
  derail Chilean socialism. In today’s episode, Tom and Dominic delve into Salvador
  Allende’s rise to power, his radical new vision for Chile, and why and how the U.S.
  sought to undermine him… 


