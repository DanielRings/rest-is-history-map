title: 'American Civil War: Gettysburg (Ep 3)'
description: 'Tom, Dominic and historian Adam Smith look at the most famous battle
  of the war and Abraham Lincoln’s 272 word address that became one of the best known
  speeches of all time. They also discuss the conditions of the black population during
  the conflict.


