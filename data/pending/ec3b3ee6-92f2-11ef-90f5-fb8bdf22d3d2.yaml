title: 'America in ''68: The Assassination of Martin Luther King (Part 2)'
description: 'The peaceful figurehead of the Civil Rights movement in the early 1960s,
  Dr Martin Luther King had inspired hundreds of thousands to demand equal rights
  for African Americans. But by 1968, the once uniting leader seemed to be losing
  popularity, both amongst activists and in the press. As he grappled with being hunted
  and threatened by the FBI, he was also contending with a new generation of more
  militant activists who felt that his nonviolent approach was not working. Downtrodden
  but not defeated, King plans a new Poor People’s Campaign to combat poverty in America.
  As part of this new focus, he visits Memphis to support striking sanitation workers.
  The day before his final moments at the Lorraine Motel, he preaches to a crowd,
  ‘I may not get there with you. But I want you to know tonight, that we, as a people,
  will get to the Promised Land.’


  Join Dominic and Tom as they discuss the tragic assassination of Martin Luther King,
  including the public outcry that ensued, and his more recent legacy as a secular
  saint in the USA with a dedicated national holiday.


