title: Medieval Treason (Ep 1)
description: 'Join Tom and Dominic at the National Archives as they explore the history
  of treason in Britain, going right back to the 1351 treason act. How has treason
  changed since its inception? Why are traitors hanged, drawn, and quartered? What
  impact did the reformation have upon treason? As these questions are answered, the
  story will interlink with some of the biggest characters in British history: Richard
  III, Henry VIII, James I, and more!


  Treason: People, Power and Plot opens at The National Archives on 5th November and
  runs until 6th April. It is free to all. For all information and to delve deeper
  please visit nationalarchives.gov.uk/treason.


