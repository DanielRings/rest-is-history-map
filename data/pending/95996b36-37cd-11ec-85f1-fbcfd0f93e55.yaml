title: The Wild West
description: 'Podcasting’s answer to Butch Cassidy and the Sundance Kid - that’s Tom
  Holland and Dominic Sandbrook of course - explore the Wild West in both fact and
  fiction. Does the romantic representation in both fiction and film bear any resemblance
  to the historical truth? And why are we still so intrigued by the myth of the American
  western frontier?



