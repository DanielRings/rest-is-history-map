title: The Fall of the Soviet Empire (Episode 2)
description: '[Episode 2 of 4]


  This episode of The Rest Is History marks the second instalment in our four part
  series on the Soviet Union, Russia and the rise of Vladimir Putin.


  From the 70th anniversary of the Russian Revolution in 1987 to the fall of the Soviet
  Union on Christmas Day 1991, this episode is jam-packed full of late Soviet drama. 


  Tune in now to hear about the abuse Yeltsin received after his attempted suicide,
  the failed Soviet coup of 1991 and Putin''s return from East Germany. 


  Producer: Dom Johnson

  Exec Producers: Tony Pastor & Jack Davenport


