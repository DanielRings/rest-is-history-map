title: '1066: The Shadows of War (Part 1)'
description: "Why is 1066 the most important year in English history? Who were the\
  \ three main candidates vying for the English throne on the eve of Edward the Confessor’s\
  \ death? And how did the coronation of one of them on the 14th of October 1066 trigger\
  \ one of the most famous invasions of all time? \n\nJoin Tom and Dominic as they\
  \ launch into the dramatic series of events, at the dawn of 1066, that sparked the\
  \ build up to the Battle of Hastings…\n\n_______\nTwitter:\n@TheRestHistory\n@holland_tom\n\
  @dcsandbrook\nProducer: Theo Young-Smith\nAssistant Producer: Tabby Syrett + Aaliyah\
  \ Akude\nExecutive Producers: Jack Davenport + Tony Pastor"
