title: The Fall of Liz Truss
description: 'After just 45 days, Liz Truss has resigned.


  Join Tom and Dominic for this special episode to discuss her place in history. Is
  she Britain''s worst ever Prime Minister? Is this the worst crisis in post-war British
  history? How does she compare to Gordian I? Is Tom Holland getting a peerage? All
  will be answered.


