title: 'RIHC: Ronald Reagan’s Near Assassination, JFK’s Ghost, and Jodie Foster’s
  Stalker'
description: "How was President Ronald Reagan almost assassinated on March 30th 1981,\
  \ only seventy days into his presidency? Who was John Hinckley Jr., the man behind\
  \ the attempt? What motivated this drastic action? Where was the president? How\
  \ did the events of that fateful day unfold? How did Reagan survive? Did anyone\
  \ else die? Where was he injured, and how severely? Was there any connection between\
  \ this  attempt upon his life, and the assassination of John F. Kennedy? How did\
  \ Reagan react to Hinckley’s attack?  What became of the would-be assassin? And,\
  \ what were the consequences of this near miss for the rest of his presidency? \n\
  \n\n\nIn this week’s bonus episode, Tom is joined by renowned journalist, Del Quentin\
  \ Wilber, to discuss the attempted assassination of President Ronald Reagan, as\
  \ depicted in his book, ‘Rawhide Down’.\n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\
  \n@holland_tom\n\n@dcsandbrook\n\nProducer: Theo Young-Smith\n\nAssistant Producer:\
  \ Tabby Syrett + Aaliyah Akude \n\nExecutive Producers: Jack Davenport + Tony Pastor"
