title: Reagan, Iran-Contra and the Cold War (Ep 3)
description: 'Warmonger or nuclear disarmer? Ronald Reagan’s presidency survived an
  assassination attempt, the AIDS epidemic and the Iranian hostage crisis. He powered
  through the 80s, creating his own truth and narrative, in a series of events that
  read like a Hollywood screenplay. 

  Tom and Dominic take a look at the impact of Reagan''s presidency, the enduring
  effects of his politics, and why none of the scandals that scarred his time in office
  led to his downfall. They reflect on Reagan''s legacy, and whether he can truly
  take credit for ending the Cold War, as the curtain falls on his blockbuster presidency.


