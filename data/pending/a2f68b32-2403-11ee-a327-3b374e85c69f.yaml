title: 'Amsterdam: Kings, Canals and Coffee Houses (Ep2)'
description: 'A city which played a fundamental role in both the Dutch Golden Age
  and the birth of the Dutch monarchy, Amsterdam has also stood in the avant-garde
  of European liberalism since the Second World War. Join Tom and Dominic on the second
  part of our walking tour through Amsterdam, as they look at the importance of its
  canals, the changing role of the Amsterdam Royal Palace, the Portuguese Synagogue
  and its relationship with the city’s jewish population, and more.


  *The Rest Is History Live Tour 2023*:


  Tom and Dominic are back on tour this autumn! See them live in London, New Zealand,
  and Australia!


