title: 'The Suez Crisis: Britain''s Shattered Empire (Part 2)'
description: 'What role did France, Russia, America and Israel play in the Suez Crisis
  of 1956? Did the Egyptian leader, President Gamal Abdel Nasser, respond to the foreign
  invasion with military force? And, how did the debacle unfold?&nbsp;




  Join Dominic and Tom as they embark upon the final, dramatic leg of the Suez Crisis,
  and explain the outcome of the scandal.&nbsp;&nbsp;&nbsp;




