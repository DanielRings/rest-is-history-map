title: 'RIHC: Religious Sects, Prussian Sex Scandals, and The Rise of the Tabloids'
description: 'How did a bizarre religious sect come to dominate the formerly powerful
  city of Königsberg in the summer 1835? What were their practices and beliefs? Who
  was the man behind this strange movement? What did he come to believe about the
  truth nature of creation, and what proofs did he draw upon? Were the rumours about
  the sect’s sexual depravity unfounded, or true? Why did Königsberg become a breeding
  ground for mysticism and religious revival in the aftermath of the Napoleonic wars,
  as well as a bastion of Kantian rationalism, and Lutheranism? What became of this
  sordid sexual scandal in the heart of Königsberg? What broader connotations did
  The Königsberg Scandal, and the persecution of the sect’s members have for the development
  of a brand new public sphere? And, what can scandals always teach us about the anxieties
  that haunt any culture at a particular time?




  In this week’s bonus episode, Dominic is joined by the eminent historian, Sir Christopher
  Clark, to discuss one of the most intriguing scandals of all time, as described
  in his new book, ‘A Scandal in Königsberg’. 




