title: 'Lee Miller: Uncovering the Horrors of World War Two'
description: 'It’s August 1944: the Liberation of Paris is underway, and France appears
  to slowly be extricating herself from Nazi control. But, on the French western shores,
  in Saint-Malo, the deafening sounds of artillery fire continue to punctuate daily
  life, with the Germans making a last-ditch attempt to hold the coastal town. And
  when the U.S. Army arrive to lay siege to the German positions, the last person
  expected to be among the Allied forces is a photographer, let alone a female one…
  Until the publication of The Lives of Lee Miller in 1985 by her son, Antony Penrose,
  very little was known of the woman who forced her way into occupied Europe, and
  documented the true horrors of the Nazi campaign. Her photographs capturing Nazi
  evil went around the world, exposing the atrocities of the Holocaust and the harrowing
  aftermath of the death of Hitler.


  Now, her incredible story is being told in a new film, LEE, with Kate Winslet taking
  on the role of the formidable title character. From a marriage to a man famed for
  dying himself blue, to a staged photoshoot in Hitler’s bathtub, Join Tom and Dominic
  as they explore the extraordinary story of Lee Miller.


  Joining Winslet is Andy Samberg playing Life Magazine photographer David E. Scherman;
  Alexander Skarsgård playing English Surrealist painter, photographer, poet and biographer
  Roland Penrose; Marion Cotillard playing Solange D’Ayen, the fashion director of
  French Vogue and close friend of Miller’s: Josh O’Connor playing Tony, a young journalist
  and Andrea Riseborough playing British Vogue Editor Audrey Withers. Only in cinemas
  from Friday 13th September, book tickets now - https://www.leefilm.co.uk 


  As always we appreciate your feedback on The Rest Is History to help make the podcast
  better: https://forms.gle/GymJghf56DFzZ8rAA

