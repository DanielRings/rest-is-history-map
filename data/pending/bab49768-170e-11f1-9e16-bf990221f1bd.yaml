title: 'London’s Golden Age: Sex and Scandal in Georgian Britain (Part 2)'
description: "Why was London such a cauldron of sexual scandal and political tumult\
  \ in the 18th century? What licentious escapades did the infamous Scottish nobleman,\
  \ James Boswell, get up to there? And, how did his legendary first meeting with\
  \ the renowned wit Samuel Johnson unfold?  \n\n\n\nJoin Tom and Dominic, as they\
  \ delve into the tumultuous, salacious life of James Boswell - the ultimate celebrity\
  \ hunter - his extraordinary adventures in 18th century London, and his encounters\
  \ with three of the greatest men of the age. \n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\
  \n@holland_tom\n\n@dcsandbrook\n\nVideo Editors: Jack Meek + Harry Swan \n\nSocial\
  \ Producer: Harry Balden\n\nProducers: Tabby Syrett & Aaliyah Akude \n\nExecutive\
  \ Producer: Dom Johnson"
