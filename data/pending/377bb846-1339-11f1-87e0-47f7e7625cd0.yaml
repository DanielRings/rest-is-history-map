title: Medieval Combat, Jimmy Carter’s Killer Rabbit, and the Northern Pit of Death
description: "The Rest Is History Festival is coming. Have you signed up to the ballot?\n\
  \n\n\nIt will be two full days of talks, live music, immersive experiences and close-up\
  \ demonstrations from Historic Royal Palace’s curators. Plus, explore the grounds\
  \ and the Palace at your own leisure. Bring your own picnic blankets, chairs, and\
  \ settle in for a weekend of engaging talks and hands-on history with your two favourite\
  \ hosts.  \n\n\n\nSaturday, 4th July:\n\nDominic with Tracy Borman on the Tudors,\
  \ Tom with Ali Ansari on Persia, Dominic with Paul Rouse on Ireland, and Tom with\
  \ Mary Beard on Rome.\n\n\n\nSunday, 5th July:\n\nDominic with Katja Hoyer on Weimar\
  \ Germany, Tom with Helen Castor on Elizabeth I, Dominic with Adam Smith on US Presidents,\
  \ and Tom with Dan Jackson on The Momentous Pit Disaster.\n\n\n\nThe ballot and\
  \ registering interest form close at midnight on Sunday, March 8th, so sign up today!\n\
  \n_______ \n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\nVideo\
  \ Editors: Jack Meek + Harry Swan \n\nSocial Producer: Harry Balden\n\nProducers:\
  \ Tabby Syrett & Aaliyah Akude\n\nExecutive Producer: Dom Johnson"
