title: 'Evita: The Rise of General Perón (Part 2)'
description: 'An admirer of Hitler and Mussolini, Colonel Perón rose through the ranks
  during the 1943 military coup in Argentina. Following a disastrous earthquake in
  1944, Perón crossed paths with Eva at a fundraising event. Now a successful radio
  actress, Eva was 20 years his junior but became completely infatuated with him and
  swiftly removed her romantic rivals. And despite the relationship being unpopular
  amongst his army comrades, the two grew closer. Meanwhile Peron gathered support
  amongst trade unions through his rousing, dramatic speeches, and began his journey
  toward ultimate political power…

  Listen as Dominic and Tom discuss how Eva became Perón’s mistress and gradually
  rose to be seen by his side in the public imagination.

  _______


