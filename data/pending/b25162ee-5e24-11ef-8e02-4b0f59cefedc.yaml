title: 'RIHC: Nazi Assassination Attempts, Alchemy, and The Greatest Historical Novel'
description: 'Which mythical figure from history would Dominic most like to have existed?
  Which assassination attempt, had it succeeded would have had the greatest impact
  on the course of history? If Hitler had been killed in 1944 could there have been
  a third Great War? Who was Augustus the Strong; the alchemy obsessed, fox tossing
  king of Sweden? What took place during the unbelievable Great Northern War in which
  Frederick the Great fought for his lands? Which is more likely to generate good
  government - parliamentarianism or presidentialism? Why are the British traditionally
  so obsessed with class and will it endure? And, what is the most important historical
  novel of all time?

  In this week''s episode, with Tom away, Dominic is joined by Assistant Producer
  Tabby to discuss some tantalising historical subjects, and answer some intriguing
  questions.

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

