title: 'The Last Viking: Warrior of the New Rome (Part 2)'
description: 'Harald Hardrada; exiled prince of Norway and mercenary, has landed in
  the greatest city on Earth: Constantinople. There he joins one of the most prestigious
  military organisations in the world, the Varangian Guard, charged with protecting
  the Emperor. Almost the next ten years of Harald’s young life are spent at war protecting
  the city from enslaving raiders. But then, he becomes embroiled in the dark and
  complex political intrigues and plots of the Byzantine court. Zoe, the formidable
  wife of the recently deceased Emperor Michael IV, who had been exiled by her husband’s
  successor, recruits Harald to help her seize the throne. Wealthy, influential and
  renowned in the world’s most glittering city, things have never seemed better for
  Harald. But then, does he overreach and embark upon a dangerous affair with the
  empress herself? Imprisoned for his crimes, Harald manages to slay the terrible
  serpent haunting his prison cell, and escape at last back to Kyiv. But his ambitions
  still lie further north, in Norway, and the throne he is determined to reclaim…


  Join Dominic and Tom and they discuss Harald Hardrada’s astonishing time as a Varangian
  Guard in Constantinople, his hair-raising escape back to Scandinavia, and his fight
  for the throne of Norway, on the road to the dramatic climax of his epic life: the
  Battle of Stamford Bridge in 1066.



