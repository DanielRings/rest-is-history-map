title: 'Paris 1968: The Students'' Revolt (Ep1)'
description: 'May 1968 saw underlying tensions reach a climax in France, resulting
  in a period of civil unrest coloured by rioting, general strikes, and the occupation
  of universities and factories. Join Tom and Dominic in the first part of our tour
  through the streets of Paris, as they tell the story of how France’s economy came
  to a halt at the hands of cobblestone-wielding students.



