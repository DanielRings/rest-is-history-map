title: 'Helen of Troy: Queen of the Greek Myths (Part 1)'
description: 'The story of Helen of Troy, her remarkable birth and her infamous love
  affair with Paris, the Trojan prince, resounds across the centuries. A figure of
  condemnation, pity and tragedy, her beauty set in motion the most legendary literary
  conflict of all time: the Trojan Wars. Yet, Helen’s story reaches far beyond Homer
  and the Iliad. From her godly parentage and the egg from which she hatched, to her
  marriage to the king of Sparta and her abduction to Troy, Helen crossed paths with
  the greatest figures of Greek mythology. But in a story told almost entirely by
  men, what then is the truth of Helen? Was her fabled life one of abuse and oppression,
  or was she the mistress of her own fate? And could it be that she did in fact really
  exist?


  Join Tom and Dominic as they journey through the life of Helen of Troy, into worlds
  of myth and legend, and explore the significance of this most iconic of women -
  both for the world of the Ancient Greeks, and our world today. 





