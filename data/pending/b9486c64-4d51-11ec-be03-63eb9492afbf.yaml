title: The East India Company
description: 'Tom and Dominic are joined by historian William Dalrymple to tell the
  fascinating and shocking story of the East India Company in the 18th century. How
  could a gang of “spectacularly corrupt” merchants conquer vast parts of Asia from
  a small office in London with just 35 employees? And how did the company’s actions
  pave the way for British government rule in India.


