title: 'RIHC: Mexican History, East German perspectives, and Roman dog epitaphs'
description: 'Do historians tend to look at East Germany through rose-tinted glasses?
  Which 20th century American president would humiliate his aides by defecating in
  front of them? How are the Spanish conquistadors viewed by Mexicans today? Which
  unexpected English high street has an "incredible concentration of History", including
  a pub where Nelson was a regular? In this week''s bonus, Tom and Dominic discuss
  these questions, and many more.


