title: 'The Netherlands: The Revolt that Made The Modern World (Part 4)'
description: 'How is the Dutch national anthem, that has its origins during a 1568
  siege of a French city, connected to the Dutch Revolt? What is the revolt’s role
  in the birth of modernity? And, why does it say ‘to the King of Spain I’ve granted
  a lifelong loyalty’?




  Join Tom and Dominic as they discuss the national anthem with the deepest history,
  the Wilhelmus.


