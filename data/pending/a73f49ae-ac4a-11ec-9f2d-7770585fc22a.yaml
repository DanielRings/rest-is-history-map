title: 'The Falklands War: Countdown to Invasion (Ep 1)'
description: 'Welcome to our mini-series on The Falklands War, where Tom and Dominic
  will break down the causes, conflict and aftermath of the war on its fortieth anniversary. 


  In the first episode we dig into the history of the islands, the causes behind the
  Argentine invasion, and the domestic situation in both Britain and Argentina in
  the late 70s and early 80s.


  The boys also dissect the almost farcical events that took place in the build up,
  some of the memorable characters like Rex Hunt, and the significance of a reindeer
  barbecue in South Georgia.


  Producer: Dom Johnson

  Exec Producers: Jack Davenport & Tony Pastor


