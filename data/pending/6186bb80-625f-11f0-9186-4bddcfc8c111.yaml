title: 'The Lion, The Priest and the Parlourmaids: A 1930s Sex Scandal'
description: 'Who was the Rector of Stiffkey, Harold Davidson - the "Prostitutes''
  Padre" - and why was he Britain’s most notorious curate? Was it his unnerving infatuation
  with girls that saw him put on trial and defrocked in 1932? What was the nature
  of the scandal surrounding the case? What did he do in later life that saw him displaying
  himself publicly in a barrel in Blackpool? And, why did he meet his gory end between
  the jaws of a lion….?


  Join Dominic and Tom as they discuss the bizarre and slightly sinister story of
  one of history’s most eccentric men: the notorious Rector of Stiffkey. 


