title: 'RIHC: Class in Britain, heretical historians, and dead men talking'
description: 'Would Tom Holland''s latin be good enough for Julius Caesar? Does working
  for cultural institutions come at a cost? Is clothing still a reliable marker of
  social class? And most importantly, how many episodes of The Rest is History truly
  exist? This week''s bonus episode attempts to answer these difficult questions,
  along with many more...


