title: 'RIHC: The Medieval World, Mystical Manuscripts, and the Red Book of Bath'
description: "How did the monks of 13th century England study the Hebrew parts of\
  \ the Bible? What happened to Hiberno-English? What makes The Red Book of Bath the\
  \ 15th century iPhone?  What do the scribe of this Arma Christi have in common with\
  \ the manager of the Rolling Stones?  \n\n\n\nIn this week’s bonus episode, Tom\
  \ travels to the British Library to study in person, and discuss with Julian Harrison,\
  \ the library’s  Lead Curator of Medieval Historical and Literary Manuscripts, \
  \ some of their extraordinary and very rare medieval manuscripts , and the remarkable\
  \ religious complexities they depict.\n\n\n\nAccess over 1,000 of the British Library's\
  \ digitised manuscripts, including a range of manuscripts digitised as part of their Medieval\
  \ and Renaissance Women digitisation project: ⁠https://www.bl.uk/research/digitised-manuscripts/⁠\n\
  \n\n\nRegistered Readers at the British Library will also be able to arrange to\
  \ come and see the manuscripts in person at the Library. Readers who are interested\
  \ in viewing the manuscripts can get in touch with the Manuscripts team via emailing\
  \ mss@bl.uk\n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\
  \nProducer: Theo Young-Smith\n\nAssistant Producer: Tabby Syrett + Aaliyah Akude\
  \ \n\nExecutive Producers: Jack Davenport + Tony Pastor"
