title: 'Elizabeth I: The Virgin Queen (Part 4)'
description: 'How was Elizabeth I finally crowned Queen of England, after long years
  of perilous waiting? Why was her early reign so fraught with danger? Who was William
  Cecil, Elizabeth’s new secretary, and the key political player of her rule? And,
  why was she so determined to remain the unmarried, ‘ Virgin Queen’?




  Join Tom and Dominic as they reach the glorious climax of Elizabeth I’s long and
  dangerous journey to the throne of England, as she finally embarked upon one of
  the most famous reigns in all English history, rife though it would be with innumerable
  dangers, and royal rivals…  






