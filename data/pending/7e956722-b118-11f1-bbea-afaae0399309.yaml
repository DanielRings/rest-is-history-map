title: 'The Terror: An Assassination in Paris (Part 1)'
description: 'How did the infamous murder of Jean-Paul Marat, one of the great firebrands
  of the French Revolution, unleash the bloody Terror? Why did the clashing political
  factions of the Revolution escalate the fractious atmosphere in France? And, which
  other apocalyptic threats saw the French masses clamouring for the blood of their
  brothers?&nbsp;




  Join Dominic and Tom as they launch into one of the most violent events in all world
  history: The Reign of Terror in Revolutionary France, and the murder of Marat, which
  served as one of its catalysts.&nbsp;


