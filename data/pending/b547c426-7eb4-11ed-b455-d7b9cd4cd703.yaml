  England: Roast Beef and Liberty

  While it has now been dethroned by the mighty Tikka Masala and the moreish fish
  and chips, Britain''s most iconic dish was once - indisputably - Roast Beef. 


  In the final episode of the World Cup marathon, Tom and Dominic chart the dish’s
  prominence over the years and how, as an affront to the French, it became a rallying
  point for British patriotism and conservatism.


