title: 'RIHC: The French Invasion of Britain, Marxism without Marx, and Right-Wing
  Painters'
description: 'Is China destined to dominate world history? Did Elvis pave the way
  for Beatlemania, and the British Invasion of the 60s? What are history’s most significant
  unintended consequences? Does Dominic consider George W. Bush a better painter than
  Churchill? Is Hogwarts a 19th century myth? In this week’s bonus episode, Tom and
  Dominic are reunited, and attempt to unpack these challenging questions, and many
  more…


