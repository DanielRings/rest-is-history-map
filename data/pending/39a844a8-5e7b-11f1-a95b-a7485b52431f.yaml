title: 'Brazil: The Emperor’s Anthem (Part 5)'
description: 'What does the Brazilian national anthem reveal about its history of
  slavery and revolt? Why did the king of Portugal rule his country all the way from
  Rio in the 19th century? Who was the first emperor of Brazil? And, why was the second
  anthem a symbol of liberty?




  Join Tom and Dominic as they delve into the chaotic episode of Brazilian history
  that resulted in its first and second national anthems.


