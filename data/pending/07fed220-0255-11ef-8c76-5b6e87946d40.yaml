title: 'The Habsburgs: Secrets of a Dynasty'
description: 'Charles V, The Holy Roman Emperor of the House of Habsburg, was at once
  King of Spain, Archduke of Austria, Lord of the Netherlands and Duke of Burgundy.
  With a lineage supposedly stretching back to Noah’s Ark, and a name born in Ancient
  Rome, the Habsburgs are one of the most influential dynasties in all of European
  history, shaping and changing the course of nations and empires. The first great
  Habsburg, Rudolph, was made King of the Romans in 1273, though it was from 1500,
  through a series of tactical marriages, that their ascendancy truly began. Key among
  these was the marriage of Maximilian I, Charles V’s grandfather, to the powerful
  heiress Mary of Burgundy. The resulting gigantic Habsburg dominion would eventually
  split into two dynastic branches, located in Spain and Vienna, forging remarkable,
  multinational empires, that dominated central Europe until the twentieth century.
  But is there any truth to the claim that the Habsburg’s notorious proclivity for
  inbreeding resulted in genetic deformities that would see the downfall of the family?


  In this week’s episode, Dominic and Tom are joined by none other than Eduard Habsburg-Lothringen,
  to discuss his illustrious family’s tumultuous history, its most famous members,
  strange death rituals, romantic legends, and the seven rules he’s derived from the
  stories of the House of Habsburg.



