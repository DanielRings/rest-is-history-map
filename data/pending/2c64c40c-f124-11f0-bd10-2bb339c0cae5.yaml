title: 'Revolution in Iran: Fall of the Shah  (Part 1)'
description: 'Why did the Iranian Revolution erupt in 1979? What was the nature of
  the relationship between President Carter and the ostentatious Shah Mohammad Reza
  Pahlavi? And, who was the Ayatollah Ruhollah Khomeini, a man whose militant vision
  for Iran would see it drastically remade?




  Join Dominic and Tom, as they launch into one of the most dramatic stories of all
  time, with such far reaching consequences, that they still reverberate across the
  Middle East today: the Islamic Revolution. As they delve into the events that set
  this cataclysmic event in motion, they will bring to life the three men at the heart
  of it all. 




