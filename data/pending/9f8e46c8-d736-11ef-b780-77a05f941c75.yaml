title: 'Emperors of Rome: Tiberius, Slaughter and Scandal (Part 2)'
description: 'The Roman historian Suetonius’ biography of the controversial Emperor
  Tiberius, is one of his most shocking and salacious, condemning Tiberius to infamy.
  But was Tiberius really the perverted monster Suetonius would have us believe? Born
  of Rome’s most illustrious family and a sacred bloodline - the Claudians - Tiberius’
  mother Livia was unceremoniously taken from his father while she carried him, to
  marry the great Emperor Augustus. So it was that Tiberius grew up in the very heart
  of imperial power, proving himself intelligent, and a superb military commander.
  But, following the unforeseen deaths of Augustus’ young heirs, he found himself
  primed to become the next caesar of Rome. The reign that ensued would prove largely
  peaceful, prosperous and stable, though Tiberius himself was increasingly plagued
  by paranoia and fear. While the last of Augustus’ bloodline were wiped out one by
  one, he retired to Capri, much to the horror of the Roman people. Before long, rumours
  had begun percolating of the heinous deeds, sick proclivities, and vile abominations
  Tiberius was practicing on his pleasure island…

  Join Tom and Dominic as they discuss Tiberius, the impressive though widely lambasted
  second emperor of Rome. What is the truth behind the sordid myths and mysteries
  of his reign…?


