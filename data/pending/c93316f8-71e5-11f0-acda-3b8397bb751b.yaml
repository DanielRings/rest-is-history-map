title: 'RIHC: Capturing Canada, Victorian Photography, and Dancing on Ice'
description: "Who was William Notman, one of the 19th century’s greatest photographers?\
  \ What were the dubious reasons that sent him to Canada from his native Scotland?\
  \ How did he push the boundaries of 19th century photography, with his depictions\
  \ of the untamed wilderness of Canada, and by playing with reality? What made his\
  \ methods so controversial? To what extraordinary lengths did he go to photograph\
  \ the Victoria Bridge? How did Gardner win the respect of Queen Victoria? What eerie\
  \ scene is depicted in his famous photograph, ‘The Bear’? And, along with Sitting\
  \ Bull, which other famous 19th century figures did he photograph? \n\n\n\nIn this\
  \ week’s bonus episode, Tom is joined by author and art critic, Laura Cumming, to\
  \ discuss one of Canada’s greatest photographers, and his fascinating methods. \n\
  \n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\n\
  Producer: Theo Young-Smith\n\nAssistant Producer: Tabby Syrett + Aaliyah Akude \n\
  \nExecutive Producers: Jack Davenport + Tony Pastor"
