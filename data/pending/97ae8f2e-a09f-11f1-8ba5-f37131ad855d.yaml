title: 'Roman Civil War: Rise of the General (Part 1)'
description: 'Who was Gaius Marius, one of the two men who would shape the fate of
  Rome in the first century BC? Why was his road to fame, fortune, and political greatness,
  from total obscurity, so dangerous? And, would Marius be the man to face down the
  existential threat facing the empire during this period?&nbsp;




  Join Tom and Dominic as they launch into one of the greatest struggles in the history
  of Rome, as two titanic generals and politicians clashed over hegemony of the empire,
  in an age of tumult.&nbsp;






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


