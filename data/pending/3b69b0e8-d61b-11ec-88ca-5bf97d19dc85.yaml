title: 'RIHC: Pub Quizzes, Unstoppable Podcast Guests, and the Most Brutal Nations
  in History'
description: 'In this bonus episode, Tom and Dominic ponder on who would be ''history''s
  top hunks and babes'' for an episode of Love Island. They discuss the pitfalls of
  being an academic compared with the freedom of being history enthusiasts. Dominic
  shares the dates his thirteen-year-old self thought were the most important in history.
  They answer your questions on Hiroshima, cancel culture, and the brutality of different
  time periods. Finally, Tom and Dominic discover which Hogwarts houses they belong
  to. 


