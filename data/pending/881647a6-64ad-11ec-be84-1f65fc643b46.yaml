title: '4 Jan: Solomon Northup and Albert Camus'
description: Tom analyses the historical importance of Solomon Northup's story, made
  famous by Steve McQueen's '12 Years A Slave'. Then, Dominic delves into the death
  of French philosopher and author Albert Camus. Tune in to also hear about the travails
  of Monsieur Sandbrook, the 21-year-old Provence-based English language assistant.
