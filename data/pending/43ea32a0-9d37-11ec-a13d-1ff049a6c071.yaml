title: Yeltsin, Economic Chaos and President Putin (Episode 3)
description: '[Episode 3 of 4]


  ''You certainly won''t understand what ordinary Russians see in Vladimir Putin if
  you don''t understand what happened in the 1990s. A time of utter, utter collapse.'' 


  In part three of our Soviet Union, Russia and Putin series, Tom and Dominic drill
  down into the details of the chaos in 90s Russia, the laughing stock Yeltsin became
  on the global stage, and Putin''s brutal rise to power on the back of the Second
  Chechen War. 


