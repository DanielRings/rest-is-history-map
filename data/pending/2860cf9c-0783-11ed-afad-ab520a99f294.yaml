title: 'RIHC: Apocalyptic London, Orwell, and Producer Dom'
description: 'While Dominic is sunning himself on holiday, Tom is sweltering in Brixton
  amid a heatwave.


  With Dominic in Greece, Tom is instead joined by Producer Dom to discuss the challenges
  of recording on location, the hidden rivers of London, Tom''s apocalyptic walks
  during lockdown, George Orwell, and more.


