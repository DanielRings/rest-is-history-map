title: 'Lady Jane Grey: The Axe Falls (Ep 2)'
description: '‘It had the alchemy of a bitter Tory leadership race’.


  Reigning for the shortest period of any British monarch, can Lady Jane even be considered
  an official Queen of England and Ireland? 


  In the second of two episodes, tune in to hear Tom and Dominic drill down into the
  story of her turbulent nine days on the throne, plus her deposition, trial, and
  execution.


