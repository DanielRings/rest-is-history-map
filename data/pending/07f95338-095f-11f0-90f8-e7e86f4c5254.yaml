title: 'The Last Viking: The Saga of Harald Hardrada (Part 1)'
description: '“I swear I will not flee from this fight. I will triumph, or I will
  die!”


  In the 1066 game of thrones for the crown of England, the most extraordinary of
  the three contenders is arguably Harald Hardrada: viking warrior, daring explorer,
  emperor’s bodyguard, serpent slayer, alleged lover to an empress, King of Norway,
  and legend of Norse mythology. How did this titan of a man come to cross the North
  Sea with his army, and take on Harold Godwinson, in the titanic showdown of Stamford
  Bridge? His story before this point is so colourful that it may be one the most
  exciting lives in all history. Fighting from the age of twelve, Harald was born
  to a petty regional king of Norway, in a Scandinavia of competing religions and
  kingships. As a teenager, he would then join his fearsome brother Olaf, the man
  who united Norway but later fell foul of King Cnut, and subsequently sailed the
  seas and mysterious waterways of Russia, in a mighty battle to take back Norway.
  Their defeat was terrible and absolute, leaving the young Harald wounded and on
  the run. A journey of horrors and hardship would then lead him at last to the awe
  inspiring city of Kyiv, where he would serve as mercenary for the Grand Prince.
  But still hungry for wealth and glory he then travelled on to the most remarkable
  city in the world: Constantinople, where his life would take an even more dramatic
  turn… 


  Join Dominic and Tom as they describe the electrifying early life of Harald Hardrada.
  From Scandinavian prince, warrior, and would-be usurper, to Baltic mercenary, and
  member of the elite Varangian Guard, in the glittering Constantinople or Miklagard
  - Asgard on earth. The stage is set for the greatest adventure of his life so far.
  But will Harald ever seize his ultimate destiny and become a king?



