title: 'Hannibal: The Invasion of Italy (Part 3)'
description: 'How did Hannibal achieve the remarkable feat of crossing the Alps with
  his army and elephants? How many of his men survived the treacherous journey? Was
  it worth sacrificing so much of his army in order to fight the Romans in Italy?
  And, what unfolded during the first great clash between Hannibal and the Roman Republic,
  at dawn by the Trebbia River, in 218 BC…?


  Join Tom and Dominic as they discuss Hannibal’s extraordinary journey over the Alps,
  and the early stages of his epic war against Rome. 




