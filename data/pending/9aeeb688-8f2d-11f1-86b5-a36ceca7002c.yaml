title: Imprisoning the Catholic Queen of Conspiracy
description: 'Where in England was Mary Queen of Scots imprisoned by Elizabeth I between
  1568 and 1587? Why were her conditions often so grisly? And, did she have an affair
  with one of her jailers?




  In this week’s bonus episode, Tom and Dominic discuss the tumultuous imprisonment
  of Mary Queen of Scots in England, before meeting her bloody end….




