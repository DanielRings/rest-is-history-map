title: Hadrian and Antinous
description: 'A mysterious death on the Nile, an unconventional love affair, a Roman-Greek
  hero turned God - the story of Hadrian and Antinous is full of intrigue. Join Tom
  and Dominic as they delve into the world of Roman romance, where gender binaries
  and modern moral arguments do not feature, and look into the possible theories of
  how Antinous'' body ended up in the Nile...


