title: God and the American Empire
description: 'On today''s episode Tom and Dominic are joined by Friend of the Show,
  Professor Andrew Preston, to talk about the relationship between the US and religion,
  both at home and abroad in the 20th and 21st centuries.


  Why have there been such low levels of anti-clericalism in the US compared to the
  rest of the world? What''s behind the sustained and growing numbers of religious
  believers in the United States? Was the Cold War really a religious crusade against
  godless communism?


  Tune in to hear the boys drill down into American Exceptionalism, the Marketplace
  of Faith and whether ''US isolationism'' is an ahistorical term.


  Producer: Dom Johnson

  Exec Producer: Jack Davenport


