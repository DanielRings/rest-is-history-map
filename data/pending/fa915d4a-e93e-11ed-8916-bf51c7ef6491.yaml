title: 'RIHC: The Death of Napoleon, South Vietnamese agency, and tent evangelists'
description: 'Did Napoleon die of disease, or was it arsenic poisoning? How did Richard
  Nixon revive his political career? What is the moral of Tom''s upcoming children''s
  book? Who is History''s greatest traitor? What feedback does Dominic often get from
  British publishers upon submitting a first draft? In this week''s bonus episode,
  Tom and Dominic tackle these challenging questions, and many more.


