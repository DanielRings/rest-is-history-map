title: 'The Year of Revolutions: 1848'
description: 'Few years in European History saw as much change and turmoil as 1848:
  across the continent, from Vienna to Paris to Palermo, mass protests took place,
  catching the old elites by surprise. The political order that stood strong since
  the defeat of Napoleon fell aside, making way for a newer, modern Europe, influenced
  by the rise both of socialism and nationalism. In today''s episode, Tom and Dominic
  are joined by the Regius Professor of History at Cambridge, Christopher Clark, to
  discuss 1848, and the lasting impact of the revolutions that came about that year.


