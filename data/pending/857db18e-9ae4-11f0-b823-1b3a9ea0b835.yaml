title: L'étranger, by Albert Camus
description: "Who was Albert Camus, the iconic absurdist French author from Algeria?\
  \ What can ‘L'étranger’ tell us about French Algeria, the Algerian War, and colonialism\
  \ in the 1930s? How does the book’s central murder unfold? Is the book first and\
  \ foremost a commentary on absurdism, or a critique of the Algerian War? Why is\
  \ this one of Dominic’s favourite books of all time? How does a book’s translation\
  \ alter its meaning? How did Albert Camus' own life inform the events of the novel?\
  \ Why did Camus famously fall out with the existential philosopher Jean-Paul Sartre?\
  \ Why was Camus' personal life so famous? How should we understand the novel’s main\
  \ character, the murderer, Meursault? Is ‘L'étranger’ a racist defence of colonialism?\
  \ Who were the Pieds-noirs, the French settlers who lived in Algeria, and what was\
  \ their relationship with the native population? And, does life really have any\
  \ meaning…?\n\n\n\nJoin Dominic and Tabby as they explore one of the most seminal\
  \ books of the 20th century, Albert Camus' stirring, sizzling, unsettling, ‘L'étranger’.\
  \   \n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\
  \nProducers: Tabby Syrett, Theo Young-Smith + Nicole Maslen\n\nExecutive Producers:\
  \ Jack Davenport + Tony Pastor"
