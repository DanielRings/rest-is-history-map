title: Martin Luther King's Dream
description: '"Out of the mountain of despair, a stone of hope.” Arguably the most
  celebrated speech of the 20th century, Martin Luther King Jr.’s address in front
  of the Lincoln Memorial in August 1963 was a defining moment in the American Civil
  Rights movement, and to this day remains a symbol of hope, equality, and social
  change. Join Tom and Dominic as they discuss Martin Luther King Jr., how he became
  involved in the Civil Rights movement, and the unfolding of the March on Washington.


  *The Rest Is History Live Tour 2023*:


  Tom and Dominic are back on tour this autumn! See them live in London, New Zealand,
  and Australia!


