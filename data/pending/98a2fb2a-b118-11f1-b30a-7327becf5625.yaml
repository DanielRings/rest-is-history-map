title: 'The Terror: Reign of Robespierre (Part 2)'
description: 'Where did Maximilien Robespierre come from, and how did he rise from
  provincial obscurity? Why is he considered the central figure in the Terror of the
  French Revolution? And, when did he transform from a fastidious man opposed to violence,
  into one of the chief proponents of bloodshed?




  Join Tom and Dominic as they describe how Maximilien Robespierre became one of the
  most powerful figures of the French Revolution, and his role in initiating the Terror,
  which saw thousands beheaded in Paris, and butchered throughout France.&nbsp;


