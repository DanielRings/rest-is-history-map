title: 'Emperors of Rome: Caligula, Incest and Insanity (Part 3)'
description: 'Enough of the Princeps, what remains to be described, is the monster….

  The Roman emperor Caligula endures as one of the most notorious figures in not only
  Roman history, but the history of the world. Famed as a byword for sexual degeneracy,
  cruelty and corruption, the account of his life written by the Roman historian Suetonius
  has, above all, enshrined him as such for posterity. Throughout the biography there
  is a whiff of dark comedy, as Caligula is cast as the ultimate demented caesar,
  corrupted absolutely by his absolute power and driven into depravity. Born of a
  sacred and illustrious bloodline to adored parents, his early life - initially so
  full of promise - was shadowed by tragedy, death, and danger, the members of his
  family picked off one by one by the emperor Tiberius. Nevertheless, Caligula succeeded,
  through his own cynical intelligence and cunning manipulation of public spectacle,
  to launch himself from the status of despised orphan, to that of master of Rome.
  Yet, before long his seemingly propitious reign, was spiralling into a nightmare
  of debauchery and terror….

  Join Tom and Dominic as they discuss the most notorious emperor in Rome: Caligula,
  a man said to have slept with his sister, transformed his palace into a brothel,
  cruelly humiliated senators, and even made his horse into a consul. But what is
  the truth behind these horrific legends? Was Caligula really more monster than man...? 


  Pre-order Tom Holland''s new translation of ''The Lives of the Caesars'' here.

