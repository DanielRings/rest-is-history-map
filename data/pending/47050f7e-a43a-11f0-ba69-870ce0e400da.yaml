title: 'Nelson: The Gathering Storm (Part 2)'
description: 'After two years at sea, what happened when Horatio Nelson - now Britain’s
  most celebrated naval commander - finally returned home, to his wife and father?
  Following his involvement in the poisonous politics of Naples, his terrible treatment
  of the Jacobite rebels, and starting an affair with the notorious Lady Emma Hamilton,
  how was Nelson received? And, with the storm clouds of war gathering above the Baltic,
  in what heroic way would Nelson next be called to serve his country?


  Join Dominic and Tom as they discuss Nelson’s controversial return to Britain, his
  relationship with Emma Hamilton, and the road to the legendary Battle of Copenhagen…


