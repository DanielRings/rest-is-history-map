title: 'Greatest Paintings: Dawn of the Dutch Golden Age - The Arnolfini Portrait
  | FULL EPISODE'
description: "Why is Jan Van Eyck’s Arnolfini Portrait perceived as one of the greatest\
  \ mysteries of the arts? What elements and symbolisms provoke debates about its\
  \ identity and meaning? And, what do we know about its provenance, its travels through\
  \ European royal courts, and its influence on Diego Velázquez? \n\n\n\nIn this new\
  \ The Rest Is History Club series, Tom is joined by art critic and author Laura\
  \ Cumming to discuss the histories behind famous paintings and put them in their\
  \ historical contexts. \n\n\n\n\n\nFUTURE EPISODES....\L\n\nFeb 11th: Las Meninas\
  \ by Diego Velázquez\L\n\nFeb 18th: The Skating Minister by Henry Raeburn\L\n\n\
  Feb 25th: The Angelus by Jean-François Millet \n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\
