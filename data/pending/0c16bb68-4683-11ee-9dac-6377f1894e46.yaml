title: 'RIHC: The Destruction of Carthage, The Beatles, and St Cuthbert’s Way'
description: 'How did the Roman army evolve between the sieges of Carthage and Jerusalem?
  Where has Tom’s tour of Britain taken him over the past few weeks? What is the meaning
  of The Rest Is History’s upcoming “Russell Crowe Week”? And are Tom and Dominic
  now considered celebrities? In today’s bonus episode, with Dominic stranded abroad,
  Tom is joined by the show’s producer, Theo, to attempt to answer these difficult
  questions, and many more…


  *The Rest Is History Live Tour 2023*:


  Tom and Dominic are back on tour this autumn! See them live in London, New Zealand,
  and Australia!


