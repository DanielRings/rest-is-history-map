title: 'Genghis Khan: Lord of the Mongols'
description: 'PART 2.

  ''An almost sacral figure'' in the words of Tom Holland, Genghis Khan has become
  the paramount leader of the Mongols. 


  Can we call his kingdom a ''Mongol Empire''? What was his aim? And why are some
  now calling him an ''eco-warrior''?!


