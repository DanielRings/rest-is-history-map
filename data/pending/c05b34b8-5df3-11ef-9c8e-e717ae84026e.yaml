title: 'RIHC: Asquith and the Road to War EXTRA with Robert Harris'
description: 'Who was H. H. Asquith - the last great Victorian Prime Minister - and
  was he a good leader? What impact did his controversial relationship with his daughter’s
  friend Venetia Stanley have upon his leadership of Britain in the build up to the
  First World War? Who was Venetia and what was the actual nature of their clandestine
  relationship? Did Asquith neglect his responsibilities and lose his grip of the
  international situation by 1915 as a result of his feelings for her? What extraordinary
  secrets and insights did their preserved correspondence reveal? And, is he overall
  an historical figure worthy of sympathy and praise, or criticism and censure? 

  In this week’s bonus episode, Dominic is joined by renowned author Robert Harris
  to discuss the life of Prime Minister H. H. Asquith, and his new book ‘Precipice’.
  A thrilling historical tale of spies, Edwardian politics and a forbidden relationship
  in the build up to the First World War. 

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
