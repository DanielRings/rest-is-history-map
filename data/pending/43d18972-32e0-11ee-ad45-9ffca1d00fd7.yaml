title: 'Historical Love Island: The Sequel'
description: '“There’s a lot of severed heads at this villa!” The great TV sensation
  of the summer returns on The Rest Is History, as Tom and Dominic are once again
  joined by Tom’s daughter Katy, to navigate an incredibly competitive field of islanders,
  and crown the successors to last year’s winners, Empress Theodora and Stanley Baldwin.
  Can Catherine Howard remain more loyal to Sir William Hamilton than she was to Henry
  VIII? Will Charles II and another byzantine Empress, Zoe, win it all? Or can the
  frightful, bloodthirsty duo of Peter the Great and Poppaea Sabina claim the throne
  for themselves? Will Admiral Horatio Nelson or Labour grandee Tony Benn make it
  to the final? Listen and find out now!


  *The Rest Is History Live Tour 2023*:


  Tom and Dominic are back on tour this autumn! See them live in London, New Zealand,
  and Australia!


