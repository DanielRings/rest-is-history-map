title: The Tudor Da Vinci Code
description: 'What remarkable secrets does Soulton Hall, a famous Tudor Manor House,
  whisper through its peculiar walls? Who was the mystical Sir Rowland Hill, and why
  does he feature in one of Shakespeare’s plays? Was he the subject of religious persecution?
  And, might Soulton contain the ancient relics of the foundation of Christianity
  in England…?


  In this week’s bonus episode, Tom is joined by Tim Ashton, the current master of
  Soulton, to discuss the secrets of the Hall, and the greatest Tudor conspiracy of
  the age._______Twitter:@TheRestHistory@holland_tom@dcsandbrookVideo Editors: Jack
  Meek + Harry SwanSocial Producer: Harry Balden Producers: Tabby Syrett & Aaliyah
  AkudeExecutive Producer: Dom Johnson'
