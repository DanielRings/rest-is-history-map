title: Was Elizabeth I England's Greatest Monarch?
description: "How did Elizabeth I’s traumatic childhood under Henry VIII shape her\
  \ cautious approach to power? What made her such a cunning ruler when it came to\
  \ maintaining the precarious balance between protestants and catholics? And, how\
  \ did she transform her reputation as the “Virgin Queen” into a political asset?\n\
  \n\n\nIn this very special bonus episode, we share an exclusive talk from The Rest\
  \ Is History Festival at Hampton Court Palace. Here, Tom is joined on stage by Friend\
  \ of the Show and historian Helen Castor, to discuss the triumphs of Elizabeth I.\n\
  \n\n\n\n\n*The Rest Is History LIVE: The Ultimate Victorian Adventure*\n\n\n\nThe\
  \ maddest expedition in history and it’s NEVER been heard before on the show: join\
  \ Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers\
  \ story of Queen Victoria ordering one of history’s most daring assignments ever.\
  \ ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.\
