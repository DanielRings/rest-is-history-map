title: 'The French Revolution: The Storming of the Bastille (Part 5)'
description: '“It was violence that made the revolution revolutionary”.

  The storming of the Bastille is viewed by many across the world as a moment of celebration,
  when the French people were liberated from the shackles of tyranny and royal despotism.
  Yet, it was also a moment of horrific violence and chaos, culminating in countless
  acts of blunt, bloody murder. With a widespread sense of social unrest throughout
  France at the beginning of July 1789, things finally reached a peak following the
  King’s dismissal of his finance minister, Necker, a great favourite of the people.
  The arrival of 20,000 troops into Paris to maintain order triggered even greater
  panic in the streets, with the already febrile atmosphere being whipped into a frenzy
  by firebrand orators. Finally, with fighting breaking out between the soldiers and
  the mob in the Vendome, and then spilling over into the Tuileries Gardens, the Royal
  Commander of Paris gave the order to evacuate the city entirely, leaving it in the
  hands of the rioters. It was then that the mob, in a final desperate effort to procure
  gunpowder for its plundered weapons, turned its sites on the Bastille, the ultimate
  monument to repression …

  Join Dominic and Tom as they discuss the apocalyptic Storming of the Bastille fortress,
  and the truth behind the prison''s famously grotesque reputation. Given the gory
  events that unfolded on that momentous day, was violence innate to the French Revolution
  from the very beginning - its driving force - and its bloody denouement therefor
  inevitable?

