title: 'RIHC: Heroic Vikings, Greek Epics, and The Rules of War'
description: 'Who was Harald Hardrada - viking king, dragon fighter, and bodyguard
  to the Byzantine emperor - and why was he such an extraordinary historical figure?
  Given their extensive knowledge of the past and historical contexts, would historians
  make good political leaders? What happened to the Welsh church following the Anglo-Saxon
  conquest? When was the economic and global political decline of Britain in the 1960s
  and 1970s set in motion? Who was the first Frankish ruler to speak French rather
  than Frankish? Has the significance of some of the most famous battles of all time
  been overblown? Did they really make that much of a difference? And, how are codes
  of warfare established? 

  Join Tom and Dominic for this week''s bonus episode, as they answer some fascinating
  historical questions. 

