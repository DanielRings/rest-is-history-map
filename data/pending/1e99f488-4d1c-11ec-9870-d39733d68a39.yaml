title: The First Anglo-Afghan War
description: '“A war begun for no wise purpose.” This description of the First Anglo-Afghan
  War, fought in the early-mid 19th Century, could stand as an epitaph for most conflicts
  in the region since. William Dalrymple has written extensively about the history
  of Afghanistan and he joins Dominic Sandbrook and Tom Holland to take a deep dive
  into this ‘graveyard of empires’.


