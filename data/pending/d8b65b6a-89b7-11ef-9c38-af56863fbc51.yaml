title: 'The French Revolution: War to the Death (Part 2)'
description: '“You have shaken off the yoke of your despots, but surely this was not
  to bend the knee before a foreign tyrant…”

  It’s January 1792, and one of the largest factions in revolutionary France, the
  Gironde, is calling for war against Austria. The French people’s hatred of Marie
  Antoinette has always fuelled suspicion of the Austrians, and at the same time,
  there has been constant, treacherous correspondence between the French royal family
  and their European cousins. And so, when one of the prominent members of the Gironde
  calls to arms in early 1972, little does he realise that the war he wants will haunt
  Europe for the next 25 years, totally redrawing its map, and costing millions of
  lives…


  Join Tom and Dominic in part two of our second season of the French Revolution,
  as they dive into the first of many wars to come between Revolutionary France and
  its European rivals.


