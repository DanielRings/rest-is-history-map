title: 'Ireland: Home Rule, Mutiny - and Civil War? (Ep 3)'
description: 'The year is 1912. The bitter arguments about Home Rule for Ireland are
  reaching boiling point. But with Ulster in uproar, the Tories encouraging mutiny
  and thousands of rifles pouring into Ireland, is the United Kingdom really heading
  for a bloody civil war? And was Sarajevo really the turning point that saved Britain
  from a sectarian inferno?

  In today''s episode, Tom and Dominic are joined by friend of the show Dan Jackson
  to discuss the thrilling climax to the Home Rule saga, with appearances from characters
  such as H. H. Asquith, Andrew Bonar Law and Sir Edward Carson. We end with Britain
  and Ireland plunging into the abyss of the Great War - and the Easter Rising fast
  approaching...


