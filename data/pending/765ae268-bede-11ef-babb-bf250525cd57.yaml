title: 'Hitler''s War on Poland: The Pact with Stalin (Part 2)'
description: 'By the 11th of April 1939, Adolf Hitler and his Nazis were in the process
  of drawing up a plan of attack for Poland, the Poles having resisted Germany’s attempts
  to make them hand over Danzig and turn themselves into a satellite state. Now, with
  a new military alliance between France, Britain and Poland established, the time
  has come for Hitler to throw the dice and cast Europe into the long predicted war.
  Yet, at this most crucial and long awaited moment of his career, Hitler found himself
  in a state of emotional distress. Uncertain of whether France and Britain would
  join the war upon his invasion of Poland, and aware of Germany’s economic turmoil,
  the stakes had never been higher. He therefore decided to make a deal with his greatest
  ideological enemy - Joseph Stalin - forming an alliance with Russia, with the intention
  of dividing up Poland between them. Then, on the 1st of September, Hitler gave a
  landmark, excoriating address at the Reichstag, declaring war on Poland and tearing
  up his naval pact with Britain. War, it seemed, had become truly inevitable. 

  Join Dominic and Tom as they discuss the build up to Hitler’s invasion of Poland,
  one of the darkest episodes of all time, and the moment that the Second World War
  truly began.

