title: 'RIHC: The Trial of Capel Lofft'
description: 'The Rumble in the Jungle. The Thrilla in Manila. The King in the Ring. 


  Today''s bonus podcast is a special one: Frenemy of the Show, Capel Lofft, defends
  the dignity and honour of Charles I (King and Martyr) against Tom and Dominic, his
  Whiggish foes.


  There are huge twists, unbelievable revelations and plenty of good humoured jousting. 


  It''s liquid history at its best. Wangs: sit back, drink it in and enjoy.


  Producer: Dom Johnson

  Exec Producer: Jack Davenport


