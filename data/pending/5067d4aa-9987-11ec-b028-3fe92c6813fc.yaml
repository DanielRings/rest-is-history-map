title: 'RIHC: Zelenskyy, le Carré and Tom''s drive from Hamburg to Berlin'
description: 'Tune in to this week''s bonus episode to hear a classic ramble chat
  between Tom and Dominic.


  The boys discuss the career of Volodymyr Zelenskyy, how well Dominic would fare
  on Strictly and what stuck out for Tom during his drive from Hamburg to Berlin after
  the fall of the Berlin Wall.


