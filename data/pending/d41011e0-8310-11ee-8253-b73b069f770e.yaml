title: 'JFK: The Road to the White House (Part 1)'
description: '“There were a lot of people who wanted Kennedy dead, a lot of powerful
  people. There are secrets still being held and I never bought for a minute that
  Oswald operated alone.”


  The assassination of President John F. Kennedy in Dallas on 22nd November 1963 is
  one of history’s most iconic stories, a moment of terrible innocence lost and a
  foundational myth for modern America. The tragedy of the murder, coupled with the
  mystery surrounding it and the glamour of Kennedy himself, have only heightened
  the enduring fascination with the event. But what really happened in the days before,
  during and after the assassination? Did Lee Harvey Oswald really act alone? Or was
  he just a tool for darker forces at play in American politics - or for an international
  conspiracy at the terrifying height of the Cold War?


  Join Dominic and Tom as they launch their epic investigation into the life and death
  of JFK, beginning with the controversial Kennedy clan, the young ‘Jack’s’ upbringing
  and the personality of the victim himself. Along the way they discuss his battle
  with crippling illness, his sexual escapades and his romance with the woman who
  became his wife, Jacqueline Bouvier.



  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


