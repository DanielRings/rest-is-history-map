title: 'The Troubles: Bloody Sunday (Part 4)'
description: 'How did Bloody Sunday erupt on the 30th of January 1972? Why did it
  follow on the heels of terrible violence? And, what were the consequences of that
  violent day?&nbsp;




  Join Tom and Dominic as they discuss the tragic events of Bloody Sunday, and the
  final attempt at peace in Northern Ireland.&nbsp;








  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


