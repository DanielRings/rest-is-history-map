title: 'RIHC: Marilyn Tomroe, Hilary Mantel and Producer Tony'
description: For this weeks bonus episode, Dominic is joined by Executive Producer
  Tony Pastor to discuss the reaction to Tom's Marilyn Monroe impersonation whilst
  he is away... They also discuss the sad passing of Hilary Mantel and her incredible
  body of work, Tony's experiences in Vietnam and an 'indiscreet' story about Roy
  Keane.
