title: The Jews Against Rome
description: '"The destruction of Jerusalem by the Romans: a thrilling, terrible,
  and blood-soaked story."


  Following on from last week''s episode on the Crucifixion, Tom and Dominic take
  us back to Judea to dissect the tumultuous events of the Jewish Revolt.


  Tune in to hear the first part of the incredible story that features Pontius Pilate,
  Nero, and the figure of Jesus - plus how it all tenuously links to Bryan Adams and
  the Summer of ''69.


  Producer: Dom Johnson

