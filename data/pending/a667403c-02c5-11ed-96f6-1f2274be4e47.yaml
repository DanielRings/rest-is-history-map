title: George Orwell
description: 'George Orwell is one of the most celebrated novelists, essayists, and
  journalists in modern British history. 


  Tom and Dominic are joined by Robert Colls, Professor Emeritus of History at De
  Montfort University, to discuss the life and legacy of the man who wrote Nineteen
  Eighty-Four, Animal Farm, and Homage to Catalonia.


