title: The Rise of Genghis Khan
description: 'PART 1.

  Tom Holland and Dominic Sandbrook speak to Ali Ansari about the origins of one of
  the greatest warlords in human history - Genghis Khan.


  They discuss his early life as Temujin and how he became Genghis Khan, leader of
  the Mongols.


  Producer: Dom Johnson

