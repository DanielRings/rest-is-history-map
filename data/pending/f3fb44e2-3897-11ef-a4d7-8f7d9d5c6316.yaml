title: 'RIHC: The English Revolution, History''s Top Funerals, and Ottoman Oil Fields'
description: 'Why isn''t the English Civil War referred to as the English Revolution?
  Would the Habsburg Empire have survived the 20th century, had it not been for the
  First World War? Which character from history had the greatest funeral? If Tom could
  bring back one of the seven wonders of the ancient world, which would it be? Join
  Tom and Dominic in this week’s bonus episode, as they wrestle with these difficult
  questions, and many more…

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

