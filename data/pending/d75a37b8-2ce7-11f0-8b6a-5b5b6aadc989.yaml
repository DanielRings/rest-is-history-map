title: 'RIHC: The Paraguayan War, The Triple Alliance, and The Napoleon of the New
  World'
description: "What role did Francisco Solano Lopez play in the War of the Triple Alliance?\
  \ What were the major turning points that led to his  downfall? Which  strategic\
  \ challenges did Paraguay face during the war? And how did the war affect Paraguay’s\
  \ long-term development and national identity?\n\nIn this week’s bonus episode,\
  \ Dominic is joined by journalist and writer Laurence Blair, to discuss the Paraguayan\
  \ War, and a particularly tumultuous period of South American history. \n\n_______\n\
