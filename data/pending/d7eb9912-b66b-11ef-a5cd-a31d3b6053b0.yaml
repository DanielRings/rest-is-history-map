title: 'Charlemagne: Pagan Hunter (Part 2)'
description: '“Here was a program to wet the ambitions of warlords as well as scholars,
  and to send men into battle beneath the fluttering of banners, the hiss of arrows,
  and the shadow of carrion crows…”

  The year is 777 and Charles the Great - Charlemagne - has ruled as joint king of
  the Franks alongside his brother, Carloman, for nine years. Now though his brother
  and greatest impediment to sole authority has died under mysterious circumstances.
  The sole successor to the mighty Carolingian dynasty, then, Charlemagne behaves
  differently from all the Frankish warlords that have come before him. In the aftermath
  of the once great Roman Empire, he seems to have modelled himself on the image an
  Augustus, pushing the already formidable kingdom that he has inherited towards greater
  and greater dominion. In his sights now are the Saxons, long growing fractious in
  Germany, and also the terrifying Lombards. The campaigns that ensued would be more
  ruthless than any before, with Charlemagne himself personally leading his men into
  battle. But his regime is not only one founded upon the blade of a sword and militaristic
  might, it is also a religious and educational revolution. It would utterly transform
  the west forever, introducing widespread writing and learning, and Christianising
  vast swathes of Europe - poor and elite alike. But Charlemagne’s total dominion
  of the West was still incomplete. What would happen next?

  Join Tom and Dominic as they delve deeper into the rise of the mighty Charlemagne:
  his transition to sole ruler of the Franks, his violent militaristic conquests,
  and a Christian regime that would change the world. 

