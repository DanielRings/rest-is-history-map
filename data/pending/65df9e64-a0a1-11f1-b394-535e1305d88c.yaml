title: 'Roman Civil War: Master of the Republic (Part 4)'
description: 'Who was Gaius Marius’ son, and how did he set out to bring down his
  father’s rival, Sulla? Which two rising stars in Sulla’s faction, Crassus and Pompey,
  would go on to bring down the Republic, with Julius Caesar? And, how did a momentous
  battle in the East see Sulla elevated to the master of Rome?




  Join Tom and Dominic as they reach the climactic conclusion to the remarkable rise
  of one of Rome’s greatest generals: Lucius Cornelius Sulla, a man who would destroy
  his rivals, win victories in the east, and ruthlessly change the destiny of the
  Roman Republic forever.&nbsp;&nbsp;


