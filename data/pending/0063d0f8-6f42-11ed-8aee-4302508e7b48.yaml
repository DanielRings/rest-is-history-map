title: 'Wales: The Roar of the Red Dragon'
description: 'What are the origins of Wales? And how do the Welsh define themselves
  against Englishness? As England play Wales in the World Cup today, Tom and Dominic
  are joined by Martin Johnes, Professor of History at the University of Swansea,
  to explore the age old rivalry between the two nations.


