title: 'The Charge of the Light Brigade: The Siege of Sebastopol (Part 3)'
description: "How did disagreements within theBritish high command destabilise the\
  \ army as it moved on the imposing Russian fortress of Sebastopol? Why was the roguish\
  \ Lord Cardigan, commander of the Light Brigade, enraged by his orders? And, what\
  \ happened when Britain and Russia clashed at the Battle of the Alma…?&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\n\
  \n\n\nJoin Tom and Dominic as they unfold Britain's march on Sebastopol, the bloody\
  \ confrontation with the Russians at the Alma River, and the ongoing feud between\
  \ Lords Lucan and Cardigan. Would the army’s most devilish cavalryman abandon his\
  \ brigade before its deadliest charge?&nbsp; &nbsp; \n\n\n\nGive The Rest Is History\
  \ Club this Christmas + free T-shirt! Treat yourself or a fellow fan to a membership:\
