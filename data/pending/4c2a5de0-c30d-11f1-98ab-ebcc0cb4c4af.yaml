title: 'King Arthur: The Truth Behind the Legend (Part 4)'
description: 'Did King Arthur really exist or is he just a legend that has developed
  over the centuries? Could he have been a Roman general who fought against the Saxons?
  Or is he a Celtic warlord?




  Join Tom and Dominic as they solve one of the greatest mysteries in British history
  and reveal who the real King Arthur was.




