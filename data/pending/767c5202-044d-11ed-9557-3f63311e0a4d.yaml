title: Haunted London (Ep 4)
description: 'Welcome to the fourth episode in our London Week mini-series.


  Ep 1 ''Londinium'' and Ep 4 ''Haunted London'' are live pods we recorded on location
  earlier this year. ''Places'', ''People'', and ''Moments'' are three accompanying
  episodes that Tom and Dominic recorded in order to dive deeper into London''s past.


  London: Haunted London

  Join Tom and Dominic for a special live, on location episode as they walk around
  central London exploring the haunted remnants of the past.


