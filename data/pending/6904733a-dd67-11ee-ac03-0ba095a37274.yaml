title: 'Titanic: The Iceberg Strikes (Part 4)'
description: 'It is Sunday the 14th of April 1912, and the passengers of the Titanic,
  from the tycoons in first class to the migrants in third class, have been enjoying
  a journey incomparable in its modernity. The weather, up until that point exceptionally
  clement, suddenly grew colder, stiller, calmer, and the ice warnings that had been
  coming through the ship’s sophisticated communications machine since Friday were
  growing evermore urgent. Ominously, they were left beneath piles of competing letters,
  unread. Then, at 11.40pm that night, a night of dancing and laughter, a cry came
  from the crow’s nest: “Iceberg ahead!”


  Join Dominic and Tom as they unpack the captivating lives and stories of the Titanic’s
  third class passengers, and recount the days and moments building up to the ship’s
  final hours. 


  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 

