title: 'RIHC: Nazi Apocalypse, Appeasement and Charles Dickens'
description: 'How did the Nazis see their place in the world? Were Romanian fascists
  more frightening than the Nazis? What was unique about Nazism, and was its terrifying
  allure circumstantial or down to Hitler? Why didn’t Britain and the Allies intervene
  earlier to prevent the rise of Nazism? What are Tom and Dominic’s New Year''s reads?
  Which ancient Roman site did they both visit over Christmas? 

  Join Tom and Dominic for this week''s bonus episode, as they answer some important
  historical questions.


