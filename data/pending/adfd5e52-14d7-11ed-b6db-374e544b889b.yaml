title: 'Theodora: Empress of Byzantium (Ep 1)'
description: 'In the first episode of a three part series, Tom and Dominic dive into
  the incredible story of Justinian and Theodora.


  Tune in for an incredible (and racy) introduction to the powerful Byzantine empress,
  the collapse of the Western half of the Roman Empire, and a deep-dive into the great
  city of Constantinople.


