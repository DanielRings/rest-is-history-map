title: The Successor to the Mayerling Murder
description: 'Who was Baron Franz Nopcsa, and why was he one of the most fascinating
  figures of the early 20th century? Why did he volunteer to become a king? How did
  he change our understanding of evolution forever? And, why does the climax of his
  life bloodily connect him to the Mayerling scandal…?


  In this week’s bonus episode, Tom and Dominic delve deeper into the life of an intriguing
  historical figure intertwined with the Mayerling tragedy: an Austro-Hungarian aristocrat,
  explorer, dinosaur hunter, independence fighter, spy, and murderer...




  *The Rest Is History LIVE: The Ultimate Victorian Adventure*The maddest expedition
  in history and it’s NEVER been heard before on the show: join Tom Holland & Dominic
  Sandbrook LIVE at the Southbank as they tell the bonkers story of Queen Victoria
  ordering one of history’s most daring assignments ever. ⁠⁠Tickets available for
  Friday 4th September⁠⁠, the Saturday show is SOLD OUT._______Twitter:@TheRestHistory@holland_tom@dcsandbrookVideo
  Editors: Jack Meek, Harry Swan + Adam ThorntonSocial Producer: Harry BaldenProducers:
  Tabby Syrett & Aaliyah AkudeSenior Producer: Callum HillExecutive Producer: Dom
  Johnson'
