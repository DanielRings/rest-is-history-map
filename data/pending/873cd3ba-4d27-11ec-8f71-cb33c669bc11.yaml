title: Halloween and Modern Paganism
description: 'In the first of a two part Hallowe’en special, Tom and Dominic are joined
  by Professor Ronald Hutton to explore the history of modern paganism: from Wicca
  to Druids, and from Himmler to the Glastonbury Festival. Do its roots reach back
  to a genuine pre-Christian past?


