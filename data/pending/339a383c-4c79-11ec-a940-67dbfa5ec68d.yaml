title: Walls and Borders
description: 'From the Great Wall of China to the Berlin Wall, history is littered
  with the building of barriers aimed at keeping people out, and sometimes in. Do
  they work? Are they ever a good thing? Tom Holland and Dominic Sandbrook climb walls
  and explore borders as they investigate the history of separation. 


