title: 'RIHC: Tom''s top books, historical guilt, and trigger warnings (livestream)'
description: 'Which 5 books defined Tom Holland''s career? Should we feel guilty about
  the crimes of our ancestors? To which book does The Rest Is History owe its existence?
  What type of historical content warrants a trigger warning? In this week''s bonus
  livestream, our hosts grapple with these difficult questions, as Tom takes us on
  a journey through the most impactful books of his career...


