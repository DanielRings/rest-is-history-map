title: 'The Fall of the Incas: Death to the Emperor (Part 3)'
description: 'What happened to the emperor of the Incas after he was taken prisoner
  by the Spanish conquistadors? Did the formidable buccaneer, Francisco Pizarro, and
  his men succeed in discovering the treasure troves of the Incas? And, could the
  Incan empire stand united against this terrifying, alien invasion…? 




  Join Dominic and Tom, as they charge into the bloodiest moment of the whole conquest
  of the Incas thus far….




