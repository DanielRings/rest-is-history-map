title: 'The Rolling Stones: Sex, Drugs and Rock ‘n’ Roll (Part 1)'
description: 'What are the origins of Britain’s original bad boys, The Rolling Stones?
  Where did they all come from and how did they meet? What was it about the 1960s,
  with its air of sexual liberation, newly Labour government, and rising youth culture
  that allowed them to burst onto the musical scene? Who was Brian Jones, the troubled
  and now largely forgotten man who really founded the band? And, what made the Rolling
  Stones, even from the earliest stages, so much more controversial than their predecessors,
  The Beatles? 


  Join Dominic and Tom as they discuss the rise of one of history’s greatest, sexiest,
  and most suavely devilish bands; the Rolling Stones, and the glaring light they
  shed upon the tumultuous 1960s. 


