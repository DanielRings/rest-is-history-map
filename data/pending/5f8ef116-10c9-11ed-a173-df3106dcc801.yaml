title: Pigeons
description: '‘If it became necessary immediately to discard every line and method
  of communications used on the front, except one, and it were left to me to select
  that one method, I should unhesitatingly choose the pigeons’, wrote Major General
  Fowler, Chief of Signals and Communications of the British Army, after the First
  World War.


  On today''s podcast Tom and Dominic are joined by Gordon Corera, the BBC''s Security
  Correspondent and author of ''Operation Columba: The Secret Pigeon Service'', to
  discuss the often under-appreciated role of pigeons throughout the course of history.


