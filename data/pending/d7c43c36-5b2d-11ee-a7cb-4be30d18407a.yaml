title: Hitler and the Mitford Sisters (Ep 4)
description: 'The Mitfords were the most glamorous aristocrats on the London scene
  in the 1920s, with at their head Diana, the most beautiful woman in London, who
  would eventually marry Oswald Mosley. However her younger sister Unity would strike
  up a relationship with her own fascist leader: Adolf Hitler. Having first moved
  to Berlin in 1934, Unity would eventually become part of the Führer’s inner-circle:
  having described them both as “perfect example of aryan womanhood”, her and Diana
  were his guests at the 1936 Berlin Olympics, sat next to Eva Braun. Unity would
  introduce her parents to Hitler, and he even visited her when she was in hospital
  during the opening weeks of WWII. Join Tom and Dominic in the final episode of our
  series on British fascism, as they delve into the life of Unity Mitford, her family,
  and her relationship with Hitler. Was she trying to seduce Hitler and form an Anglo-German
  dynasty? Was she not unsettled by the violence of the SS? And was she carrying Hitler’s
  child upon her return to Britain? Listen to find out…


