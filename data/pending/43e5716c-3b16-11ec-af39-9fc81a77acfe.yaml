title: Is Trump Caesar or Nixon?
description: 'Recorded hours after Joe Biden was named President of the United States,
  we ask if Donald Trump is a modern day Caesar, willing to do anything to stay in
  power? Or is Trump the natural successor to the disgraced Richard Nixon? Tom Holland
  and Dominic Sandbrook draw parallels between the modern White House, the 1970s and
  ancient Rome.



