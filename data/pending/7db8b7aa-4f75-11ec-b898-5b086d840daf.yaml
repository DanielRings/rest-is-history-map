title: '1066'
description: 'It is perhaps the best known year in English history. But why has it
  endured in the national consciousness? Tom Holland and Dominic Sandbrook talk the
  Battle of Hastings, the end of the Anglo-Saxons and wonder if King Harold really
  was killed by an arrow in the eye.


