title: 'RIHC: Introducing the ''12'' Days of Christmas'
description: 'Merry Christmas, members of the Rest Is History Club! Instead of our
  normal schedule, Dominic and Tom have recorded 13 episodes remembering things that
  have happened on this day in history from Christmas Day up to the 6th January. As
  a club member, instead of a bonus episode this week we''ve given you early access
  to all 13 episodes to listen to at your leisure over the holiday period. The next
  bonus episode will be available on 3rd January (our live show on cinema and history),
  and our regular schedule will resume on 10th January.


  Producer: Dom Johnson


  Exec Producers: Tony Pastor & Jack Davenport


  Twitter:

  @TheRestHistory

  @holland_tom

  @dcsandbrook


  Email: restishistorypod@gmail.com'
