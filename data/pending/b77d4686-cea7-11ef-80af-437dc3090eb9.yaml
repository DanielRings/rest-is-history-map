title: 'RIHC: Canada vs. America'
description: 'Why have Canadian politics historically been so troubled? How did Canada
  come to be an independent entity? What was its role in the American Revolution?
  Were the Canadian the real winner of the war of 1812? How did the American threat
  endure to Canadian independence? What happened at the Battle of the Windmill in
  November 1838? What makes it one of the greatest victory in Canadian history? And,
  judging from the history of its relationship with the US, how likely is it that
  Canada will one day be subsumed into it? 


  Join Dominic and Tom for this week’s bonus episode, as they discuss the history
  of Canada in the wake of the American Revolution, and its greatest victory against
  America.

