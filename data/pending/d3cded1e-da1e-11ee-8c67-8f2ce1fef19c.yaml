title: 'RIHC: Henry VIII, Thatcherism and Roman Counterfactuals'
description: 'Who is England''s most important monarch, William the Conquerer or Henry
  VIII? How would England have turned out without the Norman Conquest? Were Sodom
  and Gomorrah caused by real natural disasters? Does 2022 rival 1974 for a crisis
  year in British politics? Was Thatcherism inevitable? Which revolts in history have
  genuinely been lead by peasants? Would a Carthaginian empire have risen in place
  of the Roman Empire had they won the First or Second Punic Wars? And, how would
  Dominic structure a new historical book series about the years between Tony Blair
  getting elected in 1997, and the next UK election?


  Join Tom and Dominic for this week''s bonus episode, as they answer some fascinating
  historical questions.





  *The Rest Is History LIVE in 2024*


  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 


