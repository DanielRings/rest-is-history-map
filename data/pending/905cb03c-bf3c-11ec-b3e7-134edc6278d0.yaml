title: The Jewish Revolt
description: 'In the second of two episodes on the Jewish Revolt, Tom and Dominic
  discuss the burning of the Temple, Vespasian & Titus'' triumph, and Masada.


  Why was it such a landmark revolt for both Christianity and Judaism? What happened
  in its aftermath? And what has its historical significance been in the modern world?


  All this and more on today''s episode of The Rest Is History.


