title: 'The Charge of the Light Brigade: Outbreak of The Crimean War (Part 1)'
description: 'What caused the outbreak of the Crimean War in spring 1854? Who were
  the glamorous cavalry commanders responsible for ordering and leading the Charge
  of the Light Brigade? And, why was this great calamity so gloriously enshrined in
  the minds of the Victorian public?&nbsp;




  Join Tom and Dominic as they launch into&nbsp; the Crimean War; one of the most
  extraordinary conflicts in all world history. An innovatively  modern war, still
  fought by sabre-waving men on horseback clad in sumptuous uniforms. A story rife
  with colourful characters and shocking mishaps, climaxing in the Charge of the Light
  Brigade.




