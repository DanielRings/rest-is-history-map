title: Julius Caesar, with Mary Beard | FULL EPISODE
description: 'What is the main difference between Julius Caesar and Alexander the
  Great? When did Julius Caesar become one of the major players of the Roman Republic?
  What was the true nature of Caesar’s relationship with Cleopatra? How did he manage
  to defeat his enemies to become Dictator of Rome for life? And, how did he finally
  meet his violent, blood-spattered end? 


  In the third episode of this exclusive new series on ancient history, Tom is joined
  again by the world renowned classicist Mary Beard, to discuss Julius Caesar: the
  legendary Roman general who changed Rome forever, and doomed himself along the way…_______Twitter:@TheRestHistory@holland_tom@dcsandbrookSenior
  Producer: Theo Young-SmithProducer: Tabby SyrettAssistant Producer: Aaliyah Akude Video
  Editor: Jack Meek Social Producer: Harry Balden'
