title: 'Elizabeth I vs The Catholics: The Queen’s Spymaster (Part 1)'
description: 'How did Elizabeth I rule England? Why was she constantly in mortal peril
  in 1569? Who was Sir William Cecil, and why was he so crucial to her reign? And,
  how did his network of spies keep her alive, and England safe…?&nbsp;


  Join Tom and Dominic as they discuss the secret war raging in the heart of Elizabeth
  I’s Tudor England, the religious unrest flaming throughout Europe, and Elizabeth’s
  master of Spies: Sir William Cecil.






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.&nbsp;⁠⁠⁠Tickets
  available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


