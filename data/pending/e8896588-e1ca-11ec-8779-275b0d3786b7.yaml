title: Childbirth
description: 'In today''s episode, Tom and Dominic talk to Sara Read about the history
  of childbirth.


  Sara unveils the origin of the word ''gossip'' and its connection to midwifery.
  As well as this, they discuss how someone would qualify as a midwife; the relationship
  between religion and childbirth; and the average age of becoming a first time mother.
  They also look into the changes in the maternal mortality rate throughout history.
  And, finally, they touch on the authenticity of ''Call The Midwife''.  


  Sara Read is the author of two works of historical fiction: The Gossips'' Choice
  and The Midwife''s Truth, available from all good bookshops.


