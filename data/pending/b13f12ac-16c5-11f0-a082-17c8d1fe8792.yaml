title: 'RIHC: 1066 and The Norman Conquest EXTRA'
description: "What would have happened if Harold Godwinson had won the Battle of Hastings\
  \ in 1066? What were the consequences of the Norman Conquest for Europe as a whole?\
  \ How did it impact the English language? Did it see the birth of the Feudal System\
  \ in England, and introduce a new social order? What was the Norman Yoke? How have\
  \ the myths of the Norman Conquest influenced British literature, such as Lord of\
  \ the Rings, and folklore tales such as Robin Hood, ever since? How has William\
  \ the Conquerer’s triumph at Hastings changed or altered attitudes to monarchy in\
  \ Britain ever since? Did the Norman Conquest invent the idea of English liberty,\
  \ and “Englishness”, by creating a myth of Anglo-Saxon freedom? How did it alter\
  \ attitudes to Britain rather than England? Is the Norman Conquest still England's\
  \ foremost founding myth? And, what makes it exceptional in British history? \n\n\
  Join Tom and Dominic for this week’s bonus episode, as they delve deeper into the\
  \ Norman Conquest, and its long-term implications.\n_______\nTwitter:\n@TheRestHistory\n\
  @holland_tom\n@dcsandbrook\nProducer: Theo Young-Smith\nAssistant Producer: Tabby\
  \ Syrett + Aaliyah Akude \nExecutive Producers: Jack Davenport + Tony Pastor"
