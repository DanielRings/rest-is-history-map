title: 'Le Marquis de Sade: Sex and Violence'
description: 'The father of sadism and a prophet of totalitarianism, the Marquis de
  Sade was a French aristocrat and writer, an uncompromising and unashamed libertine
  with the eerie ability to corrupt those around him. Arrested first by the French
  monarchy and then by the revolutionaries, he spent much of his life in jail, narrowly
  avoiding the death penalty thanks to Robespierre’s deposition on the day of his
  proposed execution. Join Tom and Dominic as they discuss the Marquis, his turbulent
  life, his time in prison, and his unsettling legacy…


