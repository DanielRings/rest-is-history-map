title: 'RIHC: The first British president, fossil halls, and Tom''s trails'
description: 'Does a western cultural and intellectual tradition truly exist? Which
  is the most interesting British national trail? Who would Dominic elect to be the
  first president of the British Republic? Which one of our hosts would wear a codpiece
  for "clicks"? Has Tom Holland finally taken a wicket this summer? In this week''s
  bonus episode, Tom and Dominic attempt to answer these robust questions, and many
  more.


