title: King Solomon's Mines
description: 'In 1885, H. Rider Haggard’s brother offered him a wager: five shillings
  if he could write a book half as good as Robert Louis Stevenson’s “Treasure Island”.

  By the end of the year, Haggard had penned a novel that would become the foundational
  text of the lost world literary genre. “King Solomon’s Mines” was one of the first
  English adventure novels set in Africa, a story brimming with treasure, bravery
  and romance, featuring all-action hero Allan Quartermain and his gang. Haggard’s
  work would inspire the likes of Conan Doyle, H.P Lovecraft, and many more. 

  Join Tom and Dominic as they discuss H. Rider Haggard and his literary legacy.


