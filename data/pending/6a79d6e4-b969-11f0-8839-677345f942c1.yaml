title: 'RIHC | Nelson EXTRA: The Fate of Lady Hamilton'
description: "What became of Emma Hamilton and Horatia, Horatio Nelson’s beloved mistress\
  \ and daughter, after his tragic death at Trafalgar? Why was Emma arrested, and\
  \ did the British Government intervene to save her? What scandalous secrets did\
  \ Emma and Nelson’s love letters, mysteriously exposed to the public, reveal? And,\
  \ how and when did Emma die? \n\n\n\nIn this week’s bonus episode, Tom and Dominic\
  \ conclude their journey through the life of the extraordinary Emma Hamilton: Europe’s\
  \ first and most glamorous female celebrity, and the love of Nelson’s life.\n\n\
