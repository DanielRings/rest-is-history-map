title: 'Iran: England - ''The Little Satan'''
description: 'On the day of England vs. Iran, Tom and Dominic are joined by friend
  of the show, Ali Ansari, to discuss Anglo-Iranian relations. 


  Tune in to hear stories of freemasons, early Iranian analysis of Tories and Whigs,
  the Anglo-Persian War, Salman Rushdie''s fatwa, the ancestor of British Petroleum,
  and why Iran still sees England as a fox-like, ''little Satan''.


