title: 'The Charge of the Light Brigade: Into The Valley of Death (Part 4)'
description: "Into the jaws of Death, Into the mouth of hell Rode the six hundred…\n\
  \n\n\nWhy did Baron Raglan feel pressured to perilously send his forces into battle\
  \ against the Russians near Balaclava? How did a terrible misunderstanding see Lord\
  \ Lucan pass on a command to his rival Lord Cardigan, which would send his men riding\
  \ into a death trap of gunfire? And, how did the Charge of the Light Brigade unfold…?\
  \ \n\n\n\nJoin Tom and Dominic as they reach the climactic conclusion of their mighty\
  \ charge through the Crimean War. In this episode, they discuss the Battle of Balaclava\
  \ and the legendary Charge of the Light Brigade. Was it entirely futile? \n\n\n\n\
