title: 'Herodotus: The Birth of History'
description: 'Born on the Western edge of an empire that stretched all the way to
  India, Herodotus was a Greek historian of the 5th century BC. His major work The
  Histories, a long and detailed account of the Greco-Persian Wars and the cultures
  of the ancient world, is considered the founding work of History in Western literature.
  Herodotus was known for his thorough research, his use of eyewitness accounts, and
  his engaging storytelling style, and was not impervious to feuding with other historians…
  Join Tom and Dominic as they look into the life of the "father of History".


