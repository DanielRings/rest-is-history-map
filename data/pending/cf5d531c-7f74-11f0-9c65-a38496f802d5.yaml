title: 'The First World War: The Miracle on the Marne (Part 3)'
description: 'What extraordinary events saw the French - already on the brink of defeat
  - take on the formerly formidable German army in a remarkable counter-offensive
  on the 4th of September, in France, in a clash that would later become known as
  the Miracle on the Marne? Why was this such a decisive moment in the events of the
  First World War How did it relate to the famous Schlieffen plan? Did it really see
  the French charging into battle in Renault taxis? And, why did it become one of
  the most legendary moments in all of French history? 


  Join Dominic and Tom as they discuss one of the most astounding clashes of the First
  World War: the Battle of the Marne. 






