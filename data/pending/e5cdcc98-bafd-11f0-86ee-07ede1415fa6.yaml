title: 'Elizabeth I: Anne Boleyn’s Bastard (Part 2)'
description: 'What happened to the infant Elizabeth I following the bloody execution
  of her mother Anne Boleyn? How did her father Henry VIII and his next four wives
  treat her? And, what became of Elizabeth following the death of Henry, and the succession
  of her protestant brother Edward…? 




  Join Tom and Dominic as they discuss the next, unsteady phase of the young Elizabeth’s
  life, as she was transformed from adored royal princess, to outcast bastard; learnt
  to navigate her father’s infamous next four marriages, and overcame a dangerous
  sex scandal…






