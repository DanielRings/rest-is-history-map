title: 'The First World War: The Eastern Front Explodes (Part 5)'
description: 'While the Western front was raging following the outbreak of the First
  World War in 1914, what was unfolding on the Eastern Front? Why was it an even bloodier
  and more brutal arena than the West? As Austria took on its great antagonist - the
  spark of the entire war - Serbia, why were its early campaigns constantly blighted
  by disaster? What terrible mistake did Russia, with its behemoth of an army, make?
  How would its dramatic war with Germany unfold? And, would this be the beginning
  of the end of the Habsburg Empire?  


  Join Dominic and Tom as they discuss the outbreak of the First World War on the
  Eastern Front, and its early clashes. 






