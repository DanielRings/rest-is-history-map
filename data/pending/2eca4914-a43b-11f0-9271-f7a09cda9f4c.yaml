title: 'Nelson: The Final Showdown (Part 5)'
description: "After two years at sea chasing the combined fleet of France and Spain,\
  \ what was Nelson’s next step? Upon returning to his beloved Emma, how was the heroic\
  \ Nelson received? What was the terrifying Napoleon Bonaparte scheming for his fleet\
  \ across the seas? And, would Britain finally face an imminent French invasion,\
  \ and with it apocalypse - for both Britain and Nelson himself?\n\n\n\nJoin Dominic\
  \ and Tom as they discuss the build up to one of the most totemic naval clashes\
  \ of all time - Trafalgar - and Nelson; the man behind it all. \n\n_______\n\nTwitter:\n\
  \n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\nVideo Editor: Jack Meek \n\n\
  Social Producer: Harry Balden\n\nAssistant Producer: Aaliyah Akude\n\nProducer:\
  \ Tabby Syrett\n\nSenior Producer: Theo Young-Smith\n\nExec Producer: Dom Johnson"
