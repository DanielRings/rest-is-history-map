title: 'RIHC: Marie Antoinette EXTRA'
description: 'How has Marie Antoinette traditionally been depicted in art - as a victim
  or a despot? What parallels can be drawn between the famous execution of Lady Jane
  Grey in England and that of Marie Antoinette? How important were Marie Antoinette’s
  flamboyant clothes in defining how she was interpreted? And, what did the exuberant
  portrayal of her execution in the opening ceremony of the Paris Olympics suggest
  about the way that she is perceived in France today? 

  In today’s bonus episode, with Dominic on holiday, Tom is joined by art historian
  and Marie Antoinette enthusiast Issy Muir, to discuss the most famous representations
  of the iconic French queen in art over time. 

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
