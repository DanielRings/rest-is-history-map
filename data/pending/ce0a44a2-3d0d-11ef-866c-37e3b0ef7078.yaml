title: 'RIHC: England vs Holland (Livestream)'
description: 'From 1556 and the Dutch Revolt onwards, what have been the key moments
  of Anglo-Dutch relations? Why were they so strained during the 17th century? What
  happened at the Battle of the Medway in 1667, which saw Dutch ships sailing right
  up the Thames estuary? How did New Amsterdam become New York? Was the Glorious Revolution
  and William of Orange''s usurpation of James II in 1688, in fact the last successful
  invasion of England? Historically, are there more differences between the Dutch
  and the English than similarities, and are they therefore natural allies or natural
  enemies? 


  Join Tom and Dominic for this month’s livestream, as, with England playing the Netherlands
  in the semi-finals of the Euros tonight, they discuss the tumultuous history of
  Anglo-Dutch relations. From 16th century protestantism and 17th century Jacobites,
  to the Battle of Arnhem in 1944, and John Lennon and Yoko Ono in Amsterdam in the
  1960''s. 

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

