title: 'RIHC: Founding Fathers, Sporting Rivalries, and Hedonism'
description: 'What sets Russia apart from other Eastern European countries? Who are
  Tom and Dominic''s favourite U.S. Founding Fathers, and which of them do they consider
  villainous? What explains the 18th century cultural turn from hedonism to puritanism?
  To what extent are the greatest sporting rivalries influenced by history? In this
  week''s bonus episode, Tom and Dominic grapple with these difficult questions, and
  many more. 


