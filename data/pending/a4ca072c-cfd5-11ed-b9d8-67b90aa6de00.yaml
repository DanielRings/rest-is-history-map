title: 'Hundred Year''s War: The Black Prince (Ep 3)'
description: 'As the spectre of the Black Death haunts Europe, a more tangible foe
  terrorises the French king and his subjects: the Black Prince, Edward of Woodstock.
  After his great victory leading the vanguard at Crécy, he continues with his regular
  incursions into France, before eventually being cornered by John II and his vast
  army at Poitiers in 1356: has the Black Prince’s luck finally run out?


