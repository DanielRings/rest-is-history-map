title: 'Rome’s Greatest Enemy: Carthage Destroyed (Part 4)'
description: 'Three decades after the defeat of Hannibal, how had the Roman Empire
  managed to conquer vast swathes of the known world? Why did the predatory eyes of
  this terrifying behemoth turn once more to Carthage? And, could this mighty city
  defy the odds and repel Rome one last time…?




  Join Tom and Dominic as they reach the climactic, final phase of the Punic Wars;
  the greatest military struggle of all ancient history.


