title: 'Custer vs. Crazy Horse: Horse-Lords of the Plains (Part 3)'
description: "Of all the great characters entangled in the story of George A. Custer\
  \ and the American Indian Wars, few are as captivating as Crazy Horse. A mighty\
  \ warrior of the Lakota Sioux, and a tremendous military tactician, he was a charismatic\
  \ but enigmatic figure. The Sioux, of which the Lakota are a subculture, are groups\
  \ of Native American tribes and First Nations people from the Great Plains. Their\
  \ way of life was transformed by the introduction of horses to North America, but\
  \ their nomadic lifestyle and dependence upon buffalo hunting was severely threatened\
  \ by the imposition of telegraph lines, forts and then railroads upon their lands.\
  \ So it was that, reluctant to be confined to the reservations outlined for them\
  \ by the U.S. Government, they decided to fight back, under the joint leadership\
  \ of the politically savvy Red Cloud, and the fated, fearless, tactically brilliant,\
  \ Crazy Horse… \n\nJoin Dominic and Tom as they plunge into the world of the Lakota\
  \ Sioux, looking at the history of their people in the American plains, their rich,\
  \ complex culture and often gory rituals, and the fascinating characters who would\
  \ challenge George Custer and the U.S. Government. \n\n\nEXCLUSIVE NordVPN Deal\
  \ ➼ https://nordvpn.com/restishistory Try it risk-free now with a 30-day money-back\
  \ guarantee!\n\n\uFEFF\n*The Rest Is History LIVE in 2024*\nTom and Dominic are\
  \ back onstage this summer, at Hampton Court Palace in London!\n\nBuy your tickets\
