title: 'Fashion: World War II, Weimar Republic’s Dadaism, and Bobby Kennedy’s Death
  | History in Photos'
description: "How have fashion ads changed thanks to photography? How did Erwin Blumenfeld’s\
  \ refugee identity influence his work? What makes Horst P. Horst’s Mainbocher Corset\
  \ one of the most iconic fashion images of all time? And, what dark, mysterious\
  \ photo influenced Glen Luchford’s Prada 1997 autumn/winter campaign? \n\n\n\nIn\
  \ today’s episode of our new member’s-only mini-series, Dominic is joined by photographer\
  \ Chris Floyd to discuss famous photographs of iconic and genre-defining fashion\
  \ images. \n\n\n\nGetty Images has one of the largest and oldest privately held\
  \ archives globally with access to over 150 million images dating back to the beginning\
  \ of photography. From historical images created in the early\n\n1800s to more contemporary\
  \ 1990s imagery, the Getty Images archive houses a wealth of socially significant,\
  \ historical photos, videos and prints, and includes content from over 40 editorial\
  \ content\n\npartners including Gamma-Rapho, Paris Match, The Bettmann Archive,\
  \ Sygma and Motorsport Images. Our archive video collection contains 3.1 million\
  \ hours of offline video footage and includes partners\n\nsuch as NBC News Archives,\
  \ ITN, Sky News and the BBC Motion Gallery.\n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\
  \n@holland_tom\n\n@dcsandbrook\n\n\n\nVideo Editors: Jack Meek, Harry Swan + Adam\
  \ Thornton\n\nSocial Producer: Harry Balden\n\nProducers: Tabby Syrett & Aaliyah\
  \ Akude\n\nSenior Producer: Callum Hill\n\nExecutive Producer: Dom Johnson"
