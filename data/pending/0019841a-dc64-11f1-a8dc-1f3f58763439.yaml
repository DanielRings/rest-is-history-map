title: How Tennyson’s Charge of The Light Brigade Changed the Victorian Imagination
  of War
description: "How is Lord Tennyson’s poem, The Charge of the Light Brigade, a window\
  \ into the 19th century? Why is his work so often imbued with darkness and melancholy?\
  \ And, how did he draw inspiration from literary giants like Lord Byron, as well\
  \ as the legends of King Arthur?\n\n\n\nIn today’s bonus episode, Tom is joined\
  \ by author and English professor Seamus Perry, to delve deeper into Alfred, Lord\
  \ Tennyson’s glorious poem about The Charge of The Light Brigade. \n\n\n\nGive The\
  \ Rest Is History Club this Christmas + free T-shirt! Treat yourself or a fellow\
