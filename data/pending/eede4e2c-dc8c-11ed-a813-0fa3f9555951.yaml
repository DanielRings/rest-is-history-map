title: 'East Germany: Life Behind the Iron Curtain'
description: 'The German Democratic Republic was born in the ashes of the Second World
  War, and described itself as a socialist “workers’ and peasants’ state”. The country
  struggled for much of the latter half of the 20th century, relying on economic support
  and political backing from the USSR, until its dissolution in 1990. But what was
  life like for the average East German? In today''s episode, Tom and Dominic are
  joined by historian Katja Hoyer as they discuss living standards, police surveillance,
  access to luxury goods, elections and political unrest in the now defunct East Germany.


