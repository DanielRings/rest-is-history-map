title: The New Elizabethan Age
description: 'The longest reigning monarch in British history, Elizabeth II acceded
  to the throne 70 years ago.


  To mark the occasion, Tom and Dominic are joined by Frances Christie, Deputy Chairman
  of Sotheby''s UK and Ireland, who specialises in 20th century British art and culture.
  Together they drill down into some of the cultural, artistic and historic happenings
  that have taken place during the Queen''s reign.


  Producer: Dom Johnson

