title: England & Englishness
description: 'George Orwell, a love of wildlife, and Raheem Sterling - but what does
  it mean to be English in the modern world?


  In today''s episode, Tom and Dominic are joined by the New Statesman editor, Jason
  Cowley, to discuss England and Englishness in the 20th century.


  Jason''s new book ''Who Are We Now?'' is available at all good book retailers.


