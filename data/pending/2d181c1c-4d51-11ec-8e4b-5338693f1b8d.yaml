title: Sparta
description: 'What does it mean to be a Spartan? How much of this Spartan image is
  real and how much is based on projections and prejudices of others?


  Tom and Dominic delve into the Ancient Greek world and take us inside the minds
  and reality of this civilisation. They also analyse the film “300” and look at what
  it got right and wrong. 


