title: 'Britain: God Save the King (Part 2)'
description: 'How did the Napoleonic Wars contribute to the enshrinement of the British
  national anthem? What are the Jacobite origins of this legendary melody? And, which
  British monarch was it written for? 




  Join Tom and Dominic as they discuss the creation of Britain’s legendary national
  anthem, God Save the King, and its mysterious composer. 


