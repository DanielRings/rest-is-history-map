title: 'Carthage vs. Rome: The Wolf at the Gates (Part 3)'
description: '“Every man is the architect of his own destiny”

  Long before Rome reigned over the Mediterranean, there was Carthage: the supreme
  predator of Antiquity. But how did Rome rise to become one of the most ruthless
  powers of all time, united in cold, disciplined violence? And what was it about
  the Roman people that made them the greatest threat Carthage would ever face? Whilst
  the Carthaginians depended upon foreign mercenaries, Rome’s legions were formed
  of Romans, all committed to protecting and furthering the interests of Rome. And
  unlike anyone before, the Roman people shared a collective sense of destiny, with
  Roman citizenship generously offered to all conquered peoples. But following the
  Sack of Rome by Gauls in 390 BC, the Romans would become even more ruthless, disciplined
  and bent on total victory…

  Join Tom and Dominic as they discuss the rise of Rome, history’s most famous superpower.
  By 285 BC her dominion of Italy was almost complete. Only one thing stood in her
  way: the formidable military leader Pyrrhus. He alone foresaw the destruction to
  come, and the “beautiful killing ground” that would emerge when, ten years later,
  Rome and Carthage would finally go to war…





