title: 'RIHC: The Anglo-French truce, latin periodicals, and a cinematic smackdown'
description: 'Did the French really cut off the fingers of English archers? Could
  latin newspapers be the answer to world peace? Which animal has Tom decided to focus
  on for the entirety of a future episode? Was the Black Prince a tremendous fellow,
  or a war criminal? In this week’s bonus, with Dominic still on holiday, Tom is joined
  by producer Theo, in an Anglo-French showdown for the ages… 


