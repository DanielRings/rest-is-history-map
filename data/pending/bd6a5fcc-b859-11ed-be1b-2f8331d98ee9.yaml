title: 'RIHC: The New Restoration, James Bond, and historical AI (livestream)'
description: 'What truly defines a nation-state? Has a new Restoration dawned on the
  UK? Will Ian Fleming, like Roald Dahl, one day be re-written? Why wasn''t France
  interested in trade with India in the 18th century? Will Tom and Dominic be touring
  Alaska next winter? This week''s bonus explores these questions, and many more,
  whilst also teasing our upcoming series on Reagan and Atlantis...


  *The Rest Is History Live Tour April 2023*:


  Tom and Dominic are going on tour in April 2023 and performing in London, Edinburgh,
  and Salford! Buy your tickets here:


