title: 'The Great Northern War: The Battle of the Baltic (Part 1)'
description: "How did the Great Northern War, which saw Sweden pitted against Peter\
  \ the Great’s Russia and her allies, and would transform Europe forever, begin?\
  \ Who was Charles XII, Sweden’s King, and a worthy antagonist for the formidable\
  \ Peter? What terrible miscalculation saw Russia’s Danish allies brutally knocked\
  \ from the war in its early stage? What dreadful havoc did Peter’s Cossacks wreak\
  \ upon the Eastern Baltic? And, who was the young farm girl who would go on to capture\
  \ the heart of a Tsar? \n\n\n\nJoin Dominic and Tom as they discuss Peter the Great,\
  \ the early stages of the tumultuous Great Northern War, and his scandalous marriage\
  \ to a serving girl.\n\n\n\n\n\nThe Rest Is History Club: Become a member for exclusive\
  \ bonus content, early access to full series and live show tickets, ad-free listening,\
  \ our exclusive newsletter, discount book prices on titles mentioned on the pod,\
