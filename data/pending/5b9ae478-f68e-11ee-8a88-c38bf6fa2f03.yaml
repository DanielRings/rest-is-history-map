title: 'Lord Byron: Death of a Vampire (Part 4)'
description: 'Rumours surrounding Lord Byron’s scandalous divorce rippled throughout
  the world. Finally, he had no choice but to abandon England in disgrace and flee
  to Italy, an exile but still the most famous man in Europe. Then, in the summer
  of 1816 in Geneva, he met a young poet named Percy Bysshe Shelley, and one of the
  most iconic literary friendships of all time was sparked. A handsome republican
  with an enthusiasm for free-love, Shelley immediately attracted Byron’s admiration.
  With him, however, was his sister-in-law Claire, a former lover of Byron’s, pregnant
  with his child whom he detested. Also, Shelley’s wife, Mary. So it was that on a
  stormy night of ghost stories, another great masterpiece was born…However, as time
  passed and in the wake of a series of tragedies, the aging Byron grew increasingly
  isolated and restive, his thoughts turning once more to Greece, that ancient land
  of myth and legend. Approached by the London Greek Committee to help support the
  cause of Greek independence, Byron set off once more for Kefalonia. Was it doom
  or destiny that beckoned?


  Join Tom and Dominic for the grand finale of their gripping journey through the
  life of one of history’s most darkly intriguing figures, Lord Byron. From his English
  exile, Italian sojourn and final love affair, to the greatest adventure of them
  all...




  *The Rest Is History LIVE in 2024*

