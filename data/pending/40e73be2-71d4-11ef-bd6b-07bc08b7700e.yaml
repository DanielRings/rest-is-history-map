title: 'Evita: Death of a Martyr (Part 4)'
description: 'The workaholic mother of a nation, Evita’s health deteriorates and she
  faints at a public event. A self-proclaimed martyr, she seems to be willing to die
  for Perón and Perónism, and her supporters see her passion. As she continues her
  public work, her supporters call for her to run as Vice President in the upcoming
  election - a position of power no woman on Earth has yet held. Evita’s supporters
  seem to outnumber Colonel Perón’s, with unions organising mass meetings that bring
  up to 2 million people to the city streets.


  As the couple look out at the crowds from the balcony, they get the sense that they
  have created a monster of a movement that they may have lost control over…

  Listen as Tom and Dominic discuss the growing public frenzy that snowballs in Argentina
  towards the end of Evita’s life.

