title: World Cup of Kings & Queens - Part 2
description: 'Elizabeth II. Henry V. William the Conqueror. All pretenders, according
  to our twitter poll to find England’s greatest monarch, which has been running over
  the last week. Dominic and Tom discuss those who fell at the final hurdle, as well
  as finding room for a rather queasy anecdote about Henry VIII’s personal hygiene.


