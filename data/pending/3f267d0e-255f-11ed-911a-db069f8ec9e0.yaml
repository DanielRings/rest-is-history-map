title: The Lord of the Rings
description: 'Written in stages between 1937 and 1949, The Lord of the Rings is one
  of the best-selling books ever written, with over 150 million copies sold.


  Join Tom and Dominic in the second of two episodes on the life and work of J.R.R. Tolkien,
  where they discuss the themes of encroaching industrialisation, the air defences
  of Mordor, and whether the Scouring of the Shire was an allegory for post-war Attlee
  Britain...


