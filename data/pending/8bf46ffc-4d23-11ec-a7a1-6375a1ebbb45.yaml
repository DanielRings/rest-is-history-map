title: The Norse Sagas
description: 'In today’s episode, Tom and Dominic are joined by Dr Eleanor Barraclough
  as they sail across the Atlantic in a dragon-ship, bound for the epic world of the
  Norse sagas. What society did the Vikings set up in Iceland? How did they get to
  America? Why were they always so violent?


