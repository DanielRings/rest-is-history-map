title: The Mad Emperor's Lost Son
description: 'What made Hormuz Rassam the extraordinary character he proved to be?
  Who was Captain Speedy, the explorer and adventurer? And, what happened to Prince
  Alemayehu, Emperor Tewodros’ son, after his suicide?&nbsp;




  In today’s bonus episode, Tom and Dominic dive deep into the side characters of
