title: 'Fall of Saigon: The Nightmare Begins  (Ep 1)'
description: 'It''s 1975, and in the final act of the Vietnam War, the U.S. have ordered
  all remaining civilian and military personnel to be withdrawn from South Vietnam.
  The communist Viet Cong are closing in on the city of Saigon, the hub of America’s
  presence, as choppers evacuate the 6000 Americans left in the city. Thousands of
  Vietnamese storm the U.S. embassy, as Saigon descends into chaos. Join Tom and Dominic
  as they explore the horror and devastation left in the wake of America’s intervention
  in Vietnam.


