title: The Death of History
description: "What can the occupation of the ancient city Mosul in Iraq, in 2014,\
  \ teach us about the erasure of history? What makes the city’s past so extraordinary,\
  \ with multiple empires and conquerors rising and falling? And, how did the Islamic\
  \ State destroy its history amidst its gruelling occupation, while spreading fear\
  \ throughout?\n\n\n\nIn this week’s bonus episode, Tom is joined by courageous historian\
  \ and journalist Omar Mohammed - formerly known as ‘The Mosul Eye’ - to discuss\
  \ the brutal occupation of Mosul by the Islamic State, and the selective destruction\
  \ of history. \n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n\
  @dcsandbrook\n\n\n\nVideo Editors: Jack Meek, Harry Swan + Adam Thornton\n\nSocial\
  \ Producer: Harry Balden\n\nProducers: Tabby Syrett & Aaliyah Akude\n\nSenior Producer:\
  \ Callum Hill\n\nExecutive Producer: Dom Johnson"
