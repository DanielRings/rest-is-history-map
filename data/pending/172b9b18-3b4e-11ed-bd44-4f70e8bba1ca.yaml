title: Marilyn Monroe
description: 'Actress, singer, model and sex symbol Marilyn Monroe has long been associated
  with old school Hollywood glamour and American pop culture. But why is she worth
  studying historically? Join Tom and Dominic as they discuss Marilyn''s relationship
  to the Mafia, JFK, the Korean War and her persisting relevance today.


