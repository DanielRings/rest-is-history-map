title: 'RIHC: Roman Sex Scandals, Courageous Leaders, and Napoleon’s Fate'
description: 'Is physical courage a prerequisite for greatness? Does the use of emergency
  dictatorial powers always result in totalitarianism? Why was Napoleon exiled rather
  than executed? Which was the bigger scandal, Profumo or Thorpe, and are there any
  Roman parallels? 


  Join Tom and Dominic in this week’s bonus episode as they answer some of history’s
  most exciting questions. 



  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


