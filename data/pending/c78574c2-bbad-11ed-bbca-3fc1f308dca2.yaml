title: 'Reagan: The Road to the White House (Ep 2)'
description: 'His Hollywood career drying up, Ronald Reagan works both for the Screen
  Actors Guild and General Electric in the 1950s. Building connections with the Californian
  elite, and having gained national attention with a speech for the Republican presidential
  candidate in 1964, he becomes Governor of California in 1966. A pragmatic, anti-hippie,
  centre-right governor, he goes on to win the Republican presidential nomination
  at his second attempt, and the American presidency at his first.


