title: The Second Reich
description: 'It emerged from the Prussian victory over France in 1870 and was destroyed
  by the First World War less than fifty years later. German historian Katja Hoyer
  joins Tom Holland and Dominic Sandbrook to discuss the short but explosive life
  of the German Second Reich.


