title: 'RIHC: Roman Legions vs. Norman Invaders, The Killing Fields of Agincourt,
  and American Aristocracy'
description: 'Was Juan Perón ultimately responsible for the death of his first two
  wives? Could a Roman field army have defeated William the Conqueror’s invasion force
  of 1066? What gift did the Kaiser leave behind after a stay in the Lake District?
  Will Dominic let Tom do a series on a mythical Greek island? Which are the top historical
  sites to visit when in Rome? In this week’s bonus episode, Tom and Dominic grapple
  with these difficult questions, and many more…

  _______


  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,
  Washington D.C., Boston and New York. 


  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.


  Tickets on sale now at TheRestIsHistory.com

