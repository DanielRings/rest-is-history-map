title: 'RIHC: Shakespeare, Riots, and Sporting Greats'
description: 'Which archives would be most dearly missed if they burned down today?
  Who is more important to the culture of Britain: William Shakespeare, King Henry
  VIII, King James I, or Winston Churchill? If Stuart Broad was a figure from History,
  who would he be? Does Tom Holland have any controversial pet theories? In this week’s
  bonus episode, with Dominic away on holiday, Tom is joined by Theo, the show’s producer,
  to discuss these challenging questions, and more.


