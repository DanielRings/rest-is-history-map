title: Why Is Christopher Nolan's Odyssey Controversial?
description: "What did Helen of Troy look like? Who would be the best person in the\
  \ world to play Odysseus on screen? What was the attitude of the ancient Greeks\
  \ to race? And, why is the home Odysseus fights to get back to for ten years; Ithaca,\
  \ used in the epic rather than somewhere more significant?\n\n\n\nIn this week’s\
  \ bonus episode, Tom is joined again by classicist Daniel Mendelsohn, to dive deeper\
  \ into the history behind The Odyssey, and the new Christopher Nolan movie.&nbsp;\n\
  \n\n\n*The Rest Is History LIVE: The Ultimate Victorian Adventure*\n\n\n\nThe maddest\
  \ expedition in history and it’s NEVER been heard before on the show: join Tom Holland\
  \ & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers story of Queen\
  \ Victoria ordering one of history’s most daring assignments ever. Tickets available\
  \ for Friday 4th September, the Saturday show is SOLD OUT. \n\n_______\n\nTwitter:\n\
  \n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\nVideo Editors: Jack Meek, Harry\
  \ Swan + Adam Thornton&nbsp;\n\nSocial Producer: Harry Balden\n\nProducers: Tabby\
  \ Syrett & Aaliyah Akude&nbsp;\n\nSenior Producer: Callum Hill&nbsp;\n\nExecutive\
  \ Producer: Dom Johnson"
