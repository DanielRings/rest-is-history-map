title: '1066: The Battle of Hastings (Part 3)'
description: "Following King Harold Godwinson’s climactic victory at the Battle of\
  \ Stanford Bridge, and the death of Harald Hardrada, what did he do when news reached\
  \ him that William of Normandy’s army had landed further south? How did the two\
  \ armies finally come together for one of the most totemic clashes of all time,\
  \ on the morning of the 14th of October 1066? What exactly unfolded during the infamous\
  \ Battle of Hastings? And, how did Harold truly meet his grisly end?\n\nJoin Tom\
  \ and Dominic as they unfold, in spine-tingling detail, the build up to and events\
  \ of one of history’s greatest collisions: Harold Godwinson vs William of Normandy\
  \ at the Battle of Hastings. \n\n_______\nTwitter:\n@TheRestHistory\n@holland_tom\n\
  @dcsandbrook\nProducer: Theo Young-Smith\nAssistant Producer: Tabby Syrett + Aaliyah\
  \ Akude\nExecutive Producers: Jack Davenport + Tony Pastor"
