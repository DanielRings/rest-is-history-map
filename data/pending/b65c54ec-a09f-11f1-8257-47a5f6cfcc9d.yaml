title: 'Roman Civil War: The Barbarian Invasion (Part 2)'
description: 'What was the ancient city of Rome actually like in the first century
  BC? Who was Lucius Cornelius Sulla, another great, but aristocratic, Roman general
  who would clash with Gaius Marius in a totemic struggle termed the Social War? And,
  who were the terrifying Germanic tribes amassing on the borders of the empire, potentially
  spelling its doom…?




  Join Tom and Dominic as they discuss Rome’s apocalyptic threat from the North, Marius’
  wars in defence of the empire, and the rise of his greatest adversary: Sulla.&nbsp;






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


