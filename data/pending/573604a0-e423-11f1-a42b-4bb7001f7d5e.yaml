title: 'Crimea: The Most Fashionable War of All Time'
description: 'Which items of clothing were inspired by the Crimean War? Is it the
  war with the most influence on sartorial and tailored fashion? And, what other wars
  impacted the way both women and men dress?In today’s bonus episode, Tom is joined
  by editor in chief of The Rake magazine Tom Chamberlin to discuss the links between
  war and fashion.




