title: The Mystery of the Holy Grail (Ep 2)
description: '“Who drinks the water I shall give him, will have a spring inside him
  welling up for eternal life.” A deeply mysterious object which doesn’t appear in
  the Bible, was the Holy Grail really the chalice used by Jesus during the Last Supper,
  and the very cup that caught his blood at the crucifixion? Or is it merely a symbol
  representing Christ’s bloodline? Join Tom and Dominic as they discuss the Holy Grail,
  the origin of the tradition, and the role it played within medieval Christendom. 


