title: Raiders of the Lost Ark (Ep 1)
description: 'The most important object in the universe, but also a somewhat invisible
  presence in the Bible, the Ark of the Covenant has fuelled stories for millennia,
  whether as a weapon of mass destruction, an elaborate filling cabinet for sacred
  laws, or as the very location where God and man meet. Join Tom and Dominic as they
  delve into the mysteries surrounding the Ark of the Covenant, its creation, its
  importance and its eventual disappearance…


