title: 'Mexico: Day of the Dead'
description: 'On the Day of the Dead you eat pan de muerto and exchange calaveras
  with your friends. This celebration is often claimed to have its roots in ancient
  Aztec traditions of human sacrifice. But is any of this true? Join Tom and Dominic
  to find out.


