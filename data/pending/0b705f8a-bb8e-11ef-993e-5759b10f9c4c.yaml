title: 'RIHC: The Eruption of Vesuvius, Lost Texts, and Ancient Cults'
description: 'What are the ancient Herculaneum scrolls, recovered following the explosion
  of Vesuvius in 79 AD? How did these supposedly lost documents survive? What happened
  this year to resurrect them, when they had seemed incomprehensible for so long?
  Who were the Epicureans, philosophers of Ancient Greece? How would new discoveries
  alter the way that Classics is studied, and the ancient world understood? And, which
  lost texts would classicists most want to discover?

  In this week’s bonus episode, Tom is joined by classicist and head of Classics at
  Oxford University, Llewellyn Morgan, to discuss the eruption of Vesuvius, the remarkable
  Herculaneum scrolls, and the ancient secrets lost texts contain… 

