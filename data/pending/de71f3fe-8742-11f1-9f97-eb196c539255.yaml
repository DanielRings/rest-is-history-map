title: 'Elizabeth I vs The Catholics: Killing the Queen of Scots (Part 6)'
description: 'How did the Babington Plot, another Catholic conspiracy to assassinate
  Elizabeth I and replace her with the imprisoned Mary Queen of Scots, unfold? Did
  the Spanish help her? How did Sir Francis Walsingham and his web of spies foil the
  plot? And, what would become of Mary once put on trial?




  Join Tom and Dominic for the dramatic conclusion to their mighty series on the most
  climatic period of the reign of Elizabeth I, as she faces another assassination
  attempt, and decides whether to execute her cousin, and a fellow queen…






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


