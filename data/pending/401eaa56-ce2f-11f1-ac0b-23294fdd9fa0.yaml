title: 'Revolution in the Soviet Empire: Revenge of the Red Army (Part 4)'
description: 'Three days into the Hungarian Uprising against the Soviet Union, had
  the revolution escalated nationwide? How did the Soviet leader Nikita Khrushchev
  respond? And, with the threat of a Red Army invasion, would Hungary abandon the
  Soviet Pact?&nbsp;




  Join Dominic and Tom as they reach the violent denouement of the Hungarian Revolution
  of 1956, and explain its bloody outcome.&nbsp;&nbsp;&nbsp;




