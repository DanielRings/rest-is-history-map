title: Ancient Olympics
description: 'With the Games underway in Tokyo, Tom and Dominic look back to the Ancient
  Olympics. They discuss the heroic but incredibly violent stories of the Greek superstars
  of 2500 years ago, and why the Games were bad news for women, animals and cheats. Plus,
  Tom reveals how his cricketing woes were compounded by an Ancient Greek poet.


