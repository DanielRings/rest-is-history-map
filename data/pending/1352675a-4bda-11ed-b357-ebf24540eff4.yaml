title: 'Trafalgar: A World at War (Ep 1)'
description: 'Was the Battle of Trafalgar the most decisive battle of the 19th century?
  Join Tom and Dominic as they embark on a three part series discussing this incredible
  conflict between the British Royal Navy and combined fleets of the French and Spanish
  navies. In this episode they discuss: the distrust between the standing army and
  the Royal Navy; technology used for the first time during Trafalgar; and the martyr-like
  status of Horatio Nelson, who led the British to victory. 


