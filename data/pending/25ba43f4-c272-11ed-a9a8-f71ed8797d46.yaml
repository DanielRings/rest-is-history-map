title: Climate Apocalypse
description: 'Have humans always been haunted by fears of a climate apocalypse? Or
  is that a modern phenomenon? Is there a continuity from the Curse of Akkad to the
  Industrial Revolution? Listen as Tom and Dominic are joined by Peter Frankopan to
  discuss the history of the climate.


