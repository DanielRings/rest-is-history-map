title: 'RIHC: 24 hours in Amsterdam, Jesus on camera, and peeping Tom'
description: 'What historical figure would Tom and Dominic love to see footage of?
  Why isn''t Irish history taught in English schools? What did Tom and Dominic really
  get up to in Amsterdam? Coming to you this week from a train somewhere between Amsterdam
  and Paris, Tom and Dominic take a look at these challenging questions, and many
  more...


