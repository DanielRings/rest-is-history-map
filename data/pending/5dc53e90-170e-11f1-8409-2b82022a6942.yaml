title: 'London’s Golden Age: The Mad Life of Dr Johnson (Part 1)'
description: "Who was Samuel Johnson, the dominant literary celebrity of 18th century\
  \ London and the man who wrote the Dictionary? Why did his friendship with James\
  \ Boswell, a sex and celebrity obsessed, but very talented writer, flourish? And,\
  \ how does this titanic friendship open a window onto Georgian Britain; from slavery\
  \ to the politics of the day? \n\n\n\nJoin Tom and Dominic as they discuss one of\
  \ history’s greatest Englishmen, Samuel Johnson, and his infamous friendship with\
  \ the man who immortalised him forever, in an age that changed Britain’s politics\
  \ forever… \n\n\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\
  \nVideo Editors: Jack Meek + Harry Swan \n\nSocial Producer: Harry Balden\n\nProducers:\
  \ Tabby Syrett & Aaliyah Akude \n\nExecutive Producer: Dom Johnson"
