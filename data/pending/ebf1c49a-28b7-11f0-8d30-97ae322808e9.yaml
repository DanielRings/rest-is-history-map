title: 'RIHC: The Fall of the Roman Empire, Edward the Confessor’s True Heir, and
  Vikings Abroad'
description: "Would it have been fair to refer to the Eastern Roman Empire - the Byzantine\
  \ Empire - as ‘Roman’? What language would have been spoken throughout the Empire?\
  \ Who did Edward the Confessor really want as his heir to the throne of England?\
  \ Was Edward a good king? Why didn’t the Anglo Saxons launch a preemptive strike\
  \ on the vikings? What language would Harald Hardrada have spoken over the course\
  \ of his extensive travels? And, what was the Hanseatic League? \n\nJoin Tom and\
  \ Dominic for this week’s bonus episode, as they answer some fascinating historical\
  \ questions.\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\
  \nProducer: Theo Young-Smith\n\nAssistant Producer: Tabby Syrett + Aaliyah Akude\
  \ \n\nExecutive Producers: Jack Davenport + Tony Pastor"
