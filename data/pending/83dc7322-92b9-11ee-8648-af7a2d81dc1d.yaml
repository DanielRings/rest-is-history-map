title: 'RIHC: The New Julius Caesar, Henry Kissinger, and Power in American Politics'
description: 'What if Joe Kennedy Jr. had survived and become President instead of
  JFK? Why haven’t more American Presidents been assassinated in processions or cavalcades?
  What was the electoral balance between the Democrats and the Republicans in 1960''s
  America? Can great nations achieve power peaceably, or must there always be violence
  and oppression? What happened to Lee Harvey Oswald’s daughter? 


  Join Tom and Dominic in this week’s bonus episode, as they explore these significant
  historical questions.




  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


