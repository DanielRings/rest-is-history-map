title: Nuclear Weapons
description: 'The year is 1983, and on November the 8th the world is the closest it’s
  ever been to nuclear destruction, yet nobody at the time realises. Dominic and Tom
  are joined by author and historian Taylor Downing to discuss how Armageddon was
  just avoided and why Tom, living near Salisbury, was in more danger than most.


