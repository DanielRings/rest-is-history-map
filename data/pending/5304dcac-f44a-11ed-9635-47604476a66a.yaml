title: 'RIHC: Roman Scotland, Humanities, and Herodotus'
description: 'What was Scotland’s place in the Roman world? Does Australia get left
  out of the conversation about the Vietnam war? What does the future hold for university
  degrees like English and History? How much do Tom and Dominic know about Irish history,
  ahead of their show in Dublin? In this week''s bonus episode, Tom and Dominic discuss
  these questions, and many more...


