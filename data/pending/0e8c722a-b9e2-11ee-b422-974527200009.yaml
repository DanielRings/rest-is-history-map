title: 'RIHC: History''s Greatest Knight, Kings vs. Tabloids, and Storms in Belfast'
description: 'Which historical figures would have been broken by the English tabloid
  press, had they been around at the same time? Did Edward I help or hinder Anglo-Scottish
  relations with his invasions? Which countries have been the powder kegs of Europe
  for the last 2,500 years? What is the connection between the Tories of the late
  seventeenth-century and those of the eighteenth-century? Join Tom and Dominic for
  this week’s bonus episode, as they discuss Tom’s Belfast odyssey, and answer some
  enthralling historical questions. 


  *The Rest Is History LIVE in 2024*

