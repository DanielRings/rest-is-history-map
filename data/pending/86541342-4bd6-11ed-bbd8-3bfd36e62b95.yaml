title: 'Trafalgar: Victory (Ep 3)'
description: 'In this final episode Tom and Dominic discuss the legendary Battle of
  Trafalgar. Despite being outnumbered and facing the biggest ship in the world, Nelson
  took the battle to the French and Spanish forces. With the swell on his side, Nelson’s
  brave leadership from the deck of the Victory gave the British one of their most
  famous military successes. Join Tom and Dominic as they take you through the battle,
  Nelson’s death, and its legacy.


