title: 'RIHC: Mary Queen of Scots EXTRA'
description: "Is Mary Queen of Scots the most famous and mythologised character in\
  \ Scottish history? Which seven buildings were most integral to her life in Scotland?\
  \ In which glamorous castle did she spend her ill fated honeymoon? Did Mary truly\
  \ play golf? Where was she imprisoned, and which of these strongholds was the most\
  \ unpleasant for her? What became of the head of her second husband, Lord Bothwell?\
  \ Why has Stirling Castle played such a pivotal role in Scottish history? And, which\
  \ actor does her ghost haunt even to this day…?\n\n\n\nJoin Tom and Dominic as they\
  \ discuss the legendary Mary Queen of Scots, and the seven beautiful and fascinating\
  \ palaces in which she spent her famous life. \n\n\n\n_______ \n\nTwitter: \n\n\
  @TheRestHistory \n\n@holland_tom\n\n@dcsandbrook\n\nProducer: Theo Young-Smith\n\
  \nAssistant Producer: Tabby Syrett + Aaliyah Akude \n\nExecutive Producers: Jack\
  \ Davenport + Tony Pastor"
