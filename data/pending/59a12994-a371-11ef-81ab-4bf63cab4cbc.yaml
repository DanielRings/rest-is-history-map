title: 'Nelson: Attack the French! (Part 2)'
description: "It is 1793 and France has declared war on Britain, meaning that the\
  \ British navy must serve as both sword and shield to Europe. Horatio Nelson is\
  \ at this time a slim and sickly 34 year old captain who nevertheless burns with\
  \ the zeal to serve his king and country, and has recently taken over command of\
  \ the impressive Agamemnon. Meanwhile, the British navy has taken Toulon by the\
  \ summer of 1793 through diplomatic means - its foothold in the Mediterranean -\
  \ but is struggling to hold it. Upon arriving in the city Nelson is shocked to find\
  \ it besieged by the French, under the leadership of one Napoleon Bonaparte - the\
  \ first time that these two titanic rivals of history will brush shoulders, but\
  \ not the last. At last the city falls to the French, and the British must go in\
  \ search of another Mediterranean base. They settle upon Corsica - Bonaparte’s homeland.\
  \ It is there, on the morning of the 12th of July that during the siege of Calvi\
  \ that Nelson is struck in the face by a spray of stone and shrapnel, severely blinding\
  \ his left eye forever more. Will this critical injury prematurely end his promising\
  \ career? Just as a great armada of Spanish and French ships gathers on the horizon,\
  \ heralding the coming one of history's bloodiest naval battles...\nJoin Dominic\
  \ and Tom as they discuss the Siege of Toulon, Nelson’s heroic early forays into\
  \ the Mediterranean, and the dramatic aftermath of his first near fatal injury.\
  \ \n_______\n\nLIVE SHOWS\n*The Rest Is History LIVE in the U.S.A.*\nIf you live\
  \ in the States, we've got some great news: Tom and Dominic will be performing throughout\
  \ America in November, with shows in San Francisco, L.A., Chicago, Philadelphia,\
  \ Washington D.C., Boston and New York.\nTickets on sale now at TheRestIsHistory.com\n\
