title: 'Titanic: The Survivors (Part 6)'
description: '"Then it is I drown again, with all those dim lost faces I never understood…
  Include me in your lamentations.”

  The aftermath of the Titanic’s sinking saw different reactions erupt across the
  Atlantic, and the responses of both mourners and onlookers were visceral. Guilt-ridden
  survivors were both ostracised and lauded. Heroes became legends - the unsinkable
  Molly Brown and the band that played on till the frozen end - while villains were
  condemned forever more. Reputations were splintered and characters blackened as
  the investigation went on. None more so than J. Bruce Ismay, the head of White Star,
  whose survival was viewed as a weakness of character. But the key question needed
  answering: was anyone really to blame, and if yes, who? 


  Join Dominic and Tom, as they discuss the terrible aftershocks of the sinking of
  the Titanic, as they unpick truth from legend, and analyse James Cameron’s 1995
  film, which famously immortalised this extraordinary story. 


  *The Rest Is History LIVE in 2024*

