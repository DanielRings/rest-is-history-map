title: 'America in ''68: The Chicago Riots (Part 5)'
description: 'The Democratic National Convention is in Chicago, and the incumbent
  president, Lyndon B. Johnson, has pulled out of the race. Anti-war protestors are
  flooding the streets of the city, and Johnson continues to press on with the war
  in Vietnam. Bobby Kennedy’s assassination has turned the Democratic candidacy contest
  into a two-horse race between Hubert Humphrey and Eugene McCarthy. And while they’re
  battling inside the convention for delegates, the real fight is taking place on
  the streets. Dope-smoking youth activists known as the “Yippies” have called for
  a protest against the Vietnam War, and their threats made in the name of the ‘politics
  of play’ have been taken seriously by Chicago police, who react with brutal force.
  Flowers and poems meet truncheons and guns. As DNC votes are being counted, images
  of these confrontations are broadcasted on newsreels across the nation.


  Join Tom and Dominic to discuss a Democratic National Convention that saw Chicago
  descend into violence and chaos. Listen as they explore what led to one of the most
  anarchic political conventions, and how it impacted a divided America.


