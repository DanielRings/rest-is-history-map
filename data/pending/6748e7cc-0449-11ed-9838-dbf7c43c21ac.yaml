title: 'London: Places (Ep 2)'
description: 'Welcome to the second episode in our new mini-series: LONDON WEEK.


  On the public feed, we''ll release an episode daily, from Monday to Friday. As a
  friend of the show, you get them all at once!


  Ep 1 ''Londinium'' and Ep 4 ''Haunted London'' are live pods we recorded on location
  earlier this year. ''Places'', ''People'', and ''Moments'' are three accompanying
  episodes that Tom and Dominic recorded in order to dive deeper into London''s past.


  London: Places

  In the second episode of London Week, Tom and Dominic focus on two very different
  historical places in London''s past, discussing Barking Abbey and the 2i''s Coffee
  Bar.


  Producer: Dom Johnson

  Exec Producers: Jack Davenport + Tony Pastor


