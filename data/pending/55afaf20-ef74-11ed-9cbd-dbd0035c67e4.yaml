title: American Witches
description: "It’s 1647, and in New England, where puritan settlers live in fear of\
  \ God’s wrath and a hostile indigenous population, there are rumours coming from\
  \ Boston, and up the Connecticut valley, that witches are to blame for the death\
  \ of local children… \nIn today’s episode, Tom and Dominic are joined by historian\
  \ Malcolm Gaskill, as they discuss witch crazes, hunts and trials in the 17th century,\
  \ with a particular focus on the town of Springfield, Massachusetts.\n\n*The Rest\
  \ Is History Live Tour 2023*:\nTom and Dominic are going on an international tour\
  \ in 2023 and performing in Dublin, Washington D.C. and New York! \n\nBuy your tickets\
  \ here: restishistorypod.com\n\nTwitter: \n@TheRestHistory\n \n@holland_tom\n \n\
  @dcsandbrook"
