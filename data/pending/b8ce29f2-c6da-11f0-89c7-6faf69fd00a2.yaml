title: 'The Nazis at War: The Fall of France (Part 3)'
description: "How did the Battle of Dunkirk unfold in 1940? Why was it one of the\
  \ key turning points of the Second World War for Hitler and his Nazi regime? And,\
  \ how did the Allies manage to evade the jaws of annihilation at this crucial stage\
  \ of the Second World War…?\n\n\n\nJoin Dominic and Tom as they march further into\
  \ the Nazis at war, with Hitler’s forces closing in on the Allies at Dunkirk, before\
  \ wreaking devastation upon the French. \n\n\n\nJoin The Rest Is History Club: Unlock\
