title: The Trial of Charles I Part 1
description: 'Charles I was executed 373 years ago to the day on 30th January. But
  was his killing a sinful act of treason or merely one of retributive justice?


  Tom and Dominic welcome back Professor Ted Vallance from the University of Roehampton
  to explore the build-up, event and aftermath of the trial of Charles I.


