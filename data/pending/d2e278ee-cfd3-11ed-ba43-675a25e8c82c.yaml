title: 'Hundred Years'' War: A Game of Thrones (Ep 1)'
description: 'Dynastic turmoil, inconvenient treaties with Scotland, tales of knights,
  longbows and the golden age of chivalry. In a time of chaos across Europe, England,
  a minor power of the time, takes on the mighty kingdom of France. Join Tom and Dominic
  to learn how the Hundred Years'' War began.


