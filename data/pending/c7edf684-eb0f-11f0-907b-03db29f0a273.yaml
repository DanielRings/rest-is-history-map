title: 'RIHC: The Discovery of Fire, Ancient Cannibals, and British Neanderthals'
description: 'How was fire first invented, and how did it change the world? What did
  Britain look like 400,000 years ago? And, how has an astonishing recent discovery
  provided  new evidence of Palaeolithic neanderthals and their innovative early uses
  of fire?




  In this week’s bonus episode, Tom is joined by historian Nick Ashton, curator of
  Palaeolithic collections at the British Museum, to discuss his extraordinary new
  discoveries, into the creation that changed the world…


