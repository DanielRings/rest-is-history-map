title: 'RIHC: History’s Top Dictators, European Fascism, and Norman Vikings'
description: 'Why didn’t France turn fascist after the First World War? Which on-screen
  portrayal of Mrs Thatcher do Tom and Dominic deem to be the best? What impact did
  the British Empire have on the development of fascism at home? Where did the Normans
  who conquered Saxon Britain come from? Who was the better writer between Nancy Mitford
  and her communist sister, Decca? Join Tom and Dominic in this week’s bonus episode
  as they answer these intriguing questions, and many more…


