title: Monty & Patton vs. the Nazis
description: 'Do commanders matter? Were the British generals effective or "foppish"?
  How did the Allies rebound from huge losses such as the Battle of Dunkirk to victories
  like El Alamein and D-Day? Tom and Dominic are joined by Al Murray to discuss all
  this and more, following the release of Al’s new book Command: How the Allies Learned
  to Win the Second World War. 


  If you want to buy Al''s book, it is available at all good book stores or online.


