title: 'The Book Club: Wuthering Heights'
description: 'Why does Emily Brontë''s novel, Wuthering Heights, have such an enduring
  romantic association? Is Heathcliff a romantic lead, or an abusive antihero? Are
  the characters aspirational in any way, or irredeemable?




  Join Dominic Sandbrook and Tabitha Syrett as they discuss all this and more.








