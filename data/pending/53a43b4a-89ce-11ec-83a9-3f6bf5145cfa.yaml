title: Smuggling
description: 'Did you think smuggling in Britain was confined to the Jamaica Inn and
  the beaches of the Cornish coast? If so, you might want to listen to today''s podcast,
  where Tom and Dominic are joined by author and smuggling oracle, Alex Preston.


  The discussion is wide-ranging, including wrecking, the Hawkhurst Gang and coastal
  militias.


  Alex''s new book, Winchelsea, is available at all good book retailers. 


  Producer: Dom Johnson

  Exec Producer: Jack Davenport


