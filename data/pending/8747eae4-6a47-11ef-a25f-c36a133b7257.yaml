title: 'RIHC: Alexander the Great, Napoleon, and Royal Correspondence'
description: 'What’s the best book that Tom and Dominic have NEVER written? How on
  earth did Alexander the Great manage to administer and garrison his enormous empire
  from the remote lands of Macedonia? Did "Willy" and "Georgie" resume their correspondence
  at the end of the Great War? Which 19th century event could have turned out very
  differently had the hand of favour gone the other way? And, what is the difference
  between a Crusade and a Jihad?


  Join Tom and Dominic for this week''s bonus episode, as they debate which era constituted
  the golden age of France, and brainstorm their next book proposals.


  _______

  *The Rest Is History LIVE in the U.S.A.*

  If you live in the States, we''ve got some great news: Tom and Dominic will be performing
  throughout America in November, with shows in New York, San Francisco, L.A., Chicago,
  Philadelphia, Washington D.C., and Boston.

  *The Rest Is History LIVE at the Royal Albert Hall*

  Tom and Dominic, accompanied by a live orchestra, take a deep dive into the lives
  and times of two of history’s greatest composers: Wolfgang Amadeus Mozart and Ludwig
  van Beethoven.

  Tickets on sale now at TheRestIsHistory.com

