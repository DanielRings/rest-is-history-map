title: 'RIHC | The 7/7 Bombings: London''s Deadliest Terror Attacks'
description: 'Why did the totemic 7/7 bombings - a series of devastating explosions
  that took place on London tubes and a bus in 2005, followed by three more attempted
  bombings later - take place? How exactly did the events of that fateful day unfold?
  Who were the young men who perpetrated it? How did the police track them down? Why
  was an innocent man shot dead by the security services on the underground in relation
  to the attack? How has this tragic event shaped attitudes to terrorism, suicide
  bombers and security in the UK ever since? How can CCTV increasingly serve as a
  primary source for historians? How does 9/11 relate to the 7/7 bombings? And, were
  the bombings an attempt to attack the British State, in retribution for the British
  government’s war in Iraq? 




  In this week’s bonus episode, Tom is joined by author and filmmaker Adam Wishart,
  to discuss the 7th of July 2005, when four suicide bombers lethally attacked London’s
  transport network, as depicted in his searing documentary, ‘7/7: The London Bombings’,
  and his book, ‘Three Weeks in July’. 




  To buy Adam’s book visit: https://harpercollins.co.uk/products/three-weeks-in-july-77-the-aftermath-and-the-deadly-manhunt-adam-wishartjames-nally?variant=54904768659835




  To watch the TV series visit: https://www.bbc.co.uk/programmes/m0026qrn


