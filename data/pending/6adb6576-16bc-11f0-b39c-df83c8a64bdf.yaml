title: 'RIHC: Hitler''s Death, Nazi Germany''s Surrender, and the End of the Second
  World War'
description: "*VOTE FOR THE REST IS HISTORY AT THE WEBBY AWARDS*\nThe Rest is History\
  \ has been nominated for Best History Podcast at the Webby Awards. Vote now at the\
  \ link below!\nhttps://vote.webbyawards.com/PublicVoting#/2025/podcasts/shows/history\n\
  \n\nWhat happened to Nazi Germany during the final months of the Second World War,\
  \ and how long did they keep fighting? When and how did Soviet Russia take Berlin\
  \ on the 2nd May 1945? Did this bring all fighting on the Eastern Front to an end?\
  \ What was Hitler's attitude to the defeat, and when did he finally kill himself?\
  \ What was the process by which the Third Reich then finally surrendered to the\
  \ Allies, and how was peace subsequently brokered? When did the Allies discover\
  \ the truth of Germany's terrible regime of Concentration Camps? How did the Allies\
  \ retaliate against the SS following these gruesome discoveries? What would have\
  \ happened if America had dropped the Atom Bomb on Berlin? How long did Japan fight\
  \ on against the Allies, after Germany's surrender? And, following the Atomic Bombing\
  \ of Hiroshima and Nagasaki, how did the Second World War at last come definitively\
  \ to an end? \n\nIn this week's bonus episode, Tom is joined by author, comedian\
  \ and presenter of fellow Goalhanger podcast We Have Ways of Making You Talk, Al\
  \ Murray, to discuss the process by which the Second World War came to an end, along\
  \ with VE Day, and VJ Day. \n\n_______\nTwitter:\n@TheRestHistory\n@holland_tom\n\
  @dcsandbrook\nProducer: Theo Young-Smith\nAssistant Producer: Tabby Syrett + Aaliyah\
  \ Akude\nExecutive Producers: Jack Davenport + Tony Pastor"
