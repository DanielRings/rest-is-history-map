title: 'Technology: The Great Depression, Inventing the Flash, and the Polaroid Puzzle
  | History in Photos'
description: 'How did Leica change the nature of war photography, and what is the
  story behind Robert Capa’s Last Man to Die? Does the invention of colour photography
  affect our collective memory of history? And, why is the invention of Polaroids
  considered one of the greatest accomplishments of engineering? 




  In today’s last episode of our member’s-only mini-series, Dominic and photographer
  Chris Floyd discuss the stories behind photography’s most vital technological inventions. 




  Getty Images has one of the largest and oldest privately held archives globally
  with access to over 150 million images dating back to the beginning of photography.
  From historical images created in the early 1800s to more contemporary 1990s imagery,
  the Getty Images archive houses a wealth of socially significant, historical photos,
  videos and prints, and includes content from over 40 editorial content partners
  including Gamma-Rapho, Paris Match, The Bettmann Archive, Sygma and Motorsport Images.
  Our archive video collection contains 3.1 million hours of offline video footage
  and includes partners such as NBC News Archives, ITN, Sky News and the BBC Motion
  Gallery.




