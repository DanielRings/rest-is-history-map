title: 'RIHC: Longbow revisionism, Churchill''s stately home, and the BBC in crisis'
description: 'How important are technological advancements to waging a successful
  military campaign? Which series has required the most extensive research and preparation
  from Tom Holland? What portraits decorate Churchill''s old bedroom? Did the BBC
  manage their recent crisis well? In Dominic''s absence, Tom is joined by RIH Executive
  Producer Tony Pastor, as they grapple with these difficult questions, and many more...


  *The Rest Is History Live Tour 2023*:

