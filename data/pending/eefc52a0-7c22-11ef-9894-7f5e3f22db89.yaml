title: 'The Roman Conquest of Britain: The Empire Strikes Back (Part 2)'
description: 'Viewed as an idiot by those around him, Claudius felt the need to prove
  himself. In the century since Caesar had invaded Britain, the mythology surrounding
  the island had taken hold in Roman imaginations. Stories of sea monsters, terrifying
  Druids, and human sacrifice by barbarians, instilled fear into the imperial legions.
  But Claudius was determined, and launched a two-pronged attack on the southeastern
  coast to immortalise his name as a victor. Accompanied by German mercenaries, Roman
  soldiers forced their way across the Medway in Kent and headed up the Thames to
  London. British elites had two options: resist or collaborate… 


  Join Tom and Dominic as they piece together, coin by Roman coin, how Claudius conquered
  Britain in 43 AD.

