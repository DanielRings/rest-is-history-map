title: 'The Terror: Death at the Guillotine (Part 4)'
description: 'Who was Georges Danton and why was he one of the most potent, charismatic
  figures of the French Revolution? How did he clash with his former friend, Maximilien
  Robespierre? And, why was he finally condemned to mount the scaffold and face the
  guillotine?&nbsp;




  Join Dominic and Tom as they discuss the terrible destruction of one of the great
  titans of the Revolution, Georges Danton, and the connotations of his cataclysmic
  fall for the future of the Terror.&nbsp;&nbsp;


