title: 'RIHC: The Worst Disasters in History (Livestream)'
description: 'What’s the truth behind the biblical story of Sodom and Gomorrah? Why
  did an amphitheatre collapse in 27AD, killing thousands? How did a whole English
  village fall into the sea in the 13th century? What sunk the ornate Swedish ship
  the Vasa within mere minutes of her departure? Why did the distribution of free
  toys in 1883 result in the deaths of over one hundred children? And, how were the
  radioactive horrors of Chernobyl unleashed…? 


  Join Tom and Dominic in today’s bonus livestream, as they reveal their top six picks
  for history’s deadliest man-made disasters. 



  *The Rest Is History LIVE in 2024*


  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 


