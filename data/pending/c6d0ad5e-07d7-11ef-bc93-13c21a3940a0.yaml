title: 'Custer vs. Crazy Horse: The Winning of the West (Part 2)'
description: 'With the American Civil War coming to a close in April 1865, George
  Custer, cavalry commander in the Union army, and a man of dubious political leanings
  for a unionist officer, was sent to Texas. Reckless, daring and bloodthirsty, the
  conclusion of the war came as a disappointment to him. Then, having allied himself
  with the new, anti-Reconstruction American president, Andrew Johnson, Custer alienated
  himself from one of the most important men in the country: Ulysses S. Grant. As
  such he found himself exiled to the murderous but dull post of Kansas. There, he
  and the 7th Cavalry were charged with handling the looming conflict with the Cheyenne;
  an indigenous people of the Great Plains, whose lives and culture had been radically
  jeopardised by modernisation, and the encroachment of the railroads into their lands.
  While some Cheyenne were inclined to negotiate with Washington, their more zealous
  warriors, the ‘Dog Soldiers’, were determined to fight and destroy the settlers,
  sending bloodthirsty raids into federal forts. The campaigns that followed saw acts
  of terrific violence, culminating in a terrible, brutal massacre…


  Join Tom and Dominic as they discuss Custer’s first forays into the gruesome and
  tragic American Indian Wars: his political missteps, southern adventures, romantic
  rollercoasters, and battles with the remarkable horse-riding, buffalo hunting Cheyenne. 



