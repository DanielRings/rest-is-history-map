title: 'The Irish Civil War: The Assassination of Sir Henry Wilson (Part 1)'
description: 'Who was Sir Henry Wilson, and how was he shockingly murdered in 1922?
  Who ordered it? What was his attitude to the question of Irish Home Rule? Why has
  death been compared to the assassination of Archduke Franz Ferdinand, whose death
  triggered the First World War? How did he garner the undying enmity of British Prime
  Minister, Herbert Henry Asquith? What was Wilson’s reputation in Ireland then, and
  how has it endured to this day? And, how did Wilson’s unexpected death impact the
  future of Irish independence? 


  In this week’s episode, Tom and Dominic are joined by historian Ronan McGreevy,
  to discuss the pivotal assassination of Sir Henry Wilson, whose death launched the
  tumultuous Irish Civil War.






