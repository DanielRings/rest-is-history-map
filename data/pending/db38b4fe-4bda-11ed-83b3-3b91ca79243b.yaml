title: 'Trafalgar: Countdown to Annihilation (Ep 2)'
description: 'In the second episode of Tom and Dominic''s Trafalgar trilogy, the stakes
  could not be higher. They discuss: Napoleon''s plan to invade Britain (and the possible
  repercussions if he did); what developments in naval technology meant for the British
  and Spanish/French allies; and Nelson''s own life, legacy, and strategy to "annihilate
  the enemy".


