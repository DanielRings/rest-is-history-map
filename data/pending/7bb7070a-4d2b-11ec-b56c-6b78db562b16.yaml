title: Australia Before Cook
description: '"Discovered this territory, 1770". So reads the inscription on a statue
  of Captain Cook in Hyde Park, Sydney. But did he really discover it? Tom and Dominic
  are joined by David Hunt to explore the long story of human settlement in Australia,
  and of the European explorers who reached it before Captain Cook ever sighted Botany
  Bay. (Also features giant wombats)


