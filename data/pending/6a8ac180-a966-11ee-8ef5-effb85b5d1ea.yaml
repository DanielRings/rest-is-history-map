title: 'RIHC: Undiscovered History, Byron and the Walking Dead'
description: 'Why are narratives so important to understanding history? Who was the
  bigger historical lad: Byron or Shelley? Is there any undiscovered history left
  which, if found, would change the present? When do past events officially become
  history? Do Dominic and Tom still read for pleasure? What were their favourite The
  Rest Is History episodes of 2023? 

  Join Tom and Dominic for the first bonus episode of 2024, as they tackle these significant
  historical questions, and many more!


  *The Rest Is History LIVE in 2024*

  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 

  Buy your tickets here: therestishistory.com


