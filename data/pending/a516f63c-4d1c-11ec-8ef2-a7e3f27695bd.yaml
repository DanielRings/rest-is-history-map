title: The Western Front
description: 'The slaughter and bloodshed on the Western Front in World War One helped
  shape the narrative of the 20th century. But was it a case of lions led by donkeys?

  Gary Sheffield, historian and author of Forgotten Victory: The First World War -
  Myths and Realities, joins Tom Holland and Dominic Sandbrook to explore events on
  the Western Front.


