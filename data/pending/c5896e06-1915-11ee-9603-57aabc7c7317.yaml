title: The American Revolution (Part 1)
description: '“America, late the strength, now the foe to Britain, dismembered, torn,
  I fear forever lost to England, whence she sprung.”

  The American Revolution came about due to growing tensions between the American
  colonies and Great Britain, primarily over issues of taxation and representation.
  It led to the birth of the United States of America, established upon Enlightenment
  principles of liberal democracy and constitutionalism. In the first episode of our
  four part series, Tom and Dominic are joined by Professor Adam Smith for a detailed
  look at the beginnings of the American Revolution, as they examine the background
  to the war, and how both religious fervour and the implementation of colonial taxes
  fuelled the conflict. 


