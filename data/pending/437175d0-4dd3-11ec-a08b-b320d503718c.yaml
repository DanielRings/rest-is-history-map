title: The CIA
description: 'America''s Central Intelligence Agency is a mysterious organisation
  which has used covert methods to assassinate enemies, influence governments and
  tip whole countries into revolution - or so countless films, TV series and books
  would have us believe. How much of it is true? Hugh Wilford, professor of history
  at California State University, Long Beach, and author of four books, including
  The Mighty Wurlitzer: How the CIA Played America, joins Tom and Dominic to discuss.'
