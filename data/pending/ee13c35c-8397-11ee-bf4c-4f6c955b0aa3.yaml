title: 'Windrush: The Story of Black Britain'
description: 'On the 8th of June 1948, the HMT Windrush sailed from Kingston with
  almost 500 migrants on board, destined for England. The ship docked at Tilbury on
  the 22nd of June, and history was made. Since that day the legend of Windrush has
  gradually come to characterise an increasingly broad and more diverse group of British
  citizens, and the event stands as a sacred moment in the history of British multiculturalism,
  race relations and immigration, laden though it is with moral and political baggage.


  In today’s episode Tom and Dominic are joined by acclaimed journalist and author
  Trevor Phillips, to discuss this seminal moment in the history of Black Britain.
  During the course of the episode they dismantle some of the myths that have since
  developed, explore the people who came over, and the emergence of the communities
  that settled in Britain in the wake of 1948. They also consider the complicated
  wider context of the Windrush story, and the long term significance of this foundational
  moment.



