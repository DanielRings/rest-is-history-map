title: 'RIHC: Cromwell & Britain''s Revolutionary Decade'
description: 'Was the Restoration inevitable? Should Oliver Cromwell have made himself
  King? What was the role of ritual in Cromwell’s premiership? How did Thomas Hobbs’
  ''Leviathan'' lead to Royalist reconciliation? And what are the similarities between
  Keir Starmer and Oliver Cromwell?


  In this week’s bonus episode, Dominic is joined by historian and erstwhile tutorial
  partner, Alice Hunt. They discuss her new book ''Republic: Britain’s Revolutionary
  Decade, 1649–1660'', a story documenting England’s unique republican experiment
  when the world turned upside down…

