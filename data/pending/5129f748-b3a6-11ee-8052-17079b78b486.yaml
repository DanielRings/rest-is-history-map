title: 'RIHC: The Assassination of Augustus, Pints with Churchill and the Last Supper'
description: 'What are the most iconic historical structures in the world? Who was
  the most incompetent person of all time? Why did so many of the most famous leaders
  in history come from the peripheries of the countries they ruled? Did Augustus’
  wife Livia really assassinate him? Which historical events do Tom and Dominic disagree
  on the most? Which fictional British character perfectly personifies the Rest is
  History? Would Tom rather see the Last Supper or the birth of a baby Brachiosaurus?
  And, would Dominic prefer to have a pint with Churchill in the early 1930''s, during
  WWII or in the 1950’s?


  Join Tom and Dominic for this week’s bonus episode, as they answer these tantalising
  historical questions.  





  *The Rest Is History LIVE in 2024*


  Tom and Dominic are back onstage this summer, at Hampton Court Palace in London! 


