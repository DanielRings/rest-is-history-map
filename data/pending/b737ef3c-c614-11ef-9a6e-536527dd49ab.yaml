title: 'Mozart: History''s Greatest Prodigy LIVE at the Royal Albert Hall'
description: 'In 1756 a musical prodigy was born in Salzburg, Austria: Wolfgang Amadeus
  Mozart. Thanks to the efforts of his exacting father, Mozart''s genius was exhibited
  and celebrated in some of the greatest courts of Europe from a young age. At four
  years old he wrote his first keyboard concerto, at six he was performing for the
  empress Maria Theresa. Soon he and his father were touring Europe, and the young
  Mozart''s exploits proved increasingly lucrative for his overbearing parent. But,
  like all young men, Mozart was growing up and becoming increasingly uncontrollable.
  Feeling stifled and professionally frustrated, he began to disobey his wealthy patrons
  and went freelance, risking financial security and the favour of his family. Yet,
  it would also see him falling in love, and writing some of his most glorious works.
  Nevertheless, time and life was running out for the young composer, as he began
  to write the powerful Requiem, which may prove to be for his own death...


  Join Tom and Dominic at the Royal Albert Hall, featuring the Academy of St Martin
  in the Fields and the Philharmonia Chorus, conducted by Oliver Zeffman, as they
  explore one of the most famous musical figures of all time: Mozart. What was the
  origin of his genius? What are the stories behind some of his most famous works,
  such as The Magic Flute and Don Giovanni? And, what is the truth behind his tragic
  and much mythologised death, young and penniless?


