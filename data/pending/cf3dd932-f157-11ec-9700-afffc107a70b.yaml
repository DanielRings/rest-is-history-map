title: 'American Civil War: The Causes (Ep 1)'
description: "Welcome to The Rest Is History 'American Civil War' series. \n\nAs a\
  \ member of the RIHC, you get all four episodes of this series before anyone else!\n\
  \nIn the first of four pods, Tom and Dominic are joined by historian Adam Smith\
  \ for an in-depth look at the origins of the war. They ask whether the moral, political\
  \ and economic problems of slavery made conflict inevitable and discuss the character\
  \ of Abraham Lincoln.\n\nProducer: Paul King\n\nTwitter:\n@TheRestHistory\n@holland_tom\n\
