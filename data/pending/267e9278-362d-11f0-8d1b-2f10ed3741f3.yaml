title: 'Hannibal: Roman Bloodbath at Cannae (Part 4)'
description: 'How did the Battle of Cannae - one of the most important battles of
  all time for Ancient Rome, with a whole Empire at stake, and a reputation that had
  reverberated across the centuries - in 216 BC, unfold? What brilliant tactics did
  Hannibal adopt in order to overcome the Roman killing machine, with its vast numbers
  and relentless soldiers? Why did so many men die in such horrific circumstances?
  And, what would be the outcome of that bloody, totemic day, for the future of both
  Carthage and Rome?


  Join Tom and Dominic for the climax of their epic journey through the rise of Hannibal,
  and his world-shaking war against Rome, in one of the deadliest rivalries of all
  time. 




