title: 'USA: The Star-Spangled Banner (Part 1)'
description: 'How did the American War of 1812 result in America’s national anthem,
  the Star Spangled Banner? Who came up with it? And, why does this origin story make
  the anthem so controversial? 




  Join Dominic and Tom as they launch into the first episode of their Football World
  Cup special, with the story behind America’s national anthem, and its secret story. 


