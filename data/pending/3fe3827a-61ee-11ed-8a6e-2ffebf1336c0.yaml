title: History's coming home... (preview)
description: "Forget the football, the next month's entertainment is coming from The\
  \ Rest is History!\n\nJoin Tom and Dominic over the coming weeks as they embark\
  \ on their colossal festival of world history. To mark the Fifa World Cup they are\
  \ bringing you an episode on every single country taking part in the competition.\
  \ From the Costa Rican Civil War, to courtesans in South Korea, via the White Rose\
  \ movement in Nazi Germany, there is a historical tale for everyone.\n\nTo set this\
  \ all up, on Monday Tom and Dominic begin their an epic three-parter on the history\
  \ of the World Cup, in which they use the tournament as a vehicle for understanding\
  \ global political and social history.\n\nJoin The Rest Is History Club (www.restishistorypod.com)\
  \ for ad-free listening to the full archive, weekly bonus episodes, live streamed\
  \ shows and access to an exclusive chatroom community.\n\nTwitter:\n \n@TheRestHistory\
  \ \n \n@holland_tom\n \n@dcsandbrook\n \nEmail: restishistorypod@gmail.com"
