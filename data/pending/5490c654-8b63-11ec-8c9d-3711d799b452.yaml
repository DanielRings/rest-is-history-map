title: Valentine's Day
description: 'Happy Valentine''s Day! Have you ever wondered why we send each other
  cards and go out to Carluccio''s for dinner on a weeknight?


  In today''s episode, Tom and Dominic drill down into the details - what are its
  origins? Why were ''Vinegar'' Valentines so brutal? And what was an optician''s
  role in Al Capone''s St Valentine''s Day Massacre?


