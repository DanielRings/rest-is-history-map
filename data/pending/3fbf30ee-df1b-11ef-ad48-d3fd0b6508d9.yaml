title: 'RIHC: American Presidents from FDR to Trump: Cuba, Watergate, and the Atomic
  Bomb (Part 1)'
description: 'Who has been the best American president in recent history? How did
  Franklin D. Roosevelt go up against Hitler and the Nazis, while battling debilitating
  Polio? Why was Lincoln such a melancholy man? What made Harry S. Truman the most
  unexpected of US presidents? What was his involvement in the development of the
  first atomic bomb in Los Alamos? Did he ever feel any guilt about the nuclear devastation
  the project would set in motion? Was Eisenhower a good soldier but a bad president?
  Was John F. Kennedy overrated, or was he a genuinely impressive individual? Did
  he mishandle the Bay of Pigs fiasco? Did Johnson fail to withdraw America from Vietnam
  when he should have done so? Why is Nixon Dominic’s favourite president? And, from
  an inside source, who really killed Kennedy…?

  In this week’s bonus episode, Dominic is joined by The Rest Is Politics US co-host
  and Donald Trump’s former Director of Communications, Anthony Scaramucci, to discuss
  some of the best and worst American presidents in history.

