description: 'Which American president would Tom and Dominic want to go on a road
  trip with? Who from history has had the most stratospheric rise to power? And, have
  more monarchical U.S. presidents, such as George Washington and Abraham Lincoln,
  generally been the most successful?




  In this week’s bonus episode, Tom and Dominic discuss these scintillating historical
  questions.


