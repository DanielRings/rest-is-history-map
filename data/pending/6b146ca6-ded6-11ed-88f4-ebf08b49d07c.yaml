title: History's Greatest Dogs
description: 'Rin Tin Tin, born on the Western Front in 1918, became one of the biggest
  movie stars of the silent film era. Greyfriars Bobby gained his fame for guarding
  his masters'' grave for 14 years, until the day he died. 

  Bounce, Admiral Collingwood’s loyal companion, would hide below deck during the
  Napoleonic Wars, and Collingwood would sing to him after battle, to calm his nerves.
  Nixon''s dog Checkers saved his political career, but never lived to see the White
  House.

  The wolfhound Gelert, who died protecting his master''s infant son, and Blondi,
  Hitler''s German Shepherd, were both put to death by their owners. 

  Join Tom and Dominic as they discuss history''s most famous dogs.



