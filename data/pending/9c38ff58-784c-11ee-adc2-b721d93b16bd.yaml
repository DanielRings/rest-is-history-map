title: 'RIHC: History’s Greatest Warrior, JFK vs. Nixon, and Roman Civil Wars'
description: 'What really caused the fall of the Mayan civilisation? Who is History’s
  greatest ever warrior? Are military victories a great tool for converting the masses?
  Who had a greater impact on American history: JFK or Nixon? Which historical location
  would Tom and Dominic choose if going on holiday together? Which figure from the
  Roman civil wars are they most sympathetic towards? Join Tom and Dominic in this
  week’s bonus episode, as they wrestle with these tough questions, and many more…


