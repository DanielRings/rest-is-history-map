title: 'Burgundy: Europe''s forgotten superpower'
description: Now mostly overlooked by history, Burgundy was a major political and
  cultural power in western Europe during the Middle Ages, rivalling France and England.
  How did the kingdom gain such prominence, and why did it disappear? Bart van Loo,
  author of "The Burgundians", joins Dominic and Tom to explain.
