title: J.R.R. Tolkien
description: 'John Ronald Reuel Tolkien is one of the most prestigious authors in
  modern history, best known for writingThe Hobbit and The Lord of the Rings.


  In the first of two episodes, Tom and Dominic explore Tolkien''s childhood, his
  relationship with religion, and the impact that the rapidly changing English countryside
  had on the creation of Middle Earth.


