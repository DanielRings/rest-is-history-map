title: The General Who Made Rome Invincible
description: 'How responsible was Marius for a revolution in Roman military practice?
  Was he the inventor of the very legions that the likes of Pompey, Caesar, and Augustus
  would come to command? And, can he really be seen as one of the greatest generals
  of the Roman Republic?&nbsp;




  In today’s bonus episode, Tom is joined by ancient and military historian Bret Devereaux
  to discuss the legacy of Gaius Marius.




  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


