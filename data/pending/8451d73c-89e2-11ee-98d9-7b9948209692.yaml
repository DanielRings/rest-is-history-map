title: 'JFK: The Second Assassin Strikes (Part 5)'
description: '“Jack, you son of a bitch, don’t do it!”


  Just hours after President Kennedy’s assassination, in the full glare of the world’s
  media, the Dallas police are confident they have solved the case. They have found
  the murder weapon, and are poised to charge their chief suspect, a strange loner
  called Lee Harvey Oswald. But as they prepare to move him to the county jail, one
  local businessman has other ideas. As they are leading Oswald into the station garage,
  an eccentric nightclub owner Jack Ruby steps forward. And as he aims his pistol
  at Oswald’s chest, the course of American history is about to take another dizzying
  turn …


  Join Dominic and Tom as they trace the footsteps of two erratic nobodies, Lee Harvey
  Oswald and Jack Ruby, in the days before Kennedy’s assassination, leading up to
  the critical moment on 24th November when the two men finally came face to face,
  changing both of their lives and the course of the investigation forever…



  *Dominic’s book The Fall of the Aztecs is available now from bookshops across the
  UK - the perfect Christmas present!*


