title: 'Fear City: New York in the 1970s'
description: '“A cloud of black, acrid smoke hung over the area. It was a scene from
  a warzone, a battlefield - it was a scene from the end of the world…” New York in
  the 1970s was a city decimated by economic stagnation, unemployment and ever-rising
  crime rates, haemorrhaging its population to the suburbs and to the more business-friendly
  South. Join Tom and Dominic as they look at the 1977 power blackout, the looting
  of Manhattan, and life in the real Gotham City.


