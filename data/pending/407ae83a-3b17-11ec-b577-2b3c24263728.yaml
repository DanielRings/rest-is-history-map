title: Conspiracy Theories
description: 'History is littered with conspiracy theories, from Popish plots to JFK’s
  assassination. But what makes people believe in them and how do they gain currency?
  As strange stories continue to swirl around the coronavirus vaccine, Tom Holland
  and Dominic Sandbrook examine conspiracy theories through the ages. Oh and Dominic
  finally solves the question of who did kill JFK.



