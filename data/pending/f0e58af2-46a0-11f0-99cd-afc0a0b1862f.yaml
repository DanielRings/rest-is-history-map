title: 'RIHC: Historical Unicorns, Renaissance Italy, and Animal Diplomacy'
description: 'Were giraffes the inspiration for the myth of the unicorn? Why did the
  Sultan of Egypt send a giraffe to Medici Florence in the 15th century? Was this
  the great turning point in European history? What did the Florentines make of this
  beautiful, alien creature? Why were the Medici so desperate to get their hands on
  exotic animals? What can this teach us about Renaissance Florence? Which famous
  Roman emperor may have owned a giraffe, and why? How conscious was Lorenzo the Magnificent
  of the Middle East and its regal traditions? And, were exotic animals used as symbols
  of diplomacy all the world over by the 15th century? 


  In this week’s bonus episode, Tom and Dominic delve deeper into the fascinating
  story of the Medici giraffe, along with Renaissance Italy, and the history of animal
  diplomacy. 


