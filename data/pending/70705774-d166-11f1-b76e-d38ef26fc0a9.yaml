title: 'The Rise and Fall of Hungarian Football: The Invention of Europe (Part 1)'
description: 'How did post-war industrial prosperity result in Wolverhampton Wanderers
  playing midweek games against teams from around the world? Why did a match against
  Budapest Honvéd carry deep national significance after Hungary’s defeat of England
  in 1953? And, what did the British press'' euphoric declaration that Wolves were
  "Champions of the World" reveal about Britain’s post-war anxieties, and declining
  global stature?




  In today’s special bonus episode, Dominic is joined by author and journalist Jonathan
  Wilson, to kick off our brand new bonus miniseries on the rise and fall of Hungarian
  Football as they look at one of the most important club matches in history.




