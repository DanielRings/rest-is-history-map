title: 'Luther: The Man Who Changed the World (Part 1)'
description: "The Reformation, launched in 1517, stands as one of the most convulsive\
  \ and transformative events of all time, shattering Christendom and dividing Europe\
  \ for centuries. Its outcome determined the fates of Kings and Emperors, and saw\
  \ the souls of millions consigned to the fiery pit of heresy. The man behind it\
  \ all was Martin Luther, a humble monk of obscure origins. Bold, intellectually\
  \ arrogant, and a master of spin, the assault he unleashed on the medieval Church\
  \ had him excommunicated by the Pope. But what was it about Luther’s humble upbringing\
  \ in Saxony and his strained relationship with his intimidating father that led\
  \ him down a path of insolence? And was the religious revolution that he sparked\
  \ inevitable?\n\nJoin Tom and Dominic as they discuss the early life of Martin Luther,\
  \ the apocalyptic environment from which he and his radical ideas emerged, and the\
  \ Catholic Church he would come to take on…\n\n\n\n\n*The Rest Is History LIVE in\
  \ 2024*\nTom and Dominic are back onstage this summer, at Hampton Court Palace in\
  \ London! \nBuy your tickets here: therestishistory.com\n\n\n\nTwitter:\n@TheRestHistory\n\
  @holland_tom\n@dcsandbrook\n\n\nProducer: Theo Young-Smith\nAssistant Producer:\
  \ Tabby Syrett\nExecutive Producers: Jack Davenport + Tony Pastor"
