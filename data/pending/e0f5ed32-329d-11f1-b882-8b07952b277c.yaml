title: 'Music: The Father of the Blues, Golden Age of Jazz, and David Bowie | History
  in Photos (FULL EPISODE)'
description: "Why are there only three confirmed photographs of Blues-legend Robert\
  \ Johnson? How did Art Kane’s photo of  1950’s NYC Jazz musicians Great Day In Harlem\
  \ serve as a symbol of American segregation? And, what is the connection between\
  \ David Bowie’s face paint on the Aladdin Sane album cover, Elvis Presley, and the\
  \ Templar Christian Brotherhood?\n\n\n\nIn today’s episode of our new member’s-only\
  \ mini-series, Dominic is joined by photographer Chris Floyd to discuss iconic photographs\
  \ of the most famous and influential 20th century musicians. \n\n\n\nGetty Images\
  \ has one of the largest and oldest privately held archives globally with access\
  \ to over 150 million images dating back to the beginning of photography. From historical\
  \ images created in the early\n\n1800s to more contemporary 1990s imagery, the Getty\
  \ Images archive houses a wealth of socially significant, historical photos, videos\
  \ and prints, and includes content from over 40 editorial content\n\npartners including\
  \ Gamma-Rapho, Paris Match, The Bettmann Archive, Sygma and Motorsport Images. Our\
  \ archive video collection contains 3.1 million hours of offline video footage and\
  \ includes partners\n\nsuch as NBC News Archives, ITN, Sky News and the BBC Motion\
  \ Gallery.\n\n\n\n_______\n\n\n\nTwitter:\n\n\n\n@TheRestHistory\n\n@holland_tom\n\
  \n@dcsandbrook\n\n\n\nVideo Editors: Jack Meek, Harry Swan + Adam Thornton  \n\n\
  Social Producer: Harry Balden\n\nProducers: Tabby Syrett & Aaliyah Akude \n\nSenior\
  \ Producer: Callum Hill \n\nExecutive Producer: Dom Johnson"
