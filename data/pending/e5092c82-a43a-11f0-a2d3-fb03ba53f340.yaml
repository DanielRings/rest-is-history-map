title: 'Nelson: Bonaparte Prepares to Strike (Part 4)'
description: "With Britain at war for more than eight long years, and her people depleted\
  \ and hungry, how did her government react to the news that Napoleon Bonaparte was\
  \ planning a full-scale invasion in 1801? What happened when Nelson tried to attack\
  \ the French at Boulogne, and what was the terrible cost? And, with Britain declaring\
  \ war on France in 1803, would Nelson rally, and seize his destiny at last?\n\n\n\
  \nJoin Dominic and Tom as they trace the aftermath of Nelson’s triumph in Copenhagen,\
  \ his notorious personal life, and his clashes with Napoleon’s fleet. \n\n_______\n\
