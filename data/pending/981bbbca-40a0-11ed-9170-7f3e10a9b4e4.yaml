title: 'Young Churchill: Born to Lead (Ep 1)'
description: '‘The child is the father of the man.’


  In the first episode of this mini-series on Young Churchill, Tom and Dominic explore
  the early life of Winston Churchill. They discuss the cruelty of his parents, his
  deeply imbued sense of destiny, and the razor sharp wit of the future Prime Minister.


