title: 'Qatar: A History'
description: 'It is finally here. Tom and Dominic are embarking upon their mighty
  World Cup themed extravaganza. Every day they will be releasing a new episode, each
  one based upon a different country that is competing in the tournament. 32 days,
  32 countries, 32 episodes, fasten your seatbelts and enjoy the ride.

  First up is Qatar. How did this tiny country in the Middle-East come to play such
  a prominent role in world affairs? Oil money, controlling the narrative, and western
  security are all part of the story.


