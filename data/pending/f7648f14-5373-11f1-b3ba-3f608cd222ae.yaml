title: 'Empress Matilda: Civil War and the Fight for the Throne'
description: 'How did Matilda, princess of England, become Empress of the Holy Roman
  Empire in 1110? What disbarred her from becoming queen of England after her father''s
  death? And, why did she go to battle for the throne of England, in the brutal civil
  war known as The Anarchy?




  In this new member’s-only mini series, Tom is joined by historian and author Helen
  Castor, to talk about some of the most impressive queens of medieval Europe. 


