title: 'Elizabeth I vs The Catholics: A Treacherous Conspiracy (Part 4)'
description: 'After ransacking Spanish treasure ships, would Elizabeth I betray Sir
  Francis Drake to her enemies? Who did she back in the French civil wars? And, with
  the help of English conspirators, would Mary Queen of Scots, incur a Spanish invasion,
  and see her rival Elizabeth assassinated?&nbsp;&nbsp;




  Join Tom and Dominic as they discuss Sir Francis Drake’s return to England, revolts
  in Europe, Catholic unrest, and the Throckmorton Plot to see the Queen of England
  murdered, and replaced with her royal cousin…






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


