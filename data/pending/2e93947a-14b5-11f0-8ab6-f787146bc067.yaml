title: 'RIHC: Cold War Secrets, American Conspiracies, and Ghosts of Iron Mountain'
description: 'Was the American government in the Sixties engaged in a policy of perpetual
  war? What would happen to the USA if permanent global peace broke out? Why are conspiracies
  so endemic to American society? And how did a satirical account of the relationship
  between the Pentagon and arms manufacturers spark conspiracies that endure to this
  day?


  Join Dominic in today’s bonus episode, as he speaks to author and documentary maker
  Phil Tinline, about “Ghosts of Iron Mountain”, his new book exploring the hoax that
  exploded at the height of the Vietnam War…


