title: 'Britain in 1974: State of Emergency (Part 1)'
description: '“Who governs Britain?”

  Britain in the early 1970’s was a state in crisis, and by 1974, things had never
  seemed bleaker. Held hostage by the Trade Unions, British industry was flailing.
  England’s sporting record was atrocious, the economy was tanking and the prospect
  of a miners’ strike loomed large. Violence was surging in Northern Ireland, as the
  IRA escalated its bombing campaigns, and the outbreak of the Yom Kippur War would
  send oil prices soaring, with the miners on the verge on plunging Britain into darkness.
  By the end of the year, the British people had voted in two general elections, had
  a three-day week enforced on them, and the Conservative party were on the cusp of
  electing their first female leader…

  Join Dominic and Tom for the first episode of their four-part epic on 1974, undoubtedly
  one of the darkest and most dramatic years in British political history…



