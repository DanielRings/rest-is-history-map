title: 'Germany: The White Rose'
description: '“Since the conquest of Poland, 300,000 Jews have been murdered in this
  country in the most bestial way ... The German people slumber on in dull, stupid
  sleep and encourage the fascist criminals. Each wants to be exonerated of guilt,
  each one continues on his way with the most placid, calm conscience. But he cannot
  be exonerated; he is guilty, guilty, guilty!” - Leaflet from the White Rose resistance
  movement, 1942.


  In today’s episode on Germany, Dominic tells us the heroic story of five German
  students who founded a non-violent protest group during the most oppressive days
  of Nazi control. 


