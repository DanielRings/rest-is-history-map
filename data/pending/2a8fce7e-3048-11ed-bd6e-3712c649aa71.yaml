title: Queen Elizabeth II - part 1
description: The death of the Queen at the age of 96 brings to an end seven decades
  of her reign over Britain and the Commonwealth. In the first of a two-part series,
  Dominic Sandbrook and Tom Holland look back at the early years of Elizabeth’s life,
  leading up to her coronation.
