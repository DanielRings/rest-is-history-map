title: 'Queen Victoria’s Revenge: The Mad Emperor of Abyssinia (Part 1)'
description: 'Who was Emperor Tewodros II, the colourful and controversial Emperor
  of Abyssinia? Why did he brutally imprison a number of British emissaries, and how
  did Queen Victoria respond? And, how would this spark one of the most ambitious
  expeditions undertaken by the British Empire…?




  Join Dominic and Tom as they launch into one of the most extraordinary military
  expeditions in all world history.&nbsp;&nbsp;


