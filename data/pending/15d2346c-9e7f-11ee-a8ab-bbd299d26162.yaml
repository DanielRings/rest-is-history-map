title: 'RIHC: Titanic, Macbeth and True Conspiracy Theories'
description: 'Was 2023 a momentous year, and what will it be remembered for? What
  did Dominic make of David Tennant''s Macbeth, and why was Into the Woods so memorable
  for Tom? What were their favourite history books of the year? What are they looking
  forward to reading in the year ahead? And, are there any 20th century political
  assassinations where a conspiracy theory really is the most likely explanation?


  Join Tom and Dominic for the final bonus episode of 2023 as they reflect upon its
  literary and theatrical highlights, and answer some fascinating historical questions. 



