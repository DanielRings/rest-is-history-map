title: Elizabeth I
description: 'She famously claimed to have the heart and stomach of a king and remains
  one of Britain’s most talked about monarchs, despite having reigned more than 400
  years ago. Tracy Borman, author of the acclaimed Elizabeth’s Women, joins Tom Holland
  and Dominic Sandbrook to discuss Elizabeth I.



