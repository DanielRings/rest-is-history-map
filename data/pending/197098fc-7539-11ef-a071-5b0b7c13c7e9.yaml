title: 'RIHC: Frontline Photography, Beards at War, and Cassino ''44'
description: 'How challenging were the obstacles faced by photographers trying to
  reach the front line in the 1940s? What happened to personal video collections filmed
  by Nazis? Why were soldiers not allowed beards during the Second World War? And
  why were they permitted to have moustaches?

  In this week’s bonus episode, Tom is joined by Friend of the Show James Holland
  to discuss the crossover between Second World War stories and recent The Rest Is
  History episodes, as well as his new book "Cassino’ 44", a human account of the
  Allied campaign in Italy.


  __________


  *The Rest Is History LIVE in the U.S.A.*

