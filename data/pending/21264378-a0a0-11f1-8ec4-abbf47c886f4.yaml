title: 'Roman Civil War: Marching on the Senate (Part 3)'
description: 'What shocking, unprecedented act did Sulla commit with his legions after
  having his ambitions frustrated once more by his bitter rival, the tribune Marius?
  How did Marius escape capture and death? And, would Marius retaliate…?




  Join Tom and Dominic as they unfold the mounting rivalry between two Roman generals
  - Marius and Sulla - as they battle for ultimate control of the empire, and Sulla
  takes a fateful step that will change the fate of the Republic forever….&nbsp;&nbsp;


