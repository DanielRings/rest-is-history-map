title: Antony & Cleopatra (Episode 3)
description: 'After centuries of Cleopatra and Mark Antony’s relationship being told
  and fictionalised by Plutarch and Shakespeare alike, Tom Holland and Dominic Sandbrook
  uncover what history tells us about this power couple. They reveal how the rise
  of Octavian as a threat caused Mark Antony to turn to Cleopatra for support. It
  was a relationship that had less to do with romance and love, and more to do with
  monetary and territory gains.


