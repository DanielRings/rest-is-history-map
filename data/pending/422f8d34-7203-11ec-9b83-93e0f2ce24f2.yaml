title: 'RIHC: Ian Paisley vs. Otto von Habsburg, horse riding in the Wild West, and
  why Margaret Thatcher went into politics'
description: 'In this week''s bonus podcast, Tom and Dominic discuss your reactions,
  questions and latest discord japes. The boys also talk about Ian Paisley receiving
  a beating in the European parliament, sing a duet together, and argue over which
  British and American leaders really believed in the binary battle between good and
  evil.


