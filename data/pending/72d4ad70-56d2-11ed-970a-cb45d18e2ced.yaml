title: Treason in Modern Britain (Ep 2)
description: 'Join Tom and Dominic for the second part of their exploration of the
  history of treason. How has the 1351 treason act impacted Britain and the world
  since the 17th century? This will be answered as they discuss seismic events such
  as the trial of Charles I, American independence, and the Easter Rising. 


  Treason: People, Power and Plot opens at The National Archives on 5th November and
  runs until 6th April. It is free to all. For all information and to delve deeper
  please visit nationalarchives.gov.uk/treason.


