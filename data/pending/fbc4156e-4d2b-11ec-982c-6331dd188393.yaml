title: 'Æthelstan: OFFICIALLY England''s Greatest Monarch'
description: 'After an intense tournament featuring sixteen of the finest Kings and
  Queens this island has to offer, the people have decided the greatest king of England
  also happens to be the first. The 10th century grandson of Alfred the Great united
  the Anglo-Saxon kingdoms and saw off the Vikings, so Tom explains why we should
  all be Æthel-STANS.


