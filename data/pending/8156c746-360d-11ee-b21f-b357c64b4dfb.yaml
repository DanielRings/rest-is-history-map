title: 'RIHC: English Mythology, Historical Heatwaves, and Woke Informers'
description: 'Does England have a foundational myth? Why did Roman emperors wear purple?
  Which historical events are attributable to periods of extreme heat? Is there a
  period of history comparable to our polarised times? Will Tom and Dominic ever do
  a “classics gone wild” episode in Turkey? In this week’s bonus episode, Tom and
  Dominic engage with these challenging topics, and many more.


