title: The Boston Tea Party (Part 2)
description: '“Last night three cargos of tea were emptied into the sea. This morning
  a man of war sails. This is the most magnificent movement of all. There is a dignity,
  a majesty, a sublimity, in this last effort of the patriots, that I greatly admire.”

  The Boston Tea Party occurs amid the growing disagreements between the British parliament
  and the people of colonial America, as New Englanders, and Bostonians in particular,
  fight British attempts to regulate imperial trade. In the second episode of this
  series, Tom, Dominic and Professor Adam Smith examine the Tea Act and how it accelerated
  the American Revolution. They also chart George Washington’s rise to commander-in-chief
  of the American patriot forces, and ask to what extent slavery was an issue in the
  war.


