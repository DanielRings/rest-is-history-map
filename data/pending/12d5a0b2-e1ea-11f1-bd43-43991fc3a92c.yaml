title: 'The Squire: The Most Important Man in History'
description: "Who was Hubert de Burgh, Lord Cardigan’s extravagant yachting accomplice,\
  \ before the battle of Balaclava? What earned him the estimable title of ‘the Squire’?\
  \ And, was he condemned in the wake of the Charge of the Light Brigade…?      \n\
  \n\n\nIn this week’s bonus episode, Tom and Dominic dig deeper into one of the most\
