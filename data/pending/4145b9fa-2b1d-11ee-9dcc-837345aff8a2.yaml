title: 'RIHC: French Intellectuals, Matricide, and Newtonian Physics'
description: 'How did Nero justify killing his mother Agrippina? In what way has the
  critique of the Founding Fathers changed over time? Has Dominic considered writing
  more on 20th century American History? What are Tom’s two main objectives when writing
  history? Which episodes would they potentially revisit? In this week’s bonus episode,
  Tom and Dominic explore these complex questions, and many more.


