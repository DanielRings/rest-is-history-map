title: Were the Troubles Inevitable?
description: "Was there ever a world in which the Troubles might have been avoided,\
  \ or were they always inevitable? Did the Good Friday agreement actually solve anything,\
  \ or was it just a temporary bandage? And, how involved was the American government\
  \ with the conflict?  \n\n\n\nIn this week’s bonus episode, Dominic and Tom delve\
  \ deeper into some of the burning questions surrounding The Troubles.  \n\n\n\n\
  *The Rest Is History LIVE: The Ultimate Victorian Adventure*\n\nThe maddest expedition\
  \ in history and it’s NEVER been heard before on the show: join Tom Holland & Dominic\
  \ Sandbrook LIVE at the Southbank as they tell the bonkers story of Queen Victoria\
  \ ordering one of history’s most daring assignments ever. ⁠⁠⁠Tickets available for\
  \ Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.\n\n_______\n\nTwitter:\n\
  \n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\n\n\nVideo Editors: Jack Meek,\
  \ Harry Swan + Adam Thornton \n\nSocial Producer: Harry Balden\n\nProducers: Tabby\
  \ Syrett & Aaliyah Akude \n\nSenior Producer: Callum Hill  \n\nExecutive Producer:\
  \ Dom Johnson"
