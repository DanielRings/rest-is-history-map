title: 'Nelson: Slaughter in Naples (Part 1)'
description: 'What happened when the heroic Horatio Nelson, victor of the Battle of
  the Nile, sailed into the seething city of Naples? Why would his meeting with the
  glamorous celebrity, Lady Emma Hamilton, shape the rest of his life? And, why would
  his decision to lend his support to the foolhardy Neapolitan campaign to “liberate
  all of Italy” from the formidable French, prove to be one of the most controversial
  episodes of Nelson’s career?


  Join Dominic and Tom as they voyage deeper into the life of Nelson, and the incident
  that nearly destroyed his reputation forever….


