title: 'Atlantis: Legacy of the Lost Empire (Ep 2)'
description: 'From claims that the alphabet was originated by Atlantians, Francis
  Bacon using the story as a model of utopia, to the Nazis co-opting Atlantis as the
  birthplace of the Aryan race, everyone seems to have wanted a slice of the Atlantian
  pie. Join Tom and Dominic as they explore the academics and the amateurs who lay
  claim to discovering the real Atlantis.


