title: 'RIHC: Collectibles, literary criticism, and the illusion of historical truth'
description: 'Was the Eastern Roman Empire wealthier than its western counterpart?
  Can a PHD thesis be deemed "too easy to read"? Was 16th century French Protestantism
  a legacy of the Cathars? Is there such a thing as historical truth? What does a
  historian have to do to earn a TV series? This week''s episode sees Tom and Dominic
  attempt to answer these important questions, and many more.




