title: 'Revolution in the Soviet Empire: The Hungarian Uprising (Part 3)'
description: 'What triggered the Hungarian Revolution in 1956? Was Stalinism still
  the major political force in Hungary, even after the paranoid dictator’s death?
  And, how did the revolution almost bring down the Soviet Empire during the peak
  of the Cold War?




  Join Dominic and Tom as they delve into the tragic, dramatic story of the Hungarian
  Revolution, which brought the seemingly indomitable USSR to the brink of disaster…&nbsp;&nbsp;




