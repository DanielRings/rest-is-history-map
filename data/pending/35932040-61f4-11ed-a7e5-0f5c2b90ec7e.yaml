title: 'The World Cup: The Falklands, despots, and corruption (Ep 3)'
description: 'In their last episode on the World Cup, Tom and Dominic are joined by
  the face of football, Gary Lineker. They discuss England playing Argentina in the
  1986 World Cup in the wake of the Falklands War, the globalisation of the competition
  that began with USA 1994, and the corruption that surrounds the upcoming tournament
  in Qatar.


