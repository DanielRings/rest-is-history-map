title: 'Heart of Darkness: Fear and Loathing in the Congo'
description: '“The horror! The horror!”

  Joseph Conrad’s ‘Heart of Darkness’ - the inspiration for Francis Ford Coppola’s
  ‘Apocalypse Now’ - is one of the most celebrated literary works of all time, though
  now increasingly contentious. Based on Conrad’s own terrible journey into the Congo
  in 1890, and the horrors he beheld there while it was under the sway of King Leopold
  of Belgium’s monstrous regime, the novella, published in 1899, delves into man’s
  capacity for evil - the primal beast lurking beneath the surface of all humans -
  and has long stood as the preeminent cultural representation of European colonialism.
  It tells the story of Mr Kurtz, a great ivory trader who has disappeared deep into
  the African interior, and appears to have lost his mind, having penetrated some
  terrifying, ancient truth. Initially, Conrad’s disturbing account was viewed as
  the ultimate attack on imperialism, though aspects of the novella have also invited
  accusations of racism and imperialism, in part owed to Conrad’s own sympathy for
  Empire. So what is the truth at the heart of ''Heart of Darkness''? And who was
  Joseph Conrad himself? What horrors did he behold to have inspired such a poignant
  account of the nightmares within and without…?

  Join Dominic and Tom as they discuss Joseph Conrad, ‘Heart of Darkness’ and the
  real life events that inspired it, and the long term reverberations of the novella
  in culture and literary criticism today. 

