title: 'The Falklands War: The Task Force Sails (Ep 2)'
description: 'In the second episode of our Falklands War mini-series, Britain is faced
  with an Argentine occupation and prepares to go to war.


  Margaret Thatcher discovers her inner Winston Churchill - but faces a titanic showdown
  in Parliament, which sits on a Saturday for the first time since Suez.


  The Task Force eventually sails - to huge public support - while the US, France
  and Chile all lend a hand. 


  Come for Tom''s Iron Lady impression, stay for his Tony Benn as Dominic talks us
  through the second instalment in this epic four-parter.


  Producer: Dom Johnson

  Exec Producers: Jack Davenport & Tony Pastor


