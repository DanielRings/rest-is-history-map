title: 'The Ku Klux Klan: American Fascists (Part 4)'
description: 'After resurrecting in 1915, how did the Klu Klux Klan make its move
  on the next major American election? What was the role of women in the Klan? And,
  would this violent organisation finally meet its reckoning? 




  Join Tom and Dominic as they reach the tragic climax of their exploration into the
  rise and fall of the Ku Klux Klan. 




