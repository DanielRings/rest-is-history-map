title: The Birth of Babylon
description: 'In January 2022, Tom and Dominic explored the history of Babylon, from
  Nebuchadnezzar onwards (published on January 31st in the Rest Is History Club podcast
  feed).


  At the end of that episode, there was a promise to revisit Babylon''s earlier period
  to fully do the topic justice - so here it is!


  Tune in to hear about the constant theft of the Statue of Marduk, the formidable
  Assyrians, and what Dominic describes as his ''favourite impersonation ever''...


  Producer: Dom Johnson

  Exec Producer: Jack Davenport


