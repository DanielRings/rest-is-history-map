title: Climate & Weather
description: 'From the Ice Age to the Winter of Discontent, climate and weather have
  hugely impacted historical events. Wars halted by freezing conditions, Prime Ministers
  thrown out of office by an electorate made angrier by the weather. Dominic Sandbrook
  and Tom Holland review their top ten weather affected moments in time.


