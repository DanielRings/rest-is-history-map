title: 'RIHC: Disney''s Legacy, with Bob Iger'
description: 'What’s the first question people at Disney ask themselves when they
  have a great idea? How does Bob Iger view his legacy, and does he think Walt Disney
  would approve of his record? How did Bob first get into The Rest Is History? And
  who is his dream dinner party guest from history?




  ⁠Watch Tom and Dominic''s tour of Disneyland with Bob:⁠


  https://www.youtube.com/watch?v=uwPaOpifZ-M




  In this special bonus episode, Tom and Dominic are joined by Friend of the Show
  Bob Iger, the CEO of The Walt Disney Company. They delve into Walt''s legacy, the
  70th anniversary of Disneyland, and Bob''s time at the helm of the worlds of Mickey
  House, Snow White and Luke Skywalker…


