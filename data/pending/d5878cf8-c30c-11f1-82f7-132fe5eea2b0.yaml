title: 'King Arthur: Lancelot and the Round Table (Part 2)'
description: 'Who was the real Lancelot, King Arthur’s dashing love rival from the
  Arthurian legends? Was he the first medieval knight? How would his relationship
  with Queen Guinevere come to shape romance and chivalry for centuries to come? And,
  was there a historical Camelot…?




  Join Tom and Dominic as they divulge the tantalising true stories behind Sir Lancelot,
  Guinevere, and the Knights of the Round Table.&nbsp;&nbsp;&nbsp;


