title: 'RIHC: The Five Eyes, Donald Trump, and the Nazi Spy'
description: "What are the Five Eyes, the globe-spanning intelligence network that\
  \ unofficially binds five world-leading countries? Why is it so relevant to politics\
  \ right now? When was it founded, and why? Who was the mysterious Scottish hairdresser\
  \ and Nazi spy behind it all? What makes it so exclusive? Who are its five members?\
  \ Is there a hierarchy? Are the dealings of this confidential pact dubious? Why\
  \ was the Five Eyes only made public in 2010? What secrets did it hide and pass\
  \ on? Has it added to, or detracted from, global political security? Did they commit\
  \ human rights abuses and other illegal dealings? Which countries collaborated with\
  \ the Five Eyes? Was the Queen involved? Will the further declassification of Five\
  \ Eyes documents rock the world? How will Trump use it to his advantage?And, do\
  \ intelligence agencies really keep us safe…?\n\nIn this week’s bonus episode, Tom\
  \ is joined by award winning documentary maker, writer and journalist, Richard Kerbaj,\
  \ to discuss the murky history of the Five Eyes, which has been so much in the news\
  \ in recent weeks, and his book ‘The Secret History of the Five Eyes’…\n_______\n\
  Twitter:\n@TheRestHistory\n@holland_tom\n@dcsandbrook\nProducer: Theo Young-Smith\n\
  Assistant Producer: Tabby Syrett + Aaliyah Akude \nExecutive Producers: Jack Davenport\
  \ + Tony Pastor"
