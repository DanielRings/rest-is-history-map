title: The Lessons of History
description: 'Can we truly learn from history? And if we can - do we?

  It’s one of the big questions this week as Tom Holland and Dominic Sandbrook roam
  through the centuries in search of certainty.

  Never get involved in a land war in Asia. That’s our starter for ten.


