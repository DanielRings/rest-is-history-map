title: 'Mary, Queen of Scots: Birth of a Legend (Part 1)'
description: 'Where was Mary Queen of Scots - Elizabeth I’s most famous rival - born,
  and who were her parents? What was the nature of the turbulent politically and religiously
  divided world she was born into? How did she become a queen at only one week old,
  and betrothed to a French Prince at five? Why was it so dangerous to be a Scottish
  monarch in the 16th century? And, was she really the rightful heir to the English
  throne….?


  Join Tom and Dominic as they discuss the early life of one of history’s most famous
  women: the brave, charming, famously glamorous but also tragic; Mary Queen of Scots. 






