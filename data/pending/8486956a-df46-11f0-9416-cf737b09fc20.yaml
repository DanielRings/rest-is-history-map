title: 'Tchaikovsky: LIVE at the Royal Albert Hall'
description: 'What are the complex origins of Russia’s most renowned composer, Pyotr
  Ilyich Tchaikovsky? What inner conflicts and private contradictions lay behind his
  romantic music, and how did these struggles shape it? And, what dark secrets lie
  hidden beneath Tchaikovsky’s sweeping, lyrical melodies…?




  Join Tom and Dominic at the Royal Albert Hall, featuring the renowned  Philharmonia
  Orchestra, conducted by Oliver Zeffman, as they play the music of Tchaikovsky live,
  accompanying their journey into the life of one of the most mercurial but brilliant
  figures in all of musical history: Pyotr Ilyich Tchaikovsky.


