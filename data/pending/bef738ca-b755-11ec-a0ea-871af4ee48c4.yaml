title: Merlin, Magic and the British
description: 'Richard II, Prince Charles, and Tony Blair. From Merlin, to the middle
  ages to the modern day, the mysterious world of magic, necromancy and the occult
  has had a notable presence in the lives of British monarchs, politicians and members
  of high society. 


  Tom and Dominic are joined by Francis Young, author of ''Magic in Merlin''s Realm:
  A History of Occult Politics in Britain'' to discuss this infinitely interesting
  and entertaining topic.'
