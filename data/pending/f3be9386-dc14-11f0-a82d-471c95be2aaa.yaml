title: 'WWI: The Christmas Truce'
description: "Did the Christmas Truce - which saw a number of unofficial ceasefires\
  \ between the combatants of the First World War, during the Christmas of 1914 -\
  \ really occur, or was it a myth? What is the real story behind this legendary event?\
  \ And, did German and British soldiers really play football across no-man's land?\n\
  \n\n\nJoin Dominic and Tom as they delve into the history behind one of the most\
  \ famous and moving events of the First World War.\n\n\n\n\n\nFor more Goalhanger\
