title: 'Fall of the Sioux: The Massacre at Wounded Knee (Part 3)'
description: '"I will bury my heart, at Wounded Knee"

  With Native American culture in free fall in the years following their triumph at
  the Battle of the Little Bighorn, the rise of the Ghost Dance - a form of spiritual
  expression that promised liberty from the oppression of 19th century American politics,
  modernisation and mass entertainment - brought a new hope to the Sioux. Even so,
  the once great war chieftain Sitting Bull, unable to see visions int the dance,
  and having allowed himself to be seduced by Buffalo Bill and the mass entertainment
  industry, found his authority in the Reservation waning. Meanwhile, a plan was being
  concocted to do away for him once and for all…his fate would set in motion a tragic
  chain of events that would culminate in a terrible, barbaric massacre at Wounded
  Knee Creek, where, amidst the bathetic winter snows, it seems that the Lakota had
  finally met their end. 

  Join Dominic and Tom for the epic conclusion to their mighty saga on the Lakota
  Sioux and the American Indian Wars, as they discuss the fate of Sitting Bull, the
  Ghost Dancers, and their last stand at the terrible Wounded Knee massacre. 






