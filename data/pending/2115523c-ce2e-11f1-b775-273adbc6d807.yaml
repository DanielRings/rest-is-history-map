title: 'The Suez Crisis: Anarchy in the Middle East (Part 1)'
description: 'Why did the Suez Crisis break out in 1956? Who were Anthony Eden, the
  British Prime Minister at the heart of the scandal, and Gamal Abdel Nasser, his
  opposite? And, would the crisis be the death knell to the British Empire?




  Join Dominic and Tom as they begin their journey into one of the greatest international
  scandals of all time, in the dying days of the British Empire.&nbsp;&nbsp;&nbsp;&nbsp;


