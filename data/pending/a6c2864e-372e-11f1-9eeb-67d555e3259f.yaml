title: 'RIHC| The Legacy of the Samurai: From Pearl Harbour to Star Wars'
description: "How have the Samurais influenced subsequent space epics, and other parts\
  \ of Western culture? Did Bushido - “Way of the Warrior” - influence Pearl Harbour\
  \ at all? And, when did the Samurai transition from a genuine way of life to a cultural\
  \ ideal?  \n\n\n\nIn this week’s bonus episode, Tom is joined by Oleg Benesch -\
  \ historian and co-curator of the British Museum’s glorious Samurai exhibition,\
  \ to delve deeper into the legacy of the Samurais in popular culture.\n\n\n\n_______\n\
