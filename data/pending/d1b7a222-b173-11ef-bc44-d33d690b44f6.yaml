title: 'RIHC: Gladiator II, Narcissistic Poets, and The Princes in the Tower (Livestream)'
description: 'What did Tom think of Gladiator II? Why did people refer to Napoleon
  by his first name unlike the Duke of Wellington and Lord Nelson? Why didn’t the
  Romans bother conquering Ireland? Who was more narcissistic, Lord Byron or Luther?
  When did the 60’s definitively end? Who is the greatest parliamentary orator of
  all time? And, does recent evidence suggest that Richard III is in fact innocent
  of his nephew’s murder? 


  In this week’s Livestream, Tom and Dominic answer all manner of intriguing historical
  questions.... 

