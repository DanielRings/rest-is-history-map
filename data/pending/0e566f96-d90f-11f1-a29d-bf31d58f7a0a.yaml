title: 'The Charge of the Light Brigade: The Tsar’s Terrible Siege (Part 2)'
description: "Who was Baron Raglan, the commander of Britain’s forces sent to fight\
  \ in the Crimea? Why did Lords Cardigan and Lucan, key players in the cavalry, loathe\
  \ each other, and what did this mean for their troops? And, what happened when the\
  \ Russians marched on the Turkish base of Silistria? \n\n\n\nJoin Tom and Dominic\
  \ as they discuss the siege of Silistria, the early disastrous forays of the British\
  \ army in the Crimea, and Lord Cardigan’s volatile disobediences…\n\n\n\nGive The\
