title: 'The French Revolution: The First Feminist (Part 2)'
description: 'In the summer and Autumn of 1792 - with the Prussians bearing down on
  Paris, the streets thronged with the stirring swell of the Marseillaise, but also
  the rotting bodies of those brutally killed during the September Massacres - the
  French Revolution bore a new symbol of optimism and hope: Liberty. Embodied by a
  female figure, later known as Marianne, and famously enshrined in Eugène Delacroix’s
  iconic painting, she was an important reminder that the revolution was about more
  than just violence, but also the dream of a brighter future, in which all the people
  of France would have a steak. Marianne was the new Republic personified, and manifested
  all those virtues most desired by the new order; freedom, equality and reason. But,
  did this new symbol have any resonance for the actual women of the revolution? Certainly,
  they had played a major role in bringing the King and Queen back to Paris from Versailles
  in 1789, helping patriots who stormed Tuileries in 1792, and were keen spectators
  to the febrile politics of the revolution. For this, women were enshrined as ‘mothers
  of the nation’, a vital mass of humanity thought to be inspired by an animating
  emotional power. And yet, unlike their male counterparts, few women save Marie Antoinette,
  at whom sexualised misogyny was constantly hurled, have stood the test of time.
  So who were the women at the very heart of the French Revolution? And what did they
  do to change the course of history?

  Join Tom and Dominic as they discuss the evolving ideology of the French Revolution
  - one of the most decisive moments of world history - and some of the women at the
  centre of it all from the very start.  


