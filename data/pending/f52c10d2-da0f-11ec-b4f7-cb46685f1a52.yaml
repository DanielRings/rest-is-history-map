title: 'Australian Prime Ministers: Edmund Barton - Robert Menzies'
description: 'In the wake of Anthony Albanese''s victory in this weekend''s Australian
  election, Tom and Dominic have recorded a three part Antipodean special on the history
  of Australian prime ministers.


  The first episode begins in 1901 with Edmund Barton, covers both World Wars, and
  drills down into the premierships of Robert Menzies.


  Producer: Dom Johnson

  Exec Producer: Tony Pastor


