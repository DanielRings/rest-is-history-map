title: 'RIHC: British Elections, Watergate, and Margaret Thatcher''s Assassination'
description: 'Was the Norman Conquest of England a colonial enterprise? Is the current
  political chaos and rapid turnover of Prime Ministers in Britain unprecedented?
  What would Dominic have done had he been an aide to President Nixon during the Watergate
  scandal, and what would his advice have been for steering his way through it? What
  would British politics have looked like for the rest of the 20th century, had Margaret
  Thatcher been killed in the Brighton Bomb of 1984? And, of all the history books
  that Dominic has read, which one does he wish he had written?

  In this week’s bonus episode, with Tom on holiday, Dominic is joined by producer,
  Theo, to discuss some fascinating historical questions. 




