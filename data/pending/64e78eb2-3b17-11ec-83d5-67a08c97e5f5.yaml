title: Communism
description: 'It was one of the great political ideologies of the 20th century, vying
  with capitalism for supremacy.

  Now communism has retreated from the political mainstream having failed to create
  the utopia of a classless society.

  Dominic Sandbrook and Tom Holland discuss the origins of communism as a theory and
  the frequently repressive attempts to govern by its principles.



