title: 'The Terror: Killing God (Part 5)'
description: 'Why did Robespierre hold a vast, eccentric festival in Paris 1794, during
  the high-point of the French Revolution? How was it received by the other leading
  figures of the revolution? And, would the French Revolution really succeed in supplanting
  the christian God?&nbsp;&nbsp;




  Join Tom and Dominic as they discuss the extraordinary spectacle of the Festival
  of the Supreme Being, its sinister reception, and the transformation of France.&nbsp;


