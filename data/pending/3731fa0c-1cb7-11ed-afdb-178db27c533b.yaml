title: Introducing Empire with William Dalrymple
description: 'Today''s feed drop features friend of the show William Dalrymple discussing
  his new podcast, Empire, which he hosts alongside Anita Anand.


  How do empires rise? Why do they fall? And how have they shaped the world around
  us today?


  This new show explores the stories, personalities and events of empire over the
  course of history.


  The first series looks at the British in India, covering The East India Company,
  the Raj, Gandhi, Independence and Partition.


  In the opening episode, William and Anita discuss the rise of The East India Company,
  exploring how a small corporation with only a handful of employees came to rule
  India. The episode begins with the birth of the Company in Tudor England and culminates
  with Robert Clive and the Battle of Plassey.


  Listen to the second episode of Empire right now:

  Apple - apple.co/3bVP1Xi

  Spotify - spoti.fi/3zX2hmG'
