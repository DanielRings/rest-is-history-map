title: 'Nelson’s Lover: The Scandalous Lady Hamilton'
description: "Who was Emma Hamilton, Horatio Nelson’s strikingly beautiful, and famously\
  \ fashionable mistress? How did she raise herself up from dire poverty, to become\
  \ a model, actress, dancer, and even an international celebrity? And, why was theirs\
  \ one of the most famous love affairs of all time? \n\n\n\nJoin Tom and Dominic\
  \ as they discuss one of history's most remarkable woman - Lady Emma Hamilton -\
  \ and explore her celebrated relationship with one of Britain's greatest, and most\
  \ tragic heroes. \n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n\
