title: Historical Love Island
description: 'The Love Island phenomenon is sweeping the nation, so Tom Holland and
  Dominic Sandbrook are joined by Tom''s daughter, Katy Holland, to play their part
  in creating a ‘villa’ made up of historical figures. Who will loveable nice-boy
  Jimmy Carter ‘couple up’ with? Will Judas Iscariot and Stanley Baldwin get along?


  Head to Twitter after listening on Monday morning to vote on The Rest Is History''s
  Love Island poll for your FAVOURITE historical couple. A special bonus episode will
  be released on Wednesday 13th July to announce and assess the winners and losers.


  Editor: James Hodgson

  Producer: Dom Johnson

  Exec Producer: Jack Davenport


