title: Alexander the Great, with Mary Beard | FULL EPISODE
description: 'No one was like him, terrible were his crimes…


  Where was Alexander the Great born, and who were his parents?  What drove him to
  go beyond the Aegean empire he had already carved out for himself, and conquer lands
  beyond the limits of the Greek world? Why did Alexander eventually turn back, after
  ten years of conquest? And, how much of his legend is actually true? 


  In the second episode of this exclusive new series on four of the most iconic subjects
  from classical antiquity, Tom is joined again by the world renowned classicist,
  Mary Beard, to discuss one of history’s most famous men: Alexander the Great….hero
  or villain? _______Twitter:@TheRestHistory@holland_tom@dcsandbrookVideo Editor:
  Jack Meek Social Producer: Harry BaldenAssistant Producer: Aaliyah Akude Producer:
  Tabby SyrettSenior Producer: Theo Young-Smith'
