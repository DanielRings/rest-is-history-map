title: The Man Who Painted The Terror
description: 'Who was Jacques-Louis David, the neoclassical painter of Revolutionary
  France? What was his relationship with journalist and Montagnard, Jean-Paul Marat?
  And, how does David’s painting, The Death of Marat, represent both the artistic
  and political climate of late 18th century Paris?




  In today’s bonus episode, Tom is joined by Friend of the Show, art historian and
  writer Laura Cumming, to talk about Jaques-Louis David, Jean-Paul Marat, and the
  French Revolution.




