title: 'The Road to The Great War: Britain’s Fateful Choice (Part 4)'
description: 'On the 24th of July 1914, in London, the Liberal British Cabinet met
  to hear the Foreign Secretary, Sir Edward Grey, read them the Ultimatum handed to
  Serbia by the Austro-Hungarian Empire the day before. The world held its breath,
  awaiting Serbia’s response. With Germany determined to stand by Austria, and the
  French against them, focus now turned turned to Britain. Historically a German ally
  despite their naval race in 1913, it had recently adopted a policy of “splendid
  isolation”, its enormous empire having in some ways been something of a millstone,
  forcing them into protective alliances with other powers with which they may not
  otherwise have aligned. Regardless, the cabinet’s response to the Ultimatum was
  one of unanimous shock, with Sir Grey himself - a man of languid superiority - especially
  worried by the situation simmering in Europe. How, then, would Britain and the other
  great powers of Europe respond to the Ultimatum? And graver still, what would Serbia
  do?

  Join Tom and Dominic as they discuss the entangled web of European diplomacy in
  1914, the British reaction to Austria’s Ultimatum, and the fascinating, comical
  and often deeply impressive cast of characters operating matters behind the scenes,
  as the countdown to war begun. 

