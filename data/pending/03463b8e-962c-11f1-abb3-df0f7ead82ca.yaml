title: 'The Troubles: Return of the IRA (Part 3)'
description: 'What was the Provisional IRA, and why did they return to the fray at
  the high point of The Troubles in Northern Ireland? How did a series of bloody battles,
  including &nbsp;the Short Strand Battle, brutally intensify tensions between the
  British Army and Catholic communities? And, how did the conflict spiral into attacks
  on civilians…?




  Join Dominic and Tom as they discuss the violent escalation of The Troubles.






  *The Rest Is History LIVE: The Ultimate Victorian Adventure*


  The maddest expedition in history and it’s NEVER been heard before on the show:
  join Tom Holland & Dominic Sandbrook LIVE at the Southbank as they tell the bonkers
  story of Queen Victoria ordering one of history’s most daring assignments ever.
  ⁠⁠⁠Tickets available for Friday 4th September⁠⁠⁠, the Saturday show is SOLD OUT.


