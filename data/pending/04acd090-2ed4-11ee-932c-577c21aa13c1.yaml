title: 'Roman Apocalypse: Pompeii 79 AD'
description: 'Mount Vesuvius'' eruption in the autumn of AD79 remains one of the deadliest
  and best-known in history. The plume of super-heated volcanic gases spewed skyward
  formed a cloud 21 miles high, with the volcano ultimately releasing 100,000 times
  the thermal energy of the atomic bombings of Hiroshima and Nagasaki. Join Tom and
  Dominic as they piece together the disaster, destruction and death caused by the
  Vesuvius’s eruption.


