title: 'Columbus: Villain or Hero? (Ep 4)'
description: 'Christopher Columbus caused debate in his own time, and remains a controversial
  figure today: some argue he initiated both the Atlantic slave trade and the genocide
  of the Native Americans, others laud him as one of the great men of History. Join
  Tom and Dominic as they explore these issues, their roots, and the truth behind
  the man Columbus really was...


