title: 'The First World War: Churchill’s Calamity (Part 6)'
description: 'After Gallipoli has descended into a bloodbath, why do the British pour
  in more troops? Does Churchill finally understand his fateful error? How do the
  allies escape the total mess they find themselves in? And, why has this failed campaign
  become the foundational moment of Anzac identity?


  Join Dominic and Tom as they bring an end to this disastrous Gallipoli campaign
  and the bloody year of 1915.




