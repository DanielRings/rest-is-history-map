title: Ronald Reagan and the American Dream (Ep 1)
description: 'Ronald "Dutch" Reagan was born in 1911 to a humble family of Illinois,
  his father an FDR-loving democrat, his mother a notable member of the local Christian
  community. A high school football star, "Dutch" would grow up to become one of America''s
  favourite sports broadcasters, a Hollywood actor and a union leader, before finally
  entering American political life in 1964.


  The first episode of our three-part series on Ronald Reagan sees Tom and Dominic
  look at his childhood, his early career, his romantic life pre-Nancy, and the beginning
  of his journey towards Republican politics.


