title: 'The Nazis in Power: The War on the Jews (Ep 6)'
description: 'As Hitler ramps up the German war machine, he remains obsessed with
  one idea: uprooting Jews from the Reich. The Nazis embark on a campaign of totalitarian
  oppression against them, persecuting Jewish people in every aspect of life. They
  are excluded from most professions, forbidden from intermarrying, Jewish children
  are bullied and excluded from schools, all Jews have a “J” stamped in their passport,
  to name but a few measures. Worst of all, the brainwashing of the German people
  has become apparent, and many are willing participants in the various forms of persecution;
  plenty of German towns have put up signs by this point saying “Jews not wanted here”.
  Hitler may tone down the oppression to whitewash the 1936 Berlin Olympics, but this
  does not last. One terrifying truth is clear: he is fully set on the destruction
  of European Jewry.


  Join Tom and Dominic in the fifth part of our series on the Nazis in power, as they
  look at how the persecution of Jewish people in the Reich increased in the lead-up
  to the Second World War.


