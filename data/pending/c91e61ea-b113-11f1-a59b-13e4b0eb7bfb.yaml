title: The History of Satire, with Ian Hislop
description: "How has satire been used to critique governments throughout the years?\
  \ What makes the illustrations of James Gillray and Jonathan Swift so timeless?\
  \ And, what distinguishes today's satire formats from other eras? \n\n\n\nIn this\
  \ very special bonus episode, we share an exclusive talk from The Rest Is History\
  \ Festival at Hampton Court Palace. Here, Dominic is joined on stage by satirist\
  \ and tv personality Ian Hislop, to discuss the history of satire and highlights\
  \ of his career.\n\n_______\n\nTwitter:\n\n@TheRestHistory\n\n@holland_tom\n\n@dcsandbrook\n\
