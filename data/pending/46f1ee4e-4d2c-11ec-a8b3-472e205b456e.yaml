title: World Cup of Kings & Queens - Part 1
description: 'Oliver Cromwell. Queen Victoria. George V. All contenders for the title
  of England''s greatest monarch, a poll for which took place on a twitter over the
  last week. We know that Athelstan went on to win, but in this episode Tom and Dominic
  run through the sovereigns who fell at the first hurdle.


