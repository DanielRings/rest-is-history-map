title: 'Custer vs. Crazy Horse: Civil War (Part 1)'
description: '“Come on, you Wolverines!”

  The story of the American Indian Wars of 1862-68 is an enthralling tale of hubris,
  politics, recklessness, and the merciless assault of industrialisation and modernity
  on an old world, nearly extinguished. An immense tragedy, it is also a story of
  great adventure, with formidable heroes and villains on both sides. No two figures
  encapsulate this better than the enigmatic, strategically brilliant Lakota war leader,
  Crazy Horse, and his foil on the side of the Unites States government, cavalry commander
  George A. Custer, whose daring, panache and egotism has immortalised him in the
  annals of American history. From the bloody battles of the American Civil War and
  the snake-pit of Reconstruction politics, to his ruthless campaigns against the
  Native American and First Nation peoples of the Great Plains, and his ensuing, mysterious
  demise, Custer’s life is a thrilling mix of heroics, brutality, madness and gore. 


  Join Dominic and Tom as they delve into the thrilling American Indian Wars, and
  the life of George A. Custer. From his flamboyant and salacious youth, to his daredevil
  performance fighting for the Union army, and his entry into the fascinating world
  of nineteenth century American politics. 




